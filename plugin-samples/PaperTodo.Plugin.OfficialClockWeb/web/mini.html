<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>PaperTodo Clock Mini</title>
  <style>
    :root {
      color-scheme: light dark;
      --text: #202020;
      --weak: #707070;
      --accent: #b07a31;
      --border: #807050;
      --font: system-ui, sans-serif;
      --scale: 1;
    }
    * { box-sizing: border-box; }
    html, body { width: 100%; height: 100%; margin: 0; background: transparent; }
    body {
      display: grid;
      place-items: center;
      overflow: hidden;
      color: var(--text);
      font-family: var(--font);
      font-size: calc(14px * var(--scale));
      user-select: none;
    }
    main { width: 100%; padding: 14px 18px 16px; text-align: center; }
    .meta {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 9px;
      min-height: 22px;
    }
    .zone {
      display: inline-flex;
      align-items: center;
      gap: 7px;
      color: var(--weak);
      font-size: .78em;
    }
    .zone::before {
      content: "";
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--accent);
    }
    #time {
      margin-top: 7px;
      font-size: clamp(38px, 19vw, 58px);
      font-weight: 650;
      line-height: 1;
      letter-spacing: .02em;
      font-variant-numeric: tabular-nums;
      white-space: nowrap;
    }
    #seconds { color: var(--accent); }
    #date { min-height: 1.3em; margin-top: 9px; color: var(--weak); font-size: .86em; }
    .track {
      height: 5px;
      margin-top: 14px;
      border-radius: 999px;
      background: color-mix(in srgb, var(--text) 13%, transparent);
      overflow: hidden;
    }
    #progress { height: 100%; width: 0; border-radius: inherit; background: var(--accent); }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <main>
    <div class="meta">
      <div id="zone" class="zone"></div>
    </div>
    <div id="time"><span id="hours"></span>:<span id="minutes"></span><span id="seconds"></span></div>
    <div id="date"></div>
    <div id="track" class="track"><div id="progress"></div></div>
  </main>
  <script>
    const defaults = Object.freeze({
      showSeconds: true,
      showDate: true,
      showWeekday: true,
      showDayProgress: true,
      hourCycle: '24',
      timeZone: 'local'
    });
    const zoneMap = Object.freeze({
      local: undefined,
      utc: 'UTC',
      beijing: 'Asia/Shanghai',
      tokyo: 'Asia/Tokyo',
      london: 'Europe/London',
      newYork: 'America/New_York',
      losAngeles: 'America/Los_Angeles'
    });
    const zoneLabels = Object.freeze({
      local: '本地时间', utc: 'UTC', beijing: '北京时间', tokyo: '东京时间',
      london: '伦敦时间', newYork: '纽约时间', losAngeles: '洛杉矶时间'
    });
    let settings = { ...defaults };
    let visible = false;
    let timer = 0;
    let announcedReady = false;
    const $ = id => document.getElementById(id);

    function applyTheme(theme) {
      if (!theme) return;
      const style = document.documentElement.style;
      style.setProperty('--text', theme.textColor || '#202020');
      style.setProperty('--weak', theme.weakTextColor || '#707070');
      style.setProperty('--accent', theme.accentColor || '#b07a31');
      style.setProperty('--border', theme.borderColor || '#807050');
      style.setProperty('--font', JSON.stringify(theme.fontFamily || 'system-ui'));
      style.setProperty('--scale', String(theme.fontScale || 1));
    }

    function render() {
      const now = new Date();
      const parts = Object.fromEntries(new Intl.DateTimeFormat(undefined, {
        timeZone: zoneMap[settings.timeZone],
        year: 'numeric', month: '2-digit', day: '2-digit',
        hour: '2-digit', minute: '2-digit', second: '2-digit',
        weekday: 'long', hour12: settings.hourCycle === '12'
      }).formatToParts(now).map(part => [part.type, part.value]));
      $('hours').textContent = parts.hour;
      $('minutes').textContent = parts.minute;
      $('seconds').textContent = settings.showSeconds ? `:${parts.second}` : '';
      $('zone').textContent = zoneLabels[settings.timeZone] || '本地时间';
      const date = [
        settings.showDate ? `${parts.year}-${parts.month}-${parts.day}` : '',
        settings.showWeekday ? parts.weekday : ''
      ].filter(Boolean).join(' · ');
      $('date').textContent = date;
      $('date').hidden = !date;
      // Day progress must use a 24-hour clock even when the visible clock is formatted as 12-hour.
      // Otherwise (for example) 5 PM is incorrectly measured as 5/24 through the day.
      const dayParts = Object.fromEntries(new Intl.DateTimeFormat('en-GB', {
        timeZone: zoneMap[settings.timeZone],
        hour: '2-digit', minute: '2-digit', second: '2-digit',
        hourCycle: 'h23'
      }).formatToParts(now).map(part => [part.type, part.value]));
      const elapsed = (Number(dayParts.hour) % 24) * 3600 +
        Number(dayParts.minute) * 60 + Number(dayParts.second);
      $('progress').style.width = `${Math.min(100, Math.max(0, elapsed / 864))}%`;
      $('track').hidden = !settings.showDayProgress;
    }

    function updateTimer() {
      clearInterval(timer);
      if (visible) timer = setInterval(render, settings.showSeconds ? 250 : 1000);
      render();
    }

    function readyAfterPaint() {
      if (announcedReady) return;
      announcedReady = true;
      requestAnimationFrame(() => requestAnimationFrame(() => window.papertodo?.mini?.ready()));
    }


    window.addEventListener('papertodo', event => {
      const message = event.detail || {};
      if (message.type === 'initialize') {
        settings = { ...defaults, ...(message.settings || {}) };
        visible = message.visible !== false;
        applyTheme(message.theme);
        updateTimer();
        readyAfterPaint();
      } else if (message.type === 'settingsChanged') {
        settings = { ...defaults, ...(message.settings || {}) };
        updateTimer();
      } else if (message.type === 'themeChanged' || message.type === 'typographyChanged') {
        applyTheme(message.theme);
      } else if (message.type === 'miniVisibilityChanged') {
        visible = message.visible !== false;
        updateTimer();
      }
    });
    render();
  </script>
</body>
</html>
