<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>PaperTodo Top Bar 2.0</title>
  <style>
    html, body { margin: 0; min-height: 100%; background: transparent; }
    body {
      font-family: system-ui, sans-serif;
      display: grid;
      place-items: center;
      color: #555;
    }
    main { max-width: 520px; padding: 24px; line-height: 1.65; }
    .actions { display: flex; gap: 8px; flex-wrap: wrap; }
  </style>
</head>
<body>
  <main>
    <strong>Protocol 2.0 Paper Top Bar</strong>
    <p id="status">等待宿主初始化…</p>
    <div class="actions">
      <button id="toggle-collapsed">折叠 / 展开自身纸片</button>
      <button id="hide-paper">隐藏自身纸片</button>
    </div>
  </main>
  <script>
    const status = document.querySelector('#status');

    async function registerPaperTopBar() {
      await papertodo.request('topbar.paper.set', {
        actions: [
          {
            id: 'paper-info',
            icon: { kind: 'character', value: 'i' },
            toolTip: '显示这张插件纸片的信息'
          }
        ],
        hiddenHostActions: ['newNotePaper']
      });
    }

    document.querySelector('#toggle-collapsed').addEventListener('click', () => {
      papertodo.paper.toggleCollapsed().catch(error => {
        status.textContent = `切换失败：${error?.message || error}`;
      });
    });

    document.querySelector('#hide-paper').addEventListener('click', () => {
      papertodo.paper.hide().catch(error => {
        status.textContent = `隐藏失败：${error?.message || error}`;
      });
    });

    papertodo.onEvent(message => {
      if (message.type === 'topBarActionInvoked' &&
          message.action?.actionId === 'paper-info') {
        status.textContent = `Paper action · ${message.action.targetPaperId}`;
      }
    });

    window.addEventListener('papertodo', event => {
      const message = event.detail || {};
      if (message.type !== 'initialize') return;


      registerPaperTopBar()
        .then(() => {
          status.textContent = 'Paper 顶栏已注册；隐藏后可用插件设置中的快捷键重新显示。';
        })
        .catch(error => { status.textContent = `注册失败：${error?.message || error}`; });
    });
  </script>
</body>
</html>
