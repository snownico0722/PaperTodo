name: Skin regression validation
on:
  push:
    branches: [exp/playful-skins-20260909]
    paths: [.github/workflows/skin-review-source.yml, '.skin-polish.*.json']
permissions:
  contents: write
jobs:
  validate:
    if: contains(github.event.head_commit.message, '[apply-skin-polish]')
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Integrate the reviewed main and skin corrections
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          @'
          from pathlib import Path
          import subprocess, re, json, hashlib
          def git(*args, check=True):
              return subprocess.run(['git', *args], check=check, stdout=subprocess.PIPE, stderr=subprocess.STDOUT)
          branch = git('branch','--show-current').stdout.decode().strip()
          assert branch == 'exp/playful-skins-20260909', branch
          git('config','user.name','github-actions[bot]')
          git('config','user.email','41898282+github-actions[bot]@users.noreply.github.com')
          merge = git('merge','--no-commit','--no-ff','8f7148843dbe9149b2f7e26c9f783091097978d0', check=False)
          print(merge.stdout.decode(errors='replace'))
          if merge.returncode:
              conflicts = git('diff','--name-only','--diff-filter=U').stdout.decode().splitlines()
              assert set(conflicts) == {'doc/ARCHITECTURE.md','src/PaperWindow.cs'}, conflicts
              pattern = re.compile(r'^<<<<<<<[^\n]*\n(.*?)^=======\n(.*?)^>>>>>>>[^\n]*\n?', re.M | re.S)
              for name in conflicts:
                  p = Path(name)
                  s = p.read_text(encoding='utf-8-sig')
                  def resolve(m):
                      ours, theirs = m[1], m[2]
                      if name == 'doc/ARCHITECTURE.md': return ours + '\n' + theirs
                      if 'var resizeBorder' in ours:
                          return theirs[:theirs.index('        var resizeBorder')] + ours
                      assert ours.strip() == 'RefreshNativeMica();', ours
                      return ours + theirs
                  s, n = pattern.subn(resolve, s)
                  assert n == (1 if name.startswith('doc/') else 3), (name, n)
                  assert '<<<<<<<' not in s
                  p.write_text(s, encoding='utf-8', newline='\n')
                  git('add',name)
          assert not git('diff','--name-only','--diff-filter=U').stdout.strip()
          git('commit','-m','chore: synchronize current main titlebar and capsule behavior')
          outputs = {}
          inputs = list(Path('.').glob('.skin-polish.*.json'))
          assert len(inputs) == 2
          digest = lambda s: hashlib.sha256(s.encode('utf-8')).hexdigest()
          for payload in inputs:
              for entry in json.loads(payload.read_text(encoding='utf-8-sig')):
                  name = entry['path']
                  assert name == 'CHANGELOG.md' or name.startswith(('src/','tests/','Resources/','doc/'))
                  assert '..' not in Path(name).parts and name not in outputs
                  s = git('show',f'HEAD:{name}').stdout.decode('utf-8-sig').replace('\r\n','\n')
                  assert digest(s) == entry['before'], f'Changed source: {name}'
                  previous = 0
                  for start, end, value in entry['edits']:
                      assert previous <= start <= end <= len(s) and isinstance(value,str)
                      previous = end
                  for start, end, value in reversed(entry['edits']): s = s[:start] + value + s[end:]
                  assert digest(s) == entry['after'], f'Transfer checksum mismatch: {name}'
                  outputs[name] = s
          assert len(outputs) == 18, len(outputs)
          for name, s in outputs.items(): Path(name).write_text(s, encoding='utf-8', newline='\n')
          for payload in inputs: payload.unlink()
          git('diff','--check')
          assert not git('diff','--name-only','--','.github/workflows').stdout.strip()
          print(f'Applied {len(outputs)} checksum-verified source updates.')
          '@ | python -
          if ($LASTEXITCODE -ne 0) { throw 'Integration failed' }
      - name: Build Release
        shell: pwsh
        run: dotnet build ./PaperTodo.csproj -c Release --nologo -clp:ErrorsOnly
      - name: Check original materials, refined skins and final desktop header pixels
        shell: pwsh
        env:
          PAPER_MICA_CAPTURE: ${{ runner.temp }}/skin-polish-evidence/native
          PAPER_SKIN_CAPTURE: ${{ runner.temp }}/skin-polish-evidence/skins
        run: dotnet run --project ./tests/PaperTodo.MicaChecks/PaperTodo.MicaChecks.csproj -c Release
      - name: Commit and push validated corrections only
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git add -A
          if (git diff --cached --name-only -- .github/workflows) { throw 'Unexpected workflow modification' }
          git commit -m 'fix: restore native material appearance and refine six skin surfaces'
          if ($LASTEXITCODE -ne 0) { throw 'Commit failed' }
          git push origin HEAD:refs/heads/exp/playful-skins-20260909
          if ($LASTEXITCODE -ne 0) { throw 'Push failed' }
          git bundle create "$env:RUNNER_TEMP/skin-polished.bundle" HEAD
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: skin-polish-evidence-${{ github.run_id }}
          path: ${{ runner.temp }}/skin-polish-evidence
          if-no-files-found: ignore
          retention-days: 2
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: skin-polished-source
          path: ${{ runner.temp }}/skin-polished.bundle
          retention-days: 1
