name: Verify and package material rework
on:
  push:
    branches: [exp/playful-skins-20260909]
    paths: [.github/workflows/skin-review-source.yml, .skin-final.py]
permissions:
  contents: write
jobs:
  verify:
    if: contains(github.event.head_commit.message, '[verify-skins]')
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Apply pending implementation and contrast correction
        run: |
          @'
          from pathlib import Path
          import subprocess, json, hashlib
          assert subprocess.check_output(['git','branch','--show-current'], text=True).strip() == 'exp/playful-skins-20260909'
          digest = lambda s: hashlib.sha256(s.encode('utf-8')).hexdigest()
          outputs = {}
          inputs = sorted(Path('.').glob('.skin-rework.*.json'))
          assert len(inputs) == 3
          for payload in inputs:
              for entry in json.loads(payload.read_text(encoding='utf-8-sig')):
                  name = entry['path']
                  assert name == 'CHANGELOG.md' or name.startswith(('src/','tests/','Resources/','doc/'))
                  assert '..' not in Path(name).parts and name not in outputs
                  if entry['before'] is None:
                      assert not Path(name).exists(), name
                      s = entry['content']
                  else:
                      s = subprocess.check_output(['git','show',f'HEAD:{name}']).decode('utf-8-sig').replace('\r\n','\n')
                      assert digest(s) == entry['before'], f'Changed source: {name}'
                      previous = 0
                      for start, end, value in entry['edits']:
                          assert previous <= start <= end <= len(s) and isinstance(value, str)
                          previous = end
                      for start, end, value in reversed(entry['edits']): s = s[:start] + value + s[end:]
                  assert digest(s) == entry['after'], f'Transfer mismatch: {name}'
                  outputs[name] = s
          assert len(outputs) == 17
          for name, s in outputs.items(): Path(name).write_text(s, encoding='utf-8', newline='\n')
          subprocess.run(['python','.skin-final.py'], check=True)
          for payload in inputs: payload.unlink()
          Path('.skin-final.py').unlink()
          subprocess.run(['git','diff','--check'], check=True)
          '@ | python -
          if ($LASTEXITCODE -ne 0) { throw 'Source integration failed' }
      - name: Release build
        run: dotnet build ./PaperTodo.csproj -c Release --nologo -clp:ErrorsOnly
      - name: Materials, live animation, native rendering and header seams
        env:
          PAPER_MICA_CAPTURE: ${{ runner.temp }}/verified-skins/native
          PAPER_SKIN_CAPTURE: ${{ runner.temp }}/verified-skins/skins
        run: dotnet run --project ./tests/PaperTodo.MicaChecks/PaperTodo.MicaChecks.csproj -c Release
      - name: Existing interaction and persistence regression checks
        run: |
          $projects = @('MarkdownSemanticChecks','MarkdownEditingChecks','TodoNavigationChecks','EdgeTitleChecks','ThreadingChecks','PersistenceChecks')
          foreach ($project in $projects) {
            dotnet run --project "./tests/PaperTodo.$project/PaperTodo.$project.csproj" -c Release
            if ($LASTEXITCODE -ne 0) { throw "Failed: $project" }
          }
      - name: Commit verified implementation to experiment only
        id: source
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if (git diff --cached --name-only -- .github/workflows) { throw 'Unexpected workflow change' }
          git commit -m 'fix: deliver distinct materials, seamless headers and live pearl reflections'
          if ($LASTEXITCODE -ne 0) { throw 'Commit failed' }
          git push origin HEAD:refs/heads/exp/playful-skins-20260909
          if ($LASTEXITCODE -ne 0) { throw 'Push failed; branch advanced during validation' }
          $sha = git rev-parse HEAD
          "sha=$sha" >> $env:GITHUB_OUTPUT
          "short=$($sha.Substring(0,8))" >> $env:GITHUB_OUTPUT
          git bundle create "$env:RUNNER_TEMP/verified-skin-source.bundle" HEAD
      - name: Publish tested Release executables
        run: |
          $sha = '${{ steps.source.outputs.sha }}'
          $short = '${{ steps.source.outputs.short }}'
          $destination = Join-Path $env:RUNNER_TEMP 'verified-skin-package'
          New-Item -ItemType Directory -Force $destination | Out-Null
          foreach ($kind in @('self-contained','no-runtime')) {
            $out = Join-Path $env:RUNNER_TEMP "publish-$kind"
            $contained = if ($kind -eq 'self-contained') { 'true' } else { 'false' }
            dotnet publish ./PaperTodo.csproj -c Release -r win-x64 --self-contained $contained -o $out /p:PublishSingleFile=true /p:IncludeNativeLibrariesForSelfExtract=true /p:EnableCompressionInSingleFile=true /p:PublishTrimmed=false /p:PublishReadyToRun=false /p:DebugType=none /p:DebugSymbols=false /p:EmbedAllSources=false /p:EmbedUntrackedSources=false "/p:InformationalVersion=4.0.0-preview+$sha"
            if ($LASTEXITCODE -ne 0) { throw "Publish failed: $kind" }
            Copy-Item (Join-Path $out 'PaperTodo.exe') (Join-Path $destination "PaperTodo-skins-$short-win-x64-$kind.exe")
          }
          $hashes = Get-ChildItem $destination -Filter *.exe | Get-FileHash -Algorithm SHA256 | Select-Object @{n='File';e={Split-Path $_.Path -Leaf}},Hash
          @{ sourceCommit=$sha; branch='exp/playful-skins-20260909'; configuration='Release'; verified=$true; executables=$hashes; nativeBackend='repository default LMDB'; realWindows11Backdrop='not manually verified' } | ConvertTo-Json -Depth 5 | Set-Content (Join-Path $destination 'build-manifest.json') -Encoding utf8
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verified-skins-visual-${{ github.run_id }}
          path: ${{ runner.temp }}/verified-skins
          if-no-files-found: ignore
          retention-days: 2
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: PaperTodo-verified-skins-${{ steps.source.outputs.short }}
          path: ${{ runner.temp }}/verified-skin-package
          if-no-files-found: error
          retention-days: 2
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: verified-skins-source
          path: ${{ runner.temp }}/verified-skin-source.bundle
          retention-days: 1
