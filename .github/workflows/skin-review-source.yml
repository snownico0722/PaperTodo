name: Package verified material implementation
on:
  push:
    branches: [exp/playful-skins-20260909]
    paths: [.github/workflows/skin-review-source.yml]
permissions:
  contents: read
jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7
        with:
          ref: 47301facf3509fe8560a833a174047d73fc57372
          fetch-depth: 0
          submodules: recursive
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Verify source identity
        run: |
          if ((git rev-parse HEAD) -ne '47301facf3509fe8560a833a174047d73fc57372') { throw 'Unexpected source revision' }
          git bundle create "$env:RUNNER_TEMP/verified-skin-source.bundle" HEAD
      - name: Publish tested Release executables
        run: |
          $ErrorActionPreference = 'Stop'
          $sha = '47301facf3509fe8560a833a174047d73fc57372'
          $short = $sha.Substring(0,8)
          $destination = Join-Path $env:RUNNER_TEMP 'verified-skin-package'
          New-Item -ItemType Directory -Force $destination | Out-Null
          foreach ($kind in @('self-contained','no-runtime')) {
            $out = Join-Path $env:RUNNER_TEMP "publish-$kind"
            $contained = if ($kind -eq 'self-contained') { 'true' } else { 'false' }
            dotnet publish ./PaperTodo.csproj -c Release -r win-x64 --self-contained $contained -o $out /p:PublishSingleFile=true /p:IncludeNativeLibrariesForSelfExtract=true "/p:EnableCompressionInSingleFile=$contained" /p:PublishTrimmed=false /p:PublishReadyToRun=false /p:DebugType=none /p:DebugSymbols=false /p:EmbedAllSources=false /p:EmbedUntrackedSources=false "/p:InformationalVersion=4.0.0-preview+$sha"
            if ($LASTEXITCODE -ne 0) { throw "Publish failed: $kind" }
            Copy-Item (Join-Path $out 'PaperTodo.exe') (Join-Path $destination "PaperTodo-skins-$short-win-x64-$kind.exe")
          }
          $hashes = Get-ChildItem $destination -Filter *.exe | Get-FileHash -Algorithm SHA256 | Select-Object @{n='File';e={Split-Path $_.Path -Leaf}},Hash
          @{ sourceCommit=$sha; branch='exp/playful-skins-20260909'; configuration='Release'; validationRun=34382919064; executables=$hashes; nativeBackend='repository default LMDB'; realWindows11Backdrop='not manually verified' } | ConvertTo-Json -Depth 5 | Set-Content (Join-Path $destination 'build-manifest.json') -Encoding utf8
      - uses: actions/upload-artifact@v4
        with:
          name: PaperTodo-verified-skins-47301fac
          path: ${{ runner.temp }}/verified-skin-package
          if-no-files-found: error
          retention-days: 2
      - uses: actions/upload-artifact@v4
        with:
          name: verified-skins-source
          path: ${{ runner.temp }}/verified-skin-source.bundle
          if-no-files-found: error
          retention-days: 1
