name: Recover material source
on:
  push:
    branches: [exp/playful-skins-20260909]
    paths: [.github/workflows/skin-review-source.yml]
permissions:
  contents: read
jobs:
  recover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Export current source and pending changes, never credentials
        run: |
          git bundle create "$RUNNER_TEMP/skin-current.bundle" HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: skin-current-source
          path: ${{ runner.temp }}/skin-current.bundle
          retention-days: 1
