name: Temporary 3.x capsule backport validation
on:
  pull_request:
    branches: [3.x]
    paths:
      - .github/backport3x-capsule.py
      - .github/workflows/backport3x-capsule.yml
permissions:
  contents: write
jobs:
  validate:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'backport/3x-capsule-memory-1019'
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          submodules: recursive
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Apply independently reversible production fixes
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          python .github/backport3x-capsule.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          @'
          from pathlib import Path
          import subprocess
          p=Path('src/StateStore.cs')
          s=p.read_text(encoding='utf-8')
          start=s.index('        var keepDeepCapsuleStartTopMargins = collapseAllRuntimeEnabled;')
          end=s.index('\n    private static void NormalizePapers(',start)
          lines=[
            '        // Heights are preferences, not transient enabled-capsule state.',
            '        // Preserve them across disabling/restarting; explicit defaults reset them.',
            '        state.DeepCapsuleStartTopMargin = NormalizeDeepCapsuleStartTopMargin(',
            '            state.DeepCapsuleStartTopMargin, state.DeepCapsuleMonitorDeviceName);',
            '        state.DeepCapsuleQueueStartTopMargins ??= new Dictionary<string, double>();',
            '        state.DeepCapsuleQueueStartTopMargins = NormalizeQueueStartTopMargins(state.DeepCapsuleQueueStartTopMargins);',
            '        RemoveNonFiniteValues(state.DeepCapsuleQueueStartTopMargins);',
            '    }',
            ''
          ]
          p.write_text(s[:start]+'\n'.join(lines)+s[end:],encoding='utf-8',newline='\n')
          p=Path('src/AppController.Settings.cs')
          s=p.read_text(encoding='utf-8')
          anchor='        State.CompactMasterCapsule = false;'
          assert s.count(anchor)==1
          p.write_text(s.replace(anchor,anchor+'\n        ResetDeepCapsuleStartTopMargins();'),encoding='utf-8',newline='\n')
          subprocess.run(['git','add','src/StateStore.cs','src/AppController.Settings.cs'],check=True)
          subprocess.run(['git','diff','--cached','--check'],check=True)
          subprocess.run(['git','commit','-m','fix(3.x): 补齐高度记忆的配置读取与明确恢复默认边界'],check=True)
          '@ | python -
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Release compilation
        run: dotnet build PaperTodo.csproj -c Release
      - name: Real WPF capsule and linked-paper checks in isolated temporary directory
        run: |
          @'
          import sys
          from pathlib import Path
          sys.argv.append('--tests')
          p=Path('.github/backport3x-capsule.py')
          s=p.read_text(encoding='utf-8').replace(')!==expected', ')! == expected')
          s=s.replace('c.State.DeepCapsuleStartTopMargin=93;', 'var leftKey=(string)Call(typeof(AppController),"QueueKey","",DeepCapsuleSides.Left)!;\n            var rightKey=(string)Call(typeof(AppController),"QueueKey","",DeepCapsuleSides.Right)!;\n            c.State.DeepCapsuleStartTopMargin=93;')
          s=s.replace('"check-left"', 'leftKey').replace('"check-right"', 'rightKey')
          s=s.replace('Deserialize<AppState>("{}")','Deserialize<AppState>("""{"Papers":[]}""")')
          s=s.replace('Assert(new StateStore().Load()', 'c.SaveNow(sync: true);\n            Assert(new StateStore().Load()')
          exec(compile(s,str(p),'exec'))
          '@ | python -
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Existing persistence regression
        run: dotnet run --project tests/PaperTodo.PersistenceChecks/PaperTodo.PersistenceChecks.csproj -c Release
      - name: Store build compatibility
        run: dotnet build PaperTodo.csproj -c Release /p:PaperTodoStoreBuild=true
      - name: Win7 best-effort build compatibility
        run: ./build-win7.ps1 -SelfContained
      - name: Publish only validated source commits to this PR branch
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          $branch = 'backport/3x-capsule-memory-1019'
          $remote = (git ls-remote origin "refs/heads/$branch").Split()[0]
          if ($remote -ne $env:EXPECTED_SHA) { throw 'PR branch changed during validation; refusing to overwrite it.' }
          git diff 05a798582929cdb08fb57e023fa2fd5e9735965a HEAD --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git push origin "HEAD:refs/heads/$branch"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
