name: Skin branch validation
on:
  push:
    branches: [exp/playful-skins-20260909]
    paths: [.github/workflows/skin-branch-bootstrap.yml, .skin-wire.py, .skin-locale.py]
permissions:
  contents: write
jobs:
  validate:
    if: contains(github.event.head_commit.message, '[apply-skins]')
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Apply integration on the isolated experiment only
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ((git branch --show-current) -ne 'exp/playful-skins-20260909') { throw 'Unexpected branch' }
          if (Test-Path .skin-wire.py) {
            python .skin-wire.py
            if ($LASTEXITCODE -ne 0) { throw 'Surface integration failed' }
            python .skin-locale.py
            if ($LASTEXITCODE -ne 0) { throw 'Resource integration failed' }
            Remove-Item .skin-wire.py, .skin-locale.py, .skin-bootstrap.py, .skin-conflicts.txt, .skin-context.txt, .skin-payload.1.b64 -ErrorAction SilentlyContinue
            git diff --check
            if ($LASTEXITCODE -ne 0) { throw 'Whitespace validation failed' }
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add -A
            if (git diff --cached --name-only -- .github/workflows) { throw 'Unexpected workflow edit' }
            git commit -m 'feat: integrate six skins with existing paper, capsule and settings surfaces'
            if ($LASTEXITCODE -ne 0) { throw 'Commit failed' }
            git push origin HEAD:refs/heads/exp/playful-skins-20260909
            if ($LASTEXITCODE -ne 0) { throw 'Push failed' }
          }
          git bundle create "$env:RUNNER_TEMP/skin-implemented.bundle" HEAD
      - name: Build Release
        shell: pwsh
        run: dotnet build ./PaperTodo.csproj -c Release --nologo -clp:ErrorsOnly
      - name: Native material and skin behavior checks
        shell: pwsh
        env:
          PAPER_MICA_CAPTURE: ${{ runner.temp }}/skin-evidence/native
          PAPER_SKIN_CAPTURE: ${{ runner.temp }}/skin-evidence/skins
        run: dotnet run --project ./tests/PaperTodo.MicaChecks/PaperTodo.MicaChecks.csproj -c Release
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: skin-visual-evidence-${{ github.run_id }}
          path: ${{ runner.temp }}/skin-evidence
          if-no-files-found: ignore
          retention-days: 7
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: skin-implemented-source
          path: ${{ runner.temp }}/skin-implemented.bundle
          if-no-files-found: ignore
          retention-days: 1
