name: Skin branch bootstrap
on:
  push:
    branches: [exp/playful-skins-20260909]
    paths: [.github/workflows/skin-branch-bootstrap.yml, .skin-bootstrap.py]
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Integrate on the isolated experiment only
        shell: bash
        run: |
          set -euo pipefail
          test "$(git branch --show-current)" = "exp/playful-skins-20260909"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if ! git merge --no-commit --no-ff e074d84084921a2c3d16e7d0448e725706bf8779; then
            python3 .skin-bootstrap.py
          fi
          # Workflow edits are applied separately through the authorized GitHub connector.
          # The Actions token has contents-write, not workflows-write.
          git restore --source=HEAD --staged --worktree .github/workflows
          git add -u
          git commit -m "chore: sync main before playful skin implementation"
          git push origin HEAD:refs/heads/exp/playful-skins-20260909
          # Git bundle carries source objects only, never checkout credentials or git config.
          git bundle create "$RUNNER_TEMP/papertodo.bundle" HEAD refs/remotes/origin/main refs/remotes/origin/exp/mica-materials-20260907
      - uses: actions/upload-artifact@v4
        with:
          name: skin-development-source
          path: ${{ runner.temp }}/papertodo.bundle
          retention-days: 1
