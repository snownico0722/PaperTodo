name: Temporary E-003 candidate comparison
on:
  push:
    branches: [perf/e003-lifecycle-probe-20260913]
    paths: ['.github/e003-candidate.py', '.github/e003-profile-candidate.py', '.github/e003-exit-variant.py', '.github/workflows/e003-candidate-check.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compare:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: 'true'
    steps:
      - uses: actions/checkout@v7
        with:
          path: tools
      - uses: actions/checkout@v7
        with:
          ref: 416a6fdbf931612ffdb7f066149001c4100a9a4c
          path: source
          fetch-depth: 0
          submodules: recursive
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Build isolated candidates
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory -Force evidence,binaries | Out-Null
          dotnet --info | Out-File evidence/environment.txt
          foreach ($mode in @('baseline','ordered','latecomp','latetray','graceful')) {
            Push-Location source
            git reset --hard 416a6fdbf931612ffdb7f066149001c4100a9a4c
            if ($LASTEXITCODE -ne 0) { throw 'reset failed' }
            if ($mode -eq 'graceful') {
              python ../tools/.github/e003-exit-variant.py .
              if ($LASTEXITCODE -ne 0) { throw 'exit variant failed' }
            }
            python ../tools/.github/e003-profile-candidate.py . $mode
            if ($LASTEXITCODE -ne 0) { throw 'candidate instrumentation failed' }
            dotnet build tests/PaperTodo.LifecycleChecks/PaperTodo.LifecycleChecks.csproj -c Release -o "../binaries/$mode" 2>&1 | Tee-Object "../evidence/build-$mode.log"
            if ($LASTEXITCODE -ne 0) { throw "$mode build failed" }
            Pop-Location
          }
      - name: Rotate startup variants
        run: |
          $ErrorActionPreference = 'Stop'
          $modes = @('baseline','ordered','latecomp','latetray')
          foreach ($mode in $modes) {
            $env:E003_MODE = $mode
            & "./binaries/$mode/PaperTodo.LifecycleChecks.exe" --probe-one capsules-10 2>&1 | Out-File "evidence/warmup-$mode.log"
            if ($LASTEXITCODE -ne 0) { throw "$mode warmup failed" }
          }
          for ($round=0; $round -lt 4; $round++) {
            for ($i=0; $i -lt $modes.Length; $i++) {
              $mode = $modes[($i+$round)%$modes.Length]
              $env:E003_MODE = $mode
              & "./binaries/$mode/PaperTodo.LifecycleChecks.exe" --probe-one capsules-10 2>&1 | Out-File "evidence/sample-$mode-$round.log"
              if ($LASTEXITCODE -ne 0) { throw "$mode sample failed" }
            }
          }
      - name: Compare true process exit with no serialization at exit
        run: |
          $ErrorActionPreference = 'Stop'
          $env:E003_NO_EXIT_DUMP = '1'
          $modes = @('baseline','ordered','graceful')
          for ($round=0; $round -lt 5; $round++) {
            foreach ($mode in $(if ($round % 2) { [array]::Reverse($modes); $modes } else { $modes })) {
              $env:E003_MODE = $mode
              & "./binaries/$mode/PaperTodo.LifecycleChecks.exe" --probe-one real-exit 2>&1 | Out-File "evidence/exit-$mode-$round.log"
              if ($LASTEXITCODE -ne 0) { throw "$mode exit failed" }
            }
          }
      - name: Preserve experiment evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e003-candidate-evidence
          path: evidence/
          retention-days: 14
          if-no-files-found: error
