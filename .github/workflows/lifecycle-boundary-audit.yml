name: Lifecycle boundary audit
on:
  push:
    branches: [fix/lifecycle-boundary-audit]
permissions:
  contents: read
jobs:
  probe:
    if: contains(github.event.head_commit.message, '[boundary-audit]')
    strategy:
      fail-fast: false
      matrix:
        area: [menu, environment, queue]
    runs-on: windows-latest
    timeout-minutes: 12
    defaults:
      run:
        shell: pwsh
    env:
      BOUNDARY_AREA: ${{ matrix.area }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Select tests without modifying production code
        run: |
          New-Item -ItemType Directory -Force "$env:RUNNER_TEMP/boundary-audit" | Out-Null
          python .github/scripts/boundary_select_checks.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Material request and capability boundaries
        if: matrix.area != 'queue'
        run: |
          dotnet run --project tests/PaperTodo.MicaChecks/PaperTodo.MicaChecks.csproj -c Release 2>&1 | Tee-Object "$env:RUNNER_TEMP/boundary-audit/${env:BOUNDARY_AREA}.txt"
          exit $LASTEXITCODE
      - name: Real queue feature intersections
        if: matrix.area == 'queue'
        run: |
          dotnet build tests/PaperTodo.LifecycleChecks/PaperTodo.LifecycleChecks.csproj -c Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $failures = @()
          foreach ($case in @('hide','hide-all','delete','disable-edge','disable-master','disable-animations','disable-material','switch-skin')) {
            $env:PAPER_BOUNDARY_CASE = $case
            dotnet run --no-build --project tests/PaperTodo.LifecycleChecks/PaperTodo.LifecycleChecks.csproj -c Release -- --case master-queue-material-handoff 2>&1 | Tee-Object "$env:RUNNER_TEMP/boundary-audit/queue-$case.txt"
            if ($LASTEXITCODE -ne 0) { $failures += $case }
          }
          "FAILED_CASES=$($failures -join ',')" | Tee-Object "$env:RUNNER_TEMP/boundary-audit/summary.txt"
          if ($failures.Count -ne 0) { exit 1 }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: boundary-audit-${{ matrix.area }}-${{ github.sha }}
          path: ${{ runner.temp }}/boundary-audit
          retention-days: 1
