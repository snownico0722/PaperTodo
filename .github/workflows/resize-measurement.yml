name: Paper window resize measurement
on:
  push:
    branches: [bench/paper-window-resize-20261109]
permissions:
  contents: read
jobs:
  measure:
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Run live paper window resize measurements
        shell: pwsh
        env:
          PAPERTODO_RESIZE_PROBE: "1"
          DOTNET_NOLOGO: "1"
          DOTNET_CLI_TELEMETRY_OPTOUT: "1"
        run: |
          python tools/PaperTodo.MaterialBenchmarks/InstrumentResize.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet build -c Release tools/PaperTodo.MaterialBenchmarks
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          foreach ($suite in @("platform", "components")) {
            $env:PAPER_RESIZE_SUITE = $suite
            dotnet run --no-build -c Release --project tools/PaperTodo.MaterialBenchmarks -- --drag-benchmark "$env:RUNNER_TEMP/resize-$suite.json"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
