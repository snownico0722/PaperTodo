name: Full boundary audit notes
on:
  push:
    branches: [audit/full-boundary-pass-20261103]
    paths: [.github/workflows/full-boundary-audit-notes.yml]
permissions:
  contents: write
jobs:
  finish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Update only user-visible release notes
        shell: python
        run: |
          from pathlib import Path
          edits = {
            'CHANGELOG.md': {
              '- **Plugin-body reads and writes**:': ' If a callback deletes a target paper before an external write or plugin title update proceeds, the operation now reports that the target is unavailable instead of reporting a write that never reached a live paper.',
              '- **Review Archive data**:': ' A failing view notification no longer prevents automatic saving of an archive change or delivery to the remaining observers.'
            },
            'CHANGELOG.zh.md': {
              '- **插件正文读写**：': ' 如果回调在外部写入或插件修改标题之前删除了目标纸片，操作会明确报告目标不可用，不再对已经脱离工作区的对象继续修改并报告成功。',
              '- **复盘记录池数据**：': ' 界面通知出错不再阻止本次修改的自动保存，也不会打断其余观察者的通知。'
            }
          }
          for filename, replacements in edits.items():
              path = Path(filename)
              lines = path.read_text(encoding='utf-8').splitlines(keepends=True)
              for prefix, addition in replacements.items():
                  indexes = [i for i, line in enumerate(lines) if line.startswith(prefix)]
                  assert len(indexes) == 1, (filename, prefix, indexes)
                  i = indexes[0]
                  assert addition.strip() not in lines[i]
                  lines[i] = lines[i].rstrip('\r\n') + addition + '\n'
              path.write_text(''.join(lines), encoding='utf-8')
      - name: Verify notes and commit scoped changes
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          python -m unittest discover -s .github/scripts -p test_release_notes.py -v
          git diff --check
          branch=audit/full-boundary-pass-20261103
          test "$(git ls-remote origin "refs/heads/$branch" | cut -f1)" = "$EXPECTED_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add CHANGELOG.md CHANGELOG.zh.md
          git rm .github/workflows/full-boundary-audit-notes.yml
          git commit -m '同步回调目标失效与复盘自动保存修复的双语说明'
          git push origin "HEAD:refs/heads/$branch"
          mkdir -p "$RUNNER_TEMP/full-audit-final"
          git archive --format=tar HEAD > "$RUNNER_TEMP/full-audit-final/source.tar"
      - name: Export canonical tracked inventory including Unicode paths and submodules
        shell: python
        run: |
          import hashlib, json, os, subprocess
          from pathlib import Path
          output = Path(os.environ['RUNNER_TEMP']) / 'full-audit-final'
          rows = []
          for entry in subprocess.check_output(['git','ls-tree','-rz','HEAD']).split(b'\0'):
              if not entry: continue
              info, rawpath = entry.split(b'\t', 1)
              mode, kind, oid = info.decode('ascii').split()
              path = rawpath.decode('utf-8')
              row = dict(path=path, mode=mode, kind=kind, git_object=oid)
              if kind == 'blob':
                  data = subprocess.check_output(['git','cat-file','blob',oid])
                  row.update(bytes=len(data), sha256=hashlib.sha256(data).hexdigest())
              rows.append(row)
          metadata = dict(head=subprocess.check_output(['git','rev-parse','HEAD']).decode().strip(),
              parent_audit='efd8a400fcaa1f0beb43bc05b9ea36ff81abbb0f',
              tested_code='d4ba0b348ce791190ead720559d5f68ece92328c',
              validation_run=41735531015,
              scope='Canonical tracked Git blobs plus separately identified gitlinks; not line coverage',
              files=rows)
          (output/'tracked-inventory.json').write_text(json.dumps(metadata,ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps(dict(head=metadata['head'], blobs=sum(r['kind']=='blob' for r in rows), gitlinks=sum(r['kind']=='commit' for r in rows))))
      - uses: actions/upload-artifact@v4
        with:
          name: full-audit-final-source
          path: ${{ runner.temp }}/full-audit-final/*
          retention-days: 1
