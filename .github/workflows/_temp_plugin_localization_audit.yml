name: Temporary plugin localization audit

on:
  push:
    branches:
      - feat/localize-plugin-samples

permissions:
  contents: write

jobs:
  audit-and-fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/localize-plugin-samples
          fetch-depth: 0
          submodules: recursive
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Fix Cloud Genshin missed UI strings
        shell: pwsh
        run: |
          @'
          from pathlib import Path
          path = Path('plugin-samples/PaperTodo.Plugin.CloudGenshin/CloudGenshinPlugin.cs')
          text = path.read_text(encoding='utf-8')
          replacements = {
              'SetPaperStatus("云原神 · 加载中", PaperCapsuleTone.Muted);': 'SetPaperStatus(PluginText.T("云原神 · 加载中"), PaperCapsuleTone.Muted);',
              'ShowStatus("正在加载云·原神…");': 'ShowStatus(PluginText.T("正在加载云·原神…"));',
          }
          for old, new in replacements.items():
              text = text.replace(old, new)
          path.write_text(text, encoding='utf-8')
          '@ | python -

      - name: Audit localized manifests and self-rendered UI
        shell: pwsh
        run: |
          @'
          from pathlib import Path
          import json, re

          cjk = re.compile(r'[\u3400-\u9fff]')
          failures = []
          sample_ids = {
              'sample.cloudgenshin.native', 'sample.focus-timer.native', 'official.clock.web',
              'sample.protocol21.web', 'sample.review-archive.native', 'sample.clock.native',
              'sample.topbar.web', 'tools.codex-cli-bridge.native'
          }

          def walk_strings(value):
              if isinstance(value, str):
                  yield value
              elif isinstance(value, dict):
                  for item in value.values(): yield from walk_strings(item)
              elif isinstance(value, list):
                  for item in value: yield from walk_strings(item)

          for path in Path('plugin-samples').glob('PaperTodo.Plugin.*/plugin.json'):
              doc = json.loads(path.read_text(encoding='utf-8'))
              if doc.get('id') not in sample_ids: continue
              base = {k: v for k, v in doc.items() if k != 'locales'}
              for value in walk_strings(base):
                  if cjk.search(value):
                      failures.append(f'{path}: base manifest contains CJK: {value}')
              locales = doc.get('locales') or {}
              if not any(key.lower().startswith('zh') for key in locales):
                  failures.append(f'{path}: missing zh locale')

          native_files = [
              Path('plugin-samples/PaperTodo.Plugin.CloudGenshin/CloudGenshinPlugin.cs'),
              Path('plugin-samples/PaperTodo.Plugin.FocusTimer/FocusTimerPlugin.cs'),
              Path('plugin-samples/PaperTodo.Plugin.ReviewArchive/ReviewArchivePlugin.cs'),
              Path('plugin-samples/PaperTodo.Plugin.ReviewArchive/ReviewArchiveSession.cs'),
              Path('plugin-samples/PaperTodo.Plugin.ReviewArchive/ReviewArchiveSettingsReader.cs'),
              Path('plugin-samples/PaperTodo.Plugin.SampleClock/SampleClockPlugin.cs'),
          ]
          string_literal = re.compile(r'"(?:\\.|[^"\\])*[\u3400-\u9fff](?:\\.|[^"\\])*"')
          for path in native_files:
              lines = path.read_text(encoding='utf-8').splitlines()
              for i, line in enumerate(lines):
                  if not string_literal.search(line): continue
                  context = '\n'.join(lines[max(0, i-2):min(len(lines), i+2)])
                  if 'PluginText.' in context:
                      continue
                  failures.append(f'{path}:{i+1}: raw localized C# string: {line.strip()}')

          web_files = [
              Path('plugin-samples/PaperTodo.Plugin.OfficialClockWeb/web/index.html'),
              Path('plugin-samples/PaperTodo.Plugin.OfficialClockWeb/web/mini.html'),
              Path('plugin-samples/PaperTodo.Plugin.OfficialClockWeb/web/runtime.html'),
              Path('plugin-samples/PaperTodo.Plugin.Protocol21Web/web/index.html'),
              Path('plugin-samples/PaperTodo.Plugin.Protocol21Web/web/runtime.html'),
              Path('plugin-samples/PaperTodo.Plugin.TopBarWeb/web/index.html'),
              Path('plugin-samples/PaperTodo.Plugin.TopBarWeb/web/runtime.html'),
          ]
          for path in web_files:
              lines = path.read_text(encoding='utf-8').splitlines()
              for i, line in enumerate(lines):
                  if not cjk.search(line): continue
                  stripped = line.strip()
                  if stripped.startswith('<!--') or stripped.startswith('//'):
                      continue
                  context = '\n'.join(lines[max(0, i-2):min(len(lines), i+3)])
                  paired = bool(re.search(r"['\"`][^'\"`]*[\u3400-\u9fff][^'\"`]*['\"`]\s*,\s*['\"`][^'\"`]*[A-Za-z]", line))
                  if 't(' in context or 'isChinese' in context or paired:
                      continue
                  failures.append(f'{path}:{i+1}: raw localized Web string: {stripped}')

          for path in [Path('src/WebPaperBodySession.cs'), Path('src/WebPaperBodySession.Mini.cs'), Path('src/WebPluginRuntime.cs')]:
              if 'uiLanguage =' not in path.read_text(encoding='utf-8'):
                  failures.append(f'{path}: initialize payload missing uiLanguage')

          if failures:
              print('\n'.join(failures))
              raise SystemExit(f'Localization audit failed with {len(failures)} finding(s).')
          print('Plugin localization raw-string audit passed.')
          '@ | python -
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Rebuild native sample outputs
        shell: pwsh
        run: |
          $projects = Get-ChildItem -Path plugin-samples -Recurse -Filter *.csproj | Sort-Object FullName
          foreach ($project in $projects) {
            & ./plugin-samples/Build-And-Install-NativePlugin.ps1 -ProjectPath $project.FullName
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }

      - name: Check Web scripts and host build
        shell: pwsh
        run: |
          dotnet build .\PaperTodo.csproj -c Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $htmlFiles = Get-ChildItem plugin-samples,plugins -Recurse -Filter *.html
          foreach ($html in $htmlFiles) {
            $content = Get-Content $html.FullName -Raw -Encoding UTF8
            $matches = [regex]::Matches($content, '<script(?:\s[^>]*)?>([\s\S]*?)</script>', [Text.RegularExpressions.RegexOptions]::IgnoreCase)
            for ($index = 0; $index -lt $matches.Count; $index++) {
              $temporary = Join-Path $env:RUNNER_TEMP ("$($html.BaseName)-$index-" + [Guid]::NewGuid().ToString("N") + ".js")
              Set-Content $temporary $matches[$index].Groups[1].Value -Encoding UTF8
              node --check $temporary
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            }
          }

      - name: Commit audited fixes
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add plugin-samples plugins
          if git diff --cached --quiet; then
            echo "No audit fixes needed."
            exit 0
          fi
          git commit -m "fix(plugin): finish sample localization coverage [ci]"
          git push origin HEAD:feat/localize-plugin-samples
