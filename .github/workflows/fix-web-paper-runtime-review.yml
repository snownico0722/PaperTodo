name: Fix Web Paper Runtime Review

on:
  push:
    branches:
      - feature/web-paper-runtime-lifecycle
    paths:
      - .github/workflows/fix-web-paper-runtime-review.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/web-paper-runtime-lifecycle
          fetch-depth: 0
          submodules: recursive

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Apply review fixes
        shell: pwsh
        run: python .\tools\fix_web_paper_runtime_review.py

      - name: Diff check
        shell: pwsh
        run: git diff --check

      - name: Restore
        shell: pwsh
        run: dotnet restore .\PaperTodo.csproj

      - name: Build Release
        shell: pwsh
        run: dotnet build .\PaperTodo.csproj -c Release --no-restore

      - name: Protocol policy checks
        shell: pwsh
        run: dotnet run --project .\tests\PaperTodo.ProtocolPolicyChecks\PaperTodo.ProtocolPolicyChecks.csproj -c Release

      - name: Review boundary scans
        shell: pwsh
        run: |
          @'
          from pathlib import Path
          runtime = Path('src/WebPaperRuntime.cs').read_text(encoding='utf-8')
          body = Path('src/WebPaperBodySession.cs').read_text(encoding='utf-8')
          app = Path('src/AppController.cs').read_text(encoding='utf-8')
          docs = Path('plugin-samples/README.md').read_text(encoding='utf-8')
          assert 'private int _stateVersion;' in runtime
          assert '_activeDocumentToken' in runtime and '_departingDocumentToken' in runtime
          assert 'SaveStateFromRuntime' in runtime
          assert '_pendingRuntimeMessages' in body
          assert app.index('EnableWebPaperRuntimeReconciliation();') < app.index('await RestorePaperSurfacesAsync(papersToRestore);')
          assert '| `paperRuntime` |' in docs
          assert 'Web 插件声明 `backgroundUpdates` 时必须同时声明 `paperRuntime`' in docs
          '@ | python -

      - name: Commit verified fixes
        shell: pwsh
        run: |
          Remove-Item .\tools\fix_web_paper_runtime_review.py
          Remove-Item .\.github\workflows\fix-web-paper-runtime-review.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: harden Web paper runtime lifecycle"
          git push origin HEAD:feature/web-paper-runtime-lifecycle
