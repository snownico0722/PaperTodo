name: One-shot v3.31 changelog resync

on:
  push:
    branches: [3.x]
    paths:
      - .github/workflows/oneshot-v331-changelog-resync-20260831.yml

permissions:
  contents: write

jobs:
  sync-main:
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"
    steps:
      - name: Checkout helper from 3.x
        uses: actions/checkout@v4
        with:
          ref: 3.x
          path: automation
          fetch-depth: 1

      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          path: main
          fetch-depth: 0

      - name: Sync changelog
        shell: pwsh
        run: python automation/.github/scripts/oneshot_v331_changelog_resync_20260831.py main

      - name: Validate and push
        shell: pwsh
        working-directory: main
        run: |
          git diff --check
          git diff -- CHANGELOG.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CHANGELOG.md
          git commit -m "docs: resync v3.31 changelog"
          git push origin HEAD:main
