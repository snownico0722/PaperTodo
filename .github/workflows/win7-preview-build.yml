name: Win7 best-effort build

on:
  push:
    branches:
      - win7-3.31-preview
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Win7 best-effort single file
    runs-on: windows-latest
    timeout-minutes: 15

    defaults:
      run:
        shell: pwsh

    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "true"
      WIN7_VERSION: "3.31-win7BestEffort"
      WIN7_EXE: "PaperTodo-v3.31-win7BestEffort-win-x64-self-contained.exe"

    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Build Win7 best-effort single file
        run: .\build-win7.ps1 -SelfContained

      - name: Verify single-file output
        run: |
          $output = ".\输出\PaperTodo-v$env:WIN7_VERSION"
          $exe = Join-Path $output $env:WIN7_EXE
          if (-not (Test-Path -LiteralPath $exe -PathType Leaf)) {
            throw "Win7 best-effort build did not produce $env:WIN7_EXE."
          }

          $files = @(Get-ChildItem -LiteralPath $output -File -Recurse)
          if ($files.Count -ne 1) {
            $files | Select-Object FullName, Length | Format-Table
            throw "Win7 best-effort output is not a true single-file package."
          }

          Get-Item -LiteralPath $exe | Format-Table Name, Length

      - name: Upload Win7 best-effort executable
        uses: actions/upload-artifact@v7
        with:
          name: PaperTodo-v${{ env.WIN7_VERSION }}-win-x64-self-contained
          if-no-files-found: error
          path: 输出/PaperTodo-v${{ env.WIN7_VERSION }}/${{ env.WIN7_EXE }}
