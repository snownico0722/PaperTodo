name: Temporary 3.x PowerShell in-flight proof
on:
  pull_request:
    branches: [3.x]
    paths: [.github/workflows/backport3x-powershell-review.yml]
permissions:
  contents: read
jobs:
  proof:
    if: github.event.pull_request.head.repo.full_name == github.repository && github.head_ref == 'backport/3x-system-startup-1019'
    runs-on: windows-latest
    timeout-minutes: 10
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Use only the pinned verified three-PR product sources
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git checkout --detach 532cd1362ae8f5276e980a9f078964f72e5bb3ee
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git merge --no-ff --no-edit a1f482fd3d655f7e1f90a6c85a4fe991abd7a9a6
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git merge --no-ff --no-edit 815de7a29964ef4900c2babfcc327b4a31c3c133
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Verify script start, in-flight preference changes, completion and session reuse
        run: |
          @'
          import os, subprocess
          from pathlib import Path
          root=Path.cwd()
          target=Path(os.environ['RUNNER_TEMP'])/'papertodo-powershell-inflight-proof'
          target.mkdir(exist_ok=True)
          project=target/'Check.csproj'
          project.write_text(f'<Project Sdk="Microsoft.NET.Sdk"><PropertyGroup><OutputType>Exe</OutputType><TargetFramework>net10.0-windows</TargetFramework><UseWPF>true</UseWPF><ImplicitUsings>enable</ImplicitUsings><Nullable>enable</Nullable></PropertyGroup><ItemGroup><ProjectReference Include="{root / "PaperTodo.csproj"}" /></ItemGroup></Project>',encoding='utf-8')
          code=r'''using System.Diagnostics;
          using System.IO;
          using System.Reflection;
          using System.Windows;
          using PaperTodo;
          static class Proof
          {
              const BindingFlags F=BindingFlags.Public|BindingFlags.NonPublic|BindingFlags.Instance|BindingFlags.Static;
              static object? Call(object target,string name,params object?[] args)
              {
                  var type=target as Type ?? target.GetType();
                  return type.GetMethods(F).Single(m=>m.Name==name && m.GetParameters().Length==args.Length).Invoke(target is Type ? null : target,args);
              }
              static void Check(bool ok,string label){if(!ok)throw new Exception(label);Console.WriteLine("PASS "+label);}
              [STAThread] static int Main()
              {
                  AppController? c=null;
                  try
                  {
                      var app=new Application{ShutdownMode=ShutdownMode.OnExplicitShutdown};
                      c=new AppController();c.State.Papers.Clear();
                      c.State.UsePersistentPowerShellProcess=true;c.State.PreferPowerShell7=false;c.State.HideScriptRunWindow=true;
                      var process=(Process)Call(typeof(PaperWindow),"EnsurePersistentScriptProcess","powershell.exe",true)!;
                      int pid=process.Id;
                      var started=Path.Combine(AppContext.BaseDirectory,"started.txt");
                      var completed=Path.Combine(AppContext.BaseDirectory,"completed.txt");
                      File.Delete(started);File.Delete(completed);
                      // Match the real submission prelude so the workload is not the first
                      // redirected line. The inherited legacy UTF-8 preamble is not a sleep.
                      process.StandardInput.WriteLine("[Console]::OutputEncoding = [System.Text.Encoding]::UTF8");
                      process.StandardInput.WriteLine("$OutputEncoding = [System.Text.Encoding]::UTF8");
                      process.StandardInput.WriteLine("$ErrorActionPreference='Stop'; Set-Content -LiteralPath '"+started.Replace("'","''")+"' -Value running; Start-Sleep -Seconds 4; Set-Content -LiteralPath '"+completed.Replace("'","''")+"' -Value completed");
                      process.StandardInput.Flush();
                      var deadline=Environment.TickCount64+15000;
                      while(!File.Exists(started) && Environment.TickCount64<deadline)Thread.Sleep(20);
                      Check(File.Exists(started) && !File.Exists(completed),"workload has actually started and has not completed before switching");
                      var timer=Stopwatch.StartNew();
                      Call(c,"TogglePreferPowerShell7");
                      Check(process.Id==pid && !process.HasExited && !File.Exists(completed),"version preference preserves the running workload and PID");
                      Call(c,"ToggleHideScriptRunWindow");
                      Check(process.Id==pid && !process.HasExited && !File.Exists(completed),"window preference preserves the still-running workload and PID");
                      deadline=Environment.TickCount64+12000;
                      while(!File.Exists(completed) && Environment.TickCount64<deadline)Thread.Sleep(20);
                      Check(File.Exists(completed) && File.ReadAllText(completed).Trim()=="completed" && timer.ElapsedMilliseconds>=2500,"same workload completes after both changes with its real delay intact");
                      var same=(Process)Call(typeof(PaperWindow),"EnsurePersistentScriptProcess","powershell.exe",true)!;
                      Check(same.Id==pid,"returning to the original preference reuses the original session");
                      Call(c,"TogglePersistentPowerShellProcess");
                      Check(!c.State.UsePersistentPowerShellProcess,"explicit persistent-mode disable remains available");
                      Console.WriteLine("IN-FLIGHT POWERSHELL PROOF PASSED");return 0;
                  }
                  catch(Exception e){Console.Error.WriteLine(e);return 1;}
                  finally{try{Call(typeof(PaperWindow),"StopPersistentScriptProcesses");}finally{c?.Dispose();}}
              }
          }'''
          (target/'Program.cs').write_text(code,encoding='utf-8')
          subprocess.run(['dotnet','run','--project',str(project),'-c','Release'],check=True)
          '@ | python -
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Record proof and no-source-change boundary
        run: |
          'Actual script-start handshake and intact delay confirmed before/after both preference changes; original PID retained and reused.' | Out-File $env:GITHUB_STEP_SUMMARY -Append
          'Read-only workflow; no product files, branches, merge targets or releases are modified by this job.' | Out-File $env:GITHUB_STEP_SUMMARY -Append
