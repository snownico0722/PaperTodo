name: Validate Focus Timer Plugin

on:
  pull_request:
    paths:
      - "plugin-samples/PaperTodo.Plugin.FocusTimer/**"
      - ".github/workflows/validate-focus-timer.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Check out source
        uses: actions/checkout@v7

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Build native WPF plugin
        run: dotnet build .\plugin-samples\PaperTodo.Plugin.FocusTimer\PaperTodo.Plugin.FocusTimer.csproj -c Release
