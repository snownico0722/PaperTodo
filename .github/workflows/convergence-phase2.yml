name: Convergence phase 2

on:
  push:
    branches:
      - cleanup/runtime-and-todo-convergence

permissions:
  contents: write

jobs:
  apply-and-validate:
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Apply phase 2
        run: python .\tools\apply_convergence_phase2.py
      - name: Diff check
        run: git diff --check
      - name: Restore
        run: dotnet restore .\PaperTodo.csproj
      - name: Build Release
        run: dotnet build .\PaperTodo.csproj -c Release --no-restore
      - name: Protocol checks
        run: dotnet run --project .\tests\PaperTodo.ProtocolPolicyChecks\PaperTodo.ProtocolPolicyChecks.csproj -c Release
      - name: Structural checks
        run: |
          $dropOldest = @(git grep -n "pending.*Messages.Count >= 32" -- src/WebPaper*.cs 2>$null)
          if ($dropOldest.Count -gt 0) {
            $contexts = foreach ($line in $dropOldest) { $line }
            $dequeues = @(git grep -n "pending.*Messages.Dequeue" -- src/WebPaper*.cs 2>$null)
            # Dequeue is valid after successful delivery; only reject the old overflow loop shape.
            $bad = @(git grep -n -P "while \(_pending(Runtime|Body)Messages\.Count >= 32\)" -- src/WebPaper*.cs 2>$null)
            if ($bad.Count -gt 0) { $bad | Write-Host; throw "silent drop-oldest transport remains" }
          }
          if (-not (git grep -n "runtime_unavailable" -- src/WebPaperBodySession.cs)) { throw "explicit runtime send failure missing" }
          if (-not (git grep -n "body_unavailable" -- src/WebPaperRuntime.cs)) { throw "explicit body send failure missing" }
          if (-not (git grep -n "paperRuntimeOwnsState" -- src/WebPaperBodySession.cs src/PaperWindow.PluginBodies.cs)) { throw "single-writer state boundary missing" }
          if (-not (git grep -n "webview2-runtime" -- src/WebPaperBodySession.cs)) { throw "runtime environment split missing" }
          if (-not (git grep -n "MaximumConcurrentColdStarts = 3" -- src/WebPaperRuntime.cs)) { throw "paper runtime startup bound missing" }
          if (-not (git grep -n "IdleReleaseDelay = TimeSpan.FromSeconds(45)" -- src/WebPaperBodySession.Mini.cs)) { throw "mini idle release missing" }
      - name: Commit validated product changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          Remove-Item .\tools\apply_convergence_phase2.py
          Remove-Item .\.github\workflows\convergence-phase2.yml
          git add -A
          git commit -m "refactor: narrow Web runtime ownership and resources"
          git push
