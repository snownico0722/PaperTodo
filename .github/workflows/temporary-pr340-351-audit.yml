name: Temporary PR 340-351 implementation verification

on:
  push:
    branches: [feat/data-json-hot-reload-main-adapt]
    paths: [.github/workflows/temporary-pr340-351-audit.yml]

permissions:
  contents: read

jobs:
  verify:
    if: github.repository == 'snownico0722/PaperTodo'
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - pr: '340'
            base: 5ef165668ebc1bdb3c292ba9729b58d5921deec3
          - pr: '351'
            base: 581408c6045c5d7618f3954d62521927e09d736a
    defaults:
      run:
        shell: pwsh
        working-directory: source
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: 'true'
    steps:
      - name: Preserve exact source line endings
        shell: pwsh
        working-directory: .
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v7
        with:
          path: harness
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          ref: ${{ matrix.base }}
          path: source
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Verify and apply exact candidate patch
        env:
          REVIEW_PR: ${{ matrix.pr }}
        run: |
          @'
          import base64, hashlib, json, lzma, os, pathlib, subprocess
          root = pathlib.Path('../harness/.github')
          encoded = ''.join((root / f'pr340-351-review-payload.{i}').read_text().strip() for i in (1,2,3))
          data = lzma.decompress(base64.b64decode(encoded, validate=True))
          assert hashlib.sha256(data).hexdigest() == 'd1c95f62f2785392f17aafce099d713ceac7cb7ae972ef44e4b11c7728b365b8'
          entry = json.loads(data)[os.environ['REVIEW_PR']]
          assert subprocess.check_output(['git','rev-parse','HEAD'], text=True).strip() == entry['base']
          patch = pathlib.Path(os.environ['RUNNER_TEMP']) / 'candidate.patch'
          patch.write_text(entry['patch'], encoding='utf-8', newline='')
          subprocess.run(['git','apply','--check','--unidiff-zero',str(patch)],check=True)
          subprocess.run(['git','apply','--unidiff-zero',str(patch)],check=True)
          subprocess.run(['git','diff','--check'],check=True)
          subprocess.run(['git','add','-A'],check=True)
          '@ | python -
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build Release
        run: |
          dotnet build ./PaperTodo.csproj -c Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Rebuild candidate native runtime outputs
        run: |
          Get-ChildItem plugin-samples -Recurse -Filter *.csproj | Sort-Object FullName | ForEach-Object {
            & ./plugin-samples/Build-And-Install-NativePlugin.ps1 -ProjectPath $_.FullName
            if ($LASTEXITCODE -ne 0) { throw "Native output build failed: $LASTEXITCODE" }
          }
          git add -A -- plugins
      - name: Run complete existing behavior inventory
        run: |
          ./tools/testing/Run-Checks.ps1 -Group all 2>&1 | Tee-Object -FilePath "$env:RUNNER_TEMP/review-checks.log"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git diff --exit-code
          if ($LASTEXITCODE -ne 0) { throw 'Verification changed staged candidate contents.' }
      - name: Export verified candidate only
        env:
          REVIEW_PR: ${{ matrix.pr }}
        run: |
          @'
          import base64, hashlib, json, os, pathlib, subprocess
          names = subprocess.check_output(['git','diff','--cached','--name-only','-z']).decode().split('\0')
          entries = []
          for name in filter(None,names):
              path = pathlib.Path(name)
              assert not name.startswith('.github/pr340-351-review')
              if not path.exists():
                  entries.append({'path':name,'deleted':True})
              else:
                  data=path.read_bytes()
                  entries.append({'path':name,'sha256':hashlib.sha256(data).hexdigest(),'content':base64.b64encode(data).decode()})
          out=pathlib.Path('../delivery')
          out.mkdir(exist_ok=True)
          (out / (os.environ['REVIEW_PR']+'.json')).write_text(json.dumps(entries),encoding='utf-8')
          stats=subprocess.check_output(['git','diff','--cached','--stat'],text=True)
          print(stats)
          (out / (os.environ['REVIEW_PR']+'-stat.txt')).write_text(stats,encoding='utf-8')
          '@ | python -
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v6
        if: success()
        with:
          name: verified-candidate-${{ matrix.pr }}
          path: delivery/*
          retention-days: 2
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: verification-logs-${{ matrix.pr }}
          path: ${{ runner.temp }}/review-checks.log
          if-no-files-found: ignore
          retention-days: 2

  prepare-commits:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          pattern: verified-candidate-*
          merge-multiple: true
          path: delivery
      - name: Create verified commit objects without changing any branch
        env:
          GH_TOKEN: ${{ github.token }}
          INFRA_HEAD: ${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64,hashlib,json,os,pathlib,urllib.request
          api='https://api.github.com/repos/'+os.environ['REPOSITORY']
          def request(method,path,body=None):
              payload=None if body is None else json.dumps(body).encode()
              req=urllib.request.Request(api+path,data=payload,method=method,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json','X-GitHub-Api-Version':'2022-11-28'})
              with urllib.request.urlopen(req,timeout=60) as r:return json.load(r)
          result={}
          for pr in ('340','351'):
              parent=os.environ['INFRA_HEAD'] if pr=='340' else '581408c6045c5d7618f3954d62521927e09d736a'
              old=request('GET','/git/commits/'+parent)
              elements=[]
              entries=json.loads(pathlib.Path('delivery/'+pr+'.json').read_text())
              for item in entries:
                  if item.get('deleted'):sha=None
                  else:
                      data=base64.b64decode(item['content'],validate=True)
                      assert hashlib.sha256(data).hexdigest()==item['sha256']
                      sha=request('POST','/git/blobs',{'content':item['content'],'encoding':'base64'})['sha']
                  elements.append({'path':item['path'],'mode':'100644','type':'blob','sha':sha})
              if pr=='340':
                  cleanup=['.github/workflows/temporary-pr340-351-audit.yml']+[f'.github/pr340-351-review-payload.{i}' for i in (1,2,3)]
                  elements += [{'path':p,'mode':'100644','type':'blob','sha':None} for p in cleanup]
              tree=request('POST','/git/trees',{'base_tree':old['tree']['sha'],'tree':elements})['sha']
              parents=[parent] if pr=='340' else [parent,result['340']['commit']]
              message='feat(data): 三种冲突策略、真实选择归档与合并边界修复 [ci]' if pr=='340' else 'fix(workspaces): 同步三方合并策略并修复状态隔离和失败回滚 [ci]'
              commit=request('POST','/git/commits',{'message':message,'tree':tree,'parents':parents})['sha']
              result[pr]={'commit':commit,'expected_head':parent,'tree':tree,'changed_files':len(entries)}
          pathlib.Path('prepared-commits.json').write_text(json.dumps(result,indent=2))
          print(json.dumps(result,indent=2))
          PY
      - uses: actions/upload-artifact@v6
        with:
          name: prepared-pr340-351-commits
          path: prepared-commits.json
          retention-days: 2
