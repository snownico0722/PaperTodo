name: 3.2 maintenance build

on:
  pull_request:
    branches:
      - 3.2
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - ".github/workflows/release.yml"

permissions:
  contents: write

concurrency:
  group: maintenance-build-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  patch-release-notes:
    name: Patch v3.3 release notes
    runs-on: ubuntu-latest
    steps:
      - name: Check out PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}

      - name: Append low-risk backport notes
        shell: python
        run: |
          from pathlib import Path

          path = Path("CHANGELOG.md")
          text = path.read_text(encoding="utf-8")
          anchor = "- 提升旧版 Windows 启动兼容性，避免部分环境在程序界面出现前直接启动失败。"
          replacement = anchor + "\n" + (
              "- 修复贴边深胶囊右键菜单打开二级菜单后，点击子项可能被外部点击保护提前关闭的问题。\n"
              "- 修复部分贴边胶囊设置变化后，需要等下一次鼠标或布局变化才刷新显示的问题；状态设置现在会立即重算布局。"
          )

          if text.count(anchor) != 1:
              raise SystemExit(f"expected exactly one v3.3 anchor, got {text.count(anchor)}")
          if "修复贴边深胶囊右键菜单打开二级菜单后" in text:
              raise SystemExit("v3.3 backport notes already present")

          path.write_text(text.replace(anchor, replacement, 1), encoding="utf-8")

      - name: Verify and push note update
        shell: bash
        run: |
          git diff --check
          git diff -- CHANGELOG.md
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- CHANGELOG.md
          git commit -m "docs: add 3.3 capsule backport notes"
          git push origin HEAD:${{ github.head_ref }}

  build:
    name: Build PaperTodo
    runs-on: windows-latest
    timeout-minutes: 15

    defaults:
      run:
        shell: pwsh

    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "true"

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore .\PaperTodo.csproj

      - name: Build
        run: dotnet build .\PaperTodo.csproj -c Release --no-restore

      - name: Publish single-file smoke test
        run: |
          $selfContainedOut = Join-Path $env:RUNNER_TEMP "maintenance-self-contained"
          $frameworkDependentOut = Join-Path $env:RUNNER_TEMP "maintenance-no-runtime"
          Remove-Item -LiteralPath $selfContainedOut, $frameworkDependentOut -Recurse -Force -ErrorAction SilentlyContinue

          dotnet publish .\PaperTodo.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -o $selfContainedOut `
            /p:PublishSingleFile=true `
            /p:PublishReadyToRun=false `
            /p:IncludeNativeLibrariesForSelfExtract=true `
            /p:EnableCompressionInSingleFile=true `
            /p:PublishTrimmed=false `
            /p:DebugType=none `
            /p:DebugSymbols=false `
            /p:EmbedAllSources=false `
            /p:EmbedUntrackedSources=false
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path -LiteralPath (Join-Path $selfContainedOut "PaperTodo.exe") -PathType Leaf)) {
            throw "Self-contained publish did not produce PaperTodo.exe"
          }

          dotnet publish .\PaperTodo.csproj `
            -c Release `
            -r win-x64 `
            --self-contained false `
            -o $frameworkDependentOut `
            /p:PublishSingleFile=true `
            /p:PublishReadyToRun=false `
            /p:IncludeNativeLibrariesForSelfExtract=true `
            /p:EnableCompressionInSingleFile=false `
            /p:PublishTrimmed=false `
            /p:DebugType=none `
            /p:DebugSymbols=false `
            /p:EmbedAllSources=false `
            /p:EmbedUntrackedSources=false
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path -LiteralPath (Join-Path $frameworkDependentOut "PaperTodo.exe") -PathType Leaf)) {
            throw "Framework-dependent publish did not produce PaperTodo.exe"
          }
