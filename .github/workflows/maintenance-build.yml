name: 3.2 maintenance build

on:
  pull_request:
    branches:
      - 3.2

permissions:
  contents: write

jobs:
  patch-final-stability:
    if: github.event.pull_request.head.ref == 'backport/3.3-final-stability'
    name: Apply final 3.3 stability patch
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Check out PR branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Apply and push final patch
        shell: pwsh
        run: .\.github\scripts\apply-3.3-final-stability.ps1
