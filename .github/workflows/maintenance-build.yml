name: 3.2 maintenance build

on:
  pull_request:
    branches:
      - 3.2
    paths-ignore:
      - "docs/**"
      - "**/*.md"
      - ".github/workflows/release.yml"

permissions:
  contents: write

concurrency:
  group: maintenance-build-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  build:
    name: Build PaperTodo
    runs-on: windows-latest
    timeout-minutes: 15

    defaults:
      run:
        shell: pwsh

    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "true"

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          submodules: true

      - name: Add PR 126 changelog entry
        run: |
          if (Test-Path -LiteralPath ".\.github\scripts\add-pr126-changelog.py" -PathType Leaf) {
            python .\.github\scripts\add-pr126-changelog.py
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -- CHANGELOG.md
            if (-not (git diff --cached --quiet)) {
              git commit -m "docs: add bare Markdown links to v3.3 changelog"
              git push origin HEAD:${{ github.event.pull_request.head.ref }}
            }
          }

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore .\PaperTodo.csproj

      - name: Build
        run: dotnet build .\PaperTodo.csproj -c Release --no-restore

      - name: Publish single-file smoke test
        run: |
          $selfContainedOut = Join-Path $env:RUNNER_TEMP "maintenance-self-contained"
          $frameworkDependentOut = Join-Path $env:RUNNER_TEMP "maintenance-no-runtime"
          Remove-Item -LiteralPath $selfContainedOut, $frameworkDependentOut -Recurse -Force -ErrorAction SilentlyContinue

          dotnet publish .\PaperTodo.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -o $selfContainedOut `
            /p:PublishSingleFile=true `
            /p:PublishReadyToRun=false `
            /p:IncludeNativeLibrariesForSelfExtract=true `
            /p:EnableCompressionInSingleFile=true `
            /p:PublishTrimmed=false `
            /p:DebugType=none `
            /p:DebugSymbols=false `
            /p:EmbedAllSources=false `
            /p:EmbedUntrackedSources=false
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path -LiteralPath (Join-Path $selfContainedOut "PaperTodo.exe") -PathType Leaf)) {
            throw "Self-contained publish did not produce PaperTodo.exe"
          }

          dotnet publish .\PaperTodo.csproj `
            -c Release `
            -r win-x64 `
            --self-contained false `
            -o $frameworkDependentOut `
            /p:PublishSingleFile=true `
            /p:PublishReadyToRun=false `
            /p:IncludeNativeLibrariesForSelfExtract=true `
            /p:EnableCompressionInSingleFile=false `
            /p:PublishTrimmed=false `
            /p:DebugType=none `
            /p:DebugSymbols=false `
            /p:EmbedAllSources=false `
            /p:EmbedUntrackedSources=false
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not (Test-Path -LiteralPath (Join-Path $frameworkDependentOut "PaperTodo.exe") -PathType Leaf)) {
            throw "Framework-dependent publish did not produce PaperTodo.exe"
          }
