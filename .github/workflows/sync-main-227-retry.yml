name: Patch #227 sync focus guard

on:
  push:
    branches:
      - exp/playful-skins-20260909
    paths:
      - .github/workflows/sync-main-227-retry.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch apply workflow and remove this helper
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "PaperTodo Sync Bot"
          git config user.email "36026283+snownico0722@users.noreply.github.com"
          python3 - <<'PY'
          from pathlib import Path
          p = Path('.github/workflows/sync-main-227-apply.yml')
          text = p.read_text(encoding='utf-8')
          start = text.index("          p = Path('src/PaperWindow.ExperimentalFocusPresentation.cs')")
          end = text.index("          # No conflict markers or duplicate current decision IDs may survive.", start)
          block = r'''          p = Path('src/PaperWindow.ExperimentalFocusPresentation.cs')
          text = p.read_text(encoding='utf-8')
          pattern = re.compile(r'(    private bool CanFadeInactiveTitleBar\(\) =>\n        AllowsTransparency &&\n)(        IsVisible &&)')
          text, count = pattern.subn(
              r'\1        (_paperChrome is not SkinBorder skin || !PaperSkins.IsDecorated(skin.Skin)) &&\n\2',
              text,
              count=1)
          if count != 1:
              raise SystemExit('Inactive-title eligibility shape changed')
          p.write_text(text, encoding='utf-8', newline='\n')

'''
          p.write_text(text[:start] + block + text[end:], encoding='utf-8', newline='\n')
          PY
          git rm .github/workflows/sync-main-227-retry.yml
          git add .github/workflows/sync-main-227-apply.yml
          git diff --check --cached
          git commit -m "ci: harden #227 sync focus guard patch"
          git push origin HEAD:exp/playful-skins-20260909
