name: Temporary beta version alignment

on:
  push:
    branches:
      - release/4.0beta1-prep

permissions:
  contents: write

jobs:
  align:
    if: github.event.head_commit.message == 'chore: apply 4.0.0-beta1 naming'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Align public beta naming
        run: |
          python3 - <<'PY'
          from pathlib import Path
          replacements = {
              'CHANGELOG.md': [('### v4.0beta1', '### v4.0.0-beta1')],
              'doc/CHANGELOG.en.md': [('### v4.0beta1', '### v4.0.0-beta1')],
              'README.md': [('currently <strong>4.0beta1</strong>', 'currently <strong>4.0.0-beta1</strong>')],
          }
          for path, pairs in replacements.items():
              p = Path(path)
              text = p.read_text(encoding='utf-8-sig')
              for old, new in pairs:
                  if text.count(old) != 1:
                      raise SystemExit(f'{path}: expected one {old!r}, found {text.count(old)}')
                  text = text.replace(old, new, 1)
              p.write_text(text, encoding='utf-8', newline='\n')
          PY
          git diff --check
          git config user.name "snownico0722"
          git config user.email "36026283+snownico0722@users.noreply.github.com"
          git add CHANGELOG.md doc/CHANGELOG.en.md README.md
          git commit -m "chore: align public beta naming [ci]"
          git push origin HEAD:release/4.0beta1-prep
