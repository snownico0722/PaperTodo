name: Plugin settings format one-shot

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  format-and-verify:
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "true"
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          submodules: recursive

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        shell: pwsh
        run: |
          dotnet restore .\PaperTodo.csproj
          dotnet restore .\tests\PaperTodo.ProtocolPolicyChecks\PaperTodo.ProtocolPolicyChecks.csproj

      - name: Normalize C# whitespace
        shell: pwsh
        run: |
          dotnet format whitespace .\PaperTodo.csproj --no-restore --include .\src\AppController.Plugins.cs .\src\PaperBodyPluginRegistry.Settings.cs
          dotnet format whitespace .\tests\PaperTodo.ProtocolPolicyChecks\PaperTodo.ProtocolPolicyChecks.csproj --no-restore --include .\tests\PaperTodo.ProtocolPolicyChecks\Program.cs

      - name: Verify
        shell: pwsh
        run: |
          dotnet build .\PaperTodo.csproj -c Release --no-restore
          dotnet run --project .\tests\PaperTodo.ProtocolPolicyChecks\PaperTodo.ProtocolPolicyChecks.csproj -c Release --no-restore
          git diff --check

      - name: Commit clean tree
        shell: pwsh
        run: |
          Remove-Item .\.github\workflows\plugin-settings-format-one-shot.yml -Force
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "style(plugin): normalize settings layout formatting"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
