name: Validate skin frame fixes
on:
  push:
    branches: [exp/playful-skins-20260909]
permissions:
  contents: write
concurrency:
  group: skin-frame-fix-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    if: contains(github.event.head_commit.message, '[skin-check]')
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Commit actual source changes on the experiment only
        id: source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          @'
          import pathlib, subprocess, hashlib, json
          def git(*args): return subprocess.check_output(['git', *args])
          assert git('branch','--show-current').decode().strip() == 'exp/playful-skins-20260909'
          payloads = sorted(pathlib.Path('.').glob('.skin-frame-fix.*.json'))
          if payloads:
              assert len(payloads) == 3
              outputs = {}
              h = lambda s: hashlib.sha256(s.encode('utf-8')).hexdigest()
              for payload in payloads:
                  for entry in json.loads(payload.read_text(encoding='utf-8-sig')):
                      name = entry['path']
                      assert name not in outputs and '..' not in pathlib.Path(name).parts
                      assert name == 'CHANGELOG.md' or name.startswith(('src/','tests/','Resources/','doc/'))
                      before = pathlib.Path(name).read_text(encoding='utf-8-sig') if pathlib.Path(name).exists() else ''
                      assert h(before) == entry['before'], 'Changed source: '+name
                      s = before
                      previous = 0
                      for start,end,value in entry['edits']:
                          assert previous <= start <= end <= len(before)
                          previous = end
                      for start,end,value in reversed(entry['edits']): s = s[:start] + value + s[end:]
                      assert h(s) == entry['after'], 'Transfer mismatch: '+name
                      outputs[name] = s
              assert len(outputs) == 19
              for name,s in outputs.items(): pathlib.Path(name).write_text(s,encoding='utf-8',newline='\n')
              for payload in payloads: payload.unlink()
              git('diff','--check')
              git('config','user.name','github-actions[bot]')
              git('config','user.email','41898282+github-actions[bot]@users.noreply.github.com')
              git('add','-A')
              assert not git('diff','--cached','--name-only','--','.github/workflows').strip()
              print(git('commit','-m','fix: remove native caption plates and nested skin frames; use clear glass composition').decode())
              print(git('push','origin','HEAD:refs/heads/exp/playful-skins-20260909').decode())
          '@ | python -
          if ($LASTEXITCODE -ne 0) { throw 'Source integration failed' }
          $sha = git rev-parse HEAD
          "sha=$sha" >> $env:GITHUB_OUTPUT
          "short=$($sha.Substring(0,8))" >> $env:GITHUB_OUTPUT
          git bundle create "$env:RUNNER_TEMP/skin-frame-source.bundle" HEAD
      - name: Release build
        shell: pwsh
        run: dotnet build ./PaperTodo.csproj -c Release --nologo -clp:ErrorsOnly
      - name: Material, native caption, clear background and reflection checks
        shell: pwsh
        env:
          PAPER_MICA_CAPTURE: ${{ runner.temp }}/skin-frame-evidence/native
          PAPER_SKIN_CAPTURE: ${{ runner.temp }}/skin-frame-evidence/skins
        run: dotnet run --project ./tests/PaperTodo.MicaChecks/PaperTodo.MicaChecks.csproj -c Release
      - name: Existing interaction and persistence regression checks
        shell: pwsh
        run: |
          foreach ($name in @('MarkdownSemanticChecks','MarkdownEditingChecks','TodoNavigationChecks','EdgeTitleChecks','ThreadingChecks','PersistenceChecks')) {
            dotnet run --project "./tests/PaperTodo.$name/PaperTodo.$name.csproj" -c Release
            if ($LASTEXITCODE -ne 0) { throw "Failed: $name" }
          }
      - name: Publish the tested source with embedded commit identity
        shell: pwsh
        run: |
          $sha = '${{ steps.source.outputs.sha }}'
          if ((git rev-parse HEAD) -ne $sha) { throw 'Source changed after validation' }
          $short = '${{ steps.source.outputs.short }}'
          $xml = [xml](Get-Content PaperTodo.csproj -Raw)
          $version = $xml.SelectSingleNode('/Project/PropertyGroup/Version').InnerText
          $destination = Join-Path $env:RUNNER_TEMP 'skin-frame-package'
          New-Item -ItemType Directory -Force $destination | Out-Null
          foreach ($kind in @('self-contained','no-runtime')) {
            $out = Join-Path $env:RUNNER_TEMP "publish-$kind"
            $contained = if ($kind -eq 'self-contained') { 'true' } else { 'false' }
            dotnet publish ./PaperTodo.csproj -c Release -r win-x64 --self-contained $contained -o $out /p:PublishSingleFile=true /p:IncludeNativeLibrariesForSelfExtract=true "/p:EnableCompressionInSingleFile=$contained" /p:PublishTrimmed=false /p:PublishReadyToRun=false /p:DebugType=none /p:DebugSymbols=false /p:EmbedAllSources=false /p:EmbedUntrackedSources=false "/p:InformationalVersion=$version+$sha"
            if ($LASTEXITCODE -ne 0) { throw "Publish failed: $kind" }
            Copy-Item (Join-Path $out 'PaperTodo.exe') (Join-Path $destination "PaperTodo-skins-$short-win-x64-$kind.exe")
          }
          $hashes = Get-ChildItem $destination -Filter *.exe | Get-FileHash -Algorithm SHA256 | Select-Object @{n='File';e={Split-Path $_.Path -Leaf}},Hash
          @{sourceCommit=$sha;branch='exp/playful-skins-20260909';configuration='Release';nativeBackend='repository default LMDB';executables=$hashes;realWindows11Backdrop='requires manual verification'} | ConvertTo-Json -Depth 5 | Set-Content (Join-Path $destination 'build-manifest.json') -Encoding utf8
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: skin-frame-evidence-${{ steps.source.outputs.short }}
          path: ${{ runner.temp }}/skin-frame-evidence
          if-no-files-found: ignore
          retention-days: 2
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: skin-frame-source-${{ steps.source.outputs.short }}
          path: ${{ runner.temp }}/skin-frame-source.bundle
          if-no-files-found: ignore
          retention-days: 1
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: skin-frame-package-${{ steps.source.outputs.short }}
          path: ${{ runner.temp }}/skin-frame-package
          if-no-files-found: error
          retention-days: 2
