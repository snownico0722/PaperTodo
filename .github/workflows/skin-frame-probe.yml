name: Validate repaired material composition
on:
  push:
    branches: [exp/playful-skins-20260909]
permissions:
  contents: write
concurrency:
  group: skin-frame-fix-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    if: contains(github.event.head_commit.message, '[skin-repair]')
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Apply reviewed repair to actual source
        id: source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ((git branch --show-current) -ne 'exp/playful-skins-20260909') { throw 'Wrong branch' }
          if (Test-Path .repair-skins.py) {
            git diff --exit-code d36a4f473d02ba6a88bd105fe2bce573c8868dc8 -- src tests Resources doc CHANGELOG.md
            if ($LASTEXITCODE -ne 0) { throw 'Product source changed; reconcile before applying' }
            python .repair-skins.py
            if ($LASTEXITCODE -ne 0) { throw 'Repair application failed' }
            Remove-Item .repair-skins.py
            git diff --check
            if ($LASTEXITCODE -ne 0) { throw 'Diff validation failed' }
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add -A
            if (git diff --cached --name-only -- .github/workflows) { throw 'Unexpected workflow change' }
            git commit -m 'fix: restore system glass composition, remove foil skin and refine lens/porcelain'
            if ($LASTEXITCODE -ne 0) { throw 'Commit failed' }
            git push origin HEAD:refs/heads/exp/playful-skins-20260909
            if ($LASTEXITCODE -ne 0) { throw 'Branch advanced during repair' }
          }
          $sha = git rev-parse HEAD
          "sha=$sha" >> $env:GITHUB_OUTPUT
          "short=$($sha.Substring(0,8))" >> $env:GITHUB_OUTPUT
          git bundle create "$env:RUNNER_TEMP/repaired-skins-source.bundle" HEAD
      - name: Release build
        shell: pwsh
        run: dotnet build ./PaperTodo.csproj -c Release --nologo -clp:ErrorsOnly
      - name: Native materials, visible lens, porcelain and lifecycle checks
        shell: pwsh
        env:
          PAPER_MICA_CAPTURE: ${{ runner.temp }}/repaired-skins-evidence/native
          PAPER_SKIN_CAPTURE: ${{ runner.temp }}/repaired-skins-evidence/skins
        run: dotnet run --project ./tests/PaperTodo.MicaChecks/PaperTodo.MicaChecks.csproj -c Release
      - name: Existing interaction and persistence checks
        shell: pwsh
        run: |
          foreach ($name in @('MarkdownSemanticChecks','MarkdownEditingChecks','TodoNavigationChecks','EdgeTitleChecks','ThreadingChecks','PersistenceChecks')) {
            dotnet run --project "./tests/PaperTodo.$name/PaperTodo.$name.csproj" -c Release
            if ($LASTEXITCODE -ne 0) { throw "Failed: $name" }
          }
      - name: Publish exactly the tested source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $sha = '${{ steps.source.outputs.sha }}'
          if ((git rev-parse HEAD) -ne $sha) { throw 'Source changed after tests' }
          $short = '${{ steps.source.outputs.short }}'
          $xml = [xml](Get-Content PaperTodo.csproj -Raw)
          $version = $xml.SelectSingleNode('/Project/PropertyGroup/Version').InnerText
          $destination = Join-Path $env:RUNNER_TEMP 'repaired-skins-package'
          New-Item -ItemType Directory -Force $destination | Out-Null
          foreach ($kind in @('self-contained','no-runtime')) {
            $out = Join-Path $env:RUNNER_TEMP "publish-$kind"
            $contained = if ($kind -eq 'self-contained') { 'true' } else { 'false' }
            dotnet publish ./PaperTodo.csproj -c Release -r win-x64 --self-contained $contained -o $out /p:PublishSingleFile=true /p:IncludeNativeLibrariesForSelfExtract=true "/p:EnableCompressionInSingleFile=$contained" /p:PublishTrimmed=false /p:PublishReadyToRun=false /p:DebugType=none /p:DebugSymbols=false /p:EmbedAllSources=false /p:EmbedUntrackedSources=false "/p:InformationalVersion=$version+$sha"
            if ($LASTEXITCODE -ne 0) { throw "Publish failed: $kind" }
            Copy-Item (Join-Path $out 'PaperTodo.exe') (Join-Path $destination "PaperTodo-skins-$short-win-x64-$kind.exe")
          }
          $hashes = Get-ChildItem $destination -Filter *.exe | Get-FileHash -Algorithm SHA256 | Select-Object @{n='File';e={Split-Path $_.Path -Leaf}},Hash
          @{sourceCommit=$sha;branch='exp/playful-skins-20260909';configuration='Release';nativeBackend='repository default LMDB';executables=$hashes;realWindows11Backdrop='requires manual verification'} | ConvertTo-Json -Depth 5 | Set-Content (Join-Path $destination 'build-manifest.json') -Encoding utf8
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: repaired-skins-evidence-${{ steps.source.outputs.short }}
          path: ${{ runner.temp }}/repaired-skins-evidence
          if-no-files-found: ignore
          retention-days: 2
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: repaired-skins-source-${{ steps.source.outputs.short }}
          path: ${{ runner.temp }}/repaired-skins-source.bundle
          if-no-files-found: ignore
          retention-days: 1
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: repaired-skins-package-${{ steps.source.outputs.short }}
          path: ${{ runner.temp }}/repaired-skins-package
          if-no-files-found: error
          retention-days: 2
