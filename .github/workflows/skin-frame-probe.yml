name: Isolate skin frame pixels
on:
  push:
    branches: [exp/playful-skins-20260909]
    paths: [.github/workflows/skin-frame-probe.yml]
permissions:
  contents: read
jobs:
  probe:
    runs-on: windows-latest
    timeout-minutes: 8
    steps:
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - shell: pwsh
        run: |
          New-Item -ItemType Directory probe | Out-Null
          Set-Location probe
          '<Project Sdk="Microsoft.NET.Sdk"><PropertyGroup><TargetFramework>net10.0-windows</TargetFramework><OutputType>Exe</OutputType><UseWPF>true</UseWPF><UseWindowsForms>true</UseWindowsForms><ImplicitUsings>enable</ImplicitUsings></PropertyGroup><ItemGroup><Using Remove="System.Drawing"/><Using Remove="System.Windows.Forms"/></ItemGroup></Project>' | Set-Content probe.csproj
          @'
          using System.IO;
          using System.Runtime.InteropServices;
          using System.Windows;
          using System.Windows.Controls;
          using System.Windows.Interop;
          using System.Windows.Media;
          using System.Windows.Shell;
          using System.Windows.Threading;
          using D = System.Drawing;
          class Probe {
            [STAThread] static void Main() {
              new Application { ShutdownMode=ShutdownMode.OnExplicitShutdown };
              var report=new List<string>(); Directory.CreateDirectory("evidence");
              foreach(var material in new[]{2,3,0})
              foreach(var mode in new[]{"explicit","default","none","disabled-nc","unthemed"}) {
                var w=new Window {WindowStyle=WindowStyle.None,ResizeMode=ResizeMode.CanResizeWithGrip,ShowInTaskbar=false,Left=60,Top=50,Width=340,Height=230,Background=Brushes.Transparent};
                var frame=new WindowChrome {CaptionHeight=0,ResizeBorderThickness=new Thickness(),GlassFrameThickness= material==0 ? new Thickness(0,1,0,0) : new Thickness(-1),CornerRadius=new CornerRadius(),UseAeroCaptionButtons=false};
                WindowChrome.SetWindowChrome(w,frame);
                w.Content=new Border {Background=material==3?new SolidColorBrush(Color.FromArgb(152,255,255,255)):Brushes.Transparent};
                w.Show();Wait();var h=new WindowInteropHelper(w).Handle;
                HwndSource.FromHwnd(h).CompositionTarget.BackgroundColor=Colors.Transparent;
                Set(h,20,0);Set(h,38,material==0?1:material);Set(h,33,2);Set(h,34,unchecked((int)0xfffffffe));
                var m=new Margins {Left=material==0?0:-1,Right=material==0?0:-1,Top=material==0?1:-1,Bottom=material==0?0:-1}; Extend(h,ref m);
                if(material==0) { var a=new Accent {State=4,Color=0x28ffffff}; var p=Marshal.AllocHGlobal(16);Marshal.StructureToPtr(a,p,false);var data=new Data {Attribute=19,DataPtr=p,Size=16};SetAccent(h,ref data);Marshal.FreeHGlobal(p); }
                Set(h,35,mode=="explicit"?0x00eeebeb:mode=="none"?unchecked((int)0xfffffffe):unchecked((int)0xffffffff));
                if(mode=="disabled-nc") Set(h,2,1);
                if(mode=="unthemed") SetWindowTheme(h,"","");
                Wait();DwmFlush();GetWindowRect(h,out var r);
                using var b=new D.Bitmap(r.Right-r.Left,r.Bottom-r.Top);using(var g=D.Graphics.FromImage(b))g.CopyFromScreen(r.Left,r.Top,0,0,b.Size);
                var name=$"{material}-{mode}";b.Save($"evidence/{name}.png");report.Add(name+" "+string.Join(" ",new[]{0,1,2,4,8,16,24,32,48,90}.Select(y=>$"{y}:{b.GetPixel(b.Width/2,y).R},{b.GetPixel(b.Width/2,y).G},{b.GetPixel(b.Width/2,y).B}")));
                w.Close();Wait();
              } File.WriteAllLines("evidence/result.txt",report);foreach(var s in report)Console.WriteLine(s);
            }
            static void Wait(){var f=new DispatcherFrame();var t=new DispatcherTimer{Interval=TimeSpan.FromMilliseconds(180)};t.Tick+=(_,_)=>{t.Stop();f.Continue=false;};t.Start();Dispatcher.PushFrame(f);}
            static void Set(IntPtr h,int a,int v)=>DwmSetWindowAttribute(h,a,ref v,4);
            [StructLayout(LayoutKind.Sequential)] struct Margins {public int Left,Right,Top,Bottom;}
            [StructLayout(LayoutKind.Sequential)] struct Rect {public int Left,Top,Right,Bottom;}
            [StructLayout(LayoutKind.Sequential)] struct Accent {public int State,Flags;public uint Color;public int Animation;}
            [StructLayout(LayoutKind.Sequential)] struct Data {public int Attribute;public IntPtr DataPtr;public nuint Size;}
            [DllImport("dwmapi.dll")]static extern int DwmSetWindowAttribute(IntPtr h,int a,ref int v,int s);
            [DllImport("dwmapi.dll",EntryPoint="DwmExtendFrameIntoClientArea")]static extern int Extend(IntPtr h,ref Margins m);
            [DllImport("user32.dll",EntryPoint="SetWindowCompositionAttribute")]static extern bool SetAccent(IntPtr h,ref Data d);
            [DllImport("uxtheme.dll",CharSet=CharSet.Unicode)]static extern int SetWindowTheme(IntPtr h,string app,string list);
            [DllImport("user32.dll")]static extern bool GetWindowRect(IntPtr h,out Rect r);
            [DllImport("dwmapi.dll")]static extern int DwmFlush();
          }
          '@ | Set-Content Program.cs
          dotnet run --project probe.csproj -c Release
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: skin-frame-probe
          path: probe/evidence
          retention-days: 2
