name: One-shot main v3.31 bold sync

on:
  push:
    branches: [3.x]
    paths:
      - .github/workflows/oneshot-main-v331-bold-sync-20260831.yml

permissions:
  contents: write

jobs:
  sync-main:
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"
    steps:
      - name: Checkout helper from 3.x
        uses: actions/checkout@v4
        with:
          ref: 3.x
          path: automation
          fetch-depth: 1

      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          path: main
          fetch-depth: 0
          submodules: recursive

      - name: Patch main
        shell: pwsh
        run: python automation/.github/scripts/oneshot_v331_main_sync_20260831.py main

      - name: Validate diff
        shell: pwsh
        working-directory: main
        run: |
          git diff --check
          git diff -- src/MarkdownTextBox.cs CHANGELOG.md

      - name: Build
        shell: pwsh
        working-directory: main
        run: dotnet build PaperTodo.csproj -c Release

      - name: Commit and push main
        shell: pwsh
        working-directory: main
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/MarkdownTextBox.cs CHANGELOG.md
          git diff --cached --check
          git commit -m "fix: sync v3.31 bold fixes into main"
          git push origin HEAD:main
