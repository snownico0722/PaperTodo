name: One-shot main v3.31 bold sync

on:
  push:
    branches:
      - 3.x
    paths:
      - .github/workflows/oneshot-main-v331-bold-sync-20260831.yml

permissions:
  contents: write

jobs:
  sync-main:
    runs-on: windows-latest
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
          submodules: recursive

      - name: Port bold rendering fix and sync changelog
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          source_path = Path("src/MarkdownTextBox.cs")
          source = source_path.read_text(encoding="utf-8")

          old_typefaces = '''        private static Typeface HeadingTypeface => new(
              NoteTypography.FontFamily,
              NoteTypography.FontStyle,
              NoteTypography.HeadingFontWeight,
              NoteTypography.FontStretch);

          private static Typeface StrongTypeface => new(
              NoteTypography.FontFamily,
              NoteTypography.FontStyle,
              NoteTypography.HeadingFontWeight,
              NoteTypography.FontStretch);

          private static Typeface EmphasisTypeface => new(
              NoteTypography.FontFamily,
              FontStyles.Italic,
              NoteTypography.FontWeight,
              NoteTypography.FontStretch);

          private static Typeface StrongEmphasisTypeface => new(
              NoteTypography.FontFamily,
              FontStyles.Italic,
              NoteTypography.HeadingFontWeight,
              NoteTypography.FontStretch);
'''
          new_typefaces = '''        private static FontFamily SemanticBoldFontFamily =>
              AppTypography.FontFamilyFor(content: true, bold: true);

          private static FontWeight SemanticBoldFontWeight =>
              AppTypography.UsesCustomBoldFace(true)
                  ? AppTypography.FontWeightFor(true)
                  : NoteTypography.HeadingFontWeight;

          private static Typeface HeadingTypeface => new(
              SemanticBoldFontFamily,
              NoteTypography.FontStyle,
              SemanticBoldFontWeight,
              NoteTypography.FontStretch);

          private static Typeface StrongTypeface => new(
              SemanticBoldFontFamily,
              NoteTypography.FontStyle,
              SemanticBoldFontWeight,
              NoteTypography.FontStretch);

          private static Typeface EmphasisTypeface => new(
              NoteTypography.FontFamily,
              FontStyles.Italic,
              NoteTypography.FontWeight,
              NoteTypography.FontStretch);

          private static Typeface StrongEmphasisTypeface => new(
              SemanticBoldFontFamily,
              FontStyles.Italic,
              SemanticBoldFontWeight,
              NoteTypography.FontStretch);
'''
          if old_typefaces not in source:
              raise SystemExit("Markdown typeface block no longer matches main; refusing unsafe patch")
          source = source.replace(old_typefaces, new_typefaces, 1)

          old_mark_styled = '''                var current = element.TextRunProperties.Typeface;
                  var style = typeface.Style == FontStyles.Italic
                      ? FontStyles.Italic
                      : current.Style;
                  var weight = typeface.Weight == NoteTypography.HeadingFontWeight
                      ? NoteTypography.HeadingFontWeight
                      : current.Weight;
                  element.TextRunProperties.SetTypeface(new Typeface(
                      current.FontFamily,
                      style,
                      weight,
                      current.Stretch));
'''
          new_mark_styled = '''                var current = element.TextRunProperties.Typeface;
                  var style = typeface.Style == FontStyles.Italic
                      ? FontStyles.Italic
                      : current.Style;
                  var requestsBold =
                      typeface.Weight == SemanticBoldFontWeight &&
                      string.Equals(
                          typeface.FontFamily.Source,
                          SemanticBoldFontFamily.Source,
                          System.StringComparison.OrdinalIgnoreCase);
                  var family = requestsBold && AppTypography.UsesCustomBoldFace(true)
                      ? SemanticBoldFontFamily
                      : current.FontFamily;
                  var weight = requestsBold
                      ? SemanticBoldFontWeight
                      : current.Weight;
                  element.TextRunProperties.SetTypeface(new Typeface(
                      family,
                      style,
                      weight,
                      current.Stretch));
'''
          if old_mark_styled not in source:
              raise SystemExit("MarkStyled block no longer matches main; refusing unsafe patch")
          source = source.replace(old_mark_styled, new_mark_styled, 1)
          source_path.write_text(source, encoding="utf-8", newline="\n")

          changelog_path = Path("CHANGELOG.md")
          changelog = changelog_path.read_text(encoding="utf-8")
          if "### v3.31" in changelog:
              raise SystemExit("v3.31 already exists on main; refusing duplicate changelog section")

          v331_bullets = [
              '- **修复含图笔记静置时的持续刷新问题**：修复含图片的笔记在前台静置时反复触发图片刷新，导致 CPU / GPU 占用持续偏高的问题。',
              '- **含图笔记缩放性能优化**：调整纸片大小时复用已显示的图片内容，并减少缩放过程中的重复刷新与处理，降低含图笔记连续缩放时的额外开销。',
              '- 修复开启“已完成待办自动置底”后，通过底部 ＋、Enter 或多行粘贴新增待办时，已完成事项可能不再保持置底的问题。',
              '- 修复部分输入法状态下录制全局快捷键时，按键可能被错误识别、导致快捷键无法正常保存或触发的问题。',
              '- **修复自定义字体增强加粗的 Markdown 正文适配**：启用增强加粗后，笔记中的 Markdown 标题、粗体和 `<b>` / `<strong>` 会正确使用自定义粗体字形。',
              '- **修复 Markdown 标题内行内样式字号**：标题中的粗体、斜体、删除线和下划线等行内样式不再把对应文字重置为正文大小。',
          ]

          unreleased_start = changelog.index("### Unreleased")
          unreleased_end = changelog.index("\n### v0.1", unreleased_start)
          unreleased = changelog[unreleased_start:unreleased_end]
          removed = []
          for bullet in v331_bullets:
              token = bullet + "\n"
              if token in unreleased:
                  unreleased = unreleased.replace(token, "", 1)
                  removed.append(bullet)
          if not any("含图笔记缩放性能优化" in item for item in removed):
              raise SystemExit("Expected v3.31 image resize item was not found in main Unreleased")
          changelog = changelog[:unreleased_start] + unreleased + changelog[unreleased_end:]

          v331_section = '''### v3.31

          **bug修复**
          - **修复含图笔记静置时的持续刷新问题**：修复含图片的笔记在前台静置时反复触发图片刷新，导致 CPU / GPU 占用持续偏高的问题。
          - **含图笔记缩放性能优化**：调整纸片大小时复用已显示的图片内容，并减少缩放过程中的重复刷新与处理，降低含图笔记连续缩放时的额外开销。
          - 修复开启“已完成待办自动置底”后，通过底部 ＋、Enter 或多行粘贴新增待办时，已完成事项可能不再保持置底的问题。
          - 修复部分输入法状态下录制全局快捷键时，按键可能被错误识别、导致快捷键无法正常保存或触发的问题。
          - **修复自定义字体增强加粗的 Markdown 正文适配**：启用增强加粗后，笔记中的 Markdown 标题、粗体和 `<b>` / `<strong>` 会正确使用自定义粗体字形。
          - **修复 Markdown 标题内行内样式字号**：标题中的粗体、斜体、删除线和下划线等行内样式不再把对应文字重置为正文大小。'''
          changelog = changelog.rstrip() + "\n\n" + v331_section + "\n"
          changelog_path.write_text(changelog, encoding="utf-8", newline="\n")
          PY

      - name: Validate diff
        shell: bash
        run: |
          git diff --check
          git diff -- src/MarkdownTextBox.cs CHANGELOG.md

      - name: Build
        shell: pwsh
        run: dotnet build PaperTodo.csproj -c Release

      - name: Commit and push main
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/MarkdownTextBox.cs CHANGELOG.md
          git diff --cached --check
          git commit -m "fix: sync v3.31 bold fixes into main"
          git push origin HEAD:main
