name: Temporary Settings API verification
on:
  push:
    branches: [feat/codex-skills-mcp-20260918]
    paths: [.github/workflows/tmp-settings-api-workbench.yml]
permissions:
  contents: write
jobs:
  verify:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply reviewed Settings API implementation
        shell: python
        run: |
          from pathlib import Path
          import base64, lzma, hashlib, subprocess, tempfile
          subprocess.run(['git', 'config', 'core.autocrlf', 'false'], check=True)
          encoded = ''.join(Path(f'.github/settings-api-payload/part{i}').read_text().strip() for i in range(1,5))
          patch = lzma.decompress(base64.b64decode(encoded))
          assert hashlib.sha256(patch).hexdigest() == '5e10b9974684efb5e577686652c8322f8c6d55fa9dac47024d12cee9e052025d'
          p = Path(tempfile.gettempdir()) / 'settings-api.patch'
          p.write_bytes(patch)
          subprocess.run(['git', 'apply', '--unidiff-zero', '--cached', str(p)], check=True)
          subprocess.run(['git', 'checkout-index', '-a', '-f'], check=True)
      - name: Build and behavior checks
        shell: pwsh
        run: |
          dotnet build ./PaperTodo.csproj -c Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet run --project ./tests/PaperTodo.SettingsApiChecks/PaperTodo.SettingsApiChecks.csproj -c Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet run --project ./tests/PaperTodo.ProtocolPolicyChecks/PaperTodo.ProtocolPolicyChecks.csproj -c Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet run --project ./tests/PaperTodo.PluginApiChecks/PaperTodo.PluginApiChecks.csproj -c Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet run --project ./tests/PaperTodo.CodexCliBridgeChecks/PaperTodo.CodexCliBridgeChecks.csproj -c Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Rebuild every Native plugin runtime
        shell: pwsh
        run: |
          foreach ($project in (Get-ChildItem plugin-samples -Recurse -Filter *.csproj | Sort-Object FullName)) {
            & ./plugin-samples/Build-And-Install-NativePlugin.ps1 -ProjectPath $project.FullName
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          git diff --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Publish tested source and runtimes
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A -- src Resources PaperTodo.Plugin.Abstractions plugin-samples plugins tests CHANGELOG.md CHANGELOG.zh.md doc/ARCHITECTURE.md
          git diff --cached --stat
          git commit -m '软件设置：共享 MCP 与插件 API，补齐待办解绑'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git push origin "HEAD:$env:GITHUB_REF_NAME"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git bundle create "$env:RUNNER_TEMP/settings-api-verified.bundle" HEAD
      - uses: actions/upload-artifact@v4
        with:
          name: settings-api-verified
          path: ${{ runner.temp }}/settings-api-verified.bundle
          retention-days: 1
