name: Apply PR 211 review fix

on:
  push:
    branches:
      - fix/settings-ui-static-20260909
    paths:
      - .github/workflows/review-fix-pr211.yml
      - tools/review-fix-pr211.ps1

permissions:
  contents: write

jobs:
  patch-build-commit:
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "true"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Apply reviewed source corrections
        run: .\tools\review-fix-pr211.ps1

      - name: Restore and build
        run: |
          dotnet restore .\PaperTodo.csproj
          dotnet build .\PaperTodo.csproj -c Release --no-restore

      - name: Commit source corrections and remove temporary tooling
        run: |
          git rm .github/workflows/review-fix-pr211.yml tools/review-fix-pr211.ps1
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- src/AppController.Settings.cs src/AppController.SettingsSidebar.cs
          git commit -m "fix(settings): preserve vector states and alignment [ci]"
          git push origin HEAD:${{ github.ref_name }}
