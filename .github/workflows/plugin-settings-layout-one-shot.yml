          text = replace_once(
              text,
              '用户在 **插件自己的设置卡片** 中录制或修改快捷键。它不会作为第三方动作塞进 PaperTodo 的全局快捷键设置页。',
              '用户在**插件自己的设置卡片或“更多设置”页**中录制或修改快捷键。它不会作为第三方动作塞进 PaperTodo 的全局快捷键设置页。',
              "shortcut settings page docs")
          write(path, text)
          '@ | python -

      - name: Build host and policy checks
        shell: pwsh
        run: |
          dotnet restore .\PaperTodo.csproj
          dotnet build .\PaperTodo.csproj -c Release --no-restore
          dotnet run --project .\tests\PaperTodo.ProtocolPolicyChecks\PaperTodo.ProtocolPolicyChecks.csproj -c Release

      - name: Rebuild installed native samples
        shell: pwsh
        run: |
          $projects = @(
            '.\plugin-samples\PaperTodo.Plugin.CloudGenshin\PaperTodo.Plugin.CloudGenshin.csproj',
            '.\plugin-samples\PaperTodo.Plugin.FocusTimer\PaperTodo.Plugin.FocusTimer.csproj',
            '.\plugin-samples\PaperTodo.Plugin.ReviewArchive\PaperTodo.Plugin.ReviewArchive.csproj',
            '.\plugin-samples\PaperTodo.Plugin.SampleClock\PaperTodo.Plugin.SampleClock.csproj'
          )
          foreach ($project in $projects) {
            .\plugin-samples\Build-And-Install-NativePlugin.ps1 -ProjectPath $project
          }

          Copy-Item .\plugin-samples\PaperTodo.Plugin.OfficialClockWeb\plugin.json .\plugins\official.clock.web\plugin.json -Force
          if (Test-Path .\plugins\official.clock.web\web) {
            Remove-Item .\plugins\official.clock.web\web -Recurse -Force
          }
          Copy-Item .\plugin-samples\PaperTodo.Plugin.OfficialClockWeb\web .\plugins\official.clock.web\web -Recurse -Force

      - name: Verify and commit
        shell: pwsh
        run: |
          $sampleManifests = Get-ChildItem .\plugin-samples -Recurse -Filter plugin.json
          foreach ($manifest in $sampleManifests) {
            $json = Get-Content $manifest.FullName -Raw -Encoding UTF8 | ConvertFrom-Json -Depth 100
            if ($json.apiVersion -ne '2.0') {
              throw "Sample did not migrate to 2.0: $($manifest.FullName)"
            }
            if ((Get-Content $manifest.FullName -Raw -Encoding UTF8) -match '"quick"\s*:') {
              throw "Legacy quick metadata remains: $($manifest.FullName)"
            }
          }
          git diff --check
          Remove-Item .\.github\workflows\plugin-settings-layout-one-shot.yml -Force
          git add -A
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "feat(plugin): add adaptive advanced settings page"
          git push origin HEAD:feature/plugin-settings-layout-20260824
