name: Plugin settings layout one-shot

on:
  push:
    branches:
      - feature/plugin-settings-layout-20260824

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "true"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Apply feature patch
        shell: pwsh
        run: |
          @'
          from pathlib import Path
          import json
          import re

          def read(path):
              return Path(path).read_text(encoding="utf-8")

          def write(path, text):
              Path(path).write_text(text, encoding="utf-8", newline="\n")

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f"{label}: expected one match, found {count}")
              return text.replace(old, new, 1)

          # Manifest contract: host defaults to the first three settings. 2.0 may optionally
          # override the primary count and describe category placement for the full settings page.
          path = "src/PaperBodyPluginRegistry.cs"
          text = read(path)
          text = replace_once(
              text,
              '    public string[] Capabilities { get; set; } = [];\n    public PaperBodyPluginSettingManifest[] Settings { get; set; } = [];',
              '    public string[] Capabilities { get; set; } = [];\n    public int? PrimarySettings { get; set; }\n    public PaperBodyPluginSettingCategoryManifest[] SettingCategories { get; set; } = [];\n    public PaperBodyPluginSettingManifest[] Settings { get; set; } = [];',
              "manifest settings layout fields")
          write(path, text)

          path = "src/PaperBodyPluginRegistry.Settings.cs"
          text = read(path)
          text = replace_once(
              text,
              '        manifest.Settings ??= [];\n',
              '''        manifest.Settings ??= [];
        manifest.SettingCategories ??= [];
        if (manifest.PrimarySettings is < 1 or > 3)
        {
            throw new InvalidDataException("primarySettings must be between 1 and 3.");
        }
        if (!ApiAtLeast(manifest.ApiVersion, 2, 0) &&
            (manifest.PrimarySettings.HasValue || manifest.SettingCategories.Length > 0))
        {
            throw new InvalidDataException(
                "primarySettings and settingCategories require apiVersion 2.0 or newer.");
        }

        var categoryNames = new HashSet<string>(StringComparer.Ordinal);
        foreach (var category in manifest.SettingCategories)
        {
            category.Name = category.Name?.Trim() ?? "";
            category.Column = category.Column?.Trim().ToLowerInvariant() ?? "";
            if (category.Name.Length == 0 || !categoryNames.Add(category.Name))
            {
                throw new InvalidDataException(
                    "Plugin setting categories must have unique non-empty names.");
            }
            if (category.Column is not ("" or "left" or "right"))
            {
                throw new InvalidDataException(
                    $"Plugin setting category '{category.Name}' has unsupported column '{category.Column}'.");
            }
        }
''',
              "settings layout validation prelude")
          text = replace_once(
              text,
              '        var ids = new HashSet<string>(StringComparer.Ordinal);\n        var quickCount = 0;\n',
              '        var ids = new HashSet<string>(StringComparer.Ordinal);\n',
              "remove quick counter")
          text = replace_once(
              text,
              '            setting.Description = setting.Description?.Trim() ?? "";\n            setting.Suffix = setting.Suffix?.Trim() ?? "";',
              '            setting.Description = setting.Description?.Trim() ?? "";\n            setting.Category = setting.Category?.Trim() ?? "";\n            setting.Suffix = setting.Suffix?.Trim() ?? "";',
              "normalize setting category")
          text = replace_once(
              text,
              '            setting.Options ??= [];\n\n            if (!SettingIdPattern.IsMatch(setting.Id)',
              '''            setting.Options ??= [];

            if (setting.Category.Length > 0 && !ApiAtLeast(manifest.ApiVersion, 2, 0))
            {
                throw new InvalidDataException(
                    $"Plugin setting '{setting.Id}' category requires apiVersion 2.0 or newer.");
            }

            if (!SettingIdPattern.IsMatch(setting.Id)''',
              "category protocol gate")
          text = replace_once(
              text,
              '''            if (setting.Quick && ++quickCount > 3)
            {
                throw new InvalidDataException("A plugin may expose at most three quick settings.");
            }
''',
              '',
              "remove legacy quick validation")
          text = replace_once(
              text,
              '    public JsonElement Default { get; set; }\n    public bool Quick { get; set; }\n    public double? Min { get; set; }',
              '    public JsonElement Default { get; set; }\n    public string Category { get; set; } = "";\n    public double? Min { get; set; }',
              "replace quick with category")
          text = replace_once(
              text,
              '''internal sealed class PaperBodyPluginSettingOptionManifest
{
''',
              '''internal sealed class PaperBodyPluginSettingCategoryManifest
{
    public string Name { get; set; } = "";
    public string Column { get; set; } = "";
}

internal sealed class PaperBodyPluginSettingOptionManifest
{
''',
              "setting category manifest type")
          write(path, text)

          # Replace the old inline expand/collapse panel with a default-first-three card and a
          # separate full settings window. Category blocks are atomic when explicitly named;
          # uncategorized settings remain freely balanceable by the host.
          path = "src/AppController.Plugins.cs"
          text = read(path)
          pattern = re.compile(
              r'    private FrameworkElement BuildPluginSettingsPanel\(.*?^    private FrameworkElement BuildPluginSettingControl\(',
              re.S | re.M)
          replacement = r'''    private FrameworkElement BuildPluginSettingsPanel(
        PaperBodyPluginDescriptor descriptor,
        IReadOnlyList<PaperBodyPluginSettingManifest> settings)
    {
        var root = new StackPanel
        {
            Margin = new Thickness(12, 0, 0, 0)
        };
        var primaryCount = Math.Min(
            settings.Count,
            descriptor.Manifest?.PrimarySettings ?? 3);
        for (var index = 0; index < primaryCount; index++)
        {
            root.Children.Add(BuildPluginSettingControl(descriptor, settings[index]));
        }

        if (settings.Count > primaryCount)
        {
            var more = PluginPageButton(Strings.Get("PluginsMoreSettings"));
            more.MinWidth = 0;
            more.Margin = new Thickness(0, 8, 0, 0);
            more.HorizontalAlignment = HorizontalAlignment.Left;
            more.Click += (_, _) => ShowPluginSettingsWindow(descriptor, settings);
            root.Children.Add(more);
        }

        return root;
    }

    private void ShowPluginSettingsWindow(
        PaperBodyPluginDescriptor descriptor,
        IReadOnlyList<PaperBodyPluginSettingManifest> settings)
    {
        var height = Math.Min(
            680,
            Math.Max(420, SystemParameters.WorkArea.Height - 120));
        var window = new Window
        {
            Title = $"{descriptor.DisplayName} · {Strings.Get("PluginsMoreSettings")}",
            Width = 720,
            Height = height,
            SizeToContent = SizeToContent.Manual,
            WindowStyle = WindowStyle.None,
            ResizeMode = ResizeMode.NoResize,
            AllowsTransparency = true,
            Background = Brushes.Transparent,
            ShowInTaskbar = false,
            Topmost = false,
            WindowStartupLocation = _settingsWindow != null
                ? WindowStartupLocation.CenterOwner
                : WindowStartupLocation.CenterScreen,
            FontFamily = AppTypography.UiFontFamily,
            FontSize = AppTypography.Scale(12),
            Language = AppTypography.Language,
            SnapsToDevicePixels = true,
            UseLayoutRounding = true
        };
        if (_settingsWindow != null)
        {
            window.Owner = _settingsWindow;
        }
        AppTypography.ApplyTextRendering(window);
        window.PreviewKeyDown += OnSettingsWindowPreviewKeyDown;
        window.PreviewKeyUp += OnSettingsWindowPreviewKeyUp;
        window.Closed += (_, _) =>
        {
            if (_pluginShortcutRecordingCommandId == null)
            {
                return;
            }

            _pluginShortcutRecordingCommandId = null;
            if (!IsExiting)
            {
                RestoreAllHotkeysAfterPluginRecording();
            }
        };
        window.Content = BuildPluginSettingsWindowContent(window, descriptor, settings);
        ApplyToolTipSetting(window);
        window.ShowDialog();
    }

    private UIElement BuildPluginSettingsWindowContent(
        Window window,
        PaperBodyPluginDescriptor descriptor,
        IReadOnlyList<PaperBodyPluginSettingManifest> settings)
    {
        var frame = new Border
        {
            Background = TrayPaperBrush,
            BorderBrush = TrayBorderBrush,
            BorderThickness = new Thickness(1),
            CornerRadius = new CornerRadius(10),
            Padding = new Thickness(14),
            Effect = new DropShadowEffect
            {
                BlurRadius = 20,
                ShadowDepth = 2,
                Opacity = 0.22
            }
        };
        var root = new DockPanel();
        var titleRow = new Grid
        {
            Margin = new Thickness(0, 0, 0, 10),
            Background = Brushes.Transparent,
            Cursor = Cursors.SizeAll
        };
        titleRow.ColumnDefinitions.Add(new ColumnDefinition
        {
            Width = new GridLength(1, GridUnitType.Star)
        });
        titleRow.ColumnDefinitions.Add(new ColumnDefinition { Width = GridLength.Auto });
        titleRow.MouseLeftButtonDown += (_, e) =>
        {
            if (e.ChangedButton != MouseButton.Left)
            {
                return;
            }
            try { window.DragMove(); } catch { }
        };

        var title = new TextBlock
        {
            Text = $"{descriptor.DisplayName} · {Strings.Get("PluginsMoreSettings")}",
            Foreground = TrayTextBrush,
            FontSize = AppTypography.Scale(15),
            FontWeight = FontWeights.SemiBold,
            VerticalAlignment = VerticalAlignment.Center
        };
        Grid.SetColumn(title, 0);
        titleRow.Children.Add(title);

        var closeButton = new Button
        {
            Content = "×",
            Width = 28,
            Height = 24,
            Padding = new Thickness(0),
            BorderThickness = new Thickness(1),
            Background = Brushes.Transparent,
            Foreground = TrayWeakTextBrush,
            FontFamily = AppTypography.SymbolFontFamily,
            FontSize = AppTypography.Scale(16),
            Cursor = Cursors.Hand,
            Focusable = false,
            Style = BuildSettingsCloseButtonStyle()
        };
        closeButton.Click += (_, _) => window.Close();
        Grid.SetColumn(closeButton, 1);
        titleRow.Children.Add(closeButton);
        DockPanel.SetDock(titleRow, Dock.Top);
        root.Children.Add(titleRow);

        var availableWidth = Math.Max(480, window.Width - 56);
        var availableHeight = Math.Max(260, window.Height - 92);
        var layout = BuildPluginFullSettingsLayout(
            descriptor,
            settings,
            availableWidth,
            availableHeight);
        var scroll = new ScrollViewer
        {
            Content = layout,
            VerticalScrollBarVisibility = ScrollBarVisibility.Auto,
            HorizontalScrollBarVisibility = ScrollBarVisibility.Disabled,
            Margin = new Thickness(0, 2, 0, 0)
        };
        root.Children.Add(scroll);
        frame.Child = root;
        return frame;
    }

    private FrameworkElement BuildPluginFullSettingsLayout(
        PaperBodyPluginDescriptor descriptor,
        IReadOnlyList<PaperBodyPluginSettingManifest> settings,
        double availableWidth,
        double availableHeight)
    {
        var categoryColumns = (descriptor.Manifest?.SettingCategories ?? [])
            .ToDictionary(
                item => item.Name,
                item => item.Column,
                StringComparer.Ordinal);
        var groupedCategories = new HashSet<string>(StringComparer.Ordinal);
        var units = new List<(
            string Category,
            string Column,
            PaperBodyPluginSettingManifest[] Settings)>();

        foreach (var setting in settings)
        {
            if (string.IsNullOrWhiteSpace(setting.Category))
            {
                units.Add(("", "", new[] { setting }));
                continue;
            }
            if (!groupedCategories.Add(setting.Category))
            {
                continue;
            }

            categoryColumns.TryGetValue(setting.Category, out var column);
            units.Add((
                setting.Category,
                column ?? "",
                settings.Where(item => string.Equals(
                    item.Category,
                    setting.Category,
                    StringComparison.Ordinal)).ToArray()));
        }

        var elements = new List<(FrameworkElement Element, string Column)>();
        var naturalHeight = 0d;
        foreach (var unit in units)
        {
            var element = BuildPluginSettingCategory(
                descriptor,
                unit.Category,
                unit.Settings);
            element.Measure(new Size(availableWidth, double.PositiveInfinity));
            naturalHeight += element.DesiredSize.Height + 8;
            elements.Add((element, unit.Column));
        }

        var useColumns = elements.Any(item =>
                item.Column is "left" or "right") ||
            naturalHeight > availableHeight;
        if (!useColumns)
        {
            var single = new StackPanel();
            foreach (var item in elements)
            {
                item.Element.Margin = new Thickness(0, 0, 0, 8);
                single.Children.Add(item.Element);
            }
            return single;
        }

        var columns = new Grid();
        columns.ColumnDefinitions.Add(new ColumnDefinition
        {
            Width = new GridLength(1, GridUnitType.Star)
        });
        columns.ColumnDefinitions.Add(new ColumnDefinition { Width = new GridLength(25) });
        columns.ColumnDefinitions.Add(new ColumnDefinition
        {
            Width = new GridLength(1, GridUnitType.Star)
        });
        var left = new StackPanel();
        var right = new StackPanel();
        var halfWidth = Math.Max(220, (availableWidth - 25) / 2);
        var leftHeight = 0d;
        var rightHeight = 0d;

        foreach (var item in elements)
        {
            item.Element.Measure(new Size(halfWidth, double.PositiveInfinity));
            var measuredHeight = item.Element.DesiredSize.Height + 8;
            var placeRight = string.Equals(item.Column, "right", StringComparison.Ordinal) ||
                (!string.Equals(item.Column, "left", StringComparison.Ordinal) &&
                 rightHeight < leftHeight);
            item.Element.Margin = new Thickness(0, 0, 0, 8);
            if (placeRight)
            {
                right.Children.Add(item.Element);
                rightHeight += measuredHeight;
            }
            else
            {
                left.Children.Add(item.Element);
                leftHeight += measuredHeight;
            }
        }

        var separator = new Border
        {
            Width = 1,
            Background = TrayBorderBrush,
            Opacity = 0.65,
            HorizontalAlignment = HorizontalAlignment.Center
        };
        Grid.SetColumn(left, 0);
        Grid.SetColumn(separator, 1);
        Grid.SetColumn(right, 2);
        columns.Children.Add(left);
        columns.Children.Add(separator);
        columns.Children.Add(right);
        return columns;
    }

    private FrameworkElement BuildPluginSettingCategory(
        PaperBodyPluginDescriptor descriptor,
        string category,
        IReadOnlyList<PaperBodyPluginSettingManifest> settings)
    {
        var root = new StackPanel();
        if (!string.IsNullOrWhiteSpace(category))
        {
            root.Children.Add(SettingsSectionLabel(category));
        }
        foreach (var setting in settings)
        {
            root.Children.Add(BuildPluginSettingControl(descriptor, setting));
        }
        return root;
    }

    private FrameworkElement BuildPluginSettingControl('''
          text, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise RuntimeError(f"plugin settings UI replacement: expected one block, found {count}")
          write(path, text)

          # Protocol policy checks pin the slim public manifest shape: no per-setting quick flag;
          # optional primary count and category metadata live at the manifest/category level.
          path = "tests/PaperTodo.ProtocolPolicyChecks/Program.cs"
          text = read(path)
          text = replace_once(
              text,
              '            CheckCapabilityNormalization(host);\n            CheckProtocolBoundaries(host);',
              '            CheckCapabilityNormalization(host);\n            CheckSettingsLayoutManifest(host);\n            CheckProtocolBoundaries(host);',
              "policy check registration")
          anchor = '    private static void CheckProtocolBoundaries(Assembly host)\n'
          method = '''    private static void CheckSettingsLayoutManifest(Assembly host)
    {
        var manifestType = RequireType(host, "PaperTodo.PaperBodyPluginManifest");
        var settingType = RequireType(host, "PaperTodo.PaperBodyPluginSettingManifest");
        var categoryType = RequireType(host, "PaperTodo.PaperBodyPluginSettingCategoryManifest");

        Assert(
            manifestType.GetProperty("PrimarySettings")?.PropertyType == typeof(int?),
            "Plugin manifest must expose optional primarySettings metadata.");
        Assert(
            manifestType.GetProperty("SettingCategories")?.PropertyType == categoryType.MakeArrayType(),
            "Plugin manifest must expose settingCategories metadata.");
        Assert(
            settingType.GetProperty("Category")?.PropertyType == typeof(string),
            "Plugin settings must expose an optional category name.");
        Assert(
            settingType.GetProperty("Quick") == null,
            "Per-setting quick metadata must not remain in the 2.0 settings contract.");
        Assert(
            categoryType.GetProperty("Name")?.PropertyType == typeof(string) &&
            categoryType.GetProperty("Column")?.PropertyType == typeof(string),
            "Setting categories must carry their display name and optional column placement.");
    }

'''
          text = replace_once(text, anchor, method + anchor, "settings layout policy check")
          write(path, text)

          # All source examples now target protocol 2.0. Native manifest and runtime declarations
          # must move together or the host correctly rejects them as mismatched.
          native_plugins = [
              "plugin-samples/PaperTodo.Plugin.CloudGenshin/CloudGenshinPlugin.cs",
              "plugin-samples/PaperTodo.Plugin.FocusTimer/FocusTimerPlugin.cs",
              "plugin-samples/PaperTodo.Plugin.ReviewArchive/ReviewArchivePlugin.cs",
              "plugin-samples/PaperTodo.Plugin.SampleClock/SampleClockPlugin.cs",
          ]
          for native_path in native_plugins:
              native_text = read(native_path)
              native_text = replace_once(
                  native_text,
                  'ApiVersion => "1.8";',
                  'ApiVersion => "2.0";',
                  f"{native_path} api version")
              write(native_path, native_text)

          category_layouts = {
              "sample.focus-timer.native": {
                  "categories": [
                      {"name": "联动", "column": "left"},
                      {"name": "显示", "column": "left"},
                      {"name": "计时", "column": "right"},
                  ],
                  "assign": {
                      "autoStartNext": "联动", "showLinkedTodo": "联动",
                      "completeLinkedTodo": "联动", "autoSelectNextTodo": "联动",
                      "showProgress": "显示", "showCompleted": "显示", "titleStyle": "显示",
                      "focusMinutes": "计时", "breakMinutes": "计时", "adjustStep": "计时",
                      "dailyGoal": "计时", "sound": "计时", "confirmReset": "计时",
                  },
              },
              "sample.clock.native": {
                  "categories": [
                      {"name": "显示", "column": "left"},
                      {"name": "时间与标题", "column": "right"},
                  ],
                  "assign": {
                      "showSeconds": "显示", "showDate": "显示", "showDayProgress": "显示",
                      "showWeekday": "显示", "clockScale": "显示",
                      "hourCycle": "时间与标题", "dateFormat": "时间与标题",
                      "timeZone": "时间与标题", "titleMode": "时间与标题",
                      "customTitle": "时间与标题",
                  },
              },
              "official.clock.web": {
                  "categories": [
                      {"name": "显示", "column": "left"},
                      {"name": "时间与标题", "column": "right"},
                      {"name": "启动", "column": "right"},
                  ],
                  "assign": {
                      "showSeconds": "显示", "showDate": "显示", "showDayProgress": "显示",
                      "showWeekday": "显示", "showWeekNumber": "显示", "clockScale": "显示",
                      "hourCycle": "时间与标题", "dateFormat": "时间与标题",
                      "timeZone": "时间与标题", "titleMode": "时间与标题",
                      "customTitle": "时间与标题", "autoStartCapsule": "启动",
                  },
                  "first": ["showSeconds", "showDate", "showDayProgress"],
                  "extra": {"miniMaxSize": {"width": 360, "height": 240}},
              },
              "sample.review-archive.native": {
                  "categories": [
                      {"name": "记录", "column": "left"},
                      {"name": "导出", "column": "left"},
                      {"name": "显示", "column": "right"},
                  ],
                  "assign": {
                      "keepDeleted": "记录", "trackCreated": "记录",
                      "showReminderChanges": "记录", "initialImport": "记录",
                      "retentionDays": "记录", "maxRecords": "记录",
                      "exportEncoding": "导出", "exportDateFormat": "导出",
                      "includePaperTitle": "导出", "confirmClear": "导出",
                      "showOpenItems": "显示", "showInsights": "显示",
                      "highlightUpcomingReminders": "显示", "defaultFilter": "显示",
                      "showDeletedBadge": "显示", "titleMode": "显示", "fixedTitle": "显示",
                  },
              },
              "sample.topbar.web": {
                  "primarySettings": 1,
              },
          }

          manifests = sorted(Path("plugin-samples").glob("*/plugin.json"))
          if not manifests:
              raise RuntimeError("No sample plugin manifests found")
          for manifest_path in manifests:
              data = json.loads(manifest_path.read_text(encoding="utf-8"))
              data["apiVersion"] = "2.0"
              settings = data.get("settings", [])
              for setting in settings:
                  setting.pop("quick", None)
                  setting.pop("category", None)

              layout = category_layouts.get(data.get("id"), {})
              assign = layout.get("assign", {})
              for setting in settings:
                  category = assign.get(setting.get("id"))
