                      setting for setting in settings if setting["id"] not in first
                  ]

              for key, value in layout.get("extra", {}).items():
                  data[key] = value

              data.pop("primarySettings", None)
              data.pop("settingCategories", None)
              data.pop("settings", None)
              if "primarySettings" in layout:
                  data["primarySettings"] = layout["primarySettings"]
              if layout.get("categories"):
                  data["settingCategories"] = layout["categories"]
              if settings:
