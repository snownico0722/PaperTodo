name: Tests refactor verification (temporary)
on:
  push:
    branches: [refactor/tests-behavior-and-tools]
    paths: [.github/scripts/refactor_tests_once.py, .github/workflows/tests-refactor-audit.yml]
permissions:
  contents: write
jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 30
    defaults:
      run:
        shell: pwsh
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: 'true'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive
      - name: Validate one-off editor
        shell: python
        run: |
          import ast
          from pathlib import Path
          path = Path('.github/scripts/refactor_tests_once.py')
          source = path.read_text(encoding='utf-8')
          old = 'def cut(text, start, end):\n'
          new = '''def cut(text, start, end):
              if end == '    }':
                  if text.count(start) != 1:
                      raise RuntimeError('Ambiguous method tail: ' + start)
                  a, b = text.index(start), text.rfind('\n    }') + 1
                  if b <= a: raise RuntimeError('Method tail not found')
                  return text[:a] + text[b:]
          '''
          new = new.replace("text.rfind('\n    }')", "text.rfind('\\n    }')")
          if source.count(old) != 1: raise RuntimeError('One-off helper not unique')
          source = source.replace(old, new, 1)
          source = source.replace('if text.count(start) != 1 or text.count(end) != 1:', 'if start not in text or text.count(end) != 1:')
          ast.parse(source)
          path.write_text(source, encoding='utf-8', newline='\n')
      - name: Apply reviewed one-off edits
        id: apply
        run: |
          python .github/scripts/refactor_tests_once.py
          if ($LASTEXITCODE -ne 0) { throw 'One-off edit failed; nothing will be pushed.' }
          git diff --check
          if ($LASTEXITCODE -ne 0) { throw 'Patch whitespace check failed.' }
          git diff --stat
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add tests tools src .github
          git commit -m 'refactor: keep behavior checks and separate test tooling'
          if ($LASTEXITCODE -ne 0) { throw 'Commit failed.' }
          git push origin HEAD:refs/heads/refactor/tests-behavior-and-tools
          if ($LASTEXITCODE -ne 0) { throw 'Branch advanced or push failed; stop without overwriting.' }
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build Release
        run: dotnet build PaperTodo.csproj -c Release
      - name: Build Debug
        if: ${{ !cancelled() && steps.apply.outcome == 'success' }}
        run: dotnet build PaperTodo.csproj -c Debug
      - name: List check groups
        if: ${{ !cancelled() && steps.apply.outcome == 'success' }}
        run: ./tools/testing/Run-Checks.ps1 -Group all -List
      - name: Execute behavior checks
        if: ${{ !cancelled() && steps.apply.outcome == 'success' }}
        run: |
          try {
            ./tools/testing/Run-Checks.ps1 -Group all *> "$env:RUNNER_TEMP/behavior-checks.log"
            Get-Content "$env:RUNNER_TEMP/behavior-checks.log" -Tail 26
          } catch {
            Get-Content "$env:RUNNER_TEMP/behavior-checks.log" | Select-String -Pattern 'FAIL|error |Exception|checks passed|True|False|PASS ' | Select-Object -Last 90
            throw
          }
      - name: Benchmark entry point smoke
        if: ${{ !cancelled() && steps.apply.outcome == 'success' }}
        run: dotnet run --project tools/PaperTodo.MarkdownBenchmarks -c Release -- --iterations 1
