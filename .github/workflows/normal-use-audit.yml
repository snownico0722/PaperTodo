name: Normal-use PR audit
on:
  push:
    branches: [audit/pr324-326-normal-use-20261008]
    paths: [.github/workflows/normal-use-audit.yml, .github/scripts/normal-use-audit.py]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Export fixed review sources
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/review-source"
          for item in main:39292c739901b74a0d718c4d697ecdc1183bdcc0 pr324:f55c392210ed559c160f78e7e027c21f6c7a8ad5 pr325:4112df23eb3bafbea4e2ff9165659cae439a973b pr326:a1b296fba72ea575de268b36ff6cc84737d55a16; do
            label="${item%%:*}"
            sha="${item#*:}"
            git archive --format=zip -o "$RUNNER_TEMP/review-source/$label.zip" "$sha" src tests tools/testing doc AGENTS.md PaperTodo.csproj .github/workflows
          done
      - uses: actions/upload-artifact@v4
        with:
          name: normal-use-review-source
          path: ${{ runner.temp }}/review-source
          retention-days: 2
