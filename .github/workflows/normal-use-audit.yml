name: Normal-use PR audit
on:
  push:
    branches: [audit/pr324-326-normal-use-20261008]
    paths: [.github/workflows/normal-use-audit.yml, '.github/scripts/normal-use-*']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: normal-use-review
  cancel-in-progress: true
jobs:
  review:
    name: Review PR ${{ matrix.pr }}
    runs-on: windows-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        pr: [324, 325]
    defaults:
      run:
        shell: pwsh
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: 'true'
      PYTHONIOENCODING: utf-8
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Review, paired measurements and candidate Git objects
        env:
          GH_TOKEN: ${{ github.token }}
        run: python .github/scripts/normal-use-launch.py ${{ matrix.pr }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: normal-use-review-${{ matrix.pr }}
          path: ${{ runner.temp }}/normal-use-${{ matrix.pr }}
          retention-days: 7
