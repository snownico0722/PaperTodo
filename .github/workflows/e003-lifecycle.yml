name: Temporary E-003 lifecycle phases
on:
  push:
    branches: [perf/e003-lifecycle-measure-20260913]
    paths: [.github/workflows/e003-lifecycle.yml]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  measure:
    runs-on: windows-latest
    timeout-minutes: 25
    defaults:
      run:
        shell: pwsh
    env:
      DOTNET_NOLOGO: '1'
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Instrument isolated checkout
        run: |
          New-Item -ItemType Directory -Force evidence | Out-Null
          git rev-parse HEAD | Set-Content evidence/source.txt
          dotnet --info | Set-Content evidence/dotnet.txt
          python .github/e003.py .
          if ($LASTEXITCODE -ne 0) { throw 'Probe instrumentation failed' }
      - name: Build probe
        run: |
          dotnet build tests/PaperTodo.LifecycleChecks/PaperTodo.LifecycleChecks.csproj -c Release 2>&1 | Tee-Object evidence/build.log
          if ($LASTEXITCODE -ne 0) { throw 'Probe build failed' }
      - name: Record independent process samples
        run: |
          foreach ($case in @('capsules-10','real-exit','scripts')) {
            foreach ($round in 1..5) {
              $dir = Join-Path (Resolve-Path evidence) "$case-$round"
              New-Item -ItemType Directory -Force $dir | Out-Null
              $env:PAPERTODO_E003_DIR = $dir
              dotnet run --project tests/PaperTodo.LifecycleChecks/PaperTodo.LifecycleChecks.csproj -c Release --no-build -- --case $case 2>&1 | Tee-Object "$dir/result.log"
              if ($LASTEXITCODE -ne 0) { throw "$case round $round failed" }
            }
          }
      - name: Upload phase evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e003-lifecycle-phases
          path: evidence/
          retention-days: 7
          if-no-files-found: error
