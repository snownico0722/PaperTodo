name: Shared semantics preview experiment
on:
  push:
    branches: [experiment/edge-preview-avalonedit]
    paths:
      - .github/workflows/edge-preview-shared-semantics.yml
      - .github/preview-experiment/**
permissions:
  contents: write
jobs:
  compare:
    runs-on: windows-latest
    timeout-minutes: 25
    defaults:
      run:
        shell: pwsh
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: 'true'
    steps:
      - uses: actions/checkout@v7
        with:
          path: candidate
          fetch-depth: 0
          submodules: recursive
      - uses: actions/checkout@v7
        with:
          path: main-control
          ref: 13a2224c549fcc7d6fbbd5c58a9b666d9f75086f
          fetch-depth: 0
          submodules: recursive
      - uses: actions/checkout@v7
        with:
          path: pr243-control
          ref: b88322feb212c4ca5be1da2d900e35794666dc37
          fetch-depth: 0
          submodules: recursive
      - uses: actions/checkout@v7
        with:
          path: avalon-control
          ref: 07b7f3ab50fb8461e2d89ec112d1f1572ed256fc
          fetch-depth: 0
          submodules: recursive
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Assemble candidate and identical control harness
        run: |
          New-Item -ItemType Directory results -Force | Out-Null
          Push-Location candidate
          python .github/preview-experiment/prepare.py
          if ($LASTEXITCODE -ne 0) { throw 'Candidate assembly failed' }
          Pop-Location
      - name: Candidate Release regressions
        id: checks
        run: |
          $ErrorActionPreference = 'Stop'
          $exitCodes = @{}
          foreach ($name in @('EdgePreviewExperimentChecks','MarkdownSemanticChecks','MarkdownEditingChecks','TodoNavigationChecks','EdgeTitleChecks','ThreadingChecks','PersistenceChecks')) {
            dotnet run --project "candidate/tests/PaperTodo.$name/PaperTodo.$name.csproj" -c Release 2>&1 | Tee-Object "results/$name.log"
            $exitCodes[$name] = $LASTEXITCODE
          }
          $exitCodes | ConvertTo-Json | Set-Content results/exit-codes.json
          "failed=$(@($exitCodes.Values | Where-Object { $_ -ne 0 }).Count)" >> $env:GITHUB_OUTPUT
          "prototype=$($exitCodes['EdgePreviewExperimentChecks'])" >> $env:GITHUB_OUTPUT
          exit 0
      - name: Candidate Debug checks
        if: steps.checks.outputs.prototype == '0'
        run: |
          dotnet run --project candidate/tests/PaperTodo.EdgePreviewExperimentChecks -c Debug 2>&1 | Tee-Object results/debug.log
          if ($LASTEXITCODE -ne 0) { throw 'Debug candidate failed' }
      - name: Same-run controls and candidate profiles
        if: steps.checks.outputs.prototype == '0'
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($entry in @(@('main-control','main'), @('pr243-control','pr243'), @('avalon-control','avalon'), @('candidate','combined'))) {
            $folder = $entry[0]; $name = $entry[1]
            $arguments = @('run','--project',"$folder/tests/PaperTodo.EdgePreviewExperimentChecks",'-c','Release','--','--profile')
            if ($name -eq 'avalon') { $arguments += '--avalon' }
            & dotnet @arguments 2>&1 | Tee-Object "results/$name.log"
            if ($LASTEXITCODE -ne 0) { throw "$name profile failed" }
          }
      - name: Preserve source and create checked blobs only
        if: steps.checks.outputs.failed == '0'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $headers = @{ Authorization = "Bearer $env:GH_TOKEN"; Accept = 'application/vnd.github+json' }
          $entries = foreach ($path in Get-Content results/changed-paths.txt) {
            $text = [IO.File]::ReadAllText("candidate/$path").Replace("`r`n", "`n")
            $destination = "results/source/$path"
            New-Item -ItemType Directory (Split-Path $destination) -Force | Out-Null
            [IO.File]::WriteAllText($destination, $text, [Text.UTF8Encoding]::new($false))
            $json = @{ content = [Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes($text)); encoding = 'base64' } | ConvertTo-Json -Compress
            $blob = Invoke-RestMethod -Method Post -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/git/blobs" -Headers $headers -Body $json -ContentType 'application/json'
            @{ path = $path; sha = $blob.sha; mode = '100644'; type = 'blob' }
          }
          $entries | ConvertTo-Json -Compress | Set-Content results/checked-blobs.json
      - name: Preserve regression failures
        if: steps.checks.outputs.failed != '0'
        run: throw 'Candidate regressions failed; no checks are waived and no branch is updated by this job.'
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: shared-semantic-preview-results
          path: results/
          retention-days: 7
