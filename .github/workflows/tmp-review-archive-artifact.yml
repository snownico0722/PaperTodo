name: Temporary ReviewArchive artifact

on:
  pull_request:
    paths:
      - "plugin-samples/PaperTodo.Plugin.ReviewArchive/**"
      - ".github/workflows/tmp-review-archive-artifact.yml"

permissions:
  contents: write

jobs:
  build-review-archive:
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          submodules: recursive
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Build ReviewArchive installed output
        shell: pwsh
        run: |
          ./plugin-samples/Build-And-Install-NativePlugin.ps1 `
            -ProjectPath ./plugin-samples/PaperTodo.Plugin.ReviewArchive/PaperTodo.Plugin.ReviewArchive.csproj
      - name: Commit generated output and remove temporary workflow
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add plugins/sample.review-archive.native/PaperTodo.Plugin.ReviewArchive.dll
          git rm .github/workflows/tmp-review-archive-artifact.yml
          git diff --cached --quiet
          if ($LASTEXITCODE -ne 0) {
            git commit -m "同步复盘插件构建产物"
            git push origin HEAD:${{ github.event.pull_request.head.ref }}
          }
