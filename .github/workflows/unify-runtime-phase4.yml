name: Unified runtime phase 4

on:
  push:
    branches:
      - refactor/unified-plugin-runtime
    paths:
      - tools/unify_runtime_phase4.py
      - .github/workflows/unify-runtime-phase4.yml

permissions:
  contents: write

jobs:
  apply-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Apply docs and policy checks
        shell: pwsh
        run: |
          python tools/unify_runtime_phase4.py
          git diff --check
      - name: Build host
        shell: pwsh
        run: dotnet build .\PaperTodo.csproj -c Release
      - name: Run protocol policy checks
        shell: pwsh
        run: dotnet run --project .\tests\PaperTodo.ProtocolPolicyChecks\PaperTodo.ProtocolPolicyChecks.csproj -c Release
      - name: Current-doc legacy scan
        shell: pwsh
        run: |
          $currentDocs = @('ARCHITECTURE.md','plugin-samples/README.md','plugin-samples/PaperTodo.Plugin.OfficialClockWeb/README.md')
          $matches = $currentDocs | ForEach-Object {
            Select-String -Path $_ -Pattern 'WebPaperRuntime|PaperRuntimePath|paperRuntime|per-Paper 后台|每 Paper 1 个'
          }
          if ($matches) {
            $matches | Format-Table | Out-String | Write-Host
            throw 'Current documentation still describes the retired per-Paper backend.'
          }
      - name: Commit docs and checks
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ARCHITECTURE.md DECISIONS.md plugin-samples/README.md plugin-samples/PaperTodo.Plugin.OfficialClockWeb/README.md tests/PaperTodo.ProtocolPolicyChecks/Program.cs
          git commit -m "docs: define unified plugin runtime model"
          git push
