name: Unified runtime phase 4

on:
  push:
    branches:
      - refactor/unified-plugin-runtime
    paths:
      - tools/unify_runtime_finalize.py
      - tools/unify_runtime_phase4.py
      - tools/unify_runtime_phase5.py
      - .github/workflows/unify-runtime-phase4.yml

permissions:
  contents: write

jobs:
  apply-and-test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Apply final convergence
        shell: pwsh
        run: |
          python tools/unify_runtime_finalize.py
          git diff --check
      - name: Build host
        shell: pwsh
        run: dotnet build .\PaperTodo.csproj -c Release
      - name: Build Native samples
        shell: pwsh
        run: |
          $projects = @(
            '.\plugin-samples\PaperTodo.Plugin.CloudGenshin\PaperTodo.Plugin.CloudGenshin.csproj',
            '.\plugin-samples\PaperTodo.Plugin.FocusTimer\PaperTodo.Plugin.FocusTimer.csproj',
            '.\plugin-samples\PaperTodo.Plugin.ReviewArchive\PaperTodo.Plugin.ReviewArchive.csproj',
            '.\plugin-samples\PaperTodo.Plugin.SampleClock\PaperTodo.Plugin.SampleClock.csproj'
          )
          foreach ($project in $projects) {
            dotnet build $project -c Release
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Run protocol policy checks
        shell: pwsh
        run: dotnet run --project .\tests\PaperTodo.ProtocolPolicyChecks\PaperTodo.ProtocolPolicyChecks.csproj -c Release
      - name: Structural legacy scan
        shell: pwsh
        run: |
          $codeTargets = Get-ChildItem PaperTodo.Plugin.Abstractions,src,plugin-samples,plugins -Recurse -File
          $codeMatches = $codeTargets | Select-String -Pattern 'WebPaperRuntime|_webPaperRuntimeSlots|PaperRuntimePath|PaperBodyRuntimeRequirements|backgroundUpdates|"requires"'
          if ($codeMatches) {
            $codeMatches | Format-Table | Out-String | Write-Host
            throw 'Retired runtime structures remain in current code or manifests.'
          }
          $currentDocs = @('ARCHITECTURE.md','plugin-samples/README.md','plugin-samples/PaperTodo.Plugin.OfficialClockWeb/README.md')
          $docMatches = $currentDocs | ForEach-Object {
            Select-String -Path $_ -Pattern 'WebPaperRuntime|PaperRuntimePath|paperRuntime|per-Paper 后台|每 Paper 1 个|backgroundUpdates'
          }
          if ($docMatches) {
            $docMatches | Format-Table | Out-String | Write-Host
            throw 'Current documentation still describes the retired backend model.'
          }
      - name: Commit converged product changes
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add PaperTodo.Plugin.Abstractions src plugin-samples plugins tests ARCHITECTURE.md DECISIONS.md
          git commit -m "refactor: converge on one plugin runtime"
          git push
