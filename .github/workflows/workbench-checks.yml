name: Workbench checks
on:
  push:
    branches: [feature/infinite-workbench, feature/workbench-materials-groups-20261105]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          # Nerdbank.GitVersioning requires the history since the last version-height reset.
          fetch-depth: 0
          submodules: recursive
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Layout, material persistence, and real editor lifecycle checks
        shell: pwsh
        env:
          WORKBENCH_ARTIFACT_DIR: ${{ github.workspace }}/.artifacts/workbench
        run: ./tools/testing/Run-Checks.ps1 -Group all -Project WorkbenchLayoutChecks,WorkbenchChecks,DataReloadChecks
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: workbench-visual-check
          path: .artifacts/workbench
          if-no-files-found: ignore
          retention-days: 7
