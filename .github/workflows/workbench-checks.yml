name: Workbench checks
on:
  push:
    branches: [feature/infinite-workbench]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  checks:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Layout and real editor lifecycle checks
        shell: pwsh
        env:
          WORKBENCH_ARTIFACT_DIR: ${{ github.workspace }}/.artifacts/workbench
        run: ./tools/testing/Run-Checks.ps1 -Group regression -Project WorkbenchLayoutChecks,WorkbenchChecks
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: workbench-visual-check
          path: .artifacts/workbench
          if-no-files-found: ignore
          retention-days: 7
