name: Normalize plugin cleanup resources

on:
  push:
    branches:
      - cleanup/plugin-contract-and-samples
    paths:
      - .github/workflows/normalize-plugin-cleanup-resources.yml

permissions:
  contents: write

jobs:
  normalize:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Restore resource formatting and delete only retired keys
        shell: pwsh
        run: |
          git checkout cd581ff5425ee6121ef7cfde82c237840976a453 -- `
            Resources/Strings.resx `
            Resources/Strings.en.resx `
            Resources/Strings.ja.resx `
            Resources/Strings.ko.resx
          @'
          from pathlib import Path
          import re

          keys = [
              b"PluginsReload",
              b"PluginsRestartRequired",
              b"PluginsNativeChangedRestart",
              b"PluginsNativeRemovedRestart",
          ]
          files = [
              Path("Resources/Strings.resx"),
              Path("Resources/Strings.en.resx"),
              Path("Resources/Strings.ja.resx"),
              Path("Resources/Strings.ko.resx"),
          ]
          for path in files:
              data = path.read_bytes()
              for key in keys:
                  pattern = rb"(?:\r?\n)?[ \t]*<data name=\"" + re.escape(key) + rb"\"[\s\S]*?</data>"
                  data, count = re.subn(pattern, b"", data, count=1)
                  if count != 1:
                      raise SystemExit(f"{path}: expected retired key {key.decode()} exactly once, found {count}")
              path.write_bytes(data)
          '@ | python -
          git diff --check
      - name: Commit normalized resources
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Resources
          git commit -m "chore: keep plugin resource cleanup minimal"
          git rm .github/workflows/normalize-plugin-cleanup-resources.yml
          git commit -m "chore: remove resource cleanup validation"
          git push
