name: Unified runtime phase 1

on:
  push:
    branches:
      - refactor/unified-plugin-runtime
    paths:
      - tools/unify_runtime_phase1.py
      - .github/workflows/unify-runtime-phase1.yml

permissions:
  contents: write

jobs:
  apply-and-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Apply phase 1
        shell: pwsh
        run: |
          python tools/unify_runtime_phase1.py
          git diff --check
      - name: Build
        shell: pwsh
        run: dotnet build .\PaperTodo.csproj -c Release
      - name: Commit product changes
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src PaperTodo.Plugin.Abstractions
          git commit -m "refactor: establish single provider runtime foundation"
          git push
