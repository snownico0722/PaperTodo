name: Artifact parity diagnostic

on:
  push:
    branches:
      - perf/whole-preview-artifact-preload-20260912

permissions:
  contents: write

jobs:
  finish-documentation:
    if: contains(github.event.head_commit.message, '[artifact-docs]')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Apply verified documentation and whitespace-only cleanup
        shell: bash
        run: |
          mkdir -p /tmp/pr251-docs
          python - <<'PY'
          import base64, hashlib, pathlib, re, subprocess, zlib
          expected = {
              'src/EdgeCapsulePreview.Markdown.Artifact.cs': '4ccd80ebbe8df8f4c8d0a955a766507df359fa07',
              'src/EdgeCapsulePreview.Markdown.cs': '35faf8425bca3fe4322d6291cf07378180ade8b0',
              'src/EdgeCapsulePreview.Preload.cs': '925a7436b7aef09c508f1a9d3d3d1041f94146e0',
              'src/MarkdownPreviewLinkHit.cs': '87d053009a042bc489ee3bbe98b9e257a67c67c0',
              'tests/PaperTodo.EdgePreviewChecks/PreloadChecks.cs': 'fc5c3ac8ca81dc324aeaeac07ace8a46fce198f5',
              'tests/PaperTodo.MarkdownEditingChecks/EdgePreviewChecks.cs': '7d8b0c75c256d29edb8a58d2e67e13345be0deec'
          }
          def blob(data):
              return hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
          for name, sha in expected.items():
              data = pathlib.Path(name).read_bytes().replace(b'\r\n', b'\n')
              assert blob(data) == sha, (name, blob(data))
          # Correct only the indentation introduced by the verified Windows patch transport.
          p = pathlib.Path('tests/PaperTodo.MarkdownEditingChecks/EdgePreviewChecks.cs')
          text = p.read_text()
          start = text.index('                            if (boundary == "retract")')
          end = text.index('                            viewport.SetContent', start)
          lines = text[start:end].splitlines(keepends=True)
          corrected = lines[0] + ''.join('          ' + line for line in lines[1:])
          result = text[:start] + corrected + text[end:]
          assert blob(result.encode()) == '96bf449ee10692cd1f23fef8e37480a9037434d9'
          p.write_text(result)
          previous = subprocess.check_output(['git', 'show', 'c34e12a45438adf9359524d83552f3777bdbb690:.github/workflows/artifact-parity-diagnostic.yml'], text=True)
          encoded = re.search(r"encoded = '''(.*?)'''", previous, re.S).group(1)
          encoded = encoded.replace('MqKz5lnT', 'MqKzlnT').replace('U1t7Cf9P', 'U1t7T9P')
          pathlib.Path('/tmp/pr251-docs/encoded.txt').write_text(encoded)
          patch = zlib.decompress(base64.b64decode(encoded, validate=True))
          assert hashlib.sha256(patch).hexdigest() == '547210152c13d284375beaef13ca9899f219120f3e365d4080e2ab9affc268aa'
          pathlib.Path('/tmp/pr251-docs/docs.patch').write_bytes(patch)
          PY
          git apply --check --index /tmp/pr251-docs/docs.patch
          git apply --index /tmp/pr251-docs/docs.patch
          git add tests/PaperTodo.MarkdownEditingChecks/EdgePreviewChecks.cs
          git diff --cached --check
          git diff --cached --stat
      - name: Push documentation to the existing PR branch
        shell: bash
        run: |
          branch='perf/whole-preview-artifact-preload-20260912'
          test "$(git ls-remote origin "refs/heads/$branch" | cut -f1)" = '${{ github.sha }}'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'docs(preview): record artifact ownership and verified performance'
          git push origin "HEAD:refs/heads/$branch"
          git rev-parse HEAD
      - name: Retain documentation transfer evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pr251-docs-transfer
          path: /tmp/pr251-docs/
          retention-days: 1
          if-no-files-found: ignore
