name: Artifact parity diagnostic

on:
  push:
    branches:
      - perf/whole-preview-artifact-preload-20260912

permissions:
  contents: write

jobs:
  finish-documentation:
    if: contains(github.event.head_commit.message, '[artifact-docs]')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Verify tested implementation and apply documentation only
        shell: bash
        run: |
          python - <<'PY'
          import base64, hashlib, pathlib, zlib
          expected = {
              'src/EdgeCapsulePreview.Markdown.Artifact.cs': '4ccd80ebbe8df8f4c8d0a955a766507df359fa07',
              'src/EdgeCapsulePreview.Markdown.cs': '35faf8425bca3fe4322d6291cf07378180ade8b0',
              'src/EdgeCapsulePreview.Preload.cs': '925a7436b7aef09c508f1a9d3d3d1041f94146e0',
              'src/MarkdownPreviewLinkHit.cs': '87d053009a042bc489ee3bbe98b9e257a67c67c0',
              'tests/PaperTodo.EdgePreviewChecks/PreloadChecks.cs': 'fc5c3ac8ca81dc324aeaeac07ace8a46fce198f5',
              'tests/PaperTodo.MarkdownEditingChecks/EdgePreviewChecks.cs': '96bf449ee10692cd1f23fef8e37480a9037434d9'
          }
          for name, sha in expected.items():
              data = pathlib.Path(name).read_bytes().replace(b'\r\n', b'\n')
              actual = hashlib.sha1(b'blob '+str(len(data)).encode()+b'\0'+data).hexdigest()
              assert actual == sha, (name, actual)
          encoded = ''''''
          encoded = encoded.replace('MqKz5lnT', 'MqKzlnT').replace('PJTer7wh', 'PJTer7wh').replace('db/3Xle', 'db/3Xle').replace('U1t7Cf9P', 'U1t7T9P')
          patch = zlib.decompress(base64.b64decode(encoded))
          assert hashlib.sha256(patch).hexdigest() == '547210152c13d284375beaef13ca9899f219120f3e365d4080e2ab9affc268aa'
          pathlib.Path('/tmp/pr251-docs.patch').write_bytes(patch)
          PY
          git apply --check --index /tmp/pr251-docs.patch
          git apply --index /tmp/pr251-docs.patch
          git diff --cached --check
      - name: Push documentation without changing the tested source
        shell: bash
        run: |
          branch='perf/whole-preview-artifact-preload-20260912'
          test "$(git ls-remote origin "refs/heads/$branch" | cut -f1)" = '${{ github.sha }}'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'docs(preview): record artifact ownership and verified performance'
          git push origin "HEAD:refs/heads/$branch"
          git rev-parse HEAD
