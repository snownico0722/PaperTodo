name: Artifact parity diagnostic

on:
  push:
    branches:
      - perf/whole-preview-artifact-preload-20260912
  workflow_dispatch:

permissions:
  contents: write

jobs:
  diagnose:
    if: contains(github.event.head_commit.message, '[artifact-apply]')
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: pwsh
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "true"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"
      - name: Apply verified source patches
        id: patch
        run: |
          New-Item -ItemType Directory -Force artifact-diagnostics | Out-Null
          @'
          import base64, hashlib, pathlib, zlib
          for name, expected in [
              ('pr251', '0cbfc692afa26a1503c4ced604817df513e634f84f0bc9a28f9554bc2d1c002e'),
              ('pr251-cleanup', 'f2f274f1a330b3d72946af9b0247486f1aa1ffb5ca697ee5800aa0fa201400b2')]:
              encoded = ''.join(pathlib.Path(f'.github/{name}.patch.b64').read_text().split())
              if name == 'pr251': encoded = encoded.replace('PR7XG32', 'PR7XbXG32')
              patch = zlib.decompress(base64.b64decode(encoded, validate=True))
              assert hashlib.sha256(patch).hexdigest() == expected, name
              pathlib.Path(f'artifact-diagnostics/{name}.patch').write_bytes(patch)
          encoded = ''
          patch = zlib.decompress(base64.b64decode(encoded, validate=True))
          assert hashlib.sha256(patch).hexdigest() == 'c8ba1ce82c44fd8e832541457c1b7afcd912f45c0f946e998e0ca356a1da54e9'
          pathlib.Path('artifact-diagnostics/pr251-underline.patch').write_bytes(patch)
          '@ | python -
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git -c core.autocrlf=true add --renormalize -- tests/PaperTodo.EdgePreviewChecks/ReviewIntegrationChecks.cs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          foreach ($name in @('pr251', 'pr251-cleanup', 'pr251-underline')) {
            git apply --check --index "artifact-diagnostics/$name.patch"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            git apply --index "artifact-diagnostics/$name.patch"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          git diff --cached --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run strict Edge preview suite
        id: edge
        run: |
          dotnet run --project .\tests\PaperTodo.EdgePreviewChecks\PaperTodo.EdgePreviewChecks.csproj -c Release 2>&1 | Tee-Object artifact-diagnostics/strict-checks.log
          exit $LASTEXITCODE
      - name: Release regression suites and Debug preview
        run: |
          foreach ($suite in @('MarkdownSemantic', 'MarkdownEditing', 'TodoNavigation', 'EdgeTitle', 'Threading', 'Persistence')) {
            dotnet run --project "tests/PaperTodo.${suite}Checks/PaperTodo.${suite}Checks.csproj" -c Release 2>&1 | Tee-Object "artifact-diagnostics/$suite.log"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          dotnet run --project tests/PaperTodo.EdgePreviewChecks/PaperTodo.EdgePreviewChecks.csproj -c Debug 2>&1 | Tee-Object artifact-diagnostics/debug-edge.log
          exit $LASTEXITCODE
      - name: Same-binary production-host performance and memory
        run: |
          dotnet run --project tests/PaperTodo.EdgePreviewChecks/PaperTodo.EdgePreviewChecks.csproj -c Release --no-build -- --preload-profile 2>&1 | Tee-Object artifact-diagnostics/profile-forward.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet run --project tests/PaperTodo.EdgePreviewChecks/PaperTodo.EdgePreviewChecks.csproj -c Release --no-build -- --preload-profile --reverse 2>&1 | Tee-Object artifact-diagnostics/profile-reverse.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet run --project tests/PaperTodo.EdgePreviewChecks/PaperTodo.EdgePreviewChecks.csproj -c Release --no-build -- --preload-memory 2>&1 | Tee-Object artifact-diagnostics/memory.log
          exit $LASTEXITCODE
      - name: Collect failure images (diagnostics only)
        if: failure() && steps.patch.outcome == 'success' && steps.edge.outcome == 'failure'
        run: |
          $path = '.\tests\PaperTodo.EdgePreviewChecks\PreloadChecks.cs'
          $program = '.\tests\PaperTodo.EdgePreviewChecks\Program.cs'
          $original = Get-Content $path -Raw
          $entry = Get-Content $program -Raw
          try {
            $text = $original.Replace('byte[] Pixels(FrameworkElement element)', 'var snapshotNumber = 0;' + [Environment]::NewLine + '            byte[] Pixels(FrameworkElement element)')
            $text = $text.Replace('bitmap.Render(element);', @'
          bitmap.Render(element);
                          var encoder = new PngBitmapEncoder();
                          encoder.Frames.Add(BitmapFrame.Create(bitmap));
                          using (var output = System.IO.File.Create($"artifact-diagnostics/{snapshotNumber++:D3}.png")) encoder.Save(output);
          '@)
            $text = $text.Replace('Require(differences.All(delta => delta <= 32), "artifact preserves visible text/decoration pixels");', 'Console.WriteLine($"DIAGNOSTIC_ONLY changed={differences.Count(delta => delta > 32)} sum={differences.Sum(delta => (long)delta)}");')
            Set-Content $path $text -NoNewline
            $entryDiagnostic = $entry.Replace('else { ArtifactSurfaceChecks(); SharedPreviewSemanticChecks.Run(); Checks(); ReviewBoundaryChecks(); PreloadAuditChecks(); PreloadChecks(); ReviewIntegrationChecks(); MarkdownWorkerChecks(); }', 'else { PreloadChecks(); }')
            Set-Content $program $entryDiagnostic -NoNewline
            dotnet run --project .\tests\PaperTodo.EdgePreviewChecks\PaperTodo.EdgePreviewChecks.csproj -c Release 2>&1 | Tee-Object artifact-diagnostics/parity-diagnostic.log
          } finally {
            Set-Content $path $original -NoNewline
            Set-Content $program $entry -NoNewline
          }
      - name: Push validated changes to the existing PR
        if: success()
        run: |
          $branch = 'perf/whole-preview-artifact-preload-20260912'
          $remote = (git ls-remote origin "refs/heads/$branch") -split '\s+'
          if ($LASTEXITCODE -ne 0 -or $remote[0] -ne '${{ github.sha }}') { throw 'Branch advanced; do not overwrite concurrent work.' }
          git rm .github/pr251.patch.b64 .github/pr251-cleanup.patch.b64
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(preview): preserve artifact rendering and native input; remove obsolete body ownership [ci]'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git push origin "HEAD:refs/heads/$branch"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git rev-parse HEAD | Tee-Object artifact-diagnostics/pushed-head.txt
      - name: Upload verification logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: artifact-parity-diagnostics
          path: artifact-diagnostics/
          retention-days: 1
          if-no-files-found: error
