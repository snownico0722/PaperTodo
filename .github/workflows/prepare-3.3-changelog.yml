name: Prepare 3.3 changelog

on:
  push:
    branches:
      - release/3.3-changelog

permissions:
  contents: write

jobs:
  patch:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Move Unreleased notes into v3.3
        shell: pwsh
        run: |
          $path = Join-Path $env:GITHUB_WORKSPACE "CHANGELOG.md"
          $content = (Get-Content -LiteralPath $path -Raw).Replace("`r`n", "`n")
          if ($content -match '(?m)^### v3\.3\s*$') {
            Write-Host "v3.3 section already exists; no change needed."
            exit 0
          }

          $gpu = '- **含图笔记渲染性能优化**：修复了含图片的笔记在前台静止时，因视口尺寸微调触发无意义的连续重绘死循环、进而导致 GPU 占用异常偏高的问题。'
          $memory = '- **大图导入内存优化**：重构了图片导入与压缩流程，探测尺寸时不再提前全量解压像素，需要压缩时直接按目标规格解码，大幅降低大图导入时的瞬间内存峰值。'
          $unreleasedBlock = "### Unreleased`n`n$gpu`n$memory`n`n"
          if (-not $content.Contains($unreleasedBlock)) {
            throw "Expected 3.3 Unreleased block was not found; refusing to rewrite CHANGELOG.md."
          }
          $content = $content.Replace($unreleasedBlock, "### Unreleased`n`n")

          $section = @'
          ### v3.3

          **优化和修复**

          - **含图笔记渲染性能优化**：修复含图片笔记在前台静止时，视口细微变化可能触发连续无意义重绘、导致 GPU 占用异常偏高的问题。
          - **大图导入内存优化**：导入和压缩大图时不再提前完整解压像素，需要压缩时直接按目标尺寸解码，明显降低瞬时内存峰值。
          - 修复调整 Windows 显示缩放、DPI 或跨显示器后，笔记图片可能没有及时重新排版并按新 DPI 重新解码的问题。
          - 减少笔记预览 / Markdown 模式的重复刷新和待办右键菜单的重复创建，降低无意义界面开销。
          - 恢复待办右键菜单的键盘入口，可使用菜单键或 `Shift+F10` 打开。
          - 提升旧版 Windows 启动兼容性，避免部分环境在程序界面出现前直接启动失败。
          '@
          $section = $section.Replace("`r`n", "`n")
          $content = $content.TrimEnd() + "`n`n" + $section.Trim() + "`n"
          [System.IO.File]::WriteAllText(
            $path,
            $content,
            [System.Text.UTF8Encoding]::new($false))

          git diff --check -- CHANGELOG.md
          git diff --exit-code -- CHANGELOG.md *> $null
          if ($LASTEXITCODE -eq 0) {
            Write-Host "No changelog changes to commit."
            exit 0
          }

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- CHANGELOG.md
          git commit -m "docs: prepare v3.3 release notes"
          git push origin HEAD:release/3.3-changelog
