name: PR302 tool smoke (temporary)

on:
  push:
    branches:
      - refactor/tests-behavior-and-tools
    paths:
      - ".github/workflows/pr302-tool-smoke.yml"
      - "tools/PaperTodo.DesktopBenchmarks/**"
      - "tools/PaperTodo.MarkdownBenchmarks/**"
      - "PaperTodo.csproj"

permissions:
  contents: read

jobs:
  smoke:
    runs-on: windows-latest
    timeout-minutes: 12
    defaults:
      run:
        shell: pwsh
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "true"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"
      - name: Desktop benchmark smoke
        run: dotnet run --project tools/PaperTodo.DesktopBenchmarks -c Release -- --smoke
      - name: Markdown benchmark smoke
        run: dotnet run --project tools/PaperTodo.MarkdownBenchmarks -c Release -- --iterations 1
