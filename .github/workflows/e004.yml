name: Temporary E-004 first-frame and editor comparison
on:
  push:
    branches: [perf/e004-first-frame-editor-20260913]
    paths: ['.github/e004.py', '.github/workflows/e004.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  compare:
    runs-on: windows-latest
    timeout-minutes: 25
    defaults:
      run:
        shell: pwsh
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: 'true'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Build isolated variants
        run: |
          New-Item -ItemType Directory -Force evidence | Out-Null
          dotnet --info > evidence/dotnet.txt
          git archive --format=zip -o evidence/baseline-source.zip 92e835a5fb259519fa41403e8eb41cc4bfec969e
          foreach ($variant in @('baseline','tray','styles')) {
            $dir = Join-Path $env:RUNNER_TEMP "e004-$variant"
            git worktree add --detach $dir 92e835a5fb259519fa41403e8eb41cc4bfec969e
            if ($LASTEXITCODE -ne 0) { throw 'worktree failed' }
            git -C $dir submodule update --init --recursive
            if ($LASTEXITCODE -ne 0) { throw 'submodule failed' }
            python .github/e004.py $dir $variant --product
            if ($LASTEXITCODE -ne 0) { throw 'candidate failed' }
            git -C $dir diff > "evidence/$variant-product.diff"
            python .github/e004.py $dir baseline
            if ($LASTEXITCODE -ne 0) { throw 'instrumentation failed' }
            git -C $dir diff > "evidence/$variant-profile.diff"
            dotnet build "$dir/tests/PaperTodo.LifecycleChecks/PaperTodo.LifecycleChecks.csproj" -c Release > "evidence/$variant-build.log" 2>&1
            if ($LASTEXITCODE -ne 0) { Get-Content "evidence/$variant-build.log" -Tail 80; throw 'build failed' }
          }
      - name: Interleave fresh-process samples
        run: |
          foreach ($round in 0..5) {
            $order = if ($round % 2 -eq 0) { @('baseline','tray','styles') } else { @('styles','tray','baseline') }
            foreach ($variant in $order) {
              $dir = Join-Path $env:RUNNER_TEMP "e004-$variant"
              foreach ($case in @('capsules-10','expanded-1')) {
                dotnet run --no-build --project "$dir/tests/PaperTodo.LifecycleChecks/PaperTodo.LifecycleChecks.csproj" -c Release -- "--e004-case=$case" > "evidence/$round-$variant-$case.log" 2>&1
                if ($LASTEXITCODE -ne 0) { Get-Content "evidence/$round-$variant-$case.log" -Tail 40; throw "$variant $case failed" }
              }
            }
          }
      - name: Summarize independent milestones
        shell: python
        run: |
          import json, csv, statistics
          from pathlib import Path
          rows=[]; scopes=[]
          for path in Path('evidence').glob('*-capsules-10.log'):
              parts=path.stem.split('-'); round=int(parts[0]); mode=parts[1]
              for line in path.read_text(encoding='utf-8-sig').splitlines():
                  if not line.startswith('E004_PROFILE '): continue
                  r=json.loads(line[13:]); es=r['entries']
                  origin=next(e['StartMs'] for e in es if e['Name']=='controller.ready')
                  def first(name): return next((e['StartMs']-origin for e in es if e['Name']==name),None)
                  def nth(name,n):
                      xs=[e['StartMs']-origin for e in es if e['Name']==name]
                      return xs[n-1] if len(xs)>=n else None
                  rows.append(dict(round=round,mode=mode,rendering=first('capsules.rendering'),returned=first('startup.returned'),cache=nth('cache.stored',10),shell=nth('shell.built',10),workingSet=r['workingSet'],privateBytes=r['privateBytes'],cpuMs=r['cpuMs'],allocated=r['allocated']))
                  for name in sorted({e['Name'] for e in es}):
                      vals=[e['DurationMs'] for e in es if e['Name']==name]
                      scopes.append(dict(round=round,mode=mode,name=name,count=len(vals),ms=sum(vals)))
          for name,data in [('milestones.csv',rows),('scopes.csv',scopes)]:
              with (Path('evidence')/name).open('w',newline='',encoding='utf-8') as f:
                  w=csv.DictWriter(f,fieldnames=list(data[0]));w.writeheader();w.writerows(data)
          for mode in ('baseline','tray','styles'):
              rs=[r for r in rows if r['mode']==mode and r['round']>0]
              print(mode, {k:round(statistics.median(r[k] for r in rs),2) for k in ('rendering','returned','cache','shell')})
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: e004-first-frame-editor
          path: evidence/
          retention-days: 2
