name: PR 270 autofix

on:
  push:
    branches:
      - work/paper-background-20260915
    paths:
      - .github/workflows/pr270-autofix.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Apply review fixes
        shell: pwsh
        run: |
          @'
          from pathlib import Path

          def read(path):
              return Path(path).read_text(encoding="utf-8")

          def write(path, text):
              Path(path).write_text(text, encoding="utf-8", newline="\n")

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f"{label}: expected exactly one match, got {count}")
              return text.replace(old, new, 1)

          # Rename the feature from NoteBackground to PaperBackground now that it serves
          # both note and todo papers.
          renames = {
              "src/NoteBackground.cs": "src/PaperBackground.cs",
              "src/PaperWindow.NoteBackground.cs": "src/PaperWindow.PaperBackground.cs",
              "src/AppController.Settings.NoteBackground.cs": "src/AppController.Settings.PaperBackground.cs",
              "tests/PaperTodo.MarkdownEditingChecks/NoteBackgroundChecks.cs": "tests/PaperTodo.MarkdownEditingChecks/PaperBackgroundChecks.cs",
          }
          for old, new in renames.items():
              old_path = Path(old)
              if old_path.exists():
                  old_path.rename(new)

          # Rename remaining symbols consistently, including the check registration in Program.cs.
          for root in (Path("src"), Path("tests")):
              for path in root.rglob("*.cs"):
                  text = read(path)
                  updated = text.replace("NoteBackground", "PaperBackground")
                  if updated != text:
                      write(path, updated)

          paper_background = r'''using System.IO;
          using System.Text.Json;
          using System.Windows.Controls;
          using System.Windows.Media;
          using System.Windows.Media.Imaging;

          namespace PaperTodo;

          internal static class PaperBackgroundLayouts
          {
              internal const string Stretch = "stretch";
              internal const string Center = "center";
              internal const string BottomLeft = "bottomLeft";
              internal const string BottomCenter = "bottomCenter";
              internal const string BottomRight = "bottomRight";

              internal static string Normalize(string? layout) => layout switch
              {
                  Stretch => Stretch,
                  BottomLeft => BottomLeft,
                  BottomCenter => BottomCenter,
                  BottomRight => BottomRight,
                  _ => Center
              };
          }

          internal static class PaperBackground
          {
              private sealed class BackgroundPreferences
              {
                  public bool BlendWithTheme { get; set; } = true;
                  public string Layout { get; set; } = PaperBackgroundLayouts.Center;
              }

              private const int MaxDecodePixelWidth = 4096;
              private const double BlendedImageOpacity = 0.30;
              private static readonly string[] CandidateNames =
                  ["papertodo.png", "papertodo.jpg", "papertodo.jpeg"];
              private static readonly string PreferencesPath = Path.Combine(
                  Environment.GetFolderPath(Environment.SpecialFolder.LocalApplicationData),
                  "PaperTodo",
                  "paper-background.json");

              private static BackgroundPreferences _preferences = LoadPreferences();
              private static BitmapSource? _cachedBitmap;
              private static string? _cachedPath;
              private static long _cachedLength = -1;
              private static DateTime _cachedWriteTimeUtc;
              private static string? _lastLoadError;

              internal static bool IsAvailable => FindPath() != null;
              internal static bool BlendWithTheme => _preferences.BlendWithTheme;
              internal static string Layout => PaperBackgroundLayouts.Normalize(_preferences.Layout);

              internal static string? LoadError
              {
                  get
                  {
                      if (!IsAvailable)
                      {
                          _lastLoadError = null;
                          return null;
                      }

                      _ = CreateBrush(BlendWithTheme, Layout);
                      return _lastLoadError;
                  }
              }

              internal static void SetBlendWithTheme(bool enabled)
              {
                  if (_preferences.BlendWithTheme == enabled)
                  {
                      return;
                  }

                  SaveAndApplyPreferences(new BackgroundPreferences
                  {
                      BlendWithTheme = enabled,
                      Layout = Layout
                  });
              }

              internal static void SetLayout(string layout)
              {
                  var normalized = PaperBackgroundLayouts.Normalize(layout);
                  if (string.Equals(Layout, normalized, StringComparison.Ordinal))
                  {
                      return;
                  }

                  SaveAndApplyPreferences(new BackgroundPreferences
                  {
                      BlendWithTheme = BlendWithTheme,
                      Layout = normalized
                  });
              }

              internal static void ResetPreferences() =>
                  SaveAndApplyPreferences(new BackgroundPreferences());

              internal static void Apply(Panel? host)
              {
                  if (host != null)
                  {
                      host.Background = (Brush?)CreateBrush(BlendWithTheme, Layout) ?? Brushes.Transparent;
                  }
              }

              internal static void Apply(Control? host)
              {
                  if (host != null)
                  {
                      host.Background = (Brush?)CreateBrush(BlendWithTheme, Layout) ?? Brushes.Transparent;
                  }
              }

              internal static ImageBrush? CreateBrush(bool blendWithTheme, string layout)
              {
                  var path = FindPath();
                  if (path == null)
                  {
                      InvalidateBitmapCache();
                      _lastLoadError = null;
                      return null;
                  }

                  try
                  {
                      var brush = new ImageBrush(GetBitmap(path))
                      {
                          Opacity = blendWithTheme ? BlendedImageOpacity : 1.0
                      };
                      ApplyLayout(brush, PaperBackgroundLayouts.Normalize(layout));
                      brush.Freeze();
                      _lastLoadError = null;
                      return brush;
                  }
                  catch (Exception ex)
                  {
                      InvalidateBitmapCache();
                      _lastLoadError = ex.Message;
                      return null;
                  }
              }

              private static BitmapSource GetBitmap(string path)
              {
                  var info = new FileInfo(path);
                  info.Refresh();
                  var length = info.Length;
                  var writeTimeUtc = info.LastWriteTimeUtc;
                  var cacheMatches =
                      _cachedBitmap != null &&
                      string.Equals(_cachedPath, path, StringComparison.OrdinalIgnoreCase) &&
                      _cachedLength == length &&
                      _cachedWriteTimeUtc == writeTimeUtc;

                  if (cacheMatches)
                  {
                      return _cachedBitmap!;
                  }

                  var bitmap = LoadBitmap(path);
                  _cachedBitmap = bitmap;
                  _cachedPath = path;
                  _cachedLength = length;
                  _cachedWriteTimeUtc = writeTimeUtc;
                  return bitmap;
              }

              private static BitmapSource LoadBitmap(string path)
              {
                  using var stream = new FileStream(
                      path, FileMode.Open, FileAccess.Read,
                      FileShare.ReadWrite | FileShare.Delete);
                  var bitmap = new BitmapImage();
                  bitmap.BeginInit();
                  bitmap.CacheOption = BitmapCacheOption.OnLoad;
                  bitmap.CreateOptions = BitmapCreateOptions.None;
                  bitmap.DecodePixelWidth = MaxDecodePixelWidth;
                  bitmap.StreamSource = stream;
                  bitmap.EndInit();
                  bitmap.Freeze();
                  return bitmap;
              }

              private static void ApplyLayout(ImageBrush brush, string layout)
              {
                  brush.Stretch = layout == PaperBackgroundLayouts.Stretch
                      ? Stretch.Fill
                      : Stretch.Uniform;
                  brush.AlignmentX = layout switch
                  {
                      PaperBackgroundLayouts.BottomLeft => AlignmentX.Left,
                      PaperBackgroundLayouts.BottomRight => AlignmentX.Right,
                      _ => AlignmentX.Center
                  };
                  brush.AlignmentY = layout switch
                  {
                      PaperBackgroundLayouts.BottomLeft or
                      PaperBackgroundLayouts.BottomCenter or
                      PaperBackgroundLayouts.BottomRight => AlignmentY.Bottom,
                      _ => AlignmentY.Center
                  };
              }

              private static BackgroundPreferences LoadPreferences()
              {
                  try
                  {
                      if (!File.Exists(PreferencesPath))
                      {
                          return new BackgroundPreferences();
                      }

                      var loaded = JsonSerializer.Deserialize<BackgroundPreferences>(
                          File.ReadAllText(PreferencesPath));
                      if (loaded == null)
                      {
                          return new BackgroundPreferences();
                      }

                      loaded.Layout = PaperBackgroundLayouts.Normalize(loaded.Layout);
                      return loaded;
                  }
                  catch (Exception ex) when (ex is IOException or UnauthorizedAccessException or JsonException)
                  {
                      return new BackgroundPreferences();
                  }
              }

              private static void SaveAndApplyPreferences(BackgroundPreferences preferences)
              {
                  SavePreferences(preferences);
                  _preferences = preferences;
                  InvalidateBitmapCache();
              }

              private static void SavePreferences(BackgroundPreferences preferences)
              {
                  var directory = Path.GetDirectoryName(PreferencesPath)!;
                  Directory.CreateDirectory(directory);
                  var temporaryPath = PreferencesPath + ".tmp";
                  try
                  {
                      File.WriteAllText(
                          temporaryPath,
                          JsonSerializer.Serialize(preferences));
                      File.Move(temporaryPath, PreferencesPath, overwrite: true);
                  }
                  catch
                  {
                      try
                      {
                          File.Delete(temporaryPath);
                      }
                      catch
                      {
                          // Preserve the original settings write failure.
                      }
                      throw;
                  }
              }

              private static void InvalidateBitmapCache()
              {
                  _cachedBitmap = null;
                  _cachedPath = null;
                  _cachedLength = -1;
                  _cachedWriteTimeUtc = default;
              }

              private static string? FindPath()
              {
                  foreach (var name in CandidateNames)
                  {
                      var path = Path.Combine(AppContext.BaseDirectory, name);
                      if (File.Exists(path))
                      {
                          return path;
                      }
                  }
                  return null;
              }
          }
          '''
          # Strip the indentation introduced by the YAML/Python block while preserving C# layout.
          import textwrap
          write("src/PaperBackground.cs", textwrap.dedent(paper_background))

          settings_background = r'''using System.IO;
          using System.Windows;
          using System.Windows.Controls;

          namespace PaperTodo;

          public sealed partial class AppController
          {
              private UIElement BuildPaperBackgroundSettingsSection()
              {
                  var section = new StackPanel
                  {
                      Margin = new Thickness(0, 0, 0, 4)
                  };
                  section.Children.Add(SettingsSectionLabel(SettingsSidebarLocalized(
                      "纸片背景", "Paper background", "紙面背景", "종이 배경")));
                  section.Children.Add(WrapWithHint(
                      SettingsToggle(
                          SettingsSidebarLocalized(
                              "启用和配色混合",
                              "Blend with paper colors",
                              "紙面カラーと混合する",
                              "종이 색상과 혼합"),
                          PaperBackground.BlendWithTheme,
                          TogglePaperBackgroundBlend),
                      BuildSettingsHintTooltip(SettingsSidebarLocalized(
                          "已检测到 PaperTodo.exe 同目录下的 papertodo.png（也支持 .jpg/.jpeg）。图片会同时用于笔记和待办；关闭此项显示原图，开启后与当前纸片配色混合。替换图片后切换此项、切换位置或重启 PaperTodo 即可刷新。",
                          "Detected papertodo.png beside PaperTodo.exe (.jpg/.jpeg are also supported). The image is shared by note and todo papers. Turn this off to show the original image, or on to blend it with the current paper colors. After replacing the image, toggle this option, change its position, or restart PaperTodo to refresh it.",
                          "PaperTodo.exe と同じフォルダーの papertodo.png を検出しました（.jpg/.jpeg も対応）。画像はノートと ToDo の両方で共有されます。オフでは元画像をそのまま表示し、オンでは現在の紙面カラーと混合します。画像を差し替えた後は、この設定か位置を切り替えるか PaperTodo を再起動すると更新されます。",
                          "PaperTodo.exe와 같은 폴더의 papertodo.png을 감지했습니다(.jpg/.jpeg도 지원). 이미지는 노트와 할 일 종이에 함께 사용됩니다. 끄면 원본 이미지를 표시하고, 켜면 현재 종이 색상과 혼합합니다. 이미지를 교체한 뒤 이 옵션이나 위치를 바꾸거나 PaperTodo를 다시 시작하면 새로 고쳐집니다."))));
                  section.Children.Add(BuildPaperBackgroundLayoutRow());

                  var loadError = PaperBackground.LoadError;
                  if (!string.IsNullOrWhiteSpace(loadError))
                  {
                      var error = new TextBlock
                      {
                          Text = SettingsSidebarLocalized(
                              "背景图片加载失败，请检查图片文件。",
                              "The background image could not be loaded. Check the image file.",
                              "背景画像を読み込めません。画像ファイルを確認してください。",
                              "배경 이미지를 불러오지 못했습니다. 이미지 파일을 확인하세요."),
                          Foreground = Theme.DangerBrush,
                          FontSize = AppTypography.Scale(11.5),
                          TextWrapping = TextWrapping.Wrap,
                          Margin = new Thickness(0, 5, 0, 0),
                          ToolTip = BuildSettingsHintTooltip(loadError)
                      };
                      section.Children.Add(error);
                  }

                  return section;
              }

              private UIElement BuildPaperBackgroundLayoutRow()
              {
                  var row = new Grid
                  {
                      Margin = new Thickness(0, 5, 0, 2)
                  };
                  row.ColumnDefinitions.Add(new ColumnDefinition
                  {
                      Width = new GridLength(1, GridUnitType.Star)
                  });
                  row.ColumnDefinitions.Add(new ColumnDefinition { Width = GridLength.Auto });

                  var label = new TextBlock
                  {
                      Text = SettingsSidebarLocalized(
                          "位置", "Position", "位置", "위치"),
                      Foreground = TrayWeakTextBrush,
                      FontSize = AppTypography.Scale(12),
                      FontWeight = FontWeights.SemiBold,
                      VerticalAlignment = VerticalAlignment.Center
                  };
                  Grid.SetColumn(label, 0);
                  row.Children.Add(label);

                  var selector = CreateSettingsSelect(
                      [
                          (PaperBackgroundLayouts.Stretch,
                              SettingsSidebarLocalized("拉伸", "Stretch", "ストレッチ", "늘이기")),
                          (PaperBackgroundLayouts.Center,
                              SettingsSidebarLocalized("居中", "Center", "中央", "가운데")),
                          (PaperBackgroundLayouts.BottomLeft,
                              SettingsSidebarLocalized("左下", "Bottom left", "左下", "왼쪽 아래")),
                          (PaperBackgroundLayouts.BottomCenter,
                              SettingsSidebarLocalized("正下", "Bottom center", "下中央", "아래 가운데")),
                          (PaperBackgroundLayouts.BottomRight,
                              SettingsSidebarLocalized("右下", "Bottom right", "右下", "오른쪽 아래"))
                      ],
                      PaperBackground.Layout,
                      SetPaperBackgroundLayout);
                  if (selector is FrameworkElement selectorElement)
                  {
                      selectorElement.Width = 132;
                      selectorElement.Margin = new Thickness(8, 0, 0, 0);
                      selectorElement.HorizontalAlignment = HorizontalAlignment.Right;
                  }
                  Grid.SetColumn(selector, 1);
                  row.Children.Add(selector);
                  return row;
              }

              private void TogglePaperBackgroundBlend()
              {
                  ApplyPaperBackgroundSetting(() =>
                      PaperBackground.SetBlendWithTheme(!PaperBackground.BlendWithTheme));
              }

              private void SetPaperBackgroundLayout(string layout)
              {
                  ApplyPaperBackgroundSetting(() => PaperBackground.SetLayout(layout));
              }

              private void ApplyPaperBackgroundSetting(Action update)
              {
                  if (TryUpdatePaperBackgroundSetting(update))
                  {
                      RefreshPaperBackgroundSurfaces();
                  }

                  // Rebuild even on a failed write so controls reflect the value that persisted.
                  RefreshSettingsWindowContent();
              }

              private bool TryResetPaperBackgroundPreferences()
              {
                  if (!TryUpdatePaperBackgroundSetting(PaperBackground.ResetPreferences))
                  {
                      return false;
                  }

                  RefreshPaperBackgroundSurfaces();
                  return true;
              }

              private void RefreshPaperBackgroundSurfaces()
              {
                  foreach (var window in _windows.Values)
                  {
                      window.RefreshPaperBackground();
                  }
              }

              private bool TryUpdatePaperBackgroundSetting(Action update)
              {
                  try
                  {
                      update();
                      return true;
                  }
                  catch (Exception ex) when (ex is IOException or UnauthorizedAccessException)
                  {
                      if (_settingsWindow != null)
                      {
                          PaperNoticeDialog.Show(
                              _settingsWindow,
                              SettingsSidebarLocalized(
                                  "纸片背景", "Paper background", "紙面背景", "종이 배경"),
                              SettingsSidebarLocalized(
                                  "无法保存纸片背景设置。请检查 PaperTodo 本地设置目录的写入权限。",
                                  "Could not save the paper background setting. Check write access to PaperTodo's local settings folder.",
                                  "紙面背景の設定を保存できませんでした。PaperTodo のローカル設定フォルダーへの書き込み権限を確認してください。",
                                  "종이 배경 설정을 저장하지 못했습니다. PaperTodo 로컬 설정 폴더의 쓰기 권한을 확인하세요.") +
                              Environment.NewLine + ex.Message);
                      }
                      return false;
                  }
              }
          }
          '''
          write("src/AppController.Settings.PaperBackground.cs", textwrap.dedent(settings_background))

          window_background = r'''using System.Windows.Controls;

          namespace PaperTodo;

          public sealed partial class PaperWindow
          {
              private Panel? _notePaperBackgroundHost;
              private ScrollViewer? _todoPaperBackgroundHost;

              internal void AttachPaperBackgroundHost(Panel host)
              {
                  _notePaperBackgroundHost = host;
                  RefreshNoteBackground();
              }

              internal void DetachPaperBackgroundHost(Panel host)
              {
                  if (ReferenceEquals(_notePaperBackgroundHost, host))
                  {
                      _notePaperBackgroundHost = null;
                  }
              }

              internal void AttachTodoBackgroundHost(ScrollViewer host)
              {
                  _todoPaperBackgroundHost = host;
                  RefreshTodoBackground();
              }

              internal void RefreshPaperBackground()
              {
                  RefreshNoteBackground();
                  RefreshTodoBackground();
              }

              internal void RefreshNoteBackground()
              {
                  PaperBackground.Apply(_notePaperBackgroundHost);
              }

              private void RefreshTodoBackground()
              {
                  PaperBackground.Apply(_todoPaperBackgroundHost);
              }
          }
          '''
          write("src/PaperWindow.PaperBackground.cs", textwrap.dedent(window_background))

          # Directly place the settings section in the visual page's right column.
          settings_path = Path("src/AppController.Settings.cs")
          settings = read(settings_path)
          settings = settings.replace("NoteBackground", "PaperBackground")
          capsule_block = '''        AddTextStyleEditor(
              rightColumn,
              "SettingsCapsuleText",
              "TipCapsuleTextStyle",
              CreateVisualTextSizeSelector(State.CapsuleTextSize, SetCapsuleTextSize),
              State.CapsuleTextBold,
              ToggleCapsuleTextBold,
              leadingDivider: true);

          '''
          capsule_insert = capsule_block + '''        if (PaperBackground.IsAvailable)
              {
                  rightColumn.Children.Add(SettingsSoftDivider());
                  rightColumn.Children.Add(BuildPaperBackgroundSettingsSection());
              }

          '''
          settings = replace_once(settings, capsule_block, capsule_insert, "visual background placement")
          old_wrapper = '''        UIElement content = columns;
              if (PaperBackground.IsAvailable)
              {
                  var stack = new StackPanel();
                  stack.Children.Add(BuildPaperBackgroundSettingsSection());
                  stack.Children.Add(columns);
                  content = stack;
              }
              return WithSettingsPageRestoreFooter(content, RestoreVisualSettingsPageDefaults);
          '''
          new_wrapper = '''        return WithSettingsPageRestoreFooter(columns, RestoreVisualSettingsPageDefaults);
          '''
          settings = replace_once(settings, old_wrapper, new_wrapper, "remove visual settings wrapper")
          settings = replace_once(
              settings,
              "        TrySetPaperBackgroundEnabled(true);\n",
              "        TryResetPaperBackgroundPreferences();\n",
              "visual reset")
          write(settings_path, settings)

          # Wire the Todo background at the point the ScrollViewer is created. No global Loaded
          # class handler is needed and there is no deferred routing to miss.
          todo_path = Path("src/PaperWindow.Todo.cs")
          todo = read(todo_path)
          old_todo = '''        return new ScrollViewer
              {
                  VerticalScrollBarVisibility = ScrollBarVisibility.Auto,
                  HorizontalScrollBarVisibility = ScrollBarVisibility.Disabled,
                  Content = _todoPanel,
                  FocusVisualStyle = null
              };
          '''
          new_todo = '''        var scrollViewer = new ScrollViewer
              {
                  VerticalScrollBarVisibility = ScrollBarVisibility.Auto,
                  HorizontalScrollBarVisibility = ScrollBarVisibility.Disabled,
                  Content = _todoPanel,
                  FocusVisualStyle = null
              };
              AttachTodoBackgroundHost(scrollViewer);
              return scrollViewer;
          '''
          todo = replace_once(todo, old_todo, new_todo, "todo background host")
          write(todo_path, todo)

          # The Markdown session keeps the note background on its stable outer root.
          markdown_path = Path("src/MarkdownPaperBodySession.cs")
          markdown = read(markdown_path)
          markdown = markdown.replace("AttachNoteBackgroundHost", "AttachPaperBackgroundHost")
          markdown = markdown.replace("DetachNoteBackgroundHost", "DetachPaperBackgroundHost")
          markdown = markdown.replace("RefreshNoteBackground", "RefreshPaperBackground")
          markdown = markdown.replace("NoteBackground", "PaperBackground")
          write(markdown_path, markdown)

          checks = r'''using System.IO;
          using System.Windows;
          using System.Windows.Controls;
          using System.Windows.Media;
          using System.Windows.Media.Imaging;
          using PaperTodo;

          internal static partial class Program
          {
              private static void CheckPaperBackgroundToggle()
              {
                  var candidatePaths = new[]
                  {
                      Path.Combine(AppContext.BaseDirectory, "papertodo.png"),
                      Path.Combine(AppContext.BaseDirectory, "papertodo.jpg"),
                      Path.Combine(AppContext.BaseDirectory, "papertodo.jpeg")
                  };
                  foreach (var candidate in candidatePaths)
                  {
                      Require(!File.Exists(candidate), "background fixture must not replace an existing papertodo image");
                  }

                  var backgroundPath = candidatePaths[0];
                  try
                  {
                      var visual = new DrawingVisual();
                      using (var drawing = visual.RenderOpen())
                      {
                          drawing.DrawRectangle(Brushes.Red, null, new Rect(0, 0, 16, 16));
                      }

                      var rendered = new RenderTargetBitmap(
                          16, 16, 96, 96, PixelFormats.Pbgra32);
                      rendered.Render(visual);
                      var encoder = new PngBitmapEncoder();
                      encoder.Frames.Add(BitmapFrame.Create(rendered));
                      using (var stream = File.Create(backgroundPath))
                      {
                          encoder.Save(stream);
                      }

                      Require(PaperBackground.IsAvailable,
                          "papertodo image beside the executable is detected");
                      Require(PaperBackground.LoadError == null,
                          "valid background reports no load error");

                      var original = PaperBackground.CreateBrush(
                          blendWithTheme: false,
                          layout: PaperBackgroundLayouts.Center);
                      Require(original != null, "valid image produces an ImageBrush");
                      Require(original.ImageSource != null, "valid image brush keeps its image source");
                      Require(original.IsFrozen, "paper background brush is frozen for UI reuse");
                      Require(Math.Abs(original.Opacity - 1.0) < 0.001,
                          "disabled blending keeps the original image opaque");
                      Require(original.Stretch == Stretch.Uniform,
                          "center mode preserves aspect ratio without cropping");
                      Require(original.AlignmentX == AlignmentX.Center &&
                              original.AlignmentY == AlignmentY.Center,
                          "center mode aligns the image to the center");

                      var bottomLeft = PaperBackground.CreateBrush(
                          blendWithTheme: true,
                          layout: PaperBackgroundLayouts.BottomLeft);
                      Require(bottomLeft != null && bottomLeft.Opacity < 1.0,
                          "enabled blending mixes the image with the paper palette");
                      Require(bottomLeft.Stretch == Stretch.Uniform &&
                              bottomLeft.AlignmentX == AlignmentX.Left &&
                              bottomLeft.AlignmentY == AlignmentY.Bottom,
                          "bottom-left mode preserves aspect ratio and anchors correctly");

                      var stretched = PaperBackground.CreateBrush(
                          blendWithTheme: false,
                          layout: PaperBackgroundLayouts.Stretch);
                      Require(stretched != null && stretched.Stretch == Stretch.Fill,
                          "stretch mode fills the whole paper body");

                      var noteHost = new Grid();
                      PaperBackground.Apply(noteHost);
                      Require(noteHost.Background is ImageBrush,
                          "paper background applies to an outer note content host");

                      var todoHost = new ScrollViewer();
                      PaperBackground.Apply(todoHost);
                      Require(todoHost.Background is ImageBrush,
                          "paper background applies to the todo ScrollViewer host");

                      File.WriteAllText(backgroundPath, "not an image");
                      var badImage = PaperBackground.CreateBrush(
                          blendWithTheme: false,
                          layout: PaperBackgroundLayouts.Center);
                      Require(badImage == null, "bad image falls back instead of throwing");
                      Require(!string.IsNullOrWhiteSpace(PaperBackground.LoadError),
                          "bad image exposes a diagnostic load error");

                      var badHost = new Grid();
                      PaperBackground.Apply(badHost);
                      Require(ReferenceEquals(badHost.Background, Brushes.Transparent),
                          "bad image keeps the plain paper background");

                      Require(
                          PaperBackgroundLayouts.Normalize("unknown") == PaperBackgroundLayouts.Center,
                          "unknown layout falls back to center");
                  }
                  finally
                  {
                      File.Delete(backgroundPath);
                  }
              }
          }
          '''
          write("tests/PaperTodo.MarkdownEditingChecks/PaperBackgroundChecks.cs", textwrap.dedent(checks))

          # Ensure the test registration follows the renamed check.
          program_path = Path("tests/PaperTodo.MarkdownEditingChecks/Program.cs")
          program = read(program_path).replace("CheckNoteBackgroundToggle", "CheckPaperBackgroundToggle")
          write(program_path, program)

          # This workflow is a one-shot patch carrier; remove it from the resulting PR.
          Path(".github/workflows/pr270-autofix.yml").unlink()
          '@ | python -

      - name: Commit fixes
        shell: pwsh
        run: |
          git config user.name "snownico0722"
          git config user.email "36026283+snownico0722@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix(background): address PR review findings [ci]"
          git push origin HEAD:work/paper-background-20260915
