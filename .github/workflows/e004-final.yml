name: Temporary E-004 final scoped validation
on:
  push:
    branches: [perf/e004-first-frame-editor-20260913]
    paths: ['.github/e004-final.py', '.github/e004-final-smoke.py', '.github/workflows/e004-final.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: 'true'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Prepare final production source
        run: |
          New-Item -ItemType Directory -Force evidence | Out-Null
          dotnet --info > evidence/dotnet.txt
          git worktree add --detach candidate 92e835a5fb259519fa41403e8eb41cc4bfec969e
          if ($LASTEXITCODE -ne 0) { throw 'worktree failed' }
          git -C candidate submodule update --init --recursive
          if ($LASTEXITCODE -ne 0) { throw 'submodule failed' }
          python .github/e004-apply.py candidate
          if ($LASTEXITCODE -ne 0) { throw 'candidate failed' }
          python .github/e004-final.py candidate
          if ($LASTEXITCODE -ne 0) { throw 'scope guard failed' }
          git -C candidate add -N src/StartupCompilationProfile.cs
          git -C candidate diff --check
          if ($LASTEXITCODE -ne 0) { throw 'diff failed' }
          git -C candidate diff > evidence/product.diff
          foreach ($path in @('App.xaml.cs','src/StartupCompilationProfile.cs','tests/PaperTodo.PersistenceChecks/Program.cs')) {
            $dest = Join-Path 'evidence/candidate-files' $path
            New-Item -ItemType Directory -Force (Split-Path $dest) | Out-Null
            Copy-Item (Join-Path 'candidate' $path) $dest
          }
      - name: Build and behavioral regressions without probes
        run: |
          dotnet build candidate/PaperTodo.csproj -c Release > evidence/build.log 2>&1
          if ($LASTEXITCODE -ne 0) { Get-Content evidence/build.log -Tail 50; throw 'Release build failed' }
          foreach ($suite in @('Lifecycle','Persistence','Threading','EdgePreview')) {
            dotnet run --project "candidate/tests/PaperTodo.${suite}Checks/PaperTodo.${suite}Checks.csproj" -c Release > "evidence/$suite.log" 2>&1
            if ($LASTEXITCODE -ne 0) { Get-Content "evidence/$suite.log" -Tail 60; throw "$suite failed" }
          }
      - name: Validate actual bundled and file-backed runtimes
        run: |
          python .github/e004-final-smoke.py
          if ($LASTEXITCODE -ne 0) { throw 'smoke preparation failed' }
          ./.github/e004-app.ps1 -Workspace .
      - name: Verify final evidence completeness
        shell: python
        run: |
          import csv,hashlib,json
          from pathlib import Path
          rows=list(csv.DictReader(Path('evidence/real-app.csv').open(encoding='utf-8-sig')))
          assert len(rows)==8,len(rows)
          for row in rows:
              assert (int(row['profileAfter'])>64) == (row['format']=='fddsingle'),row
          hashes={str(p.relative_to('evidence/candidate-files')).replace('\\','/'):hashlib.sha256(p.read_bytes()).hexdigest() for p in Path('evidence/candidate-files').rglob('*') if p.is_file()}
          Path('evidence/source-sha256.json').write_text(json.dumps(hashes,indent=2)+'\n',encoding='utf-8')
          print('PASS final runtime gate, repeated startup, preview cache, state and orderly process exit')
          print(json.dumps(hashes))
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: e004-final-scoped
          path: evidence/
          retention-days: 2
