name: PR 270 final cleanup

on:
  push:
    branches:
      - work/paper-background-20260915
    paths:
      - .github/workflows/pr270-final-cleanup.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Apply cleanup
        shell: pwsh
        run: |
          @'
          from pathlib import Path
          import re

          def read(path):
              return Path(path).read_text(encoding="utf-8")

          def write(path, text):
              Path(path).write_text(text, encoding="utf-8", newline="\n")

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise RuntimeError(f"{label}: expected one match, got {count}")
              return text.replace(old, new, 1)

          def sub_once(text, pattern, repl, label):
              updated, count = re.subn(pattern, repl, text, count=1, flags=re.S)
              if count != 1:
                  raise RuntimeError(f"{label}: expected one match, got {count}")
              return updated

          # 1. Avoid writing paper-background.json when preferences are already defaults.
          path = Path("src/PaperBackground.cs")
          text = read(path)
          pattern = (
              r"    internal static void ResetPreferences\(\)\n"
              r"    \{\n"
              r"        var next = new BackgroundPreferences\(\);\n"
              r"        SavePreferences\(next\);\n"
              r"        _preferences = next;\n"
              r"        InvalidateCache\(\);\n"
              r"    \}"
          )
          replacement = "\n".join([
              "    internal static void ResetPreferences()",
              "    {",
              "        if (BlendWithTheme &&",
              "            string.Equals(Layout, PaperBackgroundLayouts.Center, StringComparison.Ordinal))",
              "        {",
              "            return;",
              "        }",
              "",
              "        var next = new BackgroundPreferences();",
              "        SavePreferences(next);",
              "        _preferences = next;",
              "        InvalidateCache();",
              "    }",
          ])
          text = sub_once(text, pattern, replacement, "default preference no-op")
          write(path, text)

          # 2. Normalize formatting in the settings helper.
          path = Path("src/AppController.Settings.PaperBackground.cs")
          text = read(path)
          text = text.replace(
              "        section.Children.Add(BuildPaperBackgroundLayoutRow());\n\n\n        var loadError",
              "        section.Children.Add(BuildPaperBackgroundLayoutRow());\n\n        var loadError")
          start = text.index("private bool TryResetPaperBackgroundPreferences()")
          end = text.index("    private bool TryUpdatePaperBackgroundSetting", start)
          block = text[start:end].rstrip("\n")
          indented = "\n".join(("    " + line) if line else line for line in block.splitlines())
          text = text[:start] + indented + "\n\n" + text[end:]
          write(path, text)

          # 3. Keep the Todo background attachment, but clean the generated indentation.
          path = Path("src/PaperWindow.Todo.cs")
          text = read(path)
          start = text.index("        var scrollViewer = new ScrollViewer")
          end_marker = "return scrollViewer;"
          end = text.index(end_marker, start) + len(end_marker)
          replacement = "\n".join([
              "        var scrollViewer = new ScrollViewer",
              "        {",
              "            VerticalScrollBarVisibility = ScrollBarVisibility.Auto,",
              "            HorizontalScrollBarVisibility = ScrollBarVisibility.Disabled,",
              "            Content = _todoPanel,",
              "            FocusVisualStyle = null",
              "        };",
              "        AttachTodoBackgroundHost(scrollViewer);",
              "        return scrollViewer;",
          ])
          text = text[:start] + replacement + text[end:]
          write(path, text)

          # 4. Rename the test label to match the feature being checked.
          path = Path("tests/PaperTodo.MarkdownEditingChecks/Program.cs")
          text = read(path)
          text = replace_once(
              text,
              'Check("Note background read fallback and write failures", CheckPaperBackgroundToggle);',
              'Check("Paper background image loading and layout", CheckPaperBackgroundToggle);',
              "paper background test label")
          write(path, text)

          # One-shot patch carrier: remove it from the resulting PR.
          Path(".github/workflows/pr270-final-cleanup.yml").unlink()
          '@ | python -

      - name: Commit cleanup
        shell: pwsh
        run: |
          git config user.name "snownico0722"
          git config user.email "36026283+snownico0722@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix(background): polish final review findings [ci]"
          git push origin HEAD:work/paper-background-20260915
