- 修复无边框全屏程序运行时，隐藏任务栏或窗口切换入口的纸片仍可能压在全屏画面上方的问题。
- 修复笔记编辑状态下第一次打开纸片右键菜单时，菜单可能闪现后立即关闭的问题。
- 修复运行中切换 Windows 显示缩放或跨不同 DPI 显示器后，托盘右键菜单可能偏离鼠标位置或首次打开异常关闭的问题。
