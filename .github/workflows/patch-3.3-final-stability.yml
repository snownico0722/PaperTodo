name: Patch 3.3 final stability

on:
  push:
    branches:
      - backport/3.3-final-stability

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    timeout-minutes: 15

    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: backport/3.3-final-stability
          fetch-depth: 0

      - name: Apply targeted patches
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          function Replace-Exact([string]$Path, [string]$Old, [string]$New) {
            $raw = [IO.File]::ReadAllText($Path)
            $hadCrLf = $raw.Contains("`r`n")
            $text = $raw.Replace("`r`n", "`n")
            $oldNorm = $Old.Replace("`r`n", "`n")
            $newNorm = $New.Replace("`r`n", "`n")
            $count = ([regex]::Matches($text, [regex]::Escape($oldNorm))).Count
            if ($count -ne 1) {
              throw "Expected exactly one match in $Path, found $count."
            }
            $updated = $text.Replace($oldNorm, $newNorm)
            if ($hadCrLf) { $updated = $updated.Replace("`n", "`r`n") }
            [IO.File]::WriteAllText($Path, $updated, [Text.UTF8Encoding]::new($false))
          }

          # 1) Remove the 4.0-only state-layout refresh backport. 3.2 already passes
          # refreshLayout=true for its only state-driven layout setting.
          $old = @'
        // State-driven requests are allowed to depend on controller settings captured in the
        // layout snapshot (resting opacity, close-button behavior, sizing facts, etc.). Reusing
        // the previous snapshot makes a settings change appear only after the next pointer or
        // placement invalidation. Always recapture those facts for an explicit state refresh.
        if (reason == EdgeCapsuleTransitionReason.State)
        {
            refreshLayout = true;
        }

'@
          Replace-Exact 'PaperWindow.EdgeCapsule.cs' $old ''

