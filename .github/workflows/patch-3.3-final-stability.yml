      - name: Verify, commit and push
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          $paths = @(
            '.gitmodules',
            'vendor/wpf-notifyicon',
            'PaperTodo.csproj',
            'WindowNative.cs',
            'PaperWindow.EdgeCapsule.cs',
            'PaperWindow.Capsule.cs',
            'PaperWindow.cs',
            'PaperWindow.Note.cs',
            'CHANGELOG.md',
            '.github/workflows/maintenance-build.yml',
            '.github/workflows/release.yml',
            '.github/workflows/patch-3.3-final-stability.yml'
          )
          git add -- $paths
          git diff --cached --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $changed = @(git diff --cached --name-only)
          $allowed = @($paths | Where-Object { $_ -ne '.github/workflows/patch-3.3-final-stability.yml' })
          foreach ($path in $changed) {
            if ($path -eq '.github/workflows/patch-3.3-final-stability.yml') { continue }
            if ($allowed -notcontains $path) { throw "Unexpected staged path: $path" }
          }

          git status --short
          git diff --cached --stat
          git commit -m 'fix: finalize PaperTodo 3.3 stability backports'
          git push origin HEAD:backport/3.3-final-stability
