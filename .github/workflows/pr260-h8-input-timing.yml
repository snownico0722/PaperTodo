name: PR260 H8 compositor/input timing

on:
  push:
    branches:
      - exp/pr260-parallel-automation

permissions:
  contents: read

jobs:
  h8-repro:
    if: contains(github.event.head_commit.message, '[h8-ci]')
    name: Real DComp stall vs native input region
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "true"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"
      - name: Restore EdgeTitle checks for H8 entry
        run: dotnet restore .\tests\PaperTodo.EdgeTitleChecks\PaperTodo.EdgeTitleChecks.csproj -p:Pr260H8InputTiming=true
      - name: Build H8 entry Release
        run: |
          dotnet build .\tests\PaperTodo.EdgeTitleChecks\PaperTodo.EdgeTitleChecks.csproj -c Release --no-restore -p:Pr260H8InputTiming=true 2>&1 |
            Tee-Object -FilePath pr260-h8-build.log
          exit $LASTEXITCODE
      - name: Run DComp stall with mature cross-process native-input fixture
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = Get-ChildItem .\tests\PaperTodo.EdgeTitleChecks\bin\Release -Recurse -Filter PaperTodo.EdgeTitleChecks.exe |
            Select-Object -First 1 -ExpandProperty FullName
          if (!$exe) { throw 'H8 EdgeTitle executable was not produced' }
          & $exe 2>&1 | Tee-Object -FilePath pr260-h8-input-timing.log
          $code = $LASTEXITCODE
          "## PR260 H8 compositor/native-input timing" >> $env:GITHUB_STEP_SUMMARY
          "This run reuses the existing NativeInputRemoteTarget, tagged SendInput path, production dual-HWND proxy window, a real WPF redirected surface, real DirectComposition animation, and an intentional UI-thread stall." >> $env:GITHUB_STEP_SUMMARY
          "It tests both directions of the mismatch: visible moved pixels outside the stale HRGN, and visually empty old pixels still inside the stale HRGN. It is automated desktop-composition evidence, not physical-monitor/high-speed-camera proof." >> $env:GITHUB_STEP_SUMMARY
          if (Test-Path pr260-h8-input-timing.log) {
            Get-Content pr260-h8-input-timing.log | ForEach-Object { "    $_" >> $env:GITHUB_STEP_SUMMARY }
          }
          exit $code
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr260-h8-input-timing-${{ github.sha }}
          path: |
            pr260-h8-build.log
            pr260-h8-input-timing.log
          if-no-files-found: ignore
          retention-days: 2
