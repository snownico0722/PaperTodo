name: Codex Bridge Runtime Artifact

on:
  pull_request:

permissions:
  contents: write

jobs:
  build-codex-bridge-runtime:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0
          submodules: recursive
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Rebuild Codex CLI Bridge runtime
        shell: pwsh
        run: |
          & ./plugin-samples/Build-And-Install-NativePlugin.ps1 `
            -ProjectPath ./plugin-samples/PaperTodo.Plugin.CodexCliBridge/PaperTodo.Plugin.CodexCliBridge.csproj
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }
      - name: Commit generated runtime outputs
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- `
            plugins/tools.codex-cli-bridge.native/PaperTodo.Plugin.CodexCliBridge.dll `
            plugins/tools.codex-cli-bridge.native/PaperTodo.Plugin.CodexCliBridge.deps.json
          if (git diff --cached --quiet) {
            Write-Host "Runtime outputs are already synchronized."
            exit 0
          }
          git commit -m "build: sync Codex bridge runtime"
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
