name: PR260 continuation regressions

on:
  push:
    branches:
      - experiment/pr260-continuation-20260915

permissions:
  contents: read

jobs:
  coordination:
    if: contains(github.event.head_commit.message, '[ci]') || contains(github.event.head_commit.message, '[coordination-ci]')
    name: Prewarm reentrancy (${{ matrix.source }})
    runs-on: windows-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        source: [baseline, candidate]
    defaults:
      run:
        shell: pwsh
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "true"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"
      - name: Build the same harness against the selected production scheduler
        run: |
          $ErrorActionPreference = 'Stop'
          $sourceRef = if ('${{ matrix.source }}' -eq 'baseline') { '953ae6266af2bc8c5d1696be7660e5006525202b' } else { '${{ github.sha }}' }
          $sourcePath = Join-Path $env:RUNNER_TEMP 'pr260-EdgePrewarmCoordinator.cs'
          $source = git show "${sourceRef}:src/EdgePrewarmCoordinator.cs"
          if ($LASTEXITCODE -ne 0) { throw 'Cannot read the pinned production source' }
          [IO.File]::WriteAllLines($sourcePath, $source, [Text.UTF8Encoding]::new($false))
          "SOURCE_REF=$sourceRef" | Tee-Object -FilePath pr260-build.log
          "HARNESS_REF=${{ github.sha }}" | Tee-Object -FilePath pr260-build.log -Append
          Get-FileHash $sourcePath -Algorithm SHA256 | Out-String | Tee-Object -FilePath pr260-build.log -Append
          dotnet --info | Tee-Object -FilePath pr260-build.log -Append
          dotnet build tests/PaperTodo.Pr260RegressionChecks -c Release "-p:CoordinatorSource=$sourcePath" 2>&1 | Tee-Object -FilePath pr260-build.log -Append
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Execute real Dispatcher checks and verify exact baseline failures
        run: |
          $ErrorActionPreference = 'Stop'
          if ('${{ matrix.source }}' -eq 'baseline') {
            & ./tests/PaperTodo.Pr260RegressionChecks/bin/Release/net10.0-windows/PaperTodo.Pr260RegressionChecks.exe --expect-baseline-defects 2>&1 | Tee-Object -FilePath pr260-run.log
          } else {
            & ./tests/PaperTodo.Pr260RegressionChecks/bin/Release/net10.0-windows/PaperTodo.Pr260RegressionChecks.exe 2>&1 | Tee-Object -FilePath pr260-run.log
          }
          $code = $LASTEXITCODE
          if (Test-Path pr260-coordination-results.json) {
            $result = Get-Content pr260-coordination-results.json -Raw | ConvertFrom-Json
            if ($result.Baseline -ne ('${{ matrix.source }}' -eq 'baseline')) {
              throw 'The executable did not receive the expected baseline/candidate mode'
            }
            "## ${{ matrix.source }} — ${{ github.sha }}" >> $env:GITHUB_STEP_SUMMARY
            "Runtime: $($result.Runtime). Scope: scheduler correctness, NOT animation or physical-display latency." >> $env:GITHUB_STEP_SUMMARY
            '| Scenario | Passed | Pending | Sleeping | Calls |' >> $env:GITHUB_STEP_SUMMARY
            '| --- | --- | --- | --- | --- |' >> $env:GITHUB_STEP_SUMMARY
            foreach ($row in $result.Results) {
              "| $($row.Name) | $($row.State.Passed) | $($row.State.Pending) | $($row.State.Sleeping) | $($row.State.Calls) |" >> $env:GITHUB_STEP_SUMMARY
            }
          } else {
            throw 'The regression executable did not produce its result file'
          }
          exit $code
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr260-coordination-${{ matrix.source }}-${{ github.sha }}
          path: |
            pr260-build.log
            pr260-run.log
            pr260-coordination-results.json
          retention-days: 2

  moving-handoff:
    if: contains(github.event.head_commit.message, '[ci]') || contains(github.event.head_commit.message, '[moving-input-ci]')
    name: Moving pointer handoff (${{ matrix.source }})
    runs-on: windows-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        source: [baseline, candidate]
    defaults:
      run:
        shell: pwsh
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "true"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"
      - name: Prepare pinned baseline or current candidate tree
        id: prepare
        run: |
          $ErrorActionPreference = 'Stop'
          if ('${{ matrix.source }}' -eq 'baseline') {
            $root = Join-Path $env:RUNNER_TEMP 'pr260-moving-baseline'
            git worktree add --detach $root 953ae6266af2bc8c5d1696be7660e5006525202b
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            Copy-Item tests/PaperTodo.EdgeTitleChecks/Pr260MovingHandoffRegression.cs (Join-Path $root 'tests/PaperTodo.EdgeTitleChecks/Pr260MovingHandoffRegression.cs') -Force
            Copy-Item tests/PaperTodo.EdgeTitleChecks/PaperTodo.EdgeTitleChecks.csproj (Join-Path $root 'tests/PaperTodo.EdgeTitleChecks/PaperTodo.EdgeTitleChecks.csproj') -Force
          } else {
            $root = (Get-Location).Path
          }
          "root=$root" >> $env:GITHUB_OUTPUT
          "SOURCE=${{ matrix.source }}" | Tee-Object -FilePath pr260-moving-build.log
          "ROOT=$root" | Tee-Object -FilePath pr260-moving-build.log -Append
          "HARNESS_REF=${{ github.sha }}" | Tee-Object -FilePath pr260-moving-build.log -Append
      - name: Build focused real-WPF/DComp regression
        run: |
          $ErrorActionPreference = 'Stop'
          $root = '${{ steps.prepare.outputs.root }}'
          Push-Location $root
          try {
            dotnet --info 2>&1 | Tee-Object -FilePath (Join-Path '${{ github.workspace }}' 'pr260-moving-build.log') -Append
            dotnet build tests/PaperTodo.EdgeTitleChecks -c Release -p:Pr260MovingHandoffHarness=true 2>&1 | Tee-Object -FilePath (Join-Path '${{ github.workspace }}' 'pr260-moving-build.log') -Append
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } finally {
            Pop-Location
          }
      - name: Run changed-coordinate handoff regression
        run: |
          $ErrorActionPreference = 'Stop'
          $root = '${{ steps.prepare.outputs.root }}'
          $exe = Join-Path $root 'tests/PaperTodo.EdgeTitleChecks/bin/Release/net10.0-windows10.0.17763.0/PaperTodo.EdgeTitleChecks.exe'
          if (!(Test-Path $exe)) {
            $exe = Join-Path $root 'tests/PaperTodo.EdgeTitleChecks/bin/Release/net10.0-windows/PaperTodo.EdgeTitleChecks.exe'
          }
          if (!(Test-Path $exe)) { throw 'Focused regression executable was not produced' }
          if ('${{ matrix.source }}' -eq 'baseline') {
            & $exe --expect-moving-handoff-defect 2>&1 | Tee-Object -FilePath pr260-moving-run.log
          } else {
            & $exe 2>&1 | Tee-Object -FilePath pr260-moving-run.log
          }
          $code = $LASTEXITCODE
          "## Moving pointer handoff — ${{ matrix.source }}" >> $env:GITHUB_STEP_SUMMARY
          "Pinned baseline: 953ae626. Candidate: ${{ github.sha }}." >> $env:GITHUB_STEP_SUMMARY
          "The test drives the production retained proxy/sample callback and real WPF/DComp source; it is not a physical-panel present benchmark." >> $env:GITHUB_STEP_SUMMARY
          Get-Content pr260-moving-run.log | ForEach-Object { "    $_" >> $env:GITHUB_STEP_SUMMARY }
          exit $code
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr260-moving-handoff-${{ matrix.source }}-${{ github.sha }}
          path: |
            pr260-moving-build.log
            pr260-moving-run.log
          retention-days: 2
