name: PR411 one-time Codex plugin artifact sync

on:
  push:
    branches:
      - feat/mcp-note-image-io-20261105

permissions:
  contents: write

jobs:
  rebuild-and-sync:
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Build native Codex bridge using repository packaging script
        shell: pwsh
        run: |
          ./plugin-samples/Build-And-Install-NativePlugin.ps1 -ProjectPath ./plugin-samples/PaperTodo.Plugin.CodexCliBridge/PaperTodo.Plugin.CodexCliBridge.csproj

      - name: Commit bundled DLL and remove this one-shot workflow
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          Remove-Item -LiteralPath ".github/workflows/pr411-one-time-codex-artifact-sync.yml"
          git add -- "plugins/tools.codex-cli-bridge.native" ".github/workflows/pr411-one-time-codex-artifact-sync.yml"
          git status --short
          git diff --cached --exit-code -- "plugins/tools.codex-cli-bridge.native"
          if ($LASTEXITCODE -eq 0) {
            throw "The rebuilt plugin must differ after updating its operation skill."
          }
          git commit -m "build: synchronize Codex plugin binaries with MCP image skill"
          if ($LASTEXITCODE -ne 0) { throw "Failed to commit generated DLL." }
          git push origin HEAD:refs/heads/feat/mcp-note-image-io-20261105
          if ($LASTEXITCODE -ne 0) { throw "Could not push regenerated plugin artifact." }
