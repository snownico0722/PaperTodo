name: PR260 empty-start regression

on:
  push:
    branches:
      - experiment/pr260-continuation-20260915

permissions:
  contents: read

jobs:
  empty-start:
    if: contains(github.event.head_commit.message, '[ci]') || contains(github.event.head_commit.message, '[empty-start-ci]')
    name: Empty startup prewarm (${{ matrix.source }})
    runs-on: windows-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        source: [baseline, candidate]
    defaults:
      run:
        shell: pwsh
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "true"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"
      - name: Prepare pinned baseline or current candidate tree
        id: prepare
        run: |
          $ErrorActionPreference = 'Stop'
          if ('${{ matrix.source }}' -eq 'baseline') {
            $root = Join-Path $env:RUNNER_TEMP 'pr260-empty-start-baseline'
            git worktree add --detach $root 953ae6266af2bc8c5d1696be7660e5006525202b
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            git -C $root submodule update --init --recursive
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            Copy-Item tests/PaperTodo.Pr260EmptyStartupChecks (Join-Path $root 'tests/PaperTodo.Pr260EmptyStartupChecks') -Recurse -Force
          } else {
            $root = (Get-Location).Path
          }
          "root=$root" >> $env:GITHUB_OUTPUT
          "SOURCE=${{ matrix.source }}" | Tee-Object -FilePath pr260-empty-start-build.log
          "ROOT=$root" | Tee-Object -FilePath pr260-empty-start-build.log -Append
          "HARNESS_REF=${{ github.sha }}" | Tee-Object -FilePath pr260-empty-start-build.log -Append
      - name: Build focused empty-start regression
        run: |
          $ErrorActionPreference = 'Stop'
          $root = '${{ steps.prepare.outputs.root }}'
          Push-Location $root
          try {
            dotnet --info 2>&1 | Tee-Object -FilePath (Join-Path '${{ github.workspace }}' 'pr260-empty-start-build.log') -Append
            dotnet build tests/PaperTodo.Pr260EmptyStartupChecks -c Release 2>&1 | Tee-Object -FilePath (Join-Path '${{ github.workspace }}' 'pr260-empty-start-build.log') -Append
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          } finally {
            Pop-Location
          }
      - name: Run empty-start regression
        run: |
          $ErrorActionPreference = 'Stop'
          $root = '${{ steps.prepare.outputs.root }}'
          $exe = Join-Path $root 'tests/PaperTodo.Pr260EmptyStartupChecks/bin/Release/net10.0-windows10.0.17763.0/PaperTodo.Pr260EmptyStartupChecks.exe'
          if (!(Test-Path $exe)) { throw 'Empty-start regression executable was not produced' }
          if ('${{ matrix.source }}' -eq 'baseline') {
            & $exe --expect-defect 2>&1 | Tee-Object -FilePath pr260-empty-start-run.log
          } else {
            & $exe 2>&1 | Tee-Object -FilePath pr260-empty-start-run.log
          }
          $code = $LASTEXITCODE
          "## Empty startup prewarm — ${{ matrix.source }}" >> $env:GITHUB_STEP_SUMMARY
          "Pinned baseline: 953ae626. Candidate: ${{ github.sha }}." >> $env:GITHUB_STEP_SUMMARY
          "This checks startup-gate/controller scheduling state on Windows; it is not a DWM or physical-display benchmark." >> $env:GITHUB_STEP_SUMMARY
          Get-Content pr260-empty-start-run.log | ForEach-Object { "    $_" >> $env:GITHUB_STEP_SUMMARY }
          exit $code
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr260-empty-start-${{ matrix.source }}-${{ github.sha }}
          path: |
            pr260-empty-start-build.log
            pr260-empty-start-run.log
          retention-days: 2
