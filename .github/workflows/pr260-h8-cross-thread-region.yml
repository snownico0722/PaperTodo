name: PR260 H8 cross-thread region probe

on:
  push:
    branches:
      - exp/pr260-parallel-automation

permissions:
  contents: read

jobs:
  h8-worker-region:
    if: contains(github.event.head_commit.message, '[h8-worker-ci]')
    name: Cross-thread HRGN progress during UI stall
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "true"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"
      - name: Restore H8 worker probe
        run: dotnet restore .\tests\PaperTodo.EdgeTitleChecks\PaperTodo.EdgeTitleChecks.csproj -p:Pr260H8CrossThreadRegion=true
      - name: Build H8 worker probe Release
        run: |
          dotnet build .\tests\PaperTodo.EdgeTitleChecks\PaperTodo.EdgeTitleChecks.csproj -c Release --no-restore -p:Pr260H8CrossThreadRegion=true 2>&1 |
            Tee-Object -FilePath pr260-h8-worker-build.log
          exit $LASTEXITCODE
      - name: Run cross-thread region progress probe
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = Get-ChildItem .\tests\PaperTodo.EdgeTitleChecks\bin\Release -Recurse -Filter PaperTodo.EdgeTitleChecks.exe |
            Select-Object -First 1 -ExpandProperty FullName
          if (!$exe) { throw 'H8 worker probe executable was not produced' }
          & $exe 2>&1 | Tee-Object -FilePath pr260-h8-worker-run.log
          $code = $LASTEXITCODE
          "## PR260 H8 cross-thread region probe" >> $env:GITHUB_STEP_SUMMARY
          "The production input HWND remains owned by the UI thread. A worker attempts SetWindowRgn-based updates from the same QPC animation clock while the UI thread sleeps for 360 ms." >> $env:GITHUB_STEP_SUMMARY
          "The probe intentionally accepts either platform outcome and records attempts/completions at UI wake. It decides whether a small worker-only fix is viable before attempting a dedicated input-HWND owner thread." >> $env:GITHUB_STEP_SUMMARY
          if (Test-Path pr260-h8-worker-run.log) {
            Get-Content pr260-h8-worker-run.log | ForEach-Object { "    $_" >> $env:GITHUB_STEP_SUMMARY }
          }
          exit $code
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: pr260-h8-cross-thread-region-${{ github.sha }}
          path: |
            pr260-h8-worker-build.log
            pr260-h8-worker-run.log
          if-no-files-found: ignore
          retention-days: 2
