name: Commit Markdown refresh hook

on:
  push:
    branches:
      - feat/markdown-math-wpf
    paths:
      - .github/workflows/commit-markdown-refresh-hook.yml
      - tools/commit-markdown-refresh-hook.ps1

permissions:
  contents: write

jobs:
  patch-and-verify:
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "true"
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"
      - name: Apply missing source hook
        run: .\tools\commit-markdown-refresh-hook.ps1
      - name: Restore
        run: dotnet restore .\PaperTodo.csproj
      - name: Build and test
        run: |
          dotnet build .\PaperTodo.csproj -c Release --no-restore
          dotnet run --project .\tests\PaperTodo.MarkdownSemanticChecks\PaperTodo.MarkdownSemanticChecks.csproj -c Release
          dotnet run --project .\tests\PaperTodo.MarkdownEditingChecks\PaperTodo.MarkdownEditingChecks.csproj -c Release
          dotnet run --project .\tests\PaperTodo.TodoNavigationChecks\PaperTodo.TodoNavigationChecks.csproj -c Release
          dotnet run --project .\tests\PaperTodo.ThreadingChecks\PaperTodo.ThreadingChecks.csproj -c Release
      - name: Commit hook
        run: |
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- src/MarkdownTextBox.cs
          if (git diff --cached --quiet) {
            throw "MarkdownTextBox refresh hook was not produced."
          }
          git commit -m "fix(markdown): synchronize math folds before refresh [ci]"
          git push origin HEAD:${{ github.ref_name }}
