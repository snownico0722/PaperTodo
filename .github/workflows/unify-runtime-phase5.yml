name: Unified runtime phase 5

on:
  push:
    branches:
      - refactor/unified-plugin-runtime
    paths:
      - tools/unify_runtime_phase5.py
      - .github/workflows/unify-runtime-phase5.yml

permissions:
  contents: write

jobs:
  apply-and-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Apply phase 5
        shell: pwsh
        run: |
          python tools/unify_runtime_phase5.py
          git diff --check
      - name: Build host
        shell: pwsh
        run: dotnet build .\PaperTodo.csproj -c Release
      - name: Build affected Native samples
        shell: pwsh
        run: |
          dotnet build .\plugin-samples\PaperTodo.Plugin.SampleClock\PaperTodo.Plugin.SampleClock.csproj -c Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet build .\plugin-samples\PaperTodo.Plugin.FocusTimer\PaperTodo.Plugin.FocusTimer.csproj -c Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet build .\plugin-samples\PaperTodo.Plugin.CloudGenshin\PaperTodo.Plugin.CloudGenshin.csproj -c Release
      - name: Run protocol policy checks
        shell: pwsh
        run: dotnet run --project .\tests\PaperTodo.ProtocolPolicyChecks\PaperTodo.ProtocolPolicyChecks.csproj -c Release
      - name: Ensure background lifetime mode is gone
        shell: pwsh
        run: |
          $targets = Get-ChildItem PaperTodo.Plugin.Abstractions,src,plugin-samples,plugins -Recurse -File
          $matches = $targets | Select-String -Pattern 'PaperBodyRuntimeRequirements|backgroundUpdates|"requires"'
          if ($matches) {
            $matches | Format-Table | Out-String | Write-Host
            throw 'Retired Body background lifetime mode remains.'
          }
      - name: Commit product changes
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add PaperTodo.Plugin.Abstractions src plugin-samples plugins tests/PaperTodo.ProtocolPolicyChecks/Program.cs
          git commit -m "refactor: remove body background lifetime mode"
          git push
