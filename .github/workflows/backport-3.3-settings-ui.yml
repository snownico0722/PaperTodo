name: Backport 3.3 Settings UI

on:
  push:
    branches:
      - backport/3.3-settings-ui-polish
    paths:
      - .github/workflows/backport-3.3-settings-ui.yml

permissions:
  contents: write

jobs:
  backport-and-build:
    runs-on: windows-latest
    steps:
      - name: Check out stable branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: true

      - name: Fetch main source
        shell: pwsh
        run: git fetch origin main

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Apply stable backport
        shell: pwsh
        run: python .github/scripts/backport-3.3-settings-ui.py

      - name: Restore
        shell: pwsh
        run: dotnet restore PaperTodo.csproj

      - name: Build Release
        shell: pwsh
        run: dotnet build PaperTodo.csproj -c Release --no-restore

      - name: Commit source changes
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- App.xaml.cs StateJsonReadPolicy.cs UiLanguages.cs Strings.cs SettingsSelectControl.cs AppController.SettingsSelects.cs Models.cs EdgeCapsuleLayout.cs AppController.Settings.cs AppController.Shortcuts.cs GlobalHotkeys.cs AppTypography.cs MasterCapsuleWindow.cs PaperWindow.cs EdgeCapsuleHost.cs EdgeCapsuleDragWindow.cs Resources/Strings.resx Resources/Strings.en.resx Resources/Strings.ja.resx Resources/Strings.ko.resx CHANGELOG.md
          if (git diff --cached --quiet) {
            throw "Backport produced no source changes."
          }
          git commit -m "feat: add stable 3.3 settings and UI enhancements"
          git push origin HEAD:backport/3.3-settings-ui-polish
