name: PR 286 native output sync
on:
  push:
    branches: [feat/codex-skills-mcp-20260918]
    paths: [.github/workflows/pr286-native-sync.yml]
permissions:
  contents: read
concurrency:
  group: pr286-native-output-sync
  cancel-in-progress: false
jobs:
  rebuild:
    if: github.repository == 'snownico0722/PaperTodo'
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          submodules: recursive
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Build host and run presentation regressions
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          dotnet build ./PaperTodo.csproj -c Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet run --project ./tests/PaperTodo.SettingsApiChecks/PaperTodo.SettingsApiChecks.csproj -c Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet run --project ./tests/PaperTodo.ProtocolPolicyChecks/PaperTodo.ProtocolPolicyChecks.csproj -c Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet run --project ./tests/PaperTodo.CodexCliBridgeChecks/PaperTodo.CodexCliBridgeChecks.csproj -c Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Rebuild native outputs twice and check reproducibility
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $projects = @(Get-ChildItem plugin-samples -Recurse -Filter *.csproj | Sort-Object FullName)
          if ($projects.Count -eq 0) { throw 'No native plugin projects found.' }
          function Read-OutputHashes {
            @(Get-ChildItem plugins -Recurse -File | Sort-Object FullName | ForEach-Object {
              '{0} {1}' -f [IO.Path]::GetRelativePath($PWD.Path, $_.FullName), (Get-FileHash $_.FullName -Algorithm SHA256).Hash
            })
          }
          foreach ($project in $projects) {
            & ./plugin-samples/Build-And-Install-NativePlugin.ps1 -ProjectPath $project.FullName
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          $first = Read-OutputHashes
          foreach ($project in $projects) {
            & ./plugin-samples/Build-And-Install-NativePlugin.ps1 -ProjectPath $project.FullName
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          $difference = Compare-Object $first (Read-OutputHashes)
          if ($difference) { $difference | Format-Table; throw 'Consecutive native rebuilds are not reproducible.' }
          Write-Host 'All native output hashes match across two independent rebuilds.'
      - name: Commit only verified plugin output changes
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git diff --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git fetch origin feat/codex-skills-mcp-20260918
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ((git rev-parse FETCH_HEAD) -ne $env:GITHUB_SHA) { throw 'PR branch changed during verification; refusing to overwrite newer work.' }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- plugins
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) { Write-Host 'Native outputs already match.'; exit 0 }
          if ($LASTEXITCODE -ne 1) { exit $LASTEXITCODE }
          git diff --cached --stat
          git commit -m '修复：同步跨纸片控制后的 Codex Native 插件产物'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git push origin HEAD:refs/heads/feat/codex-skills-mcp-20260918
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git log -1 --format='%H %s'
