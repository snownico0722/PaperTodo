name: AvalonEdit preview experiment
on:
  push:
    branches: [experiment/edge-preview-avalonedit]
permissions:
  contents: write
jobs:
  compare:
    runs-on: windows-latest
    timeout-minutes: 25
    defaults:
      run:
        shell: pwsh
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: 'true'
    steps:
      - uses: actions/checkout@v7
        with:
          path: candidate
          fetch-depth: 0
          submodules: recursive
      - uses: actions/checkout@v7
        with:
          ref: 13a2224c549fcc7d6fbbd5c58a9b666d9f75086f
          path: baseline
          fetch-depth: 0
          submodules: recursive
      - uses: actions/checkout@v7
        with:
          ref: b88322feb212c4ca5be1da2d900e35794666dc37
          path: textlayout
          fetch-depth: 0
          submodules: recursive
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Wire candidate only and copy identical comparison harness
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory results -Force | Out-Null
          function Replace-Once($path, $old, $new) {
            $text = [IO.File]::ReadAllText($path).Replace("`r`n", "`n")
            if ([regex]::Matches($text, [regex]::Escape($old)).Count -ne 1) { throw "Unexpected patch context: $path" }
            [IO.File]::WriteAllText($path, $text.Replace($old, $new), [Text.UTF8Encoding]::new($false))
          }
          Replace-Once candidate/src/PaperWindow.EdgeCapsulePreview.cs 'return MarkdownEdgeCapsulePreviewProvider.Instance;' 'return AvalonEditEdgeCapsulePreviewProvider.Instance;'
          $old = '        var current = source;'
          $new = @'
                  // Text renderers can reuse their own link hit testing without synthetic controls.
                  // Bounds/lifecycle authority remains here; ask only about descendants of this preview.
                  if (_previewContent is IEdgeCapsulePreviewPointerTarget target &&
                      source != null && IsDescendantOfPreview(source))
                  {
                      return target.ConsumesPointerAt(Mouse.GetPosition(_previewContent));
                  }

                  var current = source;
          '@
          Replace-Once candidate/src/EdgeCapsuleHost.Preview.cs $old $new
          Replace-Once candidate/src/EdgeCapsulePreview.AvalonEdit.cs 'MouseMove += (_, e) => Cursor = TryGetLink(e.GetPosition(this), out _) ? Cursors.Hand : Cursors.Arrow;' 'MouseMove += (_, e) => Editor?.SetInteractionCursor(TryGetLink(e.GetPosition(this), out _) ? Cursors.Hand : Cursors.Arrow);'
          Replace-Once candidate/src/EdgeCapsulePreview.AvalonEdit.cs 'MouseLeave += (_, _) => Cursor = Cursors.Arrow;' 'MouseLeave += (_, _) => Editor?.SetInteractionCursor(Cursors.Arrow);'
          foreach ($folder in @('baseline', 'textlayout')) {
            Copy-Item candidate/src/EdgeCapsulePreview.AvalonEdit.cs "$folder/src/EdgeCapsulePreview.AvalonEdit.cs"
            Copy-Item candidate/tests/PaperTodo.EdgePreviewExperimentChecks "$folder/tests/" -Recurse
          }
          git -C candidate diff --check
          if ($LASTEXITCODE -ne 0) { throw 'Diff whitespace check failed' }
          git -C candidate diff | Set-Content results/wiring.diff
      - name: Candidate Release regression suites
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($name in @('EdgePreviewExperimentChecks','MarkdownSemanticChecks','MarkdownEditingChecks','TodoNavigationChecks','EdgeTitleChecks','ThreadingChecks','PersistenceChecks')) {
            dotnet run --project "candidate/tests/PaperTodo.$name/PaperTodo.$name.csproj" -c Release 2>&1 | Tee-Object "results/$name.log"
            if ($LASTEXITCODE -ne 0) { throw "$name failed" }
          }
      - name: Candidate Debug experiment checks
        run: |
          dotnet run --project candidate/tests/PaperTodo.EdgePreviewExperimentChecks -c Debug 2>&1 | Tee-Object results/experiment-debug.log
          if ($LASTEXITCODE -ne 0) { throw 'Debug experiment checks failed' }
      - name: Main baseline profile
        run: |
          dotnet run --project baseline/tests/PaperTodo.EdgePreviewExperimentChecks -c Release -- --profile 2>&1 | Tee-Object results/baseline.log
          if ($LASTEXITCODE -ne 0) { throw 'Main baseline profile failed' }
      - name: PR243 profile without animation layer
        run: |
          dotnet run --project textlayout/tests/PaperTodo.EdgePreviewExperimentChecks -c Release -- --profile 2>&1 | Tee-Object results/pr243.log
          if ($LASTEXITCODE -ne 0) { throw 'PR243 profile failed' }
      - name: AvalonEdit candidate profile
        run: |
          dotnet run --project candidate/tests/PaperTodo.EdgePreviewExperimentChecks -c Release -- --profile --avalon 2>&1 | Tee-Object results/avalon.log
          if ($LASTEXITCODE -ne 0) { throw 'AvalonEdit candidate profile failed' }
      - name: Record validated wiring blobs without changing any branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          $headers = @{ Authorization = "Bearer $env:GH_TOKEN"; Accept = 'application/vnd.github+json' }
          $entries = foreach ($path in @('src/PaperWindow.EdgeCapsulePreview.cs','src/EdgeCapsuleHost.Preview.cs','src/EdgeCapsulePreview.AvalonEdit.cs')) {
            $text = [IO.File]::ReadAllText("candidate/$path").Replace("`r`n", "`n")
            $content = [Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes($text))
            $json = @{ content = $content; encoding = 'base64' } | ConvertTo-Json -Compress
            $blob = Invoke-RestMethod -Method Post -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/git/blobs" -Headers $headers -Body $json -ContentType 'application/json'
            @{ path = $path; sha = $blob.sha; mode = '100644'; type = 'blob' }
          }
          $entries | ConvertTo-Json -Compress | Tee-Object results/validated-blobs.json
          Write-Output ('VALIDATED_BLOBS ' + ($entries | ConvertTo-Json -Compress))
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: edge-preview-avalonedit-results
          path: results/
