name: Component boundary audit validation
on:
  push:
    branches: [audit/component-boundaries-20261103]
    paths: [.github/workflows/component-boundary-audit.yml]
permissions:
  contents: read
jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 25
    defaults:
      run:
        shell: pwsh
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "true"
    steps:
      - uses: actions/checkout@v7
        with:
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"
      - uses: actions/setup-node@v6
        with:
          node-version: "22"
      - name: Apply regression tests without production fixes
        run: |
          New-Item -ItemType Directory -Force "$env:RUNNER_TEMP/boundary-audit-logs" | Out-Null
          foreach ($patch in Get-ChildItem .github/component-audit/*.patch | Sort-Object Name) {
            git apply --include='tests/**' $patch.FullName
            if ($LASTEXITCODE -ne 0) { throw "Could not apply tests from $($patch.Name)" }
          }
      - name: Reproduce hidden-queue state loss on old implementation
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          $log = "$env:RUNNER_TEMP/boundary-audit-logs/red-master.txt"
          dotnet run --project tests/PaperTodo.LifecycleChecks -c Release -- --case master-queue-hidden-retains-collapse 2>&1 | Tee-Object -FilePath $log
          if ($LASTEXITCODE -eq 0 -or !(Get-Content $log -Raw).Contains('transfer changed the persisted source collapse state')) {
            throw 'Old master implementation did not fail at the expected behavior assertion.'
          }
          Write-Host 'CONFIRMED: old window teardown erases saved queue collapse state.'
          $global:LASTEXITCODE = 0
      - name: Reproduce unrelated Runtime notification from file cleanup
        run: |
          $PSNativeCommandUseErrorActionPreference = $false
          $log = "$env:RUNNER_TEMP/boundary-audit-logs/red-cleanup.txt"
          dotnet run --project tests/PaperTodo.SettingsApiChecks -c Release 2>&1 | Tee-Object -FilePath $log
          if ($LASTEXITCODE -eq 0 -or !(Get-Content $log -Raw).Contains('Plugin file cleanup must not publish unrelated Runtime membership changes.')) {
            throw 'Old cleanup implementation did not fail at the expected behavior assertion.'
          }
          Write-Host 'CONFIRMED: plugin file cleanup publishes unrelated Runtime membership changes.'
          $global:LASTEXITCODE = 0
      - name: Apply save-boundary fix and reproduce interrupted visual broadcast
        run: |
          git apply --include='src/**' .github/component-audit/01-save-boundaries.patch
          if ($LASTEXITCODE -ne 0) { throw 'Could not apply save-boundary fix.' }
          $PSNativeCommandUseErrorActionPreference = $false
          $log = "$env:RUNNER_TEMP/boundary-audit-logs/red-broadcast.txt"
          dotnet run --project tests/PaperTodo.SettingsApiChecks -c Release 2>&1 | Tee-Object -FilePath $log
          if ($LASTEXITCODE -eq 0 -or !(Get-Content $log -Raw).Contains('Creating a paper in a theme callback stopped the theme broadcast to another existing paper.')) {
            throw 'Old visual broadcast did not fail at the expected behavior assertion.'
          }
          Write-Host 'CONFIRMED: synchronous plugin creation interrupts other windows theme notifications.'
          $global:LASTEXITCODE = 0
      - name: Apply remaining fixes and documentation
        run: |
          git apply --include='src/**' .github/component-audit/02-master-state.patch
          if ($LASTEXITCODE -ne 0) { throw 'Could not apply master fix.' }
          git apply --include='src/**' .github/component-audit/03-visual-broadcast.patch
          if ($LASTEXITCODE -ne 0) { throw 'Could not apply broadcast fix.' }
          foreach ($patch in Get-ChildItem .github/component-audit/*.patch | Sort-Object Name) {
            git apply --include='doc/**' --include='CHANGELOG*' $patch.FullName
            if ($LASTEXITCODE -ne 0) { throw "Could not apply docs from $($patch.Name)" }
          }
          git diff --check
          if ($LASTEXITCODE -ne 0) { throw 'Whitespace validation failed.' }
      - name: Release build
        run: |
          dotnet build PaperTodo.csproj -c Release 2>&1 | Tee-Object -FilePath "$env:RUNNER_TEMP/boundary-audit-logs/build.txt"
          if ($LASTEXITCODE -ne 0) { throw 'Release build failed.' }
      - name: Full regression suite
        run: ./tools/testing/Run-Checks.ps1 -Group regression *>&1 | Tee-Object -FilePath "$env:RUNNER_TEMP/boundary-audit-logs/regression.txt"
      - name: Plugin and settings behavior suites
        run: ./tools/testing/Run-Checks.ps1 -Group plugins *>&1 | Tee-Object -FilePath "$env:RUNNER_TEMP/boundary-audit-logs/plugins.txt"
      - name: Persistence behavior suite
        run: ./tools/testing/Run-Checks.ps1 -Group persistence *>&1 | Tee-Object -FilePath "$env:RUNNER_TEMP/boundary-audit-logs/persistence.txt"
      - name: Material behavior suite
        run: ./tools/testing/Run-Checks.ps1 -Group visual -Project MicaChecks *>&1 | Tee-Object -FilePath "$env:RUNNER_TEMP/boundary-audit-logs/material.txt"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: component-boundary-validation-logs
          path: ${{ runner.temp }}/boundary-audit-logs/*
          retention-days: 14
  publish:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - name: Publish only tested changes to the audit branch and remove temporary tooling
        shell: bash
        env:
          EXPECTED_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          branch=audit/component-boundaries-20261103
          test "$GITHUB_REF" = "refs/heads/$branch"
          current=$(git ls-remote origin "refs/heads/$branch" | cut -f1)
          test "$current" = "$EXPECTED_SHA"
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git apply --index .github/component-audit/01-save-boundaries.patch
          git commit -m '解耦保存完成、插件文件清理与纸片删除历史'
          git apply --index .github/component-audit/02-master-state.patch
          git commit -m '保留隐藏队列的收起选择，不由窗口销毁清空设置'
          git apply --index .github/component-audit/03-visual-broadcast.patch
          git commit -m '修复插件回调创建纸片中断主题与字体刷新'
          git rm .github/workflows/component-boundary-audit.yml .github/component-audit/*.patch
          git commit -m '移除组件边界审查的临时验证工具 [ci]'
          git diff 371519644dc5d6f6c2fc00d89b7a13f928121653 HEAD --check
          git push origin "HEAD:refs/heads/$branch"
          git log --oneline -4 | tee "$RUNNER_TEMP/published-commits.txt"
      - uses: actions/upload-artifact@v4
        with:
          name: component-boundary-published-commits
          path: ${{ runner.temp }}/published-commits.txt
          retention-days: 14
