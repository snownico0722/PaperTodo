name: Temporary settings UI refinement verification
on:
  push:
    branches: [feat/codex-skills-mcp-20260918]
    paths: [.github/workflows/tmp-settings-refine.yml, .github/settings-refine.patch.xz]
permissions:
  contents: write
jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Apply reviewed settings refinement
        shell: python
        run: |
          from pathlib import Path
          import hashlib, lzma, subprocess, tempfile
          subprocess.run(['git', 'config', 'core.autocrlf', 'false'], check=True)
          patch = lzma.decompress(Path('.github/settings-refine.patch.xz').read_bytes())
          assert hashlib.sha256(patch).hexdigest() == '435848f97f08e9f728cc9837cd87f3e81fb1a53353aab83937ef8823136f5dae'
          target = Path(tempfile.gettempdir()) / 'settings-refine.patch'
          target.write_bytes(patch)
          subprocess.run(['git', 'apply', '--cached', str(target)], check=True)
          subprocess.run(['git', 'checkout-index', '-a', '-f'], check=True)
      - name: Build and settings behavior checks
        shell: pwsh
        run: |
          dotnet run --project ./tests/PaperTodo.SettingsApiChecks/PaperTodo.SettingsApiChecks.csproj -c Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git diff --cached --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Commit verified refinement
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git diff --cached --stat
          git commit -m '设置：复用 UI 与 API 联动并修复编辑框旧值回写'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git push origin "HEAD:$env:GITHUB_REF_NAME"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
