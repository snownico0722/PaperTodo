name: Fix v3.31 Markdown custom bold

on:
  push:
    branches:
      - "3.x"
    paths:
      - ".github/workflows/fix-v3.31-markdown-bold.yml"

permissions:
  contents: write
  actions: write

jobs:
  patch-test-and-release:
    runs-on: windows-latest

    defaults:
      run:
        shell: pwsh

    steps:
      - name: Check out 3.x
        uses: actions/checkout@v4
        with:
          ref: 3.x
          fetch-depth: 0
          submodules: true

      - name: Patch Markdown semantic bold
        run: |
          $path = Join-Path $env:GITHUB_WORKSPACE "MarkdownTextBox.cs"
          $text = Get-Content -LiteralPath $path -Raw

          $old = @'
                  private static Typeface HeadingTypeface => new(
                      NoteTypography.FontFamily,
                      NoteTypography.FontStyle,
                      NoteTypography.HeadingFontWeight,
                      NoteTypography.FontStretch);

                  private static Typeface StrongTypeface => new(
                      NoteTypography.FontFamily,
                      NoteTypography.FontStyle,
                      NoteTypography.HeadingFontWeight,
                      NoteTypography.FontStretch);
          '@

          $new = @'
                  private static FontFamily SemanticBoldFontFamily =>
                      AppTypography.FontFamilyFor(content: true, bold: true);

                  private static FontWeight SemanticBoldFontWeight =>
                      AppTypography.UsesCustomBoldFace(true)
                          ? AppTypography.FontWeightFor(true)
                          : NoteTypography.HeadingFontWeight;

                  private static Typeface HeadingTypeface => new(
                      SemanticBoldFontFamily,
                      NoteTypography.FontStyle,
                      SemanticBoldFontWeight,
                      NoteTypography.FontStretch);

                  private static Typeface StrongTypeface => new(
                      SemanticBoldFontFamily,
                      NoteTypography.FontStyle,
                      SemanticBoldFontWeight,
                      NoteTypography.FontStretch);
          '@

          $count = ([regex]::Matches($text, [regex]::Escape($old))).Count
          if ($count -ne 1) {
            throw "Expected exactly one Markdown heading/strong typeface block, found $count."
          }

          $text = $text.Replace($old, $new)
          Set-Content -LiteralPath $path -Value $text -Encoding utf8 -NoNewline

      - name: Fix changelog order and v3.31 note
        run: |
          $path = Join-Path $env:GITHUB_WORKSPACE "CHANGELOG.md"
          $text = Get-Content -LiteralPath $path -Raw
          $sectionPattern = '(?ms)^### v3\.31\s*\r?\n(?<body>.*?)(?=^### v0\.1\b)'
          $match = [regex]::Match($text, $sectionPattern)
          if (-not $match.Success) {
            throw "Could not find the misplaced v3.31 section before v0.1."
          }

          $body = $match.Groups['body'].Value.Trim()
          $releaseNote = '- **修复自定义字体增强加粗的 Markdown 正文适配**：启用增强加粗后，笔记中的 Markdown 标题、粗体和 `<b>` / `<strong>` 会正确使用自定义粗体字形。'
          if (-not $body.Contains($releaseNote)) {
            $body = $body.TrimEnd() + "`r`n" + $releaseNote
          }

          $text = $text.Remove($match.Index, $match.Length)
          if ($text -match '(?m)^### Unreleased\s*$') {
            throw "CHANGELOG.md already contains Unreleased unexpectedly; aborting instead of duplicating it."
          }

          $firstRelease = [regex]::Match($text, '(?m)^### v0\.1\b')
          if (-not $firstRelease.Success) {
            throw "Could not find v0.1 heading while restoring Unreleased."
          }

          $unreleased = "### Unreleased`r`n`r`n- 暂无`r`n`r`n"
          $text = $text.Insert($firstRelease.Index, $unreleased)
          $text = $text.TrimEnd() + "`r`n`r`n### v3.31`r`n`r`n" + $body + "`r`n"
          Set-Content -LiteralPath $path -Value $text -Encoding utf8 -NoNewline

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore and build
        run: |
          dotnet restore .\PaperTodo.csproj
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet build .\PaperTodo.csproj -c Release --no-restore
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git diff --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Commit fix to 3.x
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add MarkdownTextBox.cs CHANGELOG.md
          git commit -m "fix: apply custom bold face to Markdown body styles"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git push origin HEAD:3.x
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Republish stable v3.31
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run release.yml `
            --repo "${{ github.repository }}" `
            --ref 3.x `
            -f release_tag=v3.31 `
            -f prerelease=false `
            -f stable_release_confirmed=true
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
