name: Validate preview preload review
on:
  push:
    branches: [experiment/edge-preview-preload]
    paths: [.github/workflows/preload-review.yml]
permissions:
  contents: write
jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Apply isolated review candidate
        shell: python
        run: |
          from pathlib import Path
          import json
          changed=[]
          def read(p): return Path(p).read_text(encoding='utf-8-sig')
          def write(p,s):
              Path(p).parent.mkdir(parents=True,exist_ok=True)
              Path(p).write_text(s,encoding='utf-8',newline='\n')
              if p not in changed: changed.append(p)
          def edit(p,old,new):
              s=read(p); assert s.count(old)==1,(p,old[:100],s.count(old)); write(p,s.replace(old,new))
          def region(p,start,end,new):
              s=read(p);a=s.index(start);b=s.index(end,a);write(p,s[:a]+new+s[b:])
          p='src/EdgeCapsulePreview.Preload.cs'
          region(p,'// Dispatcher-local, disposable speculative work.', 'internal sealed class MarkdownEdgePreviewPreload', '''// Dispatcher-local, discardable prelayout of eligible edge notes. This cache never owns
          // presentation, input or persistence. One current body per source, with no count-based eviction.
          ''')
          region(p,'    private readonly Dictionary<EdgeCapsulePreviewInvalidationSource, Excerpt>', '    internal long BodyHits', '''    private readonly Dictionary<EdgeCapsulePreviewInvalidationSource, MarkdownEdgeCapsulePreviewRenderer.PreviewContent> _excerpts = new();
              private readonly Dictionary<EdgeCapsulePreviewInvalidationSource, Body> _bodies = new();
              private readonly Dictionary<EdgeCapsulePreviewInvalidationSource, Func<Target?>> _pendingLayout = new();
              private readonly DispatcherTimer _debounce;
              private CancellationTokenSource? _work;
              private EdgeCapsulePreviewInvalidationSource? _workingSource;
              private bool _enabled = true;
              internal int ExcerptCount => _excerpts.Count;
              internal int BodyCount => _bodies.Count;
              internal int PendingCount => _pendingLayout.Count;
          ''')
          edit(p,'    private sealed record Excerpt(MarkdownEdgeCapsulePreviewRenderer.PreviewContent Content, long Touched);\n','')
          edit(p,'        internal bool Current => Source.Version == Version;', '''        internal bool Current => Owner._enabled && Source.Version == Version &&
                      Owner._excerpts.TryGetValue(Source, out var current) && ReferenceEquals(current, Content);''')
          edit(p,'content.Inlines.Get(line.Text, content.RenderMode).Pieces', 'content.Inlines.Get(line.Text, MarkdownRenderModes.Full).Pieces')
          edit(p,'                    if (piece.Style == MarkdownEdgeCapsulePreviewRenderer.InlineStyle.None && piece.Link == null)', '''                    // Count semantic content, never Enhanced-mode delimiter/URL styling.
                              if ((piece.Style & ~MarkdownEdgeCapsulePreviewRenderer.InlineStyle.Syntax) == 0 && piece.Link == null)''')
          region(p,'        var source = context.InvalidationSource;','    internal static Key? MakeKey', '''        var source = context.InvalidationSource;
                  // Compare the bounded source BEFORE classifying: unchanged previews must not reparse.
                  if (_excerpts.TryGetValue(source, out var entry) &&
                      entry.RenderMode == candidate.RenderMode && entry.Truncated == candidate.Truncated &&
                      entry.Lines.SequenceEqual(candidate.Lines)) return entry;
                  _bodies.Remove(source);
                  _excerpts.Remove(source);
                  if (IsClearlyHighLoad(candidate)) _excerpts[source] = candidate;
                  return candidate;
              }

              internal Binding? Bind(EdgeCapsulePreviewContext context,
                  MarkdownEdgeCapsulePreviewRenderer.PreviewContent content, double zoom) =>
                  _enabled && _excerpts.TryGetValue(context.InvalidationSource, out var entry) && ReferenceEquals(entry, content)
                      ? new(this, context.InvalidationSource, context.InvalidationSource.Version, content, zoom) : null;

          ''')
          region(p,'    internal bool TryTake(', '    // An invisible zero-sized holder', '''    internal bool TryTake(Key key, out Body? body, bool demand = true)
              {
                  _dispatcher.VerifyAccess();
                  body = null;
                  if (!key.Binding.Current || !_bodies.TryGetValue(key.Binding.Source, out var candidate)) return false;
                  if (!candidate.Key.Binding.Current) { _bodies.Remove(key.Binding.Source); return false; }
                  if (candidate.Key != key) return false;
                  _bodies.Remove(key.Binding.Source);
                  body = candidate;
                  if (demand) BodyHits++;
                  return true;
              }

              internal bool Store(Body body)
              {
                  _dispatcher.VerifyAccess();
                  if (!body.Key.Binding.Current || body.Panel.Parent != null) return false;
                  _bodies[body.Key.Binding.Source] = body;
                  return true;
              }

              internal void Invalidate(EdgeCapsulePreviewInvalidationSource source)
              {
                  _dispatcher.VerifyAccess();
                  _bodies.Remove(source);
              }

              internal void Forget(EdgeCapsulePreviewInvalidationSource source)
              {
                  _dispatcher.VerifyAccess();
                  _excerpts.Remove(source); _bodies.Remove(source); _pendingLayout.Remove(source);
                  if (ReferenceEquals(_workingSource, source)) _work?.Cancel();
                  if (PendingCount == 0) _debounce.Stop();
              }

              internal void RequestLayout(EdgeCapsulePreviewInvalidationSource source, Func<Target?> read)
              {
                  _dispatcher.VerifyAccess();
                  if (!_enabled || _dispatcher.HasShutdownStarted) return;
                  // Keep only the newest request. Capturing/classifying text happens after the debounce,
                  // never on a keystroke or pointer callback. A running drain cannot bypass a new 500ms wait.
                  _pendingLayout[source] = read;
                  _work?.Cancel();
                  Arm();
              }

              private void Arm() { _debounce.Stop(); _debounce.Start(); }

              internal void BeginDemand()
              {
                  _dispatcher.VerifyAccess();
                  _work?.Cancel();
                  _debounce.Stop();
                  if (PendingCount > 0) Arm();
              }

              private async void Drain()
              {
                  if (!_enabled || _work != null || _dispatcher.HasShutdownStarted) return;
                  using var work = new CancellationTokenSource();
                  _work = work;
                  try
                  {
                      while (!work.IsCancellationRequested && PendingCount > 0)
                      {
                          await Dispatcher.Yield(DispatcherPriority.ContextIdle);
                          if (work.IsCancellationRequested || PendingCount == 0) break;
                          var pair = _pendingLayout.First();
                          _workingSource = pair.Key;
                          try
                          {
                              var target = pair.Value();
                              if (target != null) await WarmLayoutAsync(target, work.Token);
                          }
                          catch (OperationCanceledException) when (work.IsCancellationRequested) { }
                          catch (Exception ex) { Trace.TraceWarning("Markdown preview preload failed: {0}", ex.GetType().Name); }
                          finally
                          {
                              _workingSource = null;
                              // Retain interrupted work. A newer edit replaces the delegate and must not
                              // be removed by the completion of the older request. Failed/ineligible work
                              // is retired, not polled forever; host/content lifecycle supplies a new event.
                              if (!work.IsCancellationRequested &&
                                  _pendingLayout.TryGetValue(pair.Key, out var current) && ReferenceEquals(current, pair.Value))
                                  _pendingLayout.Remove(pair.Key);
                          }
                      }
                  }
                  finally
                  {
                      _work = null;
                      if (PendingCount > 0 && !_dispatcher.HasShutdownStarted && !_debounce.IsEnabled) Arm();
                  }
              }

          ''')
          region(p,'        var descriptor = MarkdownEdgeCapsulePreviewProvider.Instance.Describe(target.Context);', '        var viewport = view.PreloadViewport;', '''        var content = Capture(target.Context);
                  if (!IsClearlyHighLoad(content)) return false;
                  var view = new MarkdownEdgeCapsulePreviewView(target.Context, target.Size, content, version);
          ''')
          edit(p,'_pendingText.Clear(); _pendingLayout.Clear(); _bodies.Clear(); _excerpts.Clear();','_pendingLayout.Clear(); _bodies.Clear(); _excerpts.Clear();')
          edit(p,'if (Theme.SyntaxFadeBrush is not SolidColorBrush syntax || syntax.HasAnimatedProperties) return null;', '''if (Theme.SyntaxFadeBrush is not SolidColorBrush syntax || syntax.HasAnimatedProperties ||
                      !syntax.Transform.Value.IsIdentity || !syntax.RelativeTransform.Value.IsIdentity) return null;''')
          edit(p,'AppTypography.Scale(1), surface.Language.IetfLanguageTag, surface.FlowDirection));', '''AppTypography.Scale(1), surface.Language.IetfLanguageTag, surface.FlowDirection,
                      TextOptions.GetTextRenderingMode(surface), TextOptions.GetTextHintingMode(surface)));''')
          edit(p,'            sized.Arrange(new Rect(0, 0, sized.Width, sized.Height));\n            var success = await complete.Task;', '''            sized.Arrange(new Rect(0, 0, sized.Width, sized.Height));
                      if (!viewport.IsLoaded || viewport.RenderSize.Width <= 0 || viewport.RenderSize.Height <= 0) return false;
                      var success = await complete.Task;''')
          write('src/PaperWindow.EdgePreviewPreload.cs','''using System.Windows;

          namespace PaperTodo;

          public sealed partial class PaperWindow
          {
              private bool _markdownPreloadCloseHook;

              private bool CanPreloadMarkdownText =>
                  _windowLifecycle == PaperWindowLifecycleState.Alive && _controller.MarkdownPreviewPreloadingAllowed &&
                  _controller.State.ExperimentalEdgeCapsuleHoverPreview && _paper.IsVisible &&
                  _controller.State.UseCapsuleMode && _controller.State.UseDeepCapsuleMode && HasDeepCapsuleSlotPlacement &&
                  _paper.Type == PaperTypes.Note && IsCurrentBodyProviderMarkdown;

              private void ScheduleMarkdownPreviewPreload()
              {
                  MarkdownEdgePreviewPreload.For(Dispatcher).Invalidate(_edgeCapsulePreviewInvalidationSource);
                  RequestMarkdownPreviewLayoutPreload();
              }

              internal void RequestMarkdownPreviewLayoutPreload()
              {
                  var cache = MarkdownEdgePreviewPreload.For(Dispatcher);
                  if (!CanPreloadMarkdownText)
                  {
                      cache.Forget(_edgeCapsulePreviewInvalidationSource);
                      return;
                  }
                  if (!_markdownPreloadCloseHook)
                  {
                      _markdownPreloadCloseHook = true;
                      Closed += (_, _) => cache.Forget(_edgeCapsulePreviewInvalidationSource);
                  }
                  // Only queue a weak reader here. Even the eligibility parse waits for the shared 500ms.
                  var weak = new WeakReference<PaperWindow>(this);
                  cache.RequestLayout(_edgeCapsulePreviewInvalidationSource,
                      () => weak.TryGetTarget(out var window) ? window.ReadMarkdownPreloadTarget() : null);
              }

              private MarkdownEdgePreviewPreload.Target? ReadMarkdownPreloadTarget()
              {
                  var cache = MarkdownEdgePreviewPreload.For(Dispatcher);
                  if (!CanPreloadMarkdownText)
                  {
                      cache.Forget(_edgeCapsulePreviewInvalidationSource);
                      return null;
                  }
                  if (!CanEnterEdgeCapsulePreview || IsEdgeCapsulePreviewOpen ||
                      _edgeCapsuleHost?.MarkdownPreloadAnchor is not { } anchor) return null;
                  var host = _edgeCapsuleHost;
                  var generation = _bodySessionGeneration;
                  var context = CreateEdgeCapsulePreviewContext();
                  if (!MarkdownEdgePreviewPreload.IsClearlyHighLoad(cache.Capture(context))) return null;
                  var descriptor = MarkdownEdgeCapsulePreviewProvider.Instance.Describe(context);
                  var workArea = DeepCapsuleMonitorGeometry().LocalWorkAreaDip;
                  var size = descriptor.Size.Normalize(Math.Max(1, workArea.Width - 16), Math.Max(1, workArea.Height - 16));
                  // Preloading never grows HWND capacity or takes presentation authority.
                  if (!TryConstrainEdgeCapsulePreviewToCurrentHostCapacity(size, out size)) return null;
                  return new(context, anchor, size, () =>
                      CanPreloadMarkdownText && CanEnterEdgeCapsulePreview && !IsEdgeCapsulePreviewOpen &&
                      generation == _bodySessionGeneration && ReferenceEquals(host, _edgeCapsuleHost));
              }
          }

          public sealed partial class AppController
          {
              internal bool MarkdownPreviewPreloadingAllowed => !IsExiting;
          }
          ''')
          edit('src/AppController.EdgeCapsulePreview.cs','        if (pointerOver) ScheduleMarkdownPreviewNeighbors(window);\n\n','')
          region('src/PaperWindow.EdgeCapsulePreview.cs','            if (content is MarkdownEdgeCapsulePreviewView markdownView)', '            content.HorizontalAlignment', '')
          edit('src/AppController.cs','        ScheduleStartupShellPrewarm(papersToRestore);', '''        ScheduleStartupShellPrewarm(papersToRestore);
                  // Restored hosts are now staged. Only queue readers; classification/layout run after the
                  // existing shared debounce, without an additional startup timer or synchronous wait.
                  foreach (var window in _windows.Values) window.RequestMarkdownPreviewLayoutPreload();''')
          p='src/PaperWindow.EdgeCapsuleAdapter.cs'
          edit(p,'        return DispatchEdgeCapsuleIntent(EdgeCapsuleIntent.Attach(placement, paperForm, retracted));', '''        var accepted = DispatchEdgeCapsuleIntent(EdgeCapsuleIntent.Attach(placement, paperForm, retracted));
                  if (accepted) RequestMarkdownPreviewLayoutPreload();
                  return accepted;''')
          edit(p,'''        return DispatchEdgeCapsuleIntent(
                      EdgeCapsuleIntent.PaperFormChanged(paperForm, reserveWhileExpanded));''', '''        var accepted = DispatchEdgeCapsuleIntent(
                      EdgeCapsuleIntent.PaperFormChanged(paperForm, reserveWhileExpanded));
                  if (accepted) RequestMarkdownPreviewLayoutPreload();
                  return accepted;''')
          edit(p,'        return DispatchEdgeCapsuleIntent(EdgeCapsuleIntent.Detached());', '''        var accepted = DispatchEdgeCapsuleIntent(EdgeCapsuleIntent.Detached());
                  if (accepted) MarkdownEdgePreviewPreload.For(Dispatcher).Forget(_edgeCapsulePreviewInvalidationSource);
                  return accepted;''')
          p='tests/PaperTodo.EdgePreviewChecks/PreloadChecks.cs'
          edit(p,'Require(!MarkdownEdgePreviewPreload.IsClearlyHighLoad(light), "ordinary short rows are not speculatively preloaded");', 'Require(MarkdownEdgePreviewPreload.IsClearlyHighLoad(light), "200+ multi-row styled text qualifies under the new style-count rule");')
          edit(p,'string.Concat(Enumerable.Repeat("**ab**", 50))','"**" + new string(\'a\', 100) + "** " + new string(\'文\', 110)')
          edit(p,'string.Concat(Enumerable.Repeat("**ab**", 51))','"**" + new string(\'a\', 101) + "** " + new string(\'文\', 110)')
          edit(p,'            cache.RequestText(source, () => a);\n','')
          edit('tests/PaperTodo.EdgePreviewChecks/Program.cs','Checks(); PreloadChecks();','Checks(); PreloadAuditChecks(); PreloadChecks();')
          write('tests/PaperTodo.EdgePreviewChecks/PreloadAuditChecks.cs','''using System.Diagnostics;
          using System.Windows;
          using System.Windows.Controls;
          using System.Windows.Media;
          using System.Windows.Threading;
          using PaperTodo;

          internal static partial class Program
          {
              private static void PreloadAuditChecks()
              {
                  bool Eligible(string text, string mode) => MarkdownEdgePreviewPreload.IsClearlyHighLoad(
                      MarkdownEdgeCapsulePreviewRenderer.CaptureContent(text, mode));
                  foreach (var mode in new[] { MarkdownRenderModes.Basic, MarkdownRenderModes.Enhanced, MarkdownRenderModes.Full })
                  {
                      Require(!Eligible(new string('a', 200), mode), "200 source characters do not qualify");
                      Require(!Eligible(new string('a', 400), mode) && Eligible(new string('a', 401), mode), "strict 400/401 boundary");
                      Require(!Eligible("**" + new string('a', 100) + "** " + new string('b', 110), mode), "exactly 100 styled characters stay cold");
                      Require(Eligible("**" + new string('a', 101) + "** " + new string('b', 110), mode), "101 styled characters qualify");
                      Require(!Eligible("**a** *b* `c` " + new string('x', 205), mode), "three content pieces: syntax markers do not count");
                      Require(Eligible("**a** *b* `c` ~~d~~ " + new string('x', 205), mode), "four content pieces qualify");
                      Require(!Eligible("[a](https://example.com/" + new string('x', 220) + ")", mode), "hidden destination is not styled label coverage");
                      Require(!Eligible("***" + new string('x', 100) + "*** " + new string('a', 110), mode), "nested styles do not double-count coverage");
                  }
                  Require(!Eligible("**a** *b* `c` ~~d~~ " + new string('x', 205), MarkdownRenderModes.Off), "Off ignores style thresholds");
                  Require(Eligible(new string('x', 401), MarkdownRenderModes.Off), "Off still obeys total-length rule");
                  Console.WriteLine("PASS audited thresholds in three modes: syntax, links, nested coverage and Off");

                  var cache = MarkdownEdgePreviewPreload.For(Dispatcher.CurrentDispatcher);
                  cache.SetEnabledForChecks(true);
                  var root = new Grid();
                  root.Resources["TextBrushKey"] = Brushes.Black;
                  root.Resources["WeakTextBrushKey"] = Brushes.Gray;
                  root.Resources["LinkBrushKey"] = Brushes.Blue;
                  root.Resources["HoverBrushKey"] = Brushes.LightGray;
                  var window = new Window { Content = root, Width = 550, Height = 500, ShowActivated = false, ShowInTaskbar = false };
                  EdgeCapsulePreviewContext Context(EdgeCapsulePreviewInvalidationSource source, Func<string>? text = null) =>
                      new(new PaperData(), () => "Audit", false, text ?? (() => new string('x', 450)),
                          () => MarkdownRenderModes.Full, (_, _) => false, _ => false, () => new Style(), () => "", _ => { }, source);
                  MarkdownEdgePreviewPreload.Target Target(EdgeCapsulePreviewContext context) => new(context, root, new(460, 410), () => true);
                  void Until(Func<bool> condition, string message)
                  {
                      var timer = Stopwatch.StartNew();
                      while (!condition() && timer.ElapsedMilliseconds < 8000) Pump();
                      Require(condition(), message);
                  }
                  try
                  {
                      var source = new EdgeCapsulePreviewInvalidationSource();
                      var context = Context(source);
                      var calls = 0;
                      var requestedAt = Stopwatch.GetTimestamp();
                      cache.RequestLayout(source, () => { calls++; return Target(context); });
                      Require(calls == 0, "queuing does not read or parse content synchronously");
                      window.Show(); Pump();
                      Until(() => cache.BodyCount == 1 && cache.PendingCount == 0, "startup request completes without mouse activity");
                      Require(calls == 1 && Stopwatch.GetElapsedTime(requestedAt).TotalMilliseconds >= 490,
                          "shared half-second debounce precedes startup prelayout");
                      var first = cache.Capture(context);
                      Require(ReferenceEquals(first, cache.Capture(context)), "unchanged excerpt reuses prepared semantics");
                      var binding = cache.Bind(context, first, 1)!;
                      var key = MarkdownEdgePreviewPreload.MakeKey(binding, root, new Size(200, 100))!;
                      cache.Forget(source);
                      Require(!binding.Current && !cache.Store(new(key, new StackPanel(), false)), "forgotten body cannot be returned late");
                      Require(cache.BodyCount == 0 && cache.ExcerptCount == 0, "retirement releases both retained layers");
                      Console.WriteLine("PASS startup-like late host, deferred readers, semantic reuse and retirement");

                      calls = 0;
                      cache.RequestLayout(source, () =>
                      {
                          calls++;
                          if (calls == 1) cache.BeginDemand();
                          return Target(context);
                      });
                      Until(() => calls == 2 && cache.BodyCount == 1 && cache.PendingCount == 0,
                          "demand interruption retains and resumes the active item without a mouse retry");
                      cache.Clear();
                      var oldReads = 0;
                      var newReads = 0;
                      var replacementAt = 0L;
                      var replacementReadAt = 0L;
                      cache.RequestLayout(source, () =>
                      {
                          oldReads++;
                          replacementAt = Stopwatch.GetTimestamp();
                          cache.RequestLayout(source, () =>
                          {
                              newReads++;
                              replacementReadAt = Stopwatch.GetTimestamp();
                              return Target(context);
                          });
                          return Target(context);
                      });
                      Until(() => newReads == 1 && cache.BodyCount == 1 && cache.PendingCount == 0,
                          "replacement request survives the old drain and eventually completes");
                      Require(oldReads == 1 && Stopwatch.GetElapsedTime(replacementAt, replacementReadAt).TotalMilliseconds >= 490,
                          "an already-running drain does not bypass the replacement's 500ms debounce");
                      cache.Clear();
                      cache.RequestLayout(source, () =>
                      {
                          cache.Forget(source);
                          return Target(context);
                      });
                      Until(() => cache.PendingCount == 0, "removed active item retires");
                      Pump();
                      Require(cache.BodyCount == 0 && root.Children.Count == 0, "removed active work cannot leave hidden controls or cache");
                      Console.WriteLine("PASS queue interruption, replacement debounce and active Forget");
                      cache.RequestLayout(new(), () => throw new InvalidOperationException("expected optional failure"));
                      cache.RequestLayout(source, () => Target(context));
                      Until(() => cache.BodyCount == 1 && cache.PendingCount == 0, "one failed target does not stall the queue");
                      cache.Clear();
                      var light = Context(new(), () => "short text");
                      Require(!AwaitPreload(cache.WarmLayoutAsync(Target(light))) && cache.ExcerptCount == 0 && cache.BodyCount == 0,
                          "light content retains no speculative body or semantic entry");
                      Console.WriteLine("PASS failure isolation and light-note exclusion");
                  }
                  finally { cache.Clear(); window.Close(); Pump(); }
              }
          }
          ''')
          edit('doc/ARCHITECTURE.md','没有完整 AvalonEdit 预览控件、另一套行内正则解析器、精确同步排版尺寸后端或进程级排版缓存。','没有完整 AvalonEdit 预览控件、另一套行内正则解析器或精确同步排版尺寸后端。')
          edit('doc/ARCHITECTURE.md','它不拥有队列、外壳动画、窗口交接或持久化状态。','''它不拥有队列、外壳动画、窗口交接或持久化状态。

          `MarkdownEdgePreviewPreload` 只拥有可丢弃的、Dispatcher 内的预排版工作和未挂载正文；按有界摘要的字符量与样式内容筛选，不按鼠标邻居预测或固定数量淘汰。每个合格来源最多保留一份当前正文，挂载时把唯一 ownership 交给 viewport，卸载可归还；版本、摘要或外观/尺寸不符时拒绝复用，离开边缘队列或关闭后撤销保留资格。启动恢复完成和后续入队/内容变化只提交延后读取请求，实际解析与排版在共享合并延迟后逐个进行。正式预览优先，被打断的有效请求留在队列；不引入第二套动画、输入或持久化状态。''')
          edit('CHANGELOG.md','行内语法沿用正文的识别实现，改善嵌套强调、转义与复杂链接的一致性。','行内语法沿用正文的识别实现，改善嵌套强调、转义与复杂链接的一致性。启动恢复和内容变化后，会在空闲期提前准备较长或样式较多的边缘笔记预览，减少首次浏览等待；轻内容不主动预热，离开边缘队列后释放对应缓存。')
          Path('results').mkdir(exist_ok=True)
          Path('results/changed-paths.json').write_text(json.dumps(changed),encoding='utf-8')
      - name: Windows regression checks
        run: |
          $results = @{}
          foreach ($name in @('EdgePreviewChecks','MarkdownSemanticChecks','MarkdownEditingChecks','TodoNavigationChecks','EdgeTitleChecks','ThreadingChecks','PersistenceChecks')) {
            dotnet run --project "tests/PaperTodo.$name" -c Release 2>&1 | Tee-Object "results/$name.log"
            $results[$name] = $LASTEXITCODE
          }
          $results | ConvertTo-Json | Set-Content results/exit-codes.json
          if (@($results.Values | Where-Object { $_ -ne 0 }).Count) { throw 'Regression failures; keep evidence.' }
          dotnet run --project tests/PaperTodo.EdgePreviewChecks -c Debug 2>&1 | Tee-Object results/edge-debug.log
          if ($LASTEXITCODE -ne 0) { throw 'Debug checks failed' }
      - name: Export only checked source blobs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $headers = @{Authorization="Bearer $env:GH_TOKEN"; Accept='application/vnd.github+json'}
          $entries = foreach ($path in (Get-Content results/changed-paths.json | ConvertFrom-Json)) {
            $text = [IO.File]::ReadAllText("$pwd/$path").Replace("`r`n","`n")
            $body = @{content=$text; encoding='utf-8'} | ConvertTo-Json -Compress
            $blob = Invoke-RestMethod -Method Post -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/git/blobs" -Headers $headers -Body $body -ContentType 'application/json; charset=utf-8'
            @{path=$path; sha=$blob.sha; mode='100644'; type='blob'}
            $dest=Join-Path "$pwd/results/source" $path
            New-Item -ItemType Directory -Force (Split-Path $dest) | Out-Null
            [IO.File]::WriteAllText($dest,$text,[Text.UTF8Encoding]::new($false))
          }
          $entries | ConvertTo-Json | Set-Content results/checked-blobs.json
          git diff --stat | Set-Content results/diff-stat.txt
          git diff | Set-Content results/candidate.diff
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: preload-review-evidence
          path: results/
          retention-days: 7
