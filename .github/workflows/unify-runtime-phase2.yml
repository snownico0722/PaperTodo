name: Unified runtime phase 2

on:
  push:
    branches:
      - refactor/unified-plugin-runtime
    paths:
      - tools/unify_runtime_phase2.py
      - tools/unify_runtime_phase2_fix.py
      - .github/workflows/unify-runtime-phase2.yml

permissions:
  contents: write

jobs:
  apply-and-build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - name: Apply phase 2
        shell: pwsh
        run: |
          python tools/unify_runtime_phase2.py
          python tools/unify_runtime_phase2_fix.py
          git diff --check
          Write-Host '--- residual legacy runtime references ---'
          Get-ChildItem src,PaperTodo.Plugin.Abstractions,plugin-samples,plugins -Recurse -File |
            Select-String -Pattern 'WebPaperRuntime|paperRuntime|PaperRuntimePath|PostBodyMessageToWebPaperRuntime|ReconcileWebPaperRuntimes|NotifyWebPaperRuntime|RetryFailedWebPaper'
      - name: Build
        shell: pwsh
        run: dotnet build .\PaperTodo.csproj -c Release
      - name: Commit product changes
        shell: pwsh
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src PaperTodo.Plugin.Abstractions plugin-samples plugins
          git commit -m "refactor: remove host-managed per-paper runtimes"
          git push
