name: Edge258 split workbench
on:
  push:
    branches: [work/edge258-split-validation]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  materialize:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Reconstruct and verify source trees without moving refs
        env:
          GH_TOKEN: ${{ github.token }}
        run: python tools/edge258-workbench/materialize.py
      - uses: actions/upload-artifact@v7
        with:
          name: edge258-verified-trees
          path: edge258-trees.json
          retention-days: 1
