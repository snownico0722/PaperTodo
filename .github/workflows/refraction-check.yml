name: Refraction integration
on:
  push:
    branches: [exp/playful-skins-20260909]
permissions:
  contents: write
concurrency:
  group: refraction-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    if: contains(github.event.head_commit.message, '[refraction-ci]')
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Commit verified integration to actual source
        id: source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ((git branch --show-current) -ne 'exp/playful-skins-20260909') { throw 'Wrong branch' }
          if (Test-Path .refraction-integrate.json) {
            @'
          from pathlib import Path
          import json, hashlib, subprocess
          checksum = lambda s: hashlib.sha256(s.encode('utf-8')).hexdigest()
          updates = {}
          for entry in json.loads(Path('.refraction-integrate.json').read_text(encoding='utf-8-sig')):
              name = entry['path']
              assert name.startswith(('src/','tests/')) and '..' not in Path(name).parts and name not in updates
              text = subprocess.check_output(['git','show',f'HEAD:{name}']).decode('utf-8-sig').replace('\r\n','\n')
              assert checksum(text) == entry['before'], 'Source changed: ' + name
              end = 0
              for a,b,value in entry['edits']:
                  assert end <= a <= b <= len(text)
                  end = b
              for a,b,value in reversed(entry['edits']): text = text[:a] + value + text[b:]
              assert checksum(text) == entry['after'], 'Transfer mismatch: ' + name
              updates[name] = text
          for name,text in updates.items(): Path(name).write_text(text, encoding='utf-8', newline='\n')
          Path('.refraction-integrate.json').unlink()
          '@ | python -
            if ($LASTEXITCODE -ne 0) { throw 'Integration failed' }
            git diff --check
            if ($LASTEXITCODE -ne 0) { throw 'Diff validation failed' }
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add -A
            if (git diff --cached --name-only -- .github/workflows) { throw 'Unexpected workflow change' }
            git commit -m 'feat: integrate actual background refraction and modern native material headers'
            if ($LASTEXITCODE -ne 0) { throw 'Commit failed' }
            git push origin HEAD:refs/heads/exp/playful-skins-20260909
            if ($LASTEXITCODE -ne 0) { throw 'Branch advanced during integration' }
          }
          $sha = git rev-parse HEAD
          "sha=$sha" >> $env:GITHUB_OUTPUT
          "short=$($sha.Substring(0,8))" >> $env:GITHUB_OUTPUT
          git bundle create "$env:RUNNER_TEMP/refraction-source.bundle" HEAD
      - name: Build Release
        shell: pwsh
        run: dotnet build ./PaperTodo.csproj -c Release --nologo -clp:ErrorsOnly
      - name: Actual refraction, native sentinel, materials and lifecycle
        shell: pwsh
        env:
          PAPER_MICA_CAPTURE: ${{ runner.temp }}/refraction-evidence/native
          PAPER_SKIN_CAPTURE: ${{ runner.temp }}/refraction-evidence/skins
        run: dotnet run --project ./tests/PaperTodo.MicaChecks/PaperTodo.MicaChecks.csproj -c Release
      - name: Existing interaction and persistence checks
        shell: pwsh
        run: |
          foreach ($project in @('MarkdownSemanticChecks','MarkdownEditingChecks','TodoNavigationChecks','EdgeTitleChecks','ThreadingChecks','PersistenceChecks')) {
            dotnet run --project "./tests/PaperTodo.$project/PaperTodo.$project.csproj" -c Release
            if ($LASTEXITCODE -ne 0) { throw "Failed: $project" }
          }
      - name: Publish the same tested source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $sha = '${{ steps.source.outputs.sha }}'
          $short = '${{ steps.source.outputs.short }}'
          $destination = Join-Path $env:RUNNER_TEMP 'refraction-package'
          New-Item -ItemType Directory -Force $destination | Out-Null
          foreach ($kind in @('self-contained','no-runtime')) {
            $contained = if ($kind -eq 'self-contained') { 'true' } else { 'false' }
            $out = Join-Path $env:RUNNER_TEMP "refraction-publish-$kind"
            dotnet publish ./PaperTodo.csproj -c Release -r win-x64 --self-contained $contained -o $out /p:PublishSingleFile=true /p:IncludeNativeLibrariesForSelfExtract=true "/p:EnableCompressionInSingleFile=$contained" /p:PublishTrimmed=false /p:PublishReadyToRun=false /p:DebugType=none /p:DebugSymbols=false /p:EmbedAllSources=false /p:EmbedUntrackedSources=false "/p:InformationalVersion=4.0.0-preview+$sha"
            if ($LASTEXITCODE -ne 0) { throw "Publish failed: $kind" }
            Copy-Item (Join-Path $out 'PaperTodo.exe') (Join-Path $destination "PaperTodo-refraction-$short-win-x64-$kind.exe")
          }
          $hashes = Get-ChildItem $destination -Filter *.exe | Get-FileHash -Algorithm SHA256 | Select-Object @{n='File';e={Split-Path $_.Path -Leaf}},Hash
          @{ sourceCommit=$sha; configuration='Release'; branch='exp/playful-skins-20260909'; executables=$hashes; capture='local memory only; active lens excluded from OS screen capture'; realWindows11ManualAcceptance=$false } | ConvertTo-Json -Depth 5 | Set-Content (Join-Path $destination 'build-manifest.json') -Encoding utf8
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: refraction-evidence-${{ github.run_id }}
          path: ${{ runner.temp }}/refraction-evidence
          if-no-files-found: ignore
          retention-days: 2
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: refraction-source-${{ github.run_id }}
          path: ${{ runner.temp }}/refraction-source.bundle
          if-no-files-found: ignore
          retention-days: 1
      - uses: actions/upload-artifact@v4
        if: success()
        with:
          name: refraction-package-${{ steps.source.outputs.short }}
          path: ${{ runner.temp }}/refraction-package
          if-no-files-found: error
          retention-days: 2
