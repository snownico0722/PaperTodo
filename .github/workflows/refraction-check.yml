name: Refraction integration
on:
  push:
    branches: [exp/playful-skins-20260909]
    paths: [.github/workflows/refraction-check.yml]
permissions:
  contents: read
jobs:
  probe:
    runs-on: windows-latest
    timeout-minutes: 8
    steps:
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Verify exclusion and native caption independently
        shell: pwsh
        run: |
          New-Item -ItemType Directory probe | Out-Null
          Set-Location probe
          '<Project Sdk="Microsoft.NET.Sdk"><PropertyGroup><TargetFramework>net10.0-windows</TargetFramework><OutputType>Exe</OutputType><UseWPF>true</UseWPF><UseWindowsForms>true</UseWindowsForms><ImplicitUsings>enable</ImplicitUsings></PropertyGroup><ItemGroup><Using Remove="System.Drawing"/><Using Remove="System.Windows.Forms"/></ItemGroup></Project>' | Set-Content probe.csproj
          @'
          using System.IO;
          using System.Runtime.InteropServices;
          using System.Windows;
          using System.Windows.Controls;
          using System.Windows.Interop;
          using System.Windows.Media;
          using System.Windows.Shell;
          using System.Windows.Threading;
          using D=System.Drawing;
          class Probe {
            [STAThread] static void Main(){
              new Application{ShutdownMode=ShutdownMode.OnExplicitShutdown}; Directory.CreateDirectory("evidence");
              var rear=new Window{Left=30,Top=30,Width=500,Height=360,WindowStyle=WindowStyle.None,ResizeMode=ResizeMode.NoResize,Background=Brushes.Lime,ShowInTaskbar=false};rear.Show();Wait();
              var front=new Window{Left=80,Top=80,Width=300,Height=200,WindowStyle=WindowStyle.None,ResizeMode=ResizeMode.NoResize,Background=Brushes.Magenta,Topmost=true,ShowInTaskbar=false};front.Show();Wait();var fh=new WindowInteropHelper(front).Handle;
              using(var included=Capture(front,"included"))Console.WriteLine("INCLUDED "+included.GetPixel(100,100));
              Console.WriteLine("EXCLUDE "+SetWindowDisplayAffinity(fh,0x11)+" error="+Marshal.GetLastWin32Error());Wait();
              using(var excluded=Capture(front,"excluded"))Console.WriteLine("EXCLUDED "+excluded.GetPixel(100,100));
              SetWindowDisplayAffinity(fh,0);front.Close();Wait();
              foreach(var recipe in new[]{2,3})foreach(var mode in new[]{"baseline","no-caption-style","no-nc","theme-options","alpha-zero"}){
                var w=new Window{WindowStyle=WindowStyle.None,ResizeMode=ResizeMode.CanResizeWithGrip,ShowInTaskbar=false,Topmost=true,Left=60,Top=50,Width=340,Height=230,Background=Brushes.Transparent};
                WindowChrome.SetWindowChrome(w,new WindowChrome{CaptionHeight=0,ResizeBorderThickness=new Thickness(),GlassFrameThickness=new Thickness(-1),UseAeroCaptionButtons=false});
                w.Content=new Border{Background=Brushes.Transparent};w.Show();Wait();var h=new WindowInteropHelper(w).Handle;
                HwndSource.FromHwnd(h).CompositionTarget.BackgroundColor=Colors.Transparent;
                Set(h,38,recipe);Set(h,35,0x00ff00ff);Set(h,34,unchecked((int)0xfffffffe));
                if(mode=="no-caption-style"){var st=GetWindowLong(h,-16);SetWindowLong(h,-16,st&~0x00c00000);SetWindowPos(h,IntPtr.Zero,0,0,0,0,0x0037);}
                if(mode=="no-nc")Set(h,2,1);
                if(mode=="theme-options"){var o=new Options{Flags=3,Mask=3};Console.WriteLine("THEME "+SetWindowThemeAttribute(h,1,ref o,8));}
                if(mode=="alpha-zero"){Set(h,39,1);var m=new Margins();Extend(h,ref m);}
                Wait();using(var b=Capture(w,$"caption-{recipe}-{mode}"))Console.WriteLine($"CAPTION {recipe}/{mode} style={GetWindowLong(h,-16):x} top={b.GetPixel(b.Width/2,8)} body={b.GetPixel(b.Width/2,100)}");w.Close();Wait();
              }rear.Close();
            }
            static D.Bitmap Capture(Window w,string name){DwmFlush();GetWindowRect(new WindowInteropHelper(w).Handle,out var r);var b=new D.Bitmap(r.R-r.L,r.B-r.T);using(var g=D.Graphics.FromImage(b))g.CopyFromScreen(r.L,r.T,0,0,b.Size);b.Save($"evidence/{name}.png");return b;}
            static void Wait(){var f=new DispatcherFrame();var t=new DispatcherTimer{Interval=TimeSpan.FromMilliseconds(200)};t.Tick+=(_,_)=>{t.Stop();f.Continue=false;};t.Start();Dispatcher.PushFrame(f);}
            static void Set(IntPtr h,int a,int v)=>Console.WriteLine($"DWM {a}={v}: {DwmSetWindowAttribute(h,a,ref v,4):x}");
            [StructLayout(LayoutKind.Sequential)]struct Margins{public int L,R,T,B;}
            [StructLayout(LayoutKind.Sequential)]struct Rect{public int L,T,R,B;}
            [StructLayout(LayoutKind.Sequential)]struct Options{public uint Flags,Mask;}
            [DllImport("user32.dll",SetLastError=true)]static extern bool SetWindowDisplayAffinity(IntPtr h,uint a);
            [DllImport("user32.dll")]static extern bool GetWindowRect(IntPtr h,out Rect r);
            [DllImport("user32.dll",EntryPoint="GetWindowLongW")]static extern int GetWindowLong(IntPtr h,int n);
            [DllImport("user32.dll",EntryPoint="SetWindowLongW")]static extern int SetWindowLong(IntPtr h,int n,int v);
            [DllImport("user32.dll")]static extern bool SetWindowPos(IntPtr h,IntPtr a,int x,int y,int w,int z,uint flags);
            [DllImport("uxtheme.dll")]static extern int SetWindowThemeAttribute(IntPtr h,int a,ref Options o,int n);
            [DllImport("dwmapi.dll")]static extern int DwmSetWindowAttribute(IntPtr h,int a,ref int v,int s);
            [DllImport("dwmapi.dll",EntryPoint="DwmExtendFrameIntoClientArea")]static extern int Extend(IntPtr h,ref Margins m);
            [DllImport("dwmapi.dll")]static extern int DwmFlush();
          }
          '@ | Set-Content Program.cs
          dotnet run --project probe.csproj -c Release | Tee-Object evidence-log.txt
          if ($LASTEXITCODE -ne 0) { throw 'Probe failed' }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: refraction-native-probe
          path: |
            probe/evidence
            probe/evidence-log.txt
          retention-days: 2
