name: PR Test Debug

on:
  push:
    branches-ignore:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    name: Package Debug test executable
    # Keep marker gating and concurrency at job scope: an ordinary push stays skipped and cannot
    # cancel a tagged Debug package that is already running for this branch.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.head_commit.message, '[debug]') ||
      contains(github.event.head_commit.message, '[debug-ci]')
    concurrency:
      group: pr-test-debug-${{ github.ref }}
      cancel-in-progress: true
    runs-on: windows-latest
    timeout-minutes: 15

    defaults:
      run:
        shell: pwsh

    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "true"
      SOURCE_SHA: ${{ github.sha }}

    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Read package metadata
        id: meta
        run: |
          $project = [xml](Get-Content -LiteralPath .\PaperTodo.csproj -Raw)
          $versionNodes = $project.SelectNodes('/Project/PropertyGroup/Version')
          if ($versionNodes.Count -ne 1) {
            throw "PaperTodo.csproj must define exactly one <Version> element (found $($versionNodes.Count))."
          }

          $version = ([string]$versionNodes[0].InnerText).Trim()
          if ([string]::IsNullOrWhiteSpace($version) -or $version -match '\s') {
            throw "PaperTodo.csproj <Version> is missing or contains whitespace: '$version'."
          }

          $shortSha = $env:SOURCE_SHA.Substring(0, [Math]::Min(7, $env:SOURCE_SHA.Length))
          "self_contained_exe=PaperTodo-v$version-debug-test-$shortSha-win-x64-self-contained.exe" >> $env:GITHUB_OUTPUT
          "framework_dependent_exe=PaperTodo-v$version-debug-test-$shortSha-win-x64-no-runtime.exe" >> $env:GITHUB_OUTPUT
          "artifact_prefix=PaperTodo-debug-test-$shortSha" >> $env:GITHUB_OUTPUT

      - name: Restore
        run: dotnet restore .\PaperTodo.csproj -r win-x64 --configfile .\NuGet.Config

      - name: Publish Debug test executables
        env:
          SELF_CONTAINED_EXE: ${{ steps.meta.outputs.self_contained_exe }}
          FRAMEWORK_DEPENDENT_EXE: ${{ steps.meta.outputs.framework_dependent_exe }}
        run: |
          $artifactDir = Join-Path $env:GITHUB_WORKSPACE "test-debug"
          $selfContainedOut = Join-Path $env:RUNNER_TEMP "pr-test-debug-self-contained"
          $frameworkDependentOut = Join-Path $env:RUNNER_TEMP "pr-test-debug-no-runtime"

          Remove-Item -LiteralPath $selfContainedOut, $frameworkDependentOut, $artifactDir -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $selfContainedOut, $frameworkDependentOut, $artifactDir | Out-Null

          dotnet publish .\PaperTodo.csproj `
            -c Debug `
            -r win-x64 `
            --self-contained true `
            --no-restore `
            -o $selfContainedOut `
            /p:PublishSingleFile=true `
            /p:PublishReadyToRun=false `
            /p:IncludeNativeLibrariesForSelfExtract=true `
            /p:EnableCompressionInSingleFile=true `
            /p:PublishTrimmed=false `
            /p:EmbedAllSources=false `
            /p:EmbedUntrackedSources=false `
            /p:DebugType=embedded `
            /p:DebugSymbols=true

          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item -LiteralPath (Join-Path $selfContainedOut "PaperTodo.exe") `
            -Destination (Join-Path $artifactDir $env:SELF_CONTAINED_EXE)

          dotnet publish .\PaperTodo.csproj `
            -c Debug `
            -r win-x64 `
            --self-contained false `
            --no-restore `
            -o $frameworkDependentOut `
            /p:PublishSingleFile=true `
            /p:PublishReadyToRun=false `
            /p:IncludeNativeLibrariesForSelfExtract=true `
            /p:EnableCompressionInSingleFile=false `
            /p:PublishTrimmed=false `
            /p:EmbedAllSources=false `
            /p:EmbedUntrackedSources=false `
            /p:DebugType=embedded `
            /p:DebugSymbols=true

          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Copy-Item -LiteralPath (Join-Path $frameworkDependentOut "PaperTodo.exe") `
            -Destination (Join-Path $artifactDir $env:FRAMEWORK_DEPENDENT_EXE)

          Get-ChildItem -LiteralPath $artifactDir -File | Sort-Object Name | Format-Table Name, Length

      - name: Launch packaged math smoke
        env:
          SELF_CONTAINED_EXE: ${{ steps.meta.outputs.self_contained_exe }}
          FRAMEWORK_DEPENDENT_EXE: ${{ steps.meta.outputs.framework_dependent_exe }}
        run: |
          $artifactDir = Join-Path $env:GITHUB_WORKSPACE "test-debug"
          $statePath = Join-Path $artifactDir "data.json"
          $state = @'
          {
            "markdownRenderMode": "full",
            "papers": [
              {
                "id": "math-package-smoke",
                "type": "note",
                "title": "Math Package Smoke",
                "isVisible": true,
                "content": "$$\\n\\\\frac{a+b}{c+d}\\n$$"
              }
            ]
          }
          '@

          function Test-PackagedApp([string] $name) {
            $exe = Join-Path $artifactDir $name
            if (-not (Test-Path -LiteralPath $exe -PathType Leaf)) {
              throw "Packaged executable not found: $exe"
            }

            Set-Content -LiteralPath $statePath -Value $state -Encoding UTF8 -NoNewline
            Remove-Item -LiteralPath (Join-Path $artifactDir "data.backup.json") -Force -ErrorAction SilentlyContinue

            $process = Start-Process -FilePath $exe -WorkingDirectory $artifactDir -PassThru
            try {
              Start-Sleep -Seconds 5
              if ($process.HasExited) {
                throw "Packaged executable exited during math startup smoke: $name (code $($process.ExitCode))"
              }
            }
            finally {
              if (-not $process.HasExited) {
                Stop-Process -Id $process.Id -Force -ErrorAction SilentlyContinue
                Wait-Process -Id $process.Id -ErrorAction SilentlyContinue
              }
              Remove-Item -LiteralPath $statePath, (Join-Path $artifactDir "data.backup.json") -Force -ErrorAction SilentlyContinue
              Start-Sleep -Milliseconds 700
            }
          }

          Test-PackagedApp $env:SELF_CONTAINED_EXE
          Test-PackagedApp $env:FRAMEWORK_DEPENDENT_EXE

      - name: Upload self-contained Debug test executable
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.meta.outputs.artifact_prefix }}-self-contained
          path: test-debug/${{ steps.meta.outputs.self_contained_exe }}
          archive: false
          if-no-files-found: error
          retention-days: 1

      - name: Upload framework-dependent Debug test executable
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.meta.outputs.artifact_prefix }}-no-runtime
          path: test-debug/${{ steps.meta.outputs.framework_dependent_exe }}
          archive: false
          if-no-files-found: error
          retention-days: 1
