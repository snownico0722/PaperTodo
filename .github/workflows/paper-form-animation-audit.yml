name: Paper form animation A-B audit

on:
  push:
    branches:
      - fix/acrylic-paper-form-animation-stutter

permissions:
  contents: read

jobs:
  audit:
    if: contains(github.event.head_commit.message, '[form-bench]')
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: pwsh
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "true"
    steps:
      - name: Check out candidate
        uses: actions/checkout@v7
        with:
          path: candidate
          fetch-depth: 0
          submodules: recursive
      - name: Check out baseline
        uses: actions/checkout@v7
        with:
          path: baseline
          ref: 9e176abfe33cbc0ca873c03576691b153f1299a0
          fetch-depth: 0
          submodules: recursive
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"
      - name: Use the same measurement code and build both revisions
        run: |
          $benchPath = 'tools/PaperTodo.MaterialBenchmarks'
          Copy-Item "candidate/$benchPath/Program.cs" "baseline/$benchPath/Program.cs" -Force
          Copy-Item "candidate/$benchPath/FormTransitionBenchmarks.cs" "baseline/$benchPath/FormTransitionBenchmarks.cs" -Force
          dotnet build "baseline/$benchPath/PaperTodo.MaterialBenchmarks.csproj" -c Release
          if ($LASTEXITCODE -ne 0) { throw 'Baseline build failed.' }
          dotnet build "candidate/$benchPath/PaperTodo.MaterialBenchmarks.csproj" -c Release
          if ($LASTEXITCODE -ne 0) { throw 'Candidate build failed.' }
      - name: Measure baseline and candidate in separate processes
        run: |
          $results = Join-Path $env:RUNNER_TEMP 'paper-form-audit'
          New-Item -ItemType Directory -Path $results -Force | Out-Null
          $env:PAPER_BENCH_REVISION = 'baseline-9e176ab'
          dotnet run --project baseline/tools/PaperTodo.MaterialBenchmarks/PaperTodo.MaterialBenchmarks.csproj -c Release --no-build -- --form-benchmark "$results/baseline.json"
          if ($LASTEXITCODE -ne 0) { throw 'Baseline measurement failed.' }
          $env:PAPER_BENCH_REVISION = 'candidate'
          dotnet run --project candidate/tools/PaperTodo.MaterialBenchmarks/PaperTodo.MaterialBenchmarks.csproj -c Release --no-build -- --form-benchmark "$results/candidate.json"
          if ($LASTEXITCODE -ne 0) { throw 'Candidate measurement failed.' }
          Get-Content "$results/baseline.json"
          Get-Content "$results/candidate.json"
      - name: Validate candidate material and native form behavior
        run: |
          dotnet run --project candidate/tests/PaperTodo.MicaChecks/PaperTodo.MicaChecks.csproj -c Release
          if ($LASTEXITCODE -ne 0) { throw 'Candidate material checks failed.' }
      - name: Upload A-B measurements
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: paper-form-audit-${{ github.sha }}
          path: ${{ runner.temp }}/paper-form-audit
          if-no-files-found: warn
          retention-days: 7
