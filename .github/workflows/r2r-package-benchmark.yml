name: Temporary R2R package benchmark

on:
  pull_request:
    paths:
      - ".github/r2r-package-benchmark.ps1"
      - ".github/workflows/r2r-package-benchmark.yml"
      - "tools/Package-R2R.ps1"
      - "PaperTodo.csproj"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  benchmark:
    runs-on: windows-latest
    timeout-minutes: 35
    defaults:
      run:
        shell: pwsh
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "true"

    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Build native LMDB library
        run: .\native\lmdb\build.ps1 -Configuration Release -ForceRebuild

      - name: Align benchmark restore with ReadyToRun publish
        run: |
          $path = '.\.github\r2r-package-benchmark.ps1'
          $text = Get-Content -LiteralPath $path -Raw
          $old = 'dotnet restore .\PaperTodo.csproj -r win-x64'
          $new = 'dotnet restore .\PaperTodo.csproj -r win-x64 /p:PublishReadyToRun=true'
          if ($text.IndexOf($old, [StringComparison]::Ordinal) -lt 0) {
            throw 'Benchmark restore command not found.'
          }
          Set-Content -LiteralPath $path -Value $text.Replace($old, $new) -Encoding utf8

      - name: Run R2R packaging benchmark
        run: .\.github\r2r-package-benchmark.ps1

      - name: Upload benchmark evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: r2r-package-benchmark
          if-no-files-found: error
          retention-days: 2
          path: benchmark-output/
