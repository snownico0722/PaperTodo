name: Apply third preview preload threshold
on:
  push:
    branches: [experiment/edge-preview-preload]
    paths: [.github/workflows/preview-style-count-update.yml]
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Patch policy, tests and docs
        shell: python
        run: |
          from pathlib import Path
          def replace(path, old, new):
              p=Path(path); s=p.read_text(encoding='utf-8-sig')
              assert s.count(old)==1, (path, s.count(old))
              p.write_text(s.replace(old,new),encoding='utf-8',newline='\n')

          old='''    // Preload policy is intentionally broader than the renderer's paragraph-path threshold.\n    // We only need to know whether doing the complete layout during idle time is worthwhile:\n    // >400 admitted source characters always qualifies; >200 qualifies when more than 100\n    // visible characters carry Markdown styling/link semantics. Thresholds are strict by design.\n    internal static bool IsClearlyHighLoad(MarkdownEdgeCapsulePreviewRenderer.PreviewContent content)\n    {\n        if (content.IsEmpty) return false;\n        var totalCharacters = content.Lines.Sum(line => line.Text.Length);\n        if (totalCharacters > 400) return true;\n        if (totalCharacters <= 200 || content.RenderMode == MarkdownRenderModes.Off) return false;\n\n        var styledCharacters = 0;\n        foreach (var line in content.Lines)\n        {\n            if (line.FenceKind is MarkdownFenceLineKind.Opening or MarkdownFenceLineKind.Closing)\n                continue;\n            if (line.WasInsideFence)\n            {\n                styledCharacters += line.Text.Length;\n            }\n            else\n            {\n                foreach (var piece in content.Inlines.Get(line.Text, content.RenderMode).Pieces)\n                    if (piece.Style != MarkdownEdgeCapsulePreviewRenderer.InlineStyle.None || piece.Link != null)\n                        styledCharacters += piece.Text.Length;\n            }\n            if (styledCharacters > 100) return true;\n        }\n        return false;\n    }'''
          new='''    // Preload policy is intentionally broader than the renderer's paragraph-path threshold.\n    // Complete idle layout is worthwhile when the bounded excerpt is large, has substantial\n    // styled coverage, or has several distinct styled/link pieces. Thresholds are strict.\n    internal static bool IsClearlyHighLoad(MarkdownEdgeCapsulePreviewRenderer.PreviewContent content)\n    {\n        if (content.IsEmpty) return false;\n        var totalCharacters = content.Lines.Sum(line => line.Text.Length);\n        if (totalCharacters > 400) return true;\n        if (totalCharacters <= 200 || content.RenderMode == MarkdownRenderModes.Off) return false;\n\n        var styledCharacters = 0;\n        var styledPieces = 0;\n        foreach (var line in content.Lines)\n        {\n            if (line.FenceKind is MarkdownFenceLineKind.Opening or MarkdownFenceLineKind.Closing)\n                continue;\n            if (line.WasInsideFence)\n            {\n                if (line.Text.Length > 0)\n                {\n                    styledCharacters += line.Text.Length;\n                    styledPieces++;\n                }\n            }\n            else\n            {\n                foreach (var piece in content.Inlines.Get(line.Text, content.RenderMode).Pieces)\n                {\n                    if (piece.Style == MarkdownEdgeCapsulePreviewRenderer.InlineStyle.None && piece.Link == null)\n                        continue;\n                    styledCharacters += piece.Text.Length;\n                    styledPieces++;\n                }\n            }\n            if (styledCharacters > 100 || styledPieces > 3) return true;\n        }\n        return false;\n    }'''
          replace('src/EdgeCapsulePreview.Preload.cs',old,new)

          marker='''            Require(!MarkdownEdgePreviewPreload.IsClearlyHighLoad(exactly100Styled), "200+ source characters with exactly 100 styled characters stay cold");\n            Require(MarkdownEdgePreviewPreload.IsClearlyHighLoad(over100Styled), "200+ source characters with more than 100 styled characters qualify");\n            Console.WriteLine("PASS preload thresholds: >400 total OR >200 total plus >100 styled characters");'''
          expanded=marker.replace('PASS preload thresholds: >400 total OR >200 total plus >100 styled characters','PASS preload thresholds: total/styled-character boundaries') + '''\n            var threeStyles = MarkdownEdgeCapsulePreviewRenderer.CaptureContent(\n                "**a** " + "*b* " + "`c` " + new string('文', 205), MarkdownRenderModes.Full);\n            var fourStyles = MarkdownEdgeCapsulePreviewRenderer.CaptureContent(\n                "**a** " + "*b* " + "`c` " + "~~d~~ " + new string('文', 205), MarkdownRenderModes.Full);\n            Require(!MarkdownEdgePreviewPreload.IsClearlyHighLoad(threeStyles), ">200 characters with exactly three styled pieces stay cold when styled coverage is small");\n            Require(MarkdownEdgePreviewPreload.IsClearlyHighLoad(fourStyles), ">200 characters with more than three styled pieces qualify");\n            Console.WriteLine("PASS preload third threshold: >200 total plus >3 styled/link pieces");'''
          replace('tests/PaperTodo.EdgePreviewChecks/PreloadChecks.cs',marker,expanded)

          p=Path('tests/PaperTodo.EdgePreviewChecks/PRELOAD.md'); s=p.read_text(encoding='utf-8-sig')
          s=s.replace('''- 16 块 / 6000 字符有界摘要的总字符数 **> 400**；或\n- 总字符数 **> 200**，并且其中带 Markdown 样式/链接语义的可见字符数 **> 100**。''','''- 16 块 / 6000 字符有界摘要的总字符数 **> 400**；或\n- 总字符数 **> 200**，并且其中带 Markdown 样式/链接语义的可见字符数 **> 100**；或\n- 总字符数 **> 200**，并且 Markdown 样式/链接片段数 **> 3**。''')
          p.write_text(s,encoding='utf-8',newline='\n')
      - name: Commit
        run: |
          git diff --check
          git config user.name snownico0722
          git config user.email 36026283+snownico0722@users.noreply.github.com
          git add src/EdgeCapsulePreview.Preload.cs tests/PaperTodo.EdgePreviewChecks/PreloadChecks.cs tests/PaperTodo.EdgePreviewChecks/PRELOAD.md
          git commit -m "perf(edge-preview): preload 200-char notes with several markdown spans [debug-ci]"
          git push origin HEAD:experiment/edge-preview-preload
