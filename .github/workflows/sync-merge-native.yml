name: Refresh merge native plugin outputs

on:
  push:
    branches:
      - integration/pr340-pr349-selective

permissions:
  contents: read

jobs:
  refresh:
    if: contains(github.event.head_commit.message, '[sync-native]')
    permissions:
      contents: write
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Rebuild delivered native plugins
        run: |
          Get-ChildItem plugin-samples -Recurse -Filter *.csproj | Sort-Object FullName | ForEach-Object {
            ./plugin-samples/Build-And-Install-NativePlugin.ps1 -ProjectPath $_.FullName
          }
          git add -- plugins
      - name: Verify persistence and plugin compatibility
        run: |
          ./tools/testing/Run-Checks.ps1 -Group persistence
          ./tools/testing/Run-Checks.ps1 -Group plugins
          git diff --exit-code -- plugins
          if ($LASTEXITCODE -ne 0) { throw 'Plugin rebuild is not reproducible.' }
      - name: Commit verified outputs to the integration branch
        run: |
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) { exit 0 }
          if ($LASTEXITCODE -ne 1) { throw 'Cannot inspect staged plugin changes.' }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'build: refresh native plugins for explicit merge baselines'
          if ($LASTEXITCODE -ne 0) { throw 'Cannot commit plugin outputs.' }
          git push origin HEAD:refs/heads/integration/pr340-pr349-selective
          if ($LASTEXITCODE -ne 0) { throw 'Branch changed or push was rejected; outputs were not force-pushed.' }
