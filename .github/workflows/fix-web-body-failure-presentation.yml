name: Fix Web Body Failure Presentation

on:
  push:
    branches:
      - feature/web-paper-runtime-lifecycle
    paths:
      - .github/workflows/fix-web-body-failure-presentation.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/web-paper-runtime-lifecycle
          fetch-depth: 0
          submodules: recursive

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Apply failure ownership fix
        shell: pwsh
        run: python .\tools\fix_web_body_failure_presentation.py

      - name: Diff check
        shell: pwsh
        run: git diff --check

      - name: Restore
        shell: pwsh
        run: dotnet restore .\PaperTodo.csproj

      - name: Build Release
        shell: pwsh
        run: dotnet build .\PaperTodo.csproj -c Release --no-restore

      - name: Protocol policy checks
        shell: pwsh
        run: dotnet run --project .\tests\PaperTodo.ProtocolPolicyChecks\PaperTodo.ProtocolPolicyChecks.csproj -c Release

      - name: Verify failure ownership guard
        shell: pwsh
        run: |
          git grep -n "_paperRuntimeOwnsPresentation" -- src/WebPaperBodySession.cs
          git grep -n "paperRuntimeOwnsPresentation:" -- src/PaperWindow.PluginBodies.cs

      - name: Commit verified fix
        shell: pwsh
        run: |
          Remove-Item .\tools\fix_web_body_failure_presentation.py
          Remove-Item .\.github\workflows\fix-web-body-failure-presentation.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: preserve paper runtime presentation on body failure"
          git push origin HEAD:feature/web-paper-runtime-lifecycle
