name: Data safety final contract verification (temporary)
on:
  push:
    branches: [feat/data-json-hot-reload-main-adapt]
    paths: [.github/workflows/temporary-data-safety.yml, .github/safety-review-followup.py]
permissions:
  contents: read
jobs:
  verify:
    if: github.repository == 'snownico0722/PaperTodo'
    runs-on: windows-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - pr: '340'
            base: 861068e071b68160ef9794b8e6991c954816f76a
          - pr: '351'
            base: c9318c3c78bf857c95a31a0a770b61f7f5b914de
    defaults:
      run:
        shell: pwsh
        working-directory: source
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: 'true'
    steps:
      - name: Preserve exact source bytes
        shell: pwsh
        working-directory: .
        run: git config --global core.autocrlf false
      - uses: actions/checkout@v7
        with:
          path: harness
          persist-credentials: false
      - uses: actions/checkout@v7
        with:
          ref: ${{ matrix.base }}
          path: source
          fetch-depth: 0
          submodules: recursive
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Apply exact candidate and synchronize its external contract
        env:
          REVIEW_PR: ${{ matrix.pr }}
        run: |
          @'
          import base64, hashlib, json, lzma, os, pathlib, subprocess
          root=pathlib.Path('../harness/.github')
          data=lzma.decompress(base64.b64decode(''.join((root/f'safety-review-payload.{i}').read_text().strip() for i in range(1,5)),validate=True))
          assert hashlib.sha256(data).hexdigest()=='a56a22343e82d742d77228eb56bce8fd513ef0fda5e89b33ecad85c16926537f'
          entry=json.loads(data)[os.environ['REVIEW_PR']]
          assert subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()==entry['base']
          patch=pathlib.Path(os.environ['RUNNER_TEMP'])/'safety.patch'
          patch.write_text(entry['patch'],encoding='utf-8',newline='')
          subprocess.run(['git','apply','--check',str(patch)],check=True)
          subprocess.run(['git','apply',str(patch)],check=True)
          subprocess.run(['python',str(root/'safety-review-followup.py')],check=True)
          contract=lzma.decompress(base64.b64decode('',validate=True))
          assert hashlib.sha256(contract).hexdigest()=='7688132ff096523f6f1b61e531b59b834ba15b8b1be9bbbf14fdb117d56aed70'
          exec(compile(contract,'external-write-contract','exec'))
          subprocess.run(['git','diff','--check'],check=True)
          subprocess.run(['git','add','-A'],check=True)
          '@ | python -
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build Release
        run: |
          dotnet build ./PaperTodo.csproj -c Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Rebuild the bridge carrying the synchronized operation instructions
        run: |
          ./plugin-samples/Build-And-Install-NativePlugin.ps1 -ProjectPath plugin-samples/PaperTodo.Plugin.CodexCliBridge/PaperTodo.Plugin.CodexCliBridge.csproj
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git add -A -- plugins
      - name: Data safety, modal shutdown and real killed writers
        run: |
          ./tools/testing/Run-Checks.ps1 -Group persistence 2>&1 | Tee-Object -FilePath "$env:RUNNER_TEMP/safety-checks.log"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Reverify changed contract and strict plugin outputs
        run: |
          ./tools/testing/Run-Checks.ps1 -Group plugins 2>&1 | Tee-Object -FilePath "$env:RUNNER_TEMP/plugin-checks.log"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git diff --exit-code
          if ($LASTEXITCODE -ne 0) { throw 'Verification changed candidate files.' }
      - name: Export successful candidate
        env:
          REVIEW_PR: ${{ matrix.pr }}
        run: |
          @'
          import base64,hashlib,json,os,pathlib,subprocess
          entries=[]
          names=subprocess.check_output(['git','diff','--cached','--name-only','-z']).decode().split('\0')
          for name in filter(None,names):
              assert not name.startswith('.github/safety-review')
              path=pathlib.Path(name)
              if not path.exists():entries.append({'path':name,'deleted':True})
              else:
                  data=path.read_bytes()
                  entries.append({'path':name,'sha256':hashlib.sha256(data).hexdigest(),'content':base64.b64encode(data).decode()})
          out=pathlib.Path('../delivery');out.mkdir(exist_ok=True)
          (out/(os.environ['REVIEW_PR']+'.json')).write_text(json.dumps(entries),encoding='utf-8')
          stats=subprocess.check_output(['git','diff','--cached','--stat'],text=True)
          print(stats)
          (out/(os.environ['REVIEW_PR']+'-stat.txt')).write_text(stats,encoding='utf-8')
          '@ | python -
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - uses: actions/upload-artifact@v6
        if: success()
        with:
          name: safety-candidate-${{ matrix.pr }}
          path: delivery/*
          retention-days: 1
      - uses: actions/upload-artifact@v6
        if: always()
        with:
          name: safety-logs-${{ matrix.pr }}
          path: |
            ${{ runner.temp }}/safety-checks.log
            ${{ runner.temp }}/plugin-checks.log
          if-no-files-found: ignore
          retention-days: 1
  prepare-commits:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v5
        with:
          pattern: safety-candidate-*
          merge-multiple: true
          path: delivery
      - name: Prepare verified commits without moving branches
        env:
          GH_TOKEN: ${{ github.token }}
          INFRA_HEAD: ${{ github.sha }}
          REPOSITORY: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import base64,hashlib,json,os,pathlib,time,urllib.request,urllib.error
          api='https://api.github.com/repos/'+os.environ['REPOSITORY']
          def request(method,path,body=None):
              payload=None if body is None else json.dumps(body).encode()
              for attempt in range(5):
                  req=urllib.request.Request(api+path,data=payload,method=method,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json','Content-Type':'application/json','X-GitHub-Api-Version':'2022-11-28'})
                  try:
                      with urllib.request.urlopen(req,timeout=60) as r:return json.load(r)
                  except urllib.error.HTTPError as ex:
                      if ex.code not in (500,502,503,504) or attempt==4:raise
                      print('Retry transient GitHub response',ex.code,method,path,flush=True)
                      time.sleep(2**attempt)
          result={}
          for pr in ('340','351'):
              parent=os.environ['INFRA_HEAD'] if pr=='340' else 'c9318c3c78bf857c95a31a0a770b61f7f5b914de'
              old=request('GET','/git/commits/'+parent)
              entries=json.loads(pathlib.Path('delivery/'+pr+'.json').read_text())
              elements=[]
              for item in entries:
                  if item.get('deleted'):sha=None
                  else:
                      data=base64.b64decode(item['content'],validate=True)
                      assert hashlib.sha256(data).hexdigest()==item['sha256']
                      sha=request('POST','/git/blobs',{'content':item['content'],'encoding':'base64'})['sha']
                  elements.append({'path':item['path'],'mode':'100644','type':'blob','sha':sha})
              if pr=='340':
                  cleanup=['.github/workflows/temporary-data-safety.yml','.github/safety-review-followup.py']+[f'.github/safety-review-payload.{i}' for i in range(1,5)]
                  elements += [{'path':p,'mode':'100644','type':'blob','sha':None} for p in cleanup]
              tree=request('POST','/git/trees',{'base_tree':old['tree']['sha'],'tree':elements})['sha']
              parents=[parent] if pr=='340' else [parent,result['340']['commit']]
              message='fix(data): 拒绝过期覆盖、关机取消写入并保护冲突图片 [ci]' if pr=='340' else 'fix(workspaces): 同步防覆盖与统一终止写入边界 [ci]'
              commit=request('POST','/git/commits',{'message':message,'tree':tree,'parents':parents})['sha']
              result[pr]={'commit':commit,'expected_head':parent,'tree':tree,'changed_files':len(entries)}
          pathlib.Path('prepared-safety-commits.json').write_text(json.dumps(result,indent=2))
          print(json.dumps(result,indent=2))
          PY
      - uses: actions/upload-artifact@v6
        with:
          name: prepared-safety-commits
          path: prepared-safety-commits.json
          retention-days: 1
