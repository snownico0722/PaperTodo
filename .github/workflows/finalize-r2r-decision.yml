name: Finalize R2R packaging decision

on:
  push:
    branches: [perf/cold-start-r2r-benchmark-20260913]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - name: Check out benchmark tools
        uses: actions/checkout@v7
        with:
          ref: perf/cold-start-r2r-benchmark-20260913
          path: tools

      - name: Check out lifecycle PR branch
        uses: actions/checkout@v7
        with:
          ref: perf/startup-exit-small-preload-20260913
          fetch-depth: 0
          path: target

      - name: Record measured R2R decision
        run: python tools/.github/finalize-r2r-decision.py target/doc/DECISIONS.md

      - name: Commit decision to lifecycle PR branch
        working-directory: target
        run: |
          if git diff --quiet -- doc/DECISIONS.md; then
            echo "Decision already present"
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add doc/DECISIONS.md
          git commit -m 'docs: record ReadyToRun single-file benchmark decision'
          git push origin HEAD:perf/startup-exit-small-preload-20260913
