name: Validate PR245 rendering review
on:
  push:
    branches: [experiment/edge-preview-avalonedit]
    paths: [.github/workflows/pr245-review.yml]
permissions:
  contents: write
jobs:
  review:
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7
        with:
          path: candidate
          fetch-depth: 0
          submodules: recursive
      - uses: actions/checkout@v7
        with:
          path: baseline
          ref: f7709dbc2ff727c1a169745a84ad1a649e32e609
          fetch-depth: 0
          submodules: recursive
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Assemble isolated candidate and identical regression harness
        shell: python
        run: |
          from pathlib import Path
          import subprocess, textwrap, shutil
          previous=subprocess.check_output(['git','-C','candidate','show','06f807ae72ed871f606aedac883dece2c53c787b:.github/workflows/pr245-review.yml'],encoding='utf-8')
          block=previous.split('      - name: Assemble isolated candidate and identical regression harness\n',1)[1]
          script=textwrap.dedent(block.split('        run: |\n',1)[1].split('      - name:',1)[0])
          exec(compile(script,'fixed-review-assembly.py','exec'))
          edit('candidate','CHANGELOG.md','按可见空间分批准备文字，密集样式短行也避免一次性构造大量文字对象；',
              '按可见空间分批准备文字，纯文本减少不必要的临时分配，密集样式短行也避免一次性构造大量文字对象；')
          edit('candidate','doc/CHANGELOG.en.md','Visible text is prepared in batches, including short rows with dense styles.',
              'Visible text is prepared in batches, including short rows with dense styles; plain text avoids unnecessary temporary allocations.')
          edit('candidate','doc/CHANGELOG.en.md','The card does not scroll and shows an ellipsis on overflow.',
              'The card does not scroll and shows an ellipsis on overflow. After startup restoration and content changes, longer or more styled edge-note previews are prepared during idle time to reduce first-hover waiting; light content is not actively preloaded, and leaving the edge queue releases its cache.')
          p=Path('results/changed-paths.txt'); p.write_text(p.read_text()+'CHANGELOG.md\ndoc/CHANGELOG.en.md\n')
          Path('results/assembly.py').write_text(script,encoding='utf-8')
          shutil.copyfile('candidate/.github/workflows/pr245-review.yml','results/exact-workflow.yml')
      - name: Reproduce on unmodified production baseline
        run: |
          dotnet run --project baseline/tests/PaperTodo.EdgePreviewChecks -c Release -- --review-only 2>&1 | Tee-Object results/baseline-regressions.log
          if ($LASTEXITCODE -eq 0) { throw 'Expected baseline regressions were not reproduced' }
          if (-not (Select-String -Path results/baseline-regressions.log -Pattern 'FAIL review')) { throw 'Baseline failed before running regression checks' }
          exit 0
      - name: Candidate standard regressions
        run: |
          $codes = @{}
          foreach ($name in @('EdgePreviewChecks','MarkdownSemanticChecks','MarkdownEditingChecks','TodoNavigationChecks','EdgeTitleChecks','ThreadingChecks','PersistenceChecks')) {
            dotnet run --project "candidate/tests/PaperTodo.$name" -c Release 2>&1 | Tee-Object "results/$name.log"
            $codes[$name] = $LASTEXITCODE
          }
          $codes | ConvertTo-Json | Set-Content results/exit-codes.json
          if (@($codes.Values | Where-Object {$_ -ne 0}).Count) { throw 'Candidate regression failure' }
      - name: Same-machine inline allocation comparison
        run: |
          foreach ($case in @(@('baseline','before'),@('candidate','after'))) {
            dotnet run --project "$($case[0])/tests/PaperTodo.EdgePreviewChecks" -c Release --no-build -- --inline-allocation 2>&1 | Tee-Object "results/$($case[1])-alloc.log"
            if ($LASTEXITCODE -ne 0) { throw 'Allocation probe failed' }
          }
          dotnet run --project candidate/tests/PaperTodo.EdgePreviewChecks -c Debug -- --review-only 2>&1 | Tee-Object results/debug-review.log
          if ($LASTEXITCODE -ne 0) { throw 'Debug regression failed' }
      - name: Export checked source blobs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $headers = @{Authorization="Bearer $env:GH_TOKEN"; Accept='application/vnd.github+json'}
          $entries = foreach ($path in Get-Content results/changed-paths.txt) {
            $text = [IO.File]::ReadAllText("$pwd/candidate/$path").Replace("`r`n","`n")
            $body = @{content=$text; encoding='utf-8'} | ConvertTo-Json -Compress
            $blob = Invoke-RestMethod -Method Post -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/git/blobs" -Headers $headers -Body $body -ContentType 'application/json; charset=utf-8'
            @{path=$path; sha=$blob.sha; mode='100644'; type='blob'}
            $dest=Join-Path "$pwd/results/source" $path
            New-Item -ItemType Directory -Force (Split-Path $dest) | Out-Null
            [IO.File]::WriteAllText($dest,$text,[Text.UTF8Encoding]::new($false))
          }
          $entries | ConvertTo-Json | Set-Content results/checked-blobs.json
          git -C candidate diff | Set-Content results/candidate.diff
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: pr245-rendering-review-evidence
          path: results/
          retention-days: 2
