name: One-time reorder v4.0.0-beta1 release notes

on:
  push:
    branches:
      - "release/4.0.0-beta1-preview-publish"

permissions:
  contents: write

jobs:
  reorder:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: "v4.0.0-beta1"
    steps:
      - name: Put Simplified Chinese changelog first
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json body --jq '.body' > /tmp/body.md
          python - <<'PY'
          from pathlib import Path

          path = Path('/tmp/body.md')
          body = path.read_text(encoding='utf-8')
          marker = '<details>\n<summary>简体中文更新日志</summary>\n\n'
          start = body.find(marker)
          if start < 0:
              raise SystemExit('Simplified Chinese details block not found')
          close = body.find('\n</details>', start)
          if close < 0:
              raise SystemExit('Simplified Chinese details block is not closed')

          chinese = body[start + len(marker):close].strip()
          english = body[:start].strip()
          tail = body[close + len('\n</details>'):].strip()

          reordered = (
              chinese
              + '\n\n<details>\n<summary>English changelog</summary>\n\n'
              + english
              + '\n\n</details>'
          )
          if tail:
              reordered += '\n\n' + tail
          reordered += '\n'
          Path('/tmp/reordered.md').write_text(reordered, encoding='utf-8')
          PY

          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --notes-file /tmp/reordered.md --prerelease
