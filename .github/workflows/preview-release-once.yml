name: One-time collapse Chinese v4.0.0-beta1 release notes

on:
  push:
    branches:
      - "release/4.0.0-beta1-preview-publish"

permissions:
  contents: write

jobs:
  reorder:
    runs-on: ubuntu-latest
    env:
      RELEASE_TAG: "v4.0.0-beta1"
    steps:
      - name: Keep Simplified Chinese first but collapsed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --json body --jq '.body' > /tmp/body.md
          python - <<'PY'
          from pathlib import Path

          path = Path('/tmp/body.md')
          body = path.read_text(encoding='utf-8')

          english_marker = '<details>\n<summary>English changelog</summary>\n\n'
          english_start = body.find(english_marker)
          if english_start < 0:
              raise SystemExit('English details block not found')
          english_close = body.find('\n</details>', english_start)
          if english_close < 0:
              raise SystemExit('English details block is not closed')

          chinese = body[:english_start].strip()
          english = body[english_start + len(english_marker):english_close].strip()
          tail = body[english_close + len('\n</details>'):].strip()

          reordered = (
              '<details>\n<summary>简体中文更新日志</summary>\n\n'
              + chinese
              + '\n\n</details>\n\n'
              + english
          )
          if tail:
              reordered += '\n\n' + tail
          reordered += '\n'
          Path('/tmp/reordered.md').write_text(reordered, encoding='utf-8')
          PY

          gh release edit "$RELEASE_TAG" --repo "$GITHUB_REPOSITORY" --notes-file /tmp/reordered.md --prerelease
