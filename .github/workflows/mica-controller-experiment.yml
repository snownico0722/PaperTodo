name: MicaController experiment
on:
  push:
    branches: [exp/mica-controller-transparency-20260923]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mica-controller-experiment
  cancel-in-progress: true
jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x
      - name: Normal build stays identical to PR 227
        run: dotnet build ./PaperTodo.csproj -c Release --nologo -clp:ErrorsOnly
      - name: Build MicaController experiment
        run: dotnet build ./PaperTodo.csproj -c Release -r win-x64 --self-contained true -p:PaperTodoMicaControllerExperiment=true --nologo -clp:ErrorsOnly
      - name: Probe adjustable Mica on a real WPF paper
        run: dotnet run --project ./tests/PaperTodo.MicaChecks/PaperTodo.MicaChecks.csproj -c Release -r win-x64 --self-contained true -p:PaperTodoMicaControllerExperiment=true -- --mica-controller-experiment
      - name: Run material regression with experimental backend available
        run: dotnet run --project ./tests/PaperTodo.MicaChecks/PaperTodo.MicaChecks.csproj -c Release -r win-x64 --self-contained true -p:PaperTodoMicaControllerExperiment=true
      - name: Publish and smoke-test self-contained folder
        run: |
          $out = Join-Path $env:RUNNER_TEMP 'mica-controller-folder'
          dotnet publish ./PaperTodo.csproj -c Release -r win-x64 --self-contained true -o $out -p:PaperTodoMicaControllerExperiment=true -p:PublishSingleFile=false -p:PublishTrimmed=false -p:PublishReadyToRun=false -p:DebugType=none -p:DebugSymbols=false --nologo -clp:ErrorsOnly
          Set-Content (Join-Path $out 'data.json') '{"paperSkin":"mica","colorScheme":"mica","theme":"light","enableAnimations":true,"papers":[]}' -Encoding utf8
          $p = Start-Process (Join-Path $out 'PaperTodo.exe') -WorkingDirectory $out -PassThru
          Start-Sleep -Seconds 5
          if ($p.HasExited) { throw "Folder-published PaperTodo exited early: $($p.ExitCode)" }
          Stop-Process -Id $p.Id -Force
          Remove-Item (Join-Path $out 'data.json') -Force -ErrorAction SilentlyContinue
      - name: Publish experiment single-file
        run: |
          $out = Join-Path $env:RUNNER_TEMP 'mica-controller'
          dotnet publish ./PaperTodo.csproj -c Release -r win-x64 --self-contained true -o $out -p:PaperTodoMicaControllerExperiment=true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -p:EnableCompressionInSingleFile=true -p:PublishTrimmed=false -p:PublishReadyToRun=false -p:DebugType=none -p:DebugSymbols=false -p:EmbedAllSources=false -p:EmbedUntrackedSources=false --nologo -clp:ErrorsOnly
          $exe = Join-Path $out 'PaperTodo.exe'
          if (!(Test-Path $exe)) { throw 'Experiment executable missing' }
          $size = (Get-Item $exe).Length
          @{ sourceCommit=(git rev-parse HEAD); bytes=$size; component='Microsoft.WindowsAppSDK.InteractiveExperiences'; componentVersion='2.1.9'; deployment='unpackaged self-contained single-file extraction'; normalBuildUnchanged=$true; micaController='active on the existing WPF PaperWindow HWND'; medium='SDK defaults'; veryLow='Tint 0.650 / Luminosity 1.000 on CI light baseline'; veryHigh='Tint 0.350 / Luminosity 0.700 on CI light baseline'; foregroundOpacity=1.0; portableDataDirectory='Environment.ProcessPath directory' } |
            ConvertTo-Json | Set-Content (Join-Path $out 'experiment-manifest.json') -Encoding utf8
          Set-Content (Join-Path $out 'data.json') '{"paperSkin":"mica","colorScheme":"mica","theme":"light","enableAnimations":true,"papers":[]}' -Encoding utf8
          $p = Start-Process $exe -WorkingDirectory $out -PassThru
          Start-Sleep -Seconds 5
          if ($p.HasExited) { throw "Single-file PaperTodo exited early: $($p.ExitCode)" }
          Stop-Process -Id $p.Id -Force
          Remove-Item (Join-Path $out 'data.json') -Force -ErrorAction SilentlyContinue
      - uses: actions/upload-artifact@v4
        with:
          name: mica-controller-experiment-${{ github.sha }}
          path: |
            ${{ runner.temp }}/mica-controller/PaperTodo.exe
            ${{ runner.temp }}/mica-controller/experiment-manifest.json
            ${{ runner.temp }}/mica-controller-folder/**
          if-no-files-found: error
          retention-days: 7
