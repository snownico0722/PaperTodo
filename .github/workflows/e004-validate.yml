name: Temporary E-004 real App validation
on:
  push:
    branches: [perf/e004-first-frame-editor-20260913]
    paths: ['.github/e004-apply.py', '.github/e004-app.py', '.github/e004-app.ps1', '.github/workflows/e004-validate.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 25
    defaults:
      run:
        shell: pwsh
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: 'true'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Prepare isolated clean baseline and candidate
        run: |
          New-Item -ItemType Directory -Force evidence | Out-Null
          dotnet --info > evidence/dotnet.txt
          foreach ($name in @('baseline','candidate')) {
            git worktree add --detach $name 92e835a5fb259519fa41403e8eb41cc4bfec969e
            if ($LASTEXITCODE -ne 0) { throw 'worktree failed' }
            git -C $name submodule update --init --recursive
            if ($LASTEXITCODE -ne 0) { throw 'submodule failed' }
          }
          python .github/e004-apply.py candidate
          if ($LASTEXITCODE -ne 0) { throw 'candidate failed' }
          git -C candidate add -N src/StartupCompilationProfile.cs
          git -C candidate diff --check
          if ($LASTEXITCODE -ne 0) { throw 'product diff failed' }
          git -C candidate diff > evidence/product.diff
          foreach ($path in @('App.xaml.cs','src/StartupCompilationProfile.cs','tests/PaperTodo.PersistenceChecks/Program.cs')) {
            $dest = Join-Path 'evidence/candidate-files' $path
            New-Item -ItemType Directory -Force (Split-Path $dest) | Out-Null
            Copy-Item (Join-Path 'candidate' $path) $dest
          }
      - name: Build and relevant behavioral regressions without probes
        run: |
          dotnet build candidate/PaperTodo.csproj -c Release > evidence/build.log 2>&1
          if ($LASTEXITCODE -ne 0) { Get-Content evidence/build.log -Tail 60; throw 'build failed' }
          foreach ($suite in @('Lifecycle','Persistence','Threading','EdgePreview')) {
            dotnet run --project "candidate/tests/PaperTodo.${suite}Checks/PaperTodo.${suite}Checks.csproj" -c Release > "evidence/$suite.log" 2>&1
            if ($LASTEXITCODE -ne 0) { Get-Content "evidence/$suite.log" -Tail 60; throw "$suite failed" }
          }
      - name: Compare real executable startup memory and exit
        run: ./.github/e004-app.ps1 -Workspace .
      - name: Summarize real App samples
        shell: python
        run: |
          import csv,statistics,json
          from pathlib import Path
          rows=list(csv.DictReader(Path('evidence/real-app.csv').open(encoding='utf-8-sig')))
          assert len(rows)==30, len(rows)
          summary=[]
          keys=['renderingMs','readyMs','cacheMs','shellMs','exitMs','idleWorkingSet','idlePrivateBytes','cpuMs','profileAfter']
          for fmt in ('multifile','compressed'):
              for mode in ('baseline','fresh','recorded'):
                  samples=[r for r in rows if r['format']==fmt and r['mode']==mode and int(r['sampleIndex'])>0]
                  assert len(samples)==4
                  item=dict(format=fmt,mode=mode,n=len(samples))
                  item.update({key:statistics.median(float(r[key]) for r in samples) for key in keys})
                  summary.append(item)
                  print(json.dumps(item))
          with Path('evidence/medians.csv').open('w',newline='',encoding='utf-8') as f:
              w=csv.DictWriter(f,fieldnames=list(summary[0]));w.writeheader();w.writerows(summary)
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: e004-real-app-validation
          path: evidence/
          retention-days: 2
