name: Fix v3.31 audit findings

on:
  push:
    branches:
      - "3.x"
    paths:
      - ".github/workflows/fix-v3.31-audit-findings.yml"

permissions:
  contents: write
  actions: write

jobs:
  patch-test-and-release:
    runs-on: windows-latest

    defaults:
      run:
        shell: pwsh

    steps:
      - name: Check out 3.x
        uses: actions/checkout@v4
        with:
          ref: 3.x
          fetch-depth: 0
          submodules: true

      - name: Preserve Markdown heading size through inline styles
        run: |
          $path = Join-Path $env:GITHUB_WORKSPACE "MarkdownTextBox.cs"
          $text = Get-Content -LiteralPath $path -Raw
          $pattern = '(?m)^(\s*)element\.TextRunProperties\.SetTypeface\(typeface\);\r?\n\1var fontSize = _owner\.ScaledFontSize\(NoteTypography\.FontSize\);\r?\n\1element\.TextRunProperties\.SetFontRenderingEmSize\(fontSize\);\r?\n\1element\.TextRunProperties\.SetFontHintingEmSize\(fontSize\);'
          $matches = [regex]::Matches($text, $pattern)
          if ($matches.Count -ne 1) {
            throw "Expected exactly one MarkStyled font-size reset, found $($matches.Count)."
          }

          $replacement = '${1}element.TextRunProperties.SetTypeface(typeface);' + "`r`n" + '${1}// Inline styles inherit the block size so styled text inside headings stays at heading size.'
          $text = [regex]::Replace($text, $pattern, $replacement, 1)
          Set-Content -LiteralPath $path -Value $text -Encoding utf8 -NoNewline

      - name: Keep existing release tags aligned with rebuilt assets
        run: |
          $path = Join-Path $env:GITHUB_WORKSPACE ".github\workflows\release.yml"
          $text = Get-Content -LiteralPath $path -Raw
          $pattern = '(?ms)(      - name: Publish GitHub Release\r?\n.*?        run: \|\r?\n          \$releaseDir = .*?\r?\n          \$tag = .*?\r?\n)'
          $matches = [regex]::Matches($text, $pattern)
          if ($matches.Count -ne 1) {
            throw "Expected exactly one Publish GitHub Release preamble, found $($matches.Count)."
          }

          $syncLines = @(
            '          # A rebuilt existing release must keep its tag/source archive on the same commit as the uploaded assets.',
            '          git fetch --force --tags origin',
            '          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }',
            '          git show-ref --verify --quiet "refs/tags/$tag"',
            '          if ($LASTEXITCODE -eq 0) {',
            '            $tagCommit = (git rev-list -n 1 $tag).Trim()',
            '            if ($LASTEXITCODE -ne 0 -or [string]::IsNullOrWhiteSpace($tagCommit)) {',
            '              throw "Could not resolve existing release tag $tag."',
            '            }',
            '            if ($tagCommit -ne $env:GITHUB_SHA) {',
            '              Write-Host "Retargeting existing release tag $tag from $tagCommit to $env:GITHUB_SHA"',
            '              git tag -f $tag $env:GITHUB_SHA',
            '              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }',
            '              git push origin "refs/tags/$tag" --force',
            '              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }',
            '            }',
            '          }',
            ''
          ) -join "`r`n"

          $text = [regex]::Replace(
            $text,
            $pattern,
            { param($match) $match.Groups[1].Value + $syncLines },
            1)
          Set-Content -LiteralPath $path -Value $text -Encoding utf8 -NoNewline

      - name: Update v3.31 notes
        run: |
          $path = Join-Path $env:GITHUB_WORKSPACE "CHANGELOG.md"
          $text = Get-Content -LiteralPath $path -Raw
          $anchor = '- **修复自定义字体增强加粗的 Markdown 正文适配**：启用增强加粗后，笔记中的 Markdown 标题、粗体和 `<b>` / `<strong>` 会正确使用自定义粗体字形。'
          $newNote = '- **修复 Markdown 标题内行内样式字号**：标题中的粗体、斜体、删除线和下划线等行内样式不再把对应文字重置为正文大小。'
          $count = ([regex]::Matches($text, [regex]::Escape($anchor))).Count
          if ($count -ne 1) {
            throw "Expected exactly one v3.31 custom-bold note, found $count."
          }
          if (-not $text.Contains($newNote)) {
            $text = $text.Replace($anchor, $anchor + "`r`n" + $newNote)
          }
          Set-Content -LiteralPath $path -Value $text -Encoding utf8 -NoNewline

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore and build
        run: |
          dotnet restore .\PaperTodo.csproj
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet build .\PaperTodo.csproj -c Release --no-restore
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git diff --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Commit fixes and remove one-shot workflow
        run: |
          Remove-Item -LiteralPath ".github\workflows\fix-v3.31-audit-findings.yml" -Force
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add MarkdownTextBox.cs CHANGELOG.md .github/workflows/release.yml .github/workflows/fix-v3.31-audit-findings.yml
          git commit -m "fix: preserve Markdown heading styles and sync release tags"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git push origin HEAD:3.x
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Republish stable v3.31
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run release.yml `
            --repo "${{ github.repository }}" `
            --ref 3.x `
            -f release_tag=v3.31 `
            -f prerelease=false `
            -f stable_release_confirmed=true
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
