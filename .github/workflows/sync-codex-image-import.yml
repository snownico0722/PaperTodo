name: Sync Codex image import instructions

on:
  push:
    branches: [feat/mcp-note-image-io-20261105]
    paths:
      - src/PaperTodoOperationSkill.cs
      - .github/workflows/sync-codex-image-import.yml

permissions:
  contents: write

jobs:
  sync:
    if: github.repository == 'snownico0722/PaperTodo'
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x
      - name: Build the distributed Codex plugin with the repository installer
        shell: pwsh
        run: ./plugin-samples/Build-And-Install-NativePlugin.ps1 -ProjectPath plugin-samples/PaperTodo.Plugin.CodexCliBridge/PaperTodo.Plugin.CodexCliBridge.csproj
      - name: Commit only the rebuilt plugin
        shell: pwsh
        run: |
          git add -- plugins/tools.codex-cli-bridge.native/PaperTodo.Plugin.CodexCliBridge.dll
          git diff --cached --quiet
          if ($LASTEXITCODE -eq 0) { exit 0 }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore: 同步图片导入说明的 Codex 插件产物'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git push origin HEAD:refs/heads/feat/mcp-note-image-io-20261105
          exit $LASTEXITCODE
