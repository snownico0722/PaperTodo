name: Data reload implementation verification

on:
  push:
    branches: [feat/data-json-hot-reload]

permissions:
  contents: write

jobs:
  verify:
    runs-on: windows-latest
    timeout-minutes: 25
    concurrency:
      group: data-reload-implementation
      cancel-in-progress: false
    defaults:
      run:
        shell: pwsh
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: 'true'
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          submodules: recursive
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Apply exact implementation patch
        run: |
          git config core.autocrlf false
          if (Test-Path .github/data-reload-stage.py) {
            python .github/data-reload-stage.py
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Build and behavioral checks
        run: |
          New-Item -ItemType Directory -Force reload-verification | Out-Null
          dotnet build PaperTodo.csproj -c Release 2>&1 | Tee-Object reload-verification/build.log
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (Test-Path tests/PaperTodo.DataReloadChecks/PaperTodo.DataReloadChecks.csproj) {
            $checks = @('DataReload', 'Persistence', 'PluginApi', 'ProtocolPolicy', 'MarkdownSemantic', 'MarkdownEditing', 'TodoNavigation', 'EdgeTitle', 'Threading', 'Lifecycle')
            foreach ($check in $checks) {
              dotnet run --project "tests/PaperTodo.${check}Checks/PaperTodo.${check}Checks.csproj" -c Release 2>&1 | Tee-Object "reload-verification/$check.log"
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            }
          }
      - name: Commit verified source changes to feature branch only
        if: success()
        run: |
          if (Test-Path .github/data-reload-stage.py) {
            git add -- src PaperTodo.Plugin.Abstractions Resources tests plugin-samples/README.md doc/ARCHITECTURE.md doc/DECISIONS.md doc/CHANGELOG.en.md CHANGELOG.md .github/workflows/pull-request-build.yml
            git diff --cached --quiet
            if ($LASTEXITCODE -eq 1) {
              git config user.name 'github-actions[bot]'
              git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
              git commit -m 'feat(data): hot reload state with conflict recovery and shared plugin/MCP API [ci]'
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
              git push origin HEAD:refs/heads/feat/data-json-hot-reload
              if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            }
          }
      - name: Capture exact source and verification
        if: always()
        run: |
          New-Item -ItemType Directory -Force reload-verification | Out-Null
          git rev-parse HEAD | Set-Content reload-verification/head.txt
          git diff --stat | Set-Content reload-verification/uncommitted.txt
          git archive --format=zip --output=reload-verification/source.zip HEAD
          git diff --binary --output=reload-verification/working.patch
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: data-reload-verification
          path: reload-verification/
          retention-days: 2
