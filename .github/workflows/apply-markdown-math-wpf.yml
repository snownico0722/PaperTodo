name: Apply Markdown WpfMath integration

on:
  push:
    branches:
      - feat/markdown-math-wpf
    paths:
      - .github/workflows/apply-markdown-math-wpf.yml
      - tools/apply-markdown-math-wpf.ps1

permissions:
  contents: write

jobs:
  apply-and-verify:
    runs-on: windows-latest
    timeout-minutes: 20

    defaults:
      run:
        shell: pwsh

    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "true"

    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Apply source integration
        run: .\tools\apply-markdown-math-wpf.ps1

      - name: Restore
        run: dotnet restore .\PaperTodo.csproj

      - name: Build
        run: dotnet build .\PaperTodo.csproj -c Release --no-restore

      - name: Markdown semantic checks
        run: dotnet run --project .\tests\PaperTodo.MarkdownSemanticChecks\PaperTodo.MarkdownSemanticChecks.csproj -c Release

      - name: Markdown editing checks
        run: dotnet run --project .\tests\PaperTodo.MarkdownEditingChecks\PaperTodo.MarkdownEditingChecks.csproj -c Release

      - name: Todo navigation checks
        run: dotnet run --project .\tests\PaperTodo.TodoNavigationChecks\PaperTodo.TodoNavigationChecks.csproj -c Release

      - name: Threading regression checks
        run: dotnet run --project .\tests\PaperTodo.ThreadingChecks\PaperTodo.ThreadingChecks.csproj -c Release

      - name: Commit verified integration
        run: |
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- `
            PaperTodo.csproj `
            src/MarkdownSemanticSnapshot.cs `
            src/MarkdownSemanticSnapshot.Incremental.cs `
            src/MarkdownSemanticReveal.cs `
            src/MarkdownSemanticPresentation.cs `
            tests/PaperTodo.MarkdownSemanticChecks/PaperTodo.MarkdownSemanticChecks.csproj `
            tests/PaperTodo.MarkdownEditingChecks/Program.cs
          if (git diff --cached --quiet) {
            throw "Integration script produced no tracked source changes."
          }
          git commit -m "feat(markdown): wire WpfMath formula presentation"
          git push origin HEAD:${{ github.ref_name }}
