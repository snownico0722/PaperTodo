name: Edge preview research comparison
on:
  push:
    branches: [experiment/edge-preview-avalonedit]
    paths: [.github/workflows/edge-preview-research.yml]
permissions:
  contents: write
jobs:
  compare:
    runs-on: windows-latest
    timeout-minutes: 25
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7
        with:
          path: candidate
          fetch-depth: 0
          submodules: recursive
      - uses: actions/checkout@v7
        with:
          path: baseline
          ref: 14c7223190b1198941d7ce450e3cf52ee83ed73e
          fetch-depth: 0
          submodules: recursive
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Prepare isolated candidate and identical measurement harness
        shell: python
        run: |
          from pathlib import Path
          import subprocess, textwrap, shutil
          previous=subprocess.check_output(['git','-C','candidate','show','ca726f3bbdd5dc9d84c4820f6d3ae912b68c9523:.github/workflows/edge-preview-research.yml'],encoding='utf-8')
          block=previous.split('      - name: Prepare isolated candidate and identical measurement harness\n',1)[1]
          script=textwrap.dedent(block.split('        run: |\n',1)[1].split('      - name:',1)[0])
          exec(compile(script,'fixed-experiment-assembly.py','exec'))
          # Isolate object-tree savings. The earlier two-variable run is retained as evidence,
          # not accepted as proof that removing copy checkpoints improves every workload.
          source='src/EdgeCapsulePreview.Markdown.TextLayout.cs'
          Path('candidate/'+source).write_text(Path('baseline/'+source).read_text(encoding='utf-8-sig'),encoding='utf-8',newline='\n')
          p=Path('candidate/src/EdgeCapsulePreview.Markdown.Inlines.cs')
          s=p.read_text(encoding='utf-8')
          s=s.replace('// One Run carries the combined style; keep real Hyperlinks for input/resources.',
                      '// Apply font styles directly; keep real Hyperlinks for input and resources.')
          a=s.index('            if (Has(InlineStyle.Strike) && Has(InlineStyle.Underline))')
          end='            (activeLink?.Inlines ?? target).Add(run);'
          b=s.index(end,a)+len(end)
          replacement='''            // Decorations retain their original scope: moving them onto a font-sized Run
                      // changes WPF underline/strikethrough metrics even when glyphs are identical.
                      Inline inline = run;
                      if (Has(InlineStyle.Strike)) inline = new Span(inline) { TextDecorations = TextDecorations.Strikethrough };
                      if (Has(InlineStyle.Underline)) inline = new Span(inline) { TextDecorations = TextDecorations.Underline };
                      (activeLink?.Inlines ?? target).Add(inline);'''
          replacement='\n'.join(line[10:] if line.startswith('                      ') else line for line in replacement.split('\n'))
          p.write_text(s[:a]+replacement+s[b:],encoding='utf-8',newline='\n')
          edit('candidate/tests/PaperTodo.MarkdownEditingChecks/EdgePreviewAppearanceChecks.cs',
              'var bold = row.Inlines.OfType<Bold>().Single();',
              'var bold = row.Inlines.OfType<Run>().Single(run => run.Text == "strong");')
          edit('candidate/tests/PaperTodo.MarkdownEditingChecks/EdgePreviewAppearanceChecks.cs',
              'var code = row.Inlines.OfType<Span>().First(span => span is not Bold);',
              'var code = row.Inlines.OfType<Run>().Single(run => run.Text == "code");')
          Path('results/changed-paths.txt').write_text('src/EdgeCapsulePreview.Markdown.Inlines.cs\ntests/PaperTodo.MarkdownEditingChecks/EdgePreviewChecks.cs\ntests/PaperTodo.MarkdownEditingChecks/EdgePreviewAppearanceChecks.cs\n')
          Path('results/harness').mkdir()
          for file in ['Program.cs','ResearchExport.cs']:
              shutil.copyfile('candidate/tests/PaperTodo.EdgePreviewExperimentChecks/'+file,'results/harness/'+file)
          Path('results/assembly.py').write_text(script,encoding='utf-8')
          shutil.copyfile('candidate/.github/workflows/edge-preview-research.yml','results/exact-workflow.yml')
      - name: Candidate correctness and existing regressions
        run: |
          $ErrorActionPreference = 'Stop'
          $results = @{}
          foreach ($name in @('EdgePreviewExperimentChecks','MarkdownSemanticChecks','MarkdownEditingChecks','TodoNavigationChecks','EdgeTitleChecks','ThreadingChecks','PersistenceChecks')) {
            dotnet run --project "candidate/tests/PaperTodo.$name" -c Release 2>&1 | Tee-Object "results/$name.log"
            $results[$name] = $LASTEXITCODE
          }
          $results | ConvertTo-Json | Set-Content results/exit-codes.json
          if (@($results.Values | Where-Object { $_ -ne 0 }).Count) { throw 'Regression failures; preserve evidence without waiving checks.' }
      - name: Baseline and candidate pixel exports
        run: |
          dotnet run --project baseline/tests/PaperTodo.EdgePreviewExperimentChecks -c Release -- --export "$pwd/results/pixels-before" 2>&1 | Tee-Object results/pixels-before.log
          if ($LASTEXITCODE -ne 0) { throw 'baseline export' }
          dotnet run --project candidate/tests/PaperTodo.EdgePreviewExperimentChecks -c Release -- --export "$pwd/results/pixels-after" 2>&1 | Tee-Object results/pixels-after.log
          if ($LASTEXITCODE -ne 0) { throw 'candidate export' }
      - name: Compare actual pixels
        shell: python
        run: |
          from pathlib import Path
          import json
          results=[]
          for p in sorted(Path('results/pixels-before').glob('*.rgba')):
              a=p.read_bytes(); b=(Path('results/pixels-after')/p.name).read_bytes()
              assert len(a)==len(b)
              changed=sum(abs(x-y)>32 for x,y in zip(a,b))
              results.append({'fixture':p.name,'bytes':len(a),'changed':changed,'fraction':changed/len(a),'exact':a==b})
          assert len(results)==128, len(results)
          Path('results/pixel-comparison.json').write_text(json.dumps(results,indent=2))
          print('PIXELS',len(results),'exact',sum(r['exact'] for r in results),'maximum changed fraction',max(r['fraction'] for r in results))
          assert all(r['fraction']<0.02 for r in results), [r for r in results if r['fraction']>=0.02]
      - name: Same-machine forward and reverse-order profiles
        run: |
          foreach ($case in @(@('baseline','before-a'),@('candidate','after-a'),@('candidate','after-b'),@('baseline','before-b'))) {
            dotnet run --project "$($case[0])/tests/PaperTodo.EdgePreviewExperimentChecks" -c Release --no-build -- --profile 2>&1 | Tee-Object "results/$($case[1]).log"
            if ($LASTEXITCODE -ne 0) { throw "Profile $($case[1]) failed" }
          }
      - name: Candidate Debug checks
        run: |
          dotnet run --project candidate/tests/PaperTodo.EdgePreviewExperimentChecks -c Debug 2>&1 | Tee-Object results/debug.log
          if ($LASTEXITCODE -ne 0) { throw 'Debug checks failed' }
      - name: Record exact checked source blobs only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $headers = @{Authorization="Bearer $env:GH_TOKEN"; Accept='application/vnd.github+json'}
          $entries = foreach ($path in Get-Content results/changed-paths.txt) {
            $text = [IO.File]::ReadAllText("$pwd/candidate/$path").Replace("`r`n","`n")
            $body = @{content=$text; encoding='utf-8'} | ConvertTo-Json -Compress
            $blob = Invoke-RestMethod -Method Post -Uri "https://api.github.com/repos/$env:GITHUB_REPOSITORY/git/blobs" -Headers $headers -Body $body -ContentType 'application/json; charset=utf-8'
            @{path=$path; sha=$blob.sha; mode='100644'; type='blob'}
            $dest=Join-Path "$pwd/results/source" $path
            New-Item -ItemType Directory -Force (Split-Path $dest) | Out-Null
            [IO.File]::WriteAllText($dest,$text,[Text.UTF8Encoding]::new($false))
          }
          $entries | ConvertTo-Json | Set-Content results/checked-blobs.json
          git -C candidate diff | Set-Content results/candidate.diff
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: edge-preview-research-results
          path: results/
          retention-days: 2
