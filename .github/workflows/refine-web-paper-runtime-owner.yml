name: Refine Web Paper Runtime Owner

on:
  push:
    branches:
      - feature/web-paper-runtime-lifecycle
    paths:
      - .github/workflows/refine-web-paper-runtime-owner.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/web-paper-runtime-lifecycle
          fetch-depth: 0
          submodules: recursive

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Relax sequential replacement helper
        shell: pwsh
        run: |
          @'
          from pathlib import Path
          path = Path('tools/refine_web_paper_runtime_owner.py')
          text = path.read_text(encoding='utf-8')
          old = '''    if count != 1:\n        raise RuntimeError(f"{path}: expected 1 match, got {count}: {old[:120]!r}")\n'''
          new = '''    if count == 0:\n        raise RuntimeError(f"{path}: expected at least 1 match, got {count}: {old[:120]!r}")\n'''
          if text.count(old) != 1:
              raise SystemExit('replace helper shape changed')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          '@ | python -

      - name: Apply ownership fixes
        shell: pwsh
        run: python .\tools\refine_web_paper_runtime_owner.py

      - name: Apply compile fix
        shell: pwsh
        run: python .\tools\fix_refine_compile.py

      - name: Diff check
        shell: pwsh
        run: git diff --check

      - name: Restore
        shell: pwsh
        run: dotnet restore .\PaperTodo.csproj

      - name: Build Release
        shell: pwsh
        run: dotnet build .\PaperTodo.csproj -c Release --no-restore

      - name: Protocol policy checks
        shell: pwsh
        run: dotnet run --project .\tests\PaperTodo.ProtocolPolicyChecks\PaperTodo.ProtocolPolicyChecks.csproj -c Release

      - name: Lifecycle ownership scans
        shell: pwsh
        run: |
          if (Test-Path .\src\PaperWindow.WebPaperRuntime.cs) {
            Write-Error 'PaperWindow still owns a WebPaperRuntime file.'
            exit 1
          }
          $legacy = git grep -n -E "PromoteBackgroundWebView|_everPresented|HasLiveWebPaperRuntime|EnsureWebPaperRuntime|DisposeWebPaperRuntime" -- src
          if ($LASTEXITCODE -eq 0) {
            Write-Error ($legacy -join "`n")
            exit 1
          }
          git grep -n "_webPaperRuntimeSlots" -- src/AppController.WebPaperRuntime.cs
          git grep -n "EnableWebPaperRuntimeReconciliation" -- src/AppController.PluginStartup.cs
          git grep -n "paperRuntime" -- plugins/official.clock.web/plugin.json

      - name: Commit verified fixes
        shell: pwsh
        run: |
          Remove-Item .\tools\refine_web_paper_runtime_owner.py
          Remove-Item .\tools\fix_refine_compile.py
          Remove-Item .\.github\workflows\refine-web-paper-runtime-owner.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix: own Web paper runtimes by paper lifetime"
          git push origin HEAD:feature/web-paper-runtime-lifecycle
