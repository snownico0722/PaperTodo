name: Backport advanced settings tint

on:
  push:
    branches:
      - "3.x"
    paths:
      - ".github/workflows/backport-advanced-settings-tint.yml"

permissions:
  contents: write

jobs:
  patch-build-commit:
    runs-on: windows-latest

    defaults:
      run:
        shell: pwsh

    steps:
      - name: Check out 3.x
        uses: actions/checkout@v4
        with:
          ref: 3.x
          fetch-depth: 0
          submodules: true

      - name: Add advanced settings block helper
        run: |
          $content = @'
          using System.Windows;
          using System.Windows.Controls;
          using System.Windows.Media;

          namespace PaperTodo;

          public sealed partial class AppController
          {
              private static T MarkAdvancedSetting<T>(T element)
                  where T : FrameworkElement
              {
                  // Advanced sections already have a distinct background. Keep their controls on the same
                  // alignment line as ordinary settings instead of adding a per-item badge.
                  return element;
              }

              private UIElement AdvancedSettingsBlock(params UIElement[] items)
              {
                  var content = new StackPanel();
                  foreach (var item in items)
                  {
                      content.Children.Add(item);
                  }

                  return new Border
                  {
                      Background = Theme.Tint((byte)(Theme.IsDark ? 24 : 14)),
                      BorderBrush = Theme.Tint((byte)(Theme.IsDark ? 42 : 28)),
                      BorderThickness = new Thickness(1),
                      CornerRadius = new CornerRadius(8),
                      // The negative horizontal margin grows only the background. Matching padding keeps
                      // every control aligned with the ordinary settings above and below this block.
                      Padding = new Thickness(8, 5, 8, 8),
                      Margin = new Thickness(-8, 5, -8, 7),
                      Child = content
                  };
              }
          }
          '@
          $content = $content -replace '(?m)^          ', ''
          Set-Content -LiteralPath .\AppController.SettingsEnhancements.cs -Value $content -Encoding utf8 -NoNewline

      - name: Group advanced settings with mainline tint
        run: |
          $path = Join-Path $env:GITHUB_WORKSPACE "AppController.Settings.cs"
          $text = Get-Content -LiteralPath $path -Raw

          function Replace-Once([string]$name, [string]$pattern, [string]$replacement) {
            $matches = [regex]::Matches($script:text, $pattern)
            if ($matches.Count -ne 1) {
              throw "Expected exactly one $name block, found $($matches.Count)."
            }
            $script:text = [regex]::Replace($script:text, $pattern, $replacement, 1)
          }

          $generalPattern = '(?ms)            _settingsHidePapersFromTaskbarCheckBox = SettingsToggle\(Strings\.Get\("SettingsHidePapersFromTaskbar"\), State\.HidePapersFromTaskbar, ToggleHidePapersFromTaskbar\);\r?\n            _settingsHidePapersFromWindowSwitcherCheckBox = SettingsToggle\(Strings\.Get\("SettingsHidePapersFromWindowSwitcher"\), State\.HidePapersFromWindowSwitcher, ToggleHidePapersFromWindowSwitcher\);\r?\n            leftColumn\.Children\.Add\(WrapWithHint\(_settingsHidePapersFromTaskbarCheckBox, "TipHidePapersFromTaskbar"\)\);\r?\n            leftColumn\.Children\.Add\(WrapWithHint\(_settingsHidePapersFromWindowSwitcherCheckBox, "TipHidePapersFromWindowSwitcher"\)\);\r?\n            leftColumn\.Children\.Add\(WrapWithHint\(SettingsFieldLabel\(Strings\.Get\("SettingsFullscreenTopmostMode"\), topMargin: 8\), "TipFullscreenTopmostMode"\)\);\r?\n            leftColumn\.Children\.Add\(CreateFullscreenTopmostModeSegmentSelector\(\)\);'
          $generalReplacement = @'
            _settingsHidePapersFromTaskbarCheckBox = MarkAdvancedSetting(SettingsToggle(Strings.Get("SettingsHidePapersFromTaskbar"), State.HidePapersFromTaskbar, ToggleHidePapersFromTaskbar));
            _settingsHidePapersFromWindowSwitcherCheckBox = MarkAdvancedSetting(SettingsToggle(Strings.Get("SettingsHidePapersFromWindowSwitcher"), State.HidePapersFromWindowSwitcher, ToggleHidePapersFromWindowSwitcher));
            leftColumn.Children.Add(AdvancedSettingsBlock(
                WrapWithHint(_settingsHidePapersFromTaskbarCheckBox, "TipHidePapersFromTaskbar"),
                WrapWithHint(_settingsHidePapersFromWindowSwitcherCheckBox, "TipHidePapersFromWindowSwitcher"),
                WrapWithHint(SettingsFieldLabel(Strings.Get("SettingsFullscreenTopmostMode"), topMargin: 8), "TipFullscreenTopmostMode"),
                CreateFullscreenTopmostModeSegmentSelector()));
          '@.TrimEnd()
          Replace-Once 'general advanced' $generalPattern $generalReplacement

          $scriptPattern = '(?ms)            // Keep script options on the shorter left column so they stay visible without scrolling\.\r?\n            leftColumn\.Children\.Add\(SettingsSectionLabel\(Strings\.Get\("SettingsScriptCapsule"\)\)\);\r?\n            leftColumn\.Children\.Add\(WrapWithHint\(SettingsToggle\(Strings\.Get\("SettingsPersistentPowerShellProcess"\), State\.UsePersistentPowerShellProcess, TogglePersistentPowerShellProcess\), "TipPersistentPowerShellProcess"\)\);\r?\n            leftColumn\.Children\.Add\(WrapWithHint\(SettingsToggle\(Strings\.Get\("SettingsPreferPowerShell7"\), State\.PreferPowerShell7, TogglePreferPowerShell7\), "TipPreferPowerShell7"\)\);\r?\n            leftColumn\.Children\.Add\(WrapWithHint\(SettingsToggle\(Strings\.Get\("SettingsHideScriptRunWindow"\), State\.HideScriptRunWindow, ToggleHideScriptRunWindow\), "TipHideScriptRunWindow"\)\);'
          $scriptReplacement = @'
            // Keep script options on the shorter left column so they stay visible without scrolling.
            leftColumn.Children.Add(AdvancedSettingsBlock(
                SettingsSectionLabel(Strings.Get("SettingsScriptCapsule")),
                WrapWithHint(MarkAdvancedSetting(SettingsToggle(Strings.Get("SettingsPersistentPowerShellProcess"), State.UsePersistentPowerShellProcess, TogglePersistentPowerShellProcess)), "TipPersistentPowerShellProcess"),
                WrapWithHint(MarkAdvancedSetting(SettingsToggle(Strings.Get("SettingsPreferPowerShell7"), State.PreferPowerShell7, TogglePreferPowerShell7)), "TipPreferPowerShell7"),
                WrapWithHint(MarkAdvancedSetting(SettingsToggle(Strings.Get("SettingsHideScriptRunWindow"), State.HideScriptRunWindow, ToggleHideScriptRunWindow)), "TipHideScriptRunWindow")));
          '@.TrimEnd()
          Replace-Once 'script advanced' $scriptPattern $scriptReplacement

          $capsulePattern = '(?ms)            rightColumn\.Children\.Add\(WrapWithHint\(\r?\n                SettingsToggle\(\r?\n                    Strings\.Get\("SettingsHideEdgeCapsuleCloseButtonOnHover"\),\r?\n                    State\.HideEdgeCapsuleCloseButtonOnHover,\r?\n                    ToggleHideEdgeCapsuleCloseButtonOnHover\),\r?\n                "TipHideEdgeCapsuleCloseButtonOnHover"\)\);\r?\n            rightColumn\.Children\.Add\(WrapWithHint\(SettingsFieldLabel\(Strings\.Get\("SettingsMaxTitleLength"\), topMargin: 8\), "TipMaxTitleLength"\)\);\r?\n            rightColumn\.Children\.Add\(CreateMaxTitleLengthStepper\(\)\);\r?\n            rightColumn\.Children\.Add\(WrapWithHint\(SettingsFieldLabel\(Strings\.Get\("SettingsDeepCapsuleTitleMeasureLimit"\), topMargin: 8\), "TipDeepCapsuleTitleMeasureLimit"\)\);\r?\n            rightColumn\.Children\.Add\(CreateDeepCapsuleTitleMeasureLimitStepper\(\)\);'
          $capsuleReplacement = @'
            rightColumn.Children.Add(AdvancedSettingsBlock(
                WrapWithHint(
                    MarkAdvancedSetting(SettingsToggle(
                        Strings.Get("SettingsHideEdgeCapsuleCloseButtonOnHover"),
                        State.HideEdgeCapsuleCloseButtonOnHover,
                        ToggleHideEdgeCapsuleCloseButtonOnHover)),
                    "TipHideEdgeCapsuleCloseButtonOnHover"),
                WrapWithHint(SettingsFieldLabel(Strings.Get("SettingsMaxTitleLength"), topMargin: 8), "TipMaxTitleLength"),
                CreateMaxTitleLengthStepper(),
                WrapWithHint(SettingsFieldLabel(Strings.Get("SettingsDeepCapsuleTitleMeasureLimit"), topMargin: 8), "TipDeepCapsuleTitleMeasureLimit"),
                CreateDeepCapsuleTitleMeasureLimitStepper()));
          '@.TrimEnd()
          Replace-Once 'capsule advanced' $capsulePattern $capsuleReplacement

          $imagePattern = '            rightColumn\.Children\.Add\(WrapWithHint\(SettingsToggle\(Strings\.Get\("SettingsAutoCompressLargeImages"\), State\.AutoCompressLargeImages, ToggleAutoCompressLargeImages\), "TipAutoCompressLargeImages"\)\);'
          $imageReplacement = @'
            rightColumn.Children.Add(AdvancedSettingsBlock(
                WrapWithHint(
                    MarkAdvancedSetting(SettingsToggle(
                        Strings.Get("SettingsAutoCompressLargeImages"),
                        State.AutoCompressLargeImages,
                        ToggleAutoCompressLargeImages)),
                    "TipAutoCompressLargeImages")));
          '@.TrimEnd()
          Replace-Once 'image advanced' $imagePattern $imageReplacement

          $markdownPattern = '(?ms)            leftColumn\.Children\.Add\(WrapWithHint\(\r?\n                SettingsFieldLabel\(Strings\.Get\("SettingsImageReferenceText"\), topMargin: 8\),\r?\n                "TipImageReferenceText"\)\);\r?\n            leftColumn\.Children\.Add\(CreateImageReferenceTextModeSelector\(\)\);'
          $markdownReplacement = @'
            leftColumn.Children.Add(AdvancedSettingsBlock(
                WrapWithHint(
                    MarkAdvancedSetting(SettingsFieldLabel(Strings.Get("SettingsImageReferenceText"), topMargin: 8)),
                    "TipImageReferenceText"),
                CreateImageReferenceTextModeSelector()));
          '@.TrimEnd()
          Replace-Once 'Markdown image-reference advanced' $markdownPattern $markdownReplacement

          Set-Content -LiteralPath $path -Value $text -Encoding utf8 -NoNewline

      - name: Update changelog
        run: |
          $path = Join-Path $env:GITHUB_WORKSPACE "CHANGELOG.md"
          $text = Get-Content -LiteralPath $path -Raw
          $old = "### Unreleased`r`n`r`n- 暂无"
          if (-not $text.Contains($old)) {
            $old = "### Unreleased`n`n- 暂无"
          }
          if (-not $text.Contains($old)) {
            throw "Could not find empty Unreleased section."
          }
          $note = '### Unreleased' + "`r`n`r`n" + '- **高级设置视觉区分**：开启高级设置后，高级选项会以轻微染色背景与边框分组显示，更容易与常用设置区分。'
          $text = $text.Replace($old, $note)
          Set-Content -LiteralPath $path -Value $text -Encoding utf8 -NoNewline

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore and build
        run: |
          dotnet restore .\PaperTodo.csproj
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet build .\PaperTodo.csproj -c Release --no-restore
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git diff --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Commit backport to 3.x
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add AppController.SettingsEnhancements.cs AppController.Settings.cs CHANGELOG.md
          git commit -m "style: tint advanced settings groups"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git push origin HEAD:3.x
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
