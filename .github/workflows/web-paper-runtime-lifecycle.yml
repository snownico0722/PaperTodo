name: Apply Web Paper Runtime Lifecycle

on:
  push:
    branches:
      - feature/web-paper-runtime-lifecycle
    paths:
      - .github/workflows/web-paper-runtime-lifecycle.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feature/web-paper-runtime-lifecycle
          fetch-depth: 0
          submodules: recursive

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Patch staging helper
        shell: pwsh
        run: |
          @'
          from pathlib import Path
          path = Path('tools/apply_web_paper_runtime.py')
          text = path.read_text(encoding='utf-8')
          old = '''    if count != 1:\n        raise RuntimeError(f"{path}: expected exactly one match, got {count}: {old[:100]!r}")\n'''
          new = '''    if count == 0:\n        raise RuntimeError(f"{path}: expected at least one match, got {count}: {old[:100]!r}")\n'''
          if text.count(old) != 1:
              raise SystemExit('replace_once helper shape changed')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          '@ | python -

      - name: Apply refactor
        shell: pwsh
        run: python .\tools\apply_web_paper_runtime.py

      - name: Diff check
        shell: pwsh
        run: git diff --check

      - name: Restore
        shell: pwsh
        run: dotnet restore .\PaperTodo.csproj

      - name: Build Release
        shell: pwsh
        run: dotnet build .\PaperTodo.csproj -c Release --no-restore

      - name: Protocol policy checks
        shell: pwsh
        run: dotnet run --project .\tests\PaperTodo.ProtocolPolicyChecks\PaperTodo.ProtocolPolicyChecks.csproj -c Release

      - name: Check removed Web body background-host paths
        shell: pwsh
        run: |
          $hits = git grep -n -E "PromoteBackgroundWebView|_everPresented|AttachSharedBackgroundWebView|DetachSharedBackgroundWebView" -- src
          if ($LASTEXITCODE -eq 0) {
            Write-Error ($hits -join "`n")
            exit 1
          }
          exit 0

      - name: Check paper runtime shape
        shell: pwsh
        run: |
          git grep -n "class WebPaperRuntime" -- src/WebPaperRuntime.cs
          git grep -n 'surface: .paperRuntime.' -- src/WebPaperRuntime.cs
          git grep -n 'paperRuntime' -- plugins/official.clock.web/plugin.json

      - name: Commit verified refactor
        shell: pwsh
        run: |
          Remove-Item .\tools\apply_web_paper_runtime.py
          Remove-Item .\.github\workflows\web-paper-runtime-lifecycle.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: decouple Web paper runtime from body UI"
          git push origin HEAD:feature/web-paper-runtime-lifecycle
