name: Edge routes 1 and 2 experiment

on:
  push:
    branches:
      - exp/edge-routes12-20260920

permissions:
  contents: write

concurrency:
  group: edge-routes12-${{ github.ref }}
  cancel-in-progress: false

jobs:
  patch-r4:
    if: contains(github.event.head_commit.message, '[routes12-r4-patch2]')
    runs-on: windows-latest
    timeout-minutes: 8
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2
      - name: Apply source patch and push source-only commit
        run: |
          $ErrorActionPreference = 'Stop'
          python tools/routes12_r4_patch.py
          if ($LASTEXITCODE -ne 0) { throw 'R4 patch helper failed' }
          git diff --check
          git config user.name 'PaperTodo routes12 automation'
          git config user.email 'actions@users.noreply.github.com'
          git add src/EdgeCapsuleQueueCompositionProxy.Visuals.cs src/EdgeCapsuleQueueCompositionProxy.Startup.cs src/EdgeCapsuleQueueProxyWindow.cs tests/PaperTodo.EdgeTitleChecks/Routes12R3InputOnlyIntegrationProbe.cs
          git commit -m 'fix(edge): commit visual before native input activation [routes12-ci] [ci]'
          git push origin HEAD:exp/edge-routes12-20260920
