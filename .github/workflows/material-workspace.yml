name: Material workspace
on:
  push:
    branches: [work/mica-materials-20260907]
    paths: [.github/workflows/material-workspace.yml]
permissions:
  contents: read
jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Prepare isolated controller proof
        shell: python
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          import base64, json, os, pathlib, urllib.request
          root = pathlib.Path('tests/MicaControllerProof'); root.mkdir(exist_ok=True)
          req = urllib.request.Request('https://api.github.com/repos/snownico0722/PaperTodo/git/blobs/b7a5700fc0a530f1f7657359dcaa2913bbb8c6b0', headers={'Authorization': 'Bearer ' + os.environ['GH_TOKEN'], 'Accept': 'application/vnd.github+json'})
          with urllib.request.urlopen(req, timeout=60) as r: code=base64.b64decode(json.load(r)['content'])
          (root/'Program.cs').write_bytes(code)
          (root/'MicaControllerProof.csproj').write_text('''<Project Sdk="Microsoft.NET.Sdk"><PropertyGroup><OutputType>Exe</OutputType><TargetFramework>net10.0-windows10.0.17763.0</TargetFramework><UseWPF>true</UseWPF><UseWindowsForms>true</UseWindowsForms><Nullable>enable</Nullable><ImplicitUsings>enable</ImplicitUsings><WindowsPackageType>None</WindowsPackageType><WindowsAppSDKSelfContained>true</WindowsAppSDKSelfContained><RuntimeIdentifier>win-x64</RuntimeIdentifier><WindowsAppSDKDeploymentManagerInitialize>false</WindowsAppSDKDeploymentManagerInitialize></PropertyGroup><ItemGroup><Using Remove="System.Drawing"/><Using Remove="System.Windows.Forms"/><PackageReference Include="Microsoft.WindowsAppSDK" Version="1.8.260804001"/></ItemGroup></Project>''')
      - name: Build and capture controller output
        env:
          MICA_OUT: ${{ runner.temp }}/mica-proof/build
        run: dotnet run --project tests/MicaControllerProof/MicaControllerProof.csproj -c Release
      - name: Publish isolated single-file proof
        run: dotnet publish tests/MicaControllerProof/MicaControllerProof.csproj -c Release -r win-x64 --self-contained false -p:PublishSingleFile=true -p:IncludeAllContentForSelfExtract=true -p:IncludeNativeLibrariesForSelfExtract=true -o '${{ runner.temp }}/mica-proof/publish'
      - name: Run published proof
        env:
          MICA_OUT: ${{ runner.temp }}/mica-proof/published
        run: |
          & '${{ runner.temp }}/mica-proof/publish/MicaControllerProof.exe'
          if ($LASTEXITCODE -ne 0) { throw "Published proof failed: $LASTEXITCODE" }
          Get-ChildItem '${{ runner.temp }}/mica-proof/publish' | Select Name,Length
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mica-controller-proof
          path: |
            ${{ runner.temp }}/mica-proof/build
            ${{ runner.temp }}/mica-proof/published
          retention-days: 2
