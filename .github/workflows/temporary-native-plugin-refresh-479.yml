name: Build native plugin refresh artifacts
on:
  push:
    branches:
      - build/native-plugin-refresh-479
permissions:
  contents: read
jobs:
  native-plugin-refresh:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.404"
      - name: Rebuild native plugin samples
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          Get-ChildItem -Path plugin-samples -Recurse -Filter *.csproj |
            Where-Object { Test-Path (Join-Path $_.DirectoryName 'plugin.json') } |
            Sort-Object FullName |
            ForEach-Object { & ./plugin-samples/Build-And-Install-NativePlugin.ps1 -ProjectPath $_.FullName }

          $changed = @(git diff --name-only -- plugins)
          $unexpected = @($changed | Where-Object { $_ -notmatch '^plugins/[^/]+/[^/]+\.(dll|deps\.json)$' })
          if ($unexpected.Count -ne 0 -or @($changed | Where-Object { $_ -like '*.dll' }).Count -ne 6) {
            throw "Unexpected plugin build changes: $($changed -join ', ')"
          }
          $output = Join-Path $env:RUNNER_TEMP 'native-plugin-refresh'
          foreach ($path in $changed) {
            $target = Join-Path $output $path
            New-Item -ItemType Directory -Path (Split-Path -Parent $target) -Force | Out-Null
            Copy-Item -LiteralPath $path -Destination $target
            Write-Host "$(git hash-object --no-filters -- $path)  $path"
          }
      - uses: actions/upload-artifact@v7
        with:
          name: native-plugin-refresh
          path: ${{ runner.temp }}/native-plugin-refresh/
          if-no-files-found: error
          retention-days: 3
