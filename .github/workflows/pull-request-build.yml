name: Pull request build

on:
  push:
    branches-ignore:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build PaperTodo
    if: >-
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.head_commit.message, '[ci]') ||
      contains(github.event.head_commit.message, '[debug-ci]')
    concurrency:
      group: pull-request-build-${{ github.ref }}
      cancel-in-progress: true
    runs-on: windows-latest
    timeout-minutes: 15

    defaults:
      run:
        shell: pwsh

    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "true"

    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore .\PaperTodo.csproj

      - name: Build
        run: dotnet build .\PaperTodo.csproj -c Release --no-restore

      - name: Run regression checks
        run: |
          ./tools/testing/Run-Checks.ps1 -Group all -List
          ./tools/testing/Run-Checks.ps1 -Group regression

      - name: Material and skin behavior checks
        # The no-longer-reliable DWM desktop screenshot fixture is removed (D-057).
        # Native-state, window-lifecycle, offscreen WPF pixels and Aero parallax stay tested.
        timeout-minutes: 2
        run: ./tools/testing/Run-Checks.ps1 -Group visual -Project MicaChecks
