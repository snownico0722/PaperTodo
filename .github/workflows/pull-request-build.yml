name: Pull request build

on:
  push:
    branches-ignore:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build PaperTodo
    if: >-
      github.event_name == 'workflow_dispatch' ||
      contains(github.event.head_commit.message, '[ci]') ||
      contains(github.event.head_commit.message, '[debug-ci]')
    concurrency:
      group: pull-request-build-${{ github.ref }}
      cancel-in-progress: true
    runs-on: windows-latest
    timeout-minutes: 25

    defaults:
      run:
        shell: pwsh

    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "true"

    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Native math checks
        run: cargo test --manifest-path .\native\math\Cargo.toml --target x86_64-pc-windows-msvc

      - name: Build native math library
        run: .\native\math\build.ps1 -Configuration Release -ForceRebuild

      - name: Upload native math build
        uses: actions/upload-artifact@v6
        with:
          name: papertodo-math-native
          path: |
            native/math/bin/win-x64/papertodo_math.dll
            native/math/Cargo.lock
          if-no-files-found: error

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore .\PaperTodo.csproj

      - name: Build
        run: dotnet build .\PaperTodo.csproj -c Release --no-restore

      - name: Markdown semantic checks
        run: dotnet run --project .\tests\PaperTodo.MarkdownSemanticChecks\PaperTodo.MarkdownSemanticChecks.csproj -c Release

      - name: Markdown math checks
        run: dotnet run --project .\tests\PaperTodo.MarkdownMathChecks\PaperTodo.MarkdownMathChecks.csproj -c Release

      - name: Markdown editing checks
        run: dotnet run --project .\tests\PaperTodo.MarkdownEditingChecks\PaperTodo.MarkdownEditingChecks.csproj -c Release

      - name: Todo navigation checks
        run: dotnet run --project .\tests\PaperTodo.TodoNavigationChecks\PaperTodo.TodoNavigationChecks.csproj -c Release

      - name: Threading regression checks
        run: dotnet run --project .\tests\PaperTodo.ThreadingChecks\PaperTodo.ThreadingChecks.csproj -c Release

      # Temporary branch bootstrap: the final workflow removes this write-back step and returns
      # contents permission to read-only. Keeping the generated DLL in git follows the existing
      # LMDB native-library pattern for ordinary .NET-only development builds.
      - name: Commit generated native artifacts
        if: github.ref_name == 'feat/markdown-math-ratex'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- native/math/Cargo.lock native/math/bin/win-x64/papertodo_math.dll
          if (git diff --cached --quiet) {
            Write-Output "Native artifacts already match the pinned sources."
            exit 0
          }
          git commit -m "build(math): pin generated native artifacts"
          git push origin HEAD:${{ github.ref_name }}
