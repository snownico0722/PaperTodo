name: Temporary Codex plugin runtime sync

on:
  push:
    branches:
      - feat/codex-skills-mcp-20260918

permissions:
  contents: write

jobs:
  sync:
    if: ${{ !contains(github.event.head_commit.message, '[runtime-sync]') }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Rebuild Codex plugin runtime
        shell: pwsh
        run: |
          & ./plugin-samples/Build-And-Install-NativePlugin.ps1 `
            -ProjectPath ./plugin-samples/PaperTodo.Plugin.CodexCliBridge/PaperTodo.Plugin.CodexCliBridge.csproj
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Commit generated runtime
        shell: pwsh
        run: |
          if (-not (git status --porcelain -- plugins/tools.codex-cli-bridge.native)) {
            Write-Host "Runtime already matches source."
            exit 0
          }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add plugins/tools.codex-cli-bridge.native
          git commit -m "build: refresh Codex CLI Bridge runtime [runtime-sync]"
          git push origin "HEAD:$env:GITHUB_REF_NAME"
