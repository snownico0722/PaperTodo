name: Plugin samples

on:
  pull_request:
    paths:
      - "PaperTodo.Plugin.Abstractions/**"
      - "plugin-samples/**"
      - "plugins/**"
      - "tests/PaperTodo.ProtocolPolicyChecks/**"
      - "tests/PaperTodo.PluginApiChecks/**"
      - "PaperTodo.csproj"
      - "src/AppController.Plugin*.cs"
      - "src/AppController.Shortcuts.cs"
      - "src/GlobalHotkeys.cs"
      - "src/PaperPluginRuntime*.cs"
      - "src/PaperBodyPlugin*.cs"
      - "src/PaperWindow.Plugin*.cs"
      - "src/Plugin*.cs"
      - "src/WebPaperBodySession*.cs"
      - "src/WebPlugin*.cs"
      - ".github/workflows/plugin-samples.yml"
  push:
    branches:
      - main
    paths:
      - "PaperTodo.Plugin.Abstractions/**"
      - "plugin-samples/**"
      - "plugins/**"
      - "tests/PaperTodo.ProtocolPolicyChecks/**"
      - "tests/PaperTodo.PluginApiChecks/**"
      - "PaperTodo.csproj"
      - "src/AppController.Plugin*.cs"
      - "src/AppController.Shortcuts.cs"
      - "src/GlobalHotkeys.cs"
      - "src/PaperPluginRuntime*.cs"
      - "src/PaperBodyPlugin*.cs"
      - "src/PaperWindow.Plugin*.cs"
      - "src/Plugin*.cs"
      - "src/WebPaperBodySession*.cs"
      - "src/WebPlugin*.cs"
      - ".github/workflows/plugin-samples.yml"

permissions:
  contents: read

jobs:
  validate-plugin-samples:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Restore PaperTodo plugin host
        shell: pwsh
        run: dotnet restore .\PaperTodo.csproj --configfile .\NuGet.Config

      - name: Build PaperTodo plugin host
        shell: pwsh
        run: dotnet build .\PaperTodo.csproj -c Release --no-restore

      - name: Run protocol policy checks
        shell: pwsh
        run: dotnet run --project .\tests\PaperTodo.ProtocolPolicyChecks\PaperTodo.ProtocolPolicyChecks.csproj -c Release

      - name: Run menu image and popup checks
        shell: pwsh
        run: dotnet run --project .\tests\PaperTodo.PluginApiChecks\PaperTodo.PluginApiChecks.csproj -c Release

      - name: Validate plugin manifests
        shell: pwsh
        run: |
          $manifests = Get-ChildItem plugin-samples,plugins -Recurse -Filter plugin.json
          if (-not $manifests) {
            throw "No plugin manifests were found."
          }
          foreach ($manifest in $manifests) {
            node .\scripts\validate-plugin-manifest.mjs $manifest.FullName
          }

      - name: Validate capsule sample coverage
        shell: pwsh
        run: node .\scripts\validate-plugin-capsule-samples.mjs

      - name: Validate protocol 2.1 top bar sample
        shell: pwsh
        run: node .\scripts\validate-plugin-topbar-samples.mjs

      - name: Validate Web source and runtime copies
        shell: pwsh
        run: node .\scripts\validate-plugin-web-source-sync.mjs

      - name: Check Web plugin scripts
        shell: pwsh
        run: node --check .\plugin-samples\PaperTodo.Plugin.WebClock\index.js

      - name: Rebuild and verify native runtime outputs
        shell: pwsh
        run: .\scripts\build-plugin-native-runtime.ps1 -Verify
