name: Apply main sync to #227

on:
  push:
    branches:
      - exp/playful-skins-20260909
    paths:
      - .github/workflows/sync-main-227-apply.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Merge current reviewed main and resolve conflicts
        shell: bash
        env:
          EXPECTED_MAIN: 364b9c7b92b1b18ed38a02b9c5bbd2dd6c802481
        run: |
          set -euo pipefail
          git config user.name "PaperTodo Sync Bot"
          git config user.email "36026283+snownico0722@users.noreply.github.com"
          git fetch origin main
          actual_main="$(git rev-parse origin/main)"
          echo "reviewed_main=$EXPECTED_MAIN"
          echo "actual_main=$actual_main"
          test "$actual_main" = "$EXPECTED_MAIN"

          branch_head="$(git rev-parse HEAD)"
          git show "$branch_head:doc/DECISIONS.md" > "$RUNNER_TEMP/decisions-ours.md"
          git show origin/main:doc/DECISIONS.md > "$RUNNER_TEMP/decisions-main.md"

          set +e
          git merge --no-commit --no-ff origin/main
          merge_status=$?
          set -e
          if [ "$merge_status" -ne 1 ]; then
            echo "Expected the reviewed eight-file conflict set, got merge exit $merge_status" >&2
            exit 20
          fi

          python3 - <<'PY'
          from pathlib import Path
          import os, re

          expected_conflicts = {
              '.github/workflows/pull-request-build.yml',
              'CHANGELOG.md',
              'doc/ARCHITECTURE.md',
              'doc/CHANGELOG.en.md',
              'doc/DECISIONS.md',
              'src/PaperWindow.Capsule.cs',
              'src/PaperWindow.Lifecycle.cs',
              'src/PaperWindow.cs',
          }

          import subprocess
          actual = set(filter(None, subprocess.check_output(
              ['git', 'diff', '--name-only', '--diff-filter=U'], text=True).splitlines()))
          if actual != expected_conflicts:
              raise SystemExit(f'Conflict set changed. expected={sorted(expected_conflicts)} actual={sorted(actual)}')

          def split_conflicts(text):
              out = []
              pos = 0
              blocks = []
              while True:
                  start = text.find('<<<<<<< HEAD\n', pos)
                  if start < 0:
                      out.append(text[pos:])
                      break
                  out.append(text[pos:start])
                  mid = text.find('=======\n', start)
                  end = text.find('>>>>>>> origin/main\n', mid)
                  if mid < 0 or end < 0:
                      raise ValueError('Malformed conflict markers')
                  ours = text[start + len('<<<<<<< HEAD\n'):mid]
                  theirs = text[mid + len('=======\n'):end]
                  blocks.append((len(out), ours, theirs))
                  out.append(None)
                  pos = end + len('>>>>>>> origin/main\n')
              return out, blocks

          def resolve(path, chooser):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              parts, blocks = split_conflicts(text)
              for slot, ours, theirs in blocks:
                  parts[slot] = chooser(ours, theirs)
              p.write_text(''.join(parts), encoding='utf-8', newline='\n')

          # CI and changelogs are independent additions at the same insertion point: keep both.
          for path in ('.github/workflows/pull-request-build.yml', 'CHANGELOG.md', 'doc/CHANGELOG.en.md'):
              resolve(path, lambda ours, theirs: ours + theirs)

          mapping = {f'D-{old:03d}': f'D-{new:03d}' for old, new in zip(range(32, 44), range(39, 51))}
          id_pattern = re.compile(r'D-(?:03[2-9]|04[0-3])')
          def remap_skin_ids(text):
              return id_pattern.sub(lambda m: mapping[m.group(0)], text)

          # Architecture: preserve #227's skin architecture, adopt main's PaperChromeBorder route,
          # and explicitly bound the decorated-skin exception until that custom renderer supports it.
          def architecture_choice(ours, theirs):
              ours_lines = [line for line in ours.splitlines(keepends=True)
                            if 'InactiveTitleBarMask' not in line]
              skin = remap_skin_ids(''.join(ours_lines))
              main = theirs
              note = ('装饰性 `SkinBorder`（描图纸、液态玻璃、Aero、像素风）暂不参与失焦标题栏裁切；'
                      '这些自绘材质继续保持完整表面，避免缩短 helper surface 与完整材质绘制叠加。'
                      '默认纸片及可走基类绘制的表面沿用 `PaperChromeBorder`。\n')
              return skin + main + note
          resolve('doc/ARCHITECTURE.md', architecture_choice)

          # Decisions: main owns D-032..D-038 now. Preserve the experimental skin history by
          # appending it as D-039..D-050 and remapping references inside that skin-only block.
          tmp = Path(os.environ['RUNNER_TEMP'])
          ours_decisions = (tmp / 'decisions-ours.md').read_text(encoding='utf-8')
          main_decisions = (tmp / 'decisions-main.md').read_text(encoding='utf-8')
          rows = []
          for line in ours_decisions.splitlines():
              m = re.match(r'^\| (D-(?:03[2-9]|04[0-3])) \|', line)
              if m:
                  rows.append(remap_skin_ids(line))
          if len(rows) != 12:
              raise SystemExit(f'Expected 12 skin decision index rows, found {len(rows)}')
          body_match = re.search(r'(?m)^## D-032 — 普通窗口原生 Mica 与 layered 胶囊边界\s*$', ours_decisions)
          if not body_match:
              raise SystemExit('Could not locate skin decision body start')
          skin_body = remap_skin_ids(ours_decisions[body_match.start():].strip())
          if 'D-039' in main_decisions:
              raise SystemExit('Main already owns D-039; renumber plan is stale')
          maintenance = '\n## 维护规则'
          if maintenance not in main_decisions:
              raise SystemExit('Could not locate decision index insertion point')
          main_decisions = main_decisions.replace(
              maintenance, '\n' + '\n'.join(rows) + '\n' + maintenance, 1)
          Path('doc/DECISIONS.md').write_text(
              main_decisions.rstrip() + '\n\n---\n\n' + skin_body + '\n',
              encoding='utf-8', newline='\n')

          # Lifecycle: both completion responsibilities are required.
          resolve('src/PaperWindow.Lifecycle.cs', lambda ours, theirs: ours + theirs)

          # Capsule: main moved transition initialization earlier. Keep that ordering, but fold
          # #227's native-material dimensions/margins into the earlier initialization.
          resolve('src/PaperWindow.Capsule.cs',
                  lambda ours, theirs: '            if (!collapsed && !_controller.UsesNativeMicaWindows)\n')
          p = Path('src/PaperWindow.Capsule.cs')
          text = p.read_text(encoding='utf-8')
          old = '        var expandedWidth = collapsed ? RoundToDevicePixelX(Width) : finalTargetWidth;\n        var expandedHeight = collapsed ? RoundToDevicePixelY(Height) : finalTargetHeight;'
          new = '''        var expandedWidth = collapsed
              ? RoundToDevicePixelX(_controller.UsesNativeMicaWindows && interruptedVisualWidth.HasValue ? _transitionBaseWidth : Width)
              : finalTargetWidth;
          var expandedHeight = collapsed
              ? RoundToDevicePixelY(_controller.UsesNativeMicaWindows && interruptedVisualHeight.HasValue ? _transitionBaseHeight : Height)
              : finalTargetHeight;'''
          if text.count(old) != 1:
              raise SystemExit(f'Unexpected expanded-size initialization count: {text.count(old)}')
          text = text.replace(old, new, 1)
          anchor = '            _targetTransitionHeight = collapsed ? finalTargetHeight : expandedHeight;\n'
          addition = anchor + '            _startTransitionChromeMargin = startChromeMargin;\n            _targetTransitionChromeMargin = _paperChrome.Margin.Left;\n'
          if text.count(anchor) != 1:
              raise SystemExit(f'Unexpected transition target anchor count: {text.count(anchor)}')
          text = text.replace(anchor, addition, 1)
          old_w = '            _shell.Width = Math.Max(0, expandedWidth - WindowChromeInset);'
          new_w = '''            _shell.Width = Math.Max(0, expandedWidth - (_controller.UsesNativeMicaWindows
                  ? _paperChrome.BorderThickness.Left + _paperChrome.BorderThickness.Right : WindowChromeInset));'''
          old_h = '            _shell.Height = Math.Max(0, expandedHeight - WindowChromeInset);'
          new_h = '''            _shell.Height = Math.Max(0, expandedHeight - (_controller.UsesNativeMicaWindows
                  ? _paperChrome.BorderThickness.Top + _paperChrome.BorderThickness.Bottom : WindowChromeInset));'''
          if text.count(old_w) != 1 or text.count(old_h) != 1:
              raise SystemExit('Unexpected shell-size initialization shape')
          text = text.replace(old_w, new_w, 1).replace(old_h, new_h, 1)
          p.write_text(text, encoding='utf-8', newline='\n')

          # Paper shell: use the skin renderer as a PaperChromeBorder specialization so main's
          # header-clip API remains the single shell contract.
          resolve('src/PaperWindow.cs', lambda ours, theirs: ours)

          p = Path('src/PaperChromeBorder.cs')
          text = p.read_text(encoding='utf-8')
          needle = 'internal sealed class PaperChromeBorder : Border'
          if text.count(needle) != 1:
              raise SystemExit('PaperChromeBorder declaration changed')
          p.write_text(text.replace(needle, 'internal class PaperChromeBorder : Border', 1), encoding='utf-8', newline='\n')

          p = Path('src/SkinBorder.cs')
          text = p.read_text(encoding='utf-8')
          needle = 'internal sealed partial class SkinBorder : Border'
          if text.count(needle) != 1:
              raise SystemExit('SkinBorder declaration changed')
          p.write_text(text.replace(needle, 'internal sealed partial class SkinBorder : PaperChromeBorder', 1), encoding='utf-8', newline='\n')

          p = Path('src/PaperWindow.ExperimentalFocusPresentation.cs')
          text = p.read_text(encoding='utf-8')
          needle = '''    private bool CanFadeInactiveTitleBar() =>
          AllowsTransparency &&
          IsVisible &&'''
          replacement = '''    private bool CanFadeInactiveTitleBar() =>
          AllowsTransparency &&
          (_paperChrome is not SkinBorder skin || !PaperSkins.IsDecorated(skin.Skin)) &&
          IsVisible &&'''
          if text.count(needle) != 1:
              raise SystemExit('Inactive-title eligibility shape changed')
          p.write_text(text.replace(needle, replacement, 1), encoding='utf-8', newline='\n')

          # No conflict markers or duplicate current decision IDs may survive.
          for path in expected_conflicts:
              content = Path(path).read_text(encoding='utf-8')
              if any(marker in content for marker in ('<<<<<<<', '=======', '>>>>>>>')):
                  raise SystemExit(f'Conflict marker remains in {path}')
          decisions = Path('doc/DECISIONS.md').read_text(encoding='utf-8')
          ids = re.findall(r'(?m)^## (D-\d{3}) — ', decisions)
          duplicates = sorted({x for x in ids if ids.count(x) > 1})
          if duplicates:
              raise SystemExit(f'Duplicate decision IDs: {duplicates}')
          PY

          git add -A
          test -z "$(git diff --name-only --diff-filter=U)"
          git diff --check --cached

      - name: Release build
        shell: pwsh
        run: dotnet build .\PaperTodo.csproj -c Release

      - name: Edge and lifecycle regression checks
        shell: pwsh
        run: |
          dotnet run --project .\tests\PaperTodo.EdgeTitleChecks\PaperTodo.EdgeTitleChecks.csproj -c Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet run --project .\tests\PaperTodo.LifecycleChecks\PaperTodo.LifecycleChecks.csproj -c Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet run --project .\tests\PaperTodo.ThreadingChecks\PaperTodo.ThreadingChecks.csproj -c Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Skin and restart regression checks
        shell: pwsh
        run: |
          dotnet run --project .\tests\PaperTodo.RestartChecks\PaperTodo.RestartChecks.csproj -c Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet run --project .\tests\PaperTodo.MicaChecks\PaperTodo.MicaChecks.csproj -c Release -- --no-raster
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Commit merge and remove temporary sync workflows
        shell: bash
        run: |
          set -euo pipefail
          git rm --ignore-unmatch .github/workflows/sync-main-227-probe.yml
          git rm --ignore-unmatch .github/workflows/sync-main-227-apply.yml
          git add -A
          git diff --check --cached
          test -n "$(git rev-parse -q --verify MERGE_HEAD)"
          git commit -m "chore: sync main into experimental skins branch"
          git push origin HEAD:exp/playful-skins-20260909
