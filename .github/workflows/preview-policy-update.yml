name: Apply preview preload policy
on:
  push:
    branches: [experiment/edge-preview-preload]
    paths: [.github/workflows/preview-policy-update.yml]
permissions:
  contents: write
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Apply policy and boundary checks
        shell: python
        run: |
          from pathlib import Path

          def replace(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8-sig')
              count = text.count(old)
              assert count == 1, (path, count, old[:120])
              p.write_text(text.replace(old, new), encoding='utf-8', newline='\n')

          replace('src/EdgeCapsulePreview.Preload.cs',
          '''        _debounce = new DispatcherTimer(DispatcherPriority.ContextIdle, dispatcher)\n        { Interval = TimeSpan.FromMilliseconds(180) };''',
          '''        _debounce = new DispatcherTimer(DispatcherPriority.ContextIdle, dispatcher)\n        { Interval = TimeSpan.FromMilliseconds(500) };''')

          old = '''    // Match the renderer's existing expensive-path rule rather than pointer proximity. Long rows\n    // always use TextFormatter preparation; a shorter row is heavy only when it is at least 96\n    // source characters and expands into at least 24 semantic style pieces. Ordinary short notes\n    // therefore pay no speculative parse/layout cost.\n    internal static bool IsClearlyHighLoad(MarkdownEdgeCapsulePreviewRenderer.PreviewContent content)\n    {\n        if (content.IsEmpty) return false;\n        foreach (var line in content.Lines)\n        {\n            if (line.FenceKind is MarkdownFenceLineKind.Opening or MarkdownFenceLineKind.Closing)\n                continue;\n            var text = line.Text.Trim();\n            if (text.Length >= MarkdownEdgePreviewParagraph.MinimumSourceLength)\n                return true;\n            if (line.WasInsideFence || content.RenderMode == MarkdownRenderModes.Off || text.Length < 96)\n                continue;\n            if (content.Inlines.Get(text, content.RenderMode).Pieces.Count >= 24)\n                return true;\n        }\n        return false;\n    }'''
          new = '''    // Preload policy is intentionally broader than the renderer's paragraph-path threshold.\n    // We only need to know whether doing the complete layout during idle time is worthwhile:\n    // >400 admitted source characters always qualifies; >200 qualifies when more than 100\n    // visible characters carry Markdown styling/link semantics. Thresholds are strict by design.\n    internal static bool IsClearlyHighLoad(MarkdownEdgeCapsulePreviewRenderer.PreviewContent content)\n    {\n        if (content.IsEmpty) return false;\n        var totalCharacters = content.Lines.Sum(line => line.Text.Length);\n        if (totalCharacters > 400) return true;\n        if (totalCharacters <= 200 || content.RenderMode == MarkdownRenderModes.Off) return false;\n\n        var styledCharacters = 0;\n        foreach (var line in content.Lines)\n        {\n            if (line.FenceKind is MarkdownFenceLineKind.Opening or MarkdownFenceLineKind.Closing)\n                continue;\n            if (line.WasInsideFence)\n            {\n                styledCharacters += line.Text.Length;\n            }\n            else\n            {\n                foreach (var piece in content.Inlines.Get(line.Text, content.RenderMode).Pieces)\n                    if (piece.Style != MarkdownEdgeCapsulePreviewRenderer.InlineStyle.None || piece.Link != null)\n                        styledCharacters += piece.Text.Length;\n            }\n            if (styledCharacters > 100) return true;\n        }\n        return false;\n    }'''
          replace('src/EdgeCapsulePreview.Preload.cs', old, new)

          marker = '''            Require(!MarkdownEdgePreviewPreload.IsClearlyHighLoad(light), "ordinary short rows are not speculatively preloaded");\n            Require(MarkdownEdgePreviewPreload.IsClearlyHighLoad(heavy), "long dense row is classified high-load");\n            Require(MarkdownEdgePreviewPreload.IsClearlyHighLoad(shortDense), "short style-dense rows are classified high-load");\n            Console.WriteLine("PASS content-cost preload classifier: light skips, both heavy shapes qualify");'''
          expanded = marker + '''\n            var exactly400Plain = MarkdownEdgeCapsulePreviewRenderer.CaptureContent(new string('文', 400), MarkdownRenderModes.Full);\n            var over400Plain = MarkdownEdgeCapsulePreviewRenderer.CaptureContent(new string('文', 401), MarkdownRenderModes.Full);\n            var exactly100Styled = MarkdownEdgeCapsulePreviewRenderer.CaptureContent(string.Concat(Enumerable.Repeat("**ab**", 50)), MarkdownRenderModes.Full);\n            var over100Styled = MarkdownEdgeCapsulePreviewRenderer.CaptureContent(string.Concat(Enumerable.Repeat("**ab**", 51)), MarkdownRenderModes.Full);\n            Require(!MarkdownEdgePreviewPreload.IsClearlyHighLoad(exactly400Plain), "400 plain characters stay cold at the strict boundary");\n            Require(MarkdownEdgePreviewPreload.IsClearlyHighLoad(over400Plain), "401 total characters qualify for preload");\n            Require(!MarkdownEdgePreviewPreload.IsClearlyHighLoad(exactly100Styled), "200+ source characters with exactly 100 styled characters stay cold");\n            Require(MarkdownEdgePreviewPreload.IsClearlyHighLoad(over100Styled), "200+ source characters with more than 100 styled characters qualify");\n            Console.WriteLine("PASS preload thresholds: >400 total OR >200 total plus >100 styled characters");'''
          replace('tests/PaperTodo.EdgePreviewChecks/PreloadChecks.cs', marker, expanded)

          p = Path('tests/PaperTodo.EdgePreviewChecks/PRELOAD.md')
          text = p.read_text(encoding='utf-8-sig')
          text = text.replace('''- 任一实际正文行长度 `>= 256`；或\n- 非 Off 模式下，长度 `>= 96` 且语义样式片段 `>= 24`\n\n即视为明显高负载。这与 #245 把文字送入可分批 `TextFormatter` paragraph 的昂贵路径保持同一量级，而不是另建鼠标预测评分。''', '''- 16 块 / 6000 字符有界摘要的总字符数 **> 400**；或\n- 总字符数 **> 200**，并且其中带 Markdown 样式/链接语义的可见字符数 **> 100**。\n\n两个比较都是严格大于。围栏代码正文按 Markdown 样式字符计入；Markdown Off 时只有总字符数 >400 这一条生效。规则用于判断“是否值得空闲预排版”，不再复用 #245 的单段渲染分流阈值。''')
          text = text.replace('''明显高负载的 Note 在内容/胶囊初始化后，于 `ContextIdle` 空闲优先级排队完成完整预排版；''', '''明显高负载的 Note 在内容/胶囊初始化后，先经过 **500ms 单次 debounce** 合并启动/编辑阶段的连续变化，再于 `ContextIdle` 空闲优先级排队完成完整预排版；''')
          p.write_text(text, encoding='utf-8', newline='\n')
      - name: Verify and commit
        run: |
          git diff --check
          git config user.name snownico0722
          git config user.email 36026283+snownico0722@users.noreply.github.com
          git add src/EdgeCapsulePreview.Preload.cs tests/PaperTodo.EdgePreviewChecks/PreloadChecks.cs tests/PaperTodo.EdgePreviewChecks/PRELOAD.md
          git commit -m "perf(edge-preview): broaden heavy preload policy and debounce 500ms [debug-ci]"
          git push origin HEAD:experiment/edge-preview-preload
