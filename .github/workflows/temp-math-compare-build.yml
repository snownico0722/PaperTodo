name: Temporary math comparison build

on:
  push:
    branches:
      - feat/markdown-math-wpf
      - feat/markdown-math-ratex
    paths:
      - .github/workflows/temp-math-compare-build.yml

permissions:
  contents: read

jobs:
  upload:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Upload comparison package
        uses: actions/upload-artifact@v6
        with:
          name: PaperTodo-math-wpf-win-x64-selfcontained
          path: compare-builds/PaperTodo-math-wpf-win-x64-selfcontained.zip
          if-no-files-found: error
          compression-level: 0
