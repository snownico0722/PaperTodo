name: Temporary visibility shortcut patch

on:
  push:
    branches:
      - feature/visibility-shortcuts

permissions:
  contents: write

jobs:
  apply:
    if: ${{ !contains(github.event.head_commit.message, '[visibility-patch]') }}
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: pwsh

    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.x'

      - name: Apply visibility shortcut changes
        run: |
          $payload = @'
*
'@
          $patch = Join-Path $env:RUNNER_TEMP 'apply_visibility_patch.py'
          [IO.File]::WriteAllBytes($patch, [Convert]::FromBase64String($payload.Trim()))
          python $patch

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'

      - name: Restore and build
        run: |
          dotnet restore .\PaperTodo.csproj
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet build .\PaperTodo.csproj -c Release --no-restore
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git diff --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Commit source changes
        run: |
          git status --short
          git diff --stat
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/AppController.cs src/AppController.Shortcuts.cs src/AppController.VisibilityShortcuts.cs src/Models.cs Resources/Strings.resx Resources/Strings.en.resx Resources/Strings.ja.resx Resources/Strings.ko.resx CHANGELOG.md
          git commit -m 'feat: refine visibility shortcut semantics [visibility-patch]'
          git push origin HEAD:feature/visibility-shortcuts
