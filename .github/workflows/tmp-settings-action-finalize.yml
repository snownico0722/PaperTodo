name: Temporary settings action source publication
on:
  push:
    branches: [feat/codex-skills-mcp-20260918]
    paths: [.github/workflows/tmp-settings-action-finalize.yml]
permissions:
  contents: write
jobs:
  publish:
    if: contains(github.event.head_commit.message, '[finalize-actions]')
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Reproduce the implementation verified by run 35349844452
        shell: python
        run: |
          import subprocess, textwrap
          previous = subprocess.check_output(['git', 'show', '1af992a28395b7f61abcae9d8393ccde3b0fa5e8:.github/workflows/tmp-settings-action-finalize.yml']).decode('utf-8-sig')
          begin = previous.index('        run: |\n', previous.index('      - name: Apply implementation and review corrections')) + len('        run: |\n')
          end = previous.index('      - name: Build and verify behavior', begin)
          exec(compile(textwrap.dedent(previous[begin:end]), '<verified-implementation>', 'exec'))
          subprocess.run(['git', 'diff', '--check'], check=True)
      - name: Rebuild Codex plugin output
        shell: pwsh
        run: |
          & ./plugin-samples/Build-And-Install-NativePlugin.ps1 -ProjectPath ./plugin-samples/PaperTodo.Plugin.CodexCliBridge/PaperTodo.Plugin.CodexCliBridge.csproj
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Commit tested source without changing workflows
        shell: pwsh
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src plugin-samples plugins tests CHANGELOG.md CHANGELOG.zh.md doc/ARCHITECTURE.md
          git diff --cached --stat
          git diff --cached --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git commit -m '插件设置：自定义动作复用 Runtime 并修复启动隐藏 [ci]'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git push origin "HEAD:$env:GITHUB_REF_NAME"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
