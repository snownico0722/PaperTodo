name: PR286 Codex native sync
on:
  push:
    branches: [feat/codex-skills-mcp-20260918]
    paths: [.github/workflows/pr286-codex-sync.yml]
permissions:
  contents: read
concurrency:
  group: pr286-codex-native-sync
  cancel-in-progress: false
jobs:
  sync:
    if: github.repository == 'snownico0722/PaperTodo'
    runs-on: windows-latest
    timeout-minutes: 20
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          submodules: recursive
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate source
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          dotnet build ./PaperTodo.csproj -c Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet run --project ./tests/PaperTodo.SettingsApiChecks/PaperTodo.SettingsApiChecks.csproj -c Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet run --project ./tests/PaperTodo.CodexCliBridgeChecks/PaperTodo.CodexCliBridgeChecks.csproj -c Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Rebuild Codex runtime twice
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $project = (Resolve-Path './plugin-samples/PaperTodo.Plugin.CodexCliBridge/PaperTodo.Plugin.CodexCliBridge.csproj').Path
          & ./plugin-samples/Build-And-Install-NativePlugin.ps1 -ProjectPath $project
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $dll = './plugins/tools.codex-cli-bridge.native/PaperTodo.Plugin.CodexCliBridge.dll'
          $first = (Get-FileHash $dll -Algorithm SHA256).Hash
          & ./plugin-samples/Build-And-Install-NativePlugin.ps1 -ProjectPath $project
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $second = (Get-FileHash $dll -Algorithm SHA256).Hash
          if ($first -ne $second) { throw 'Codex native output is not reproducible.' }
      - name: Commit runtime and remove temporary workflow
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          git fetch origin feat/codex-skills-mcp-20260918
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ((git rev-parse FETCH_HEAD) -ne $env:GITHUB_SHA) { throw 'PR branch changed during verification.' }
          git rm .github/workflows/pr286-codex-sync.yml
          git add -- plugins/tools.codex-cli-bridge.native
          git diff --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m '构建：同步精简权限后的 Codex Native 产物 [ci]'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git push origin HEAD:refs/heads/feat/codex-skills-mcp-20260918
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
