name: One-time fast reversal paper resize diagnosis

on:
  push:
    branches:
      - bench/paper-resize-fast-reverse-20261106

permissions:
  contents: read

jobs:
  rapid-resize:
    runs-on: windows-latest
    timeout-minutes: 12
    defaults:
      run:
        shell: pwsh
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "true"
    steps:
      - name: Checkout with submodules
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive
      - name: Setup dotnet
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"
      - name: Run reversal and hotpath isolation
        run: |
          dotnet run --project tools/PaperTodo.MaterialBenchmarks -c Release -- --hotpath-benchmark "$env:RUNNER_TEMP\rapid-resize.json"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Upload raw results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: rapid-resize-one-time-data
          path: ${{ runner.temp }}/rapid-resize.json
          if-no-files-found: warn
          retention-days: 1
