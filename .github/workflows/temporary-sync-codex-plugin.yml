name: Temporary Codex plugin binary sync

on:
  push:
    branches:
      - fix/mcp-image-binary-import-only-20261105
    paths:
      - ".github/workflows/temporary-sync-codex-plugin.yml"

permissions:
  contents: write

jobs:
  sync:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/mcp-image-binary-import-only-20261105
          fetch-depth: 0
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"
      - name: Rebuild Codex plugin with the repository's release script
        shell: pwsh
        run: |
          ./plugin-samples/Build-And-Install-NativePlugin.ps1 -ProjectPath ./plugin-samples/PaperTodo.Plugin.CodexCliBridge/PaperTodo.Plugin.CodexCliBridge.csproj
          if ($LASTEXITCODE -ne 0) { throw "Codex plugin compilation failed." }
          $changes = @(git status --short -- plugins)
          $unexpected = @($changes | Where-Object { $_ -notmatch 'PaperTodo\.Plugin\.CodexCliBridge\.dll$' })
          if ($unexpected.Count -gt 0) { throw ("Unexpected plugin output changes: " + ($unexpected -join '; ')) }
          if ($changes.Count -ne 1) { throw "Expected exactly one changed Codex plugin DLL." }
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- plugins/tools.codex-cli-bridge.native/PaperTodo.Plugin.CodexCliBridge.dll
          git commit -m "build(plugin): sync Codex bridge DLL with MCP operation instructions"
          if ($LASTEXITCODE -ne 0) { throw "Cannot commit rebuilt Codex plugin." }
          git push origin HEAD:fix/mcp-image-binary-import-only-20261105
          if ($LASTEXITCODE -ne 0) { throw "Cannot push rebuilt Codex plugin." }
