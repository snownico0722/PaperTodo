name: Edge preview phase probe
on:
  push:
    branches: [experiment/edge-preview-avalonedit]
    paths: [.github/workflows/edge-preview-phase-probe.yml]
permissions:
  contents: read
jobs:
  probe:
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        shell: pwsh
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: 'true'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Instrument a disposable worktree copy
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory results -Force | Out-Null
          @'
          from pathlib import Path
          def replace(path, old, new):
              p=Path(path); s=p.read_text(encoding='utf-8-sig')
              assert s.count(old)==1, (path, old, s.count(old))
              p.write_text(s.replace(old,new),encoding='utf-8')
          def scope(path, signature, label):
              replace(path, signature+'\n    {', signature+'\n    {\n        using var phase = EdgePreviewPhaseProbe.Measure("'+label+'");')
          p='src/EdgeCapsulePreview.AvalonEdit.cs'
          scope(p,'    internal void SetContent(string text, string mode, double zoom, bool truncated, bool empty)','SetContent')
          scope(p,'    protected override void RebuildContent()','RebuildContent')
          scope(p,'    protected override Size MeasureOverride(Size availableSize)','Viewport.Measure')
          scope(p,'    protected override Size ArrangeOverride(Size finalSize)','Viewport.Arrange')
          replace(p,'        Editor?.Measure(size);','        EdgePreviewPhaseProbe.Event("constraint:" + size);\n        Editor?.Measure(size);')
          replace(p,'            Children.Insert(0, editor);','            editor.TextArea.TextView.VisualLineConstructionStarting += (_, _) => EdgePreviewPhaseProbe.Event("line-build");\n            editor.TextArea.TextView.VisualLinesChanged += (_, _) =>\n            {\n                var tv = editor.TextArea.TextView;\n                if (tv.VisualLinesValid) EdgePreviewPhaseProbe.Event("visual-lines:" + tv.VisualLines.Count + ":wraps:" + tv.VisualLines.Sum(l => l.TextLines.Count));\n            };\n            Children.Insert(0, editor);')
          p='src/MarkdownSemanticPresentation.Colorizer.cs'
          replace(p,'        protected override void ColorizeLine(DocumentLine line)\n        {','        protected override void ColorizeLine(DocumentLine line)\n        {\n            using var phase = EdgePreviewPhaseProbe.Measure("ColorizeLine");')
          p='src/MarkdownSemanticPresentation.Background.cs'
          replace(p,'        public void Draw(TextView textView, DrawingContext drawingContext)\n        {','        public void Draw(TextView textView, DrawingContext drawingContext)\n        {\n            using var phase = EdgePreviewPhaseProbe.Measure("Background.Draw");')
          p='src/MarkdownSemanticDocument.cs'
          scope(p,'    public MarkdownSemanticDocument(ICSharpCode.AvalonEdit.Document.TextDocument document)','SemanticDocument.Parse')
          p='tests/PaperTodo.EdgePreviewExperimentChecks/Program.cs'
          replace(p,'        var allocation = GC.GetAllocatedBytesForCurrentThread();','        EdgePreviewPhaseProbe.Begin();\n        var allocation = GC.GetAllocatedBytesForCurrentThread();')
          replace(p,'            return new[] { describeMs, createMs, stageMs,','            EdgePreviewPhaseProbe.Print();\n            return new[] { describeMs, createMs, stageMs,')
          '@ | Set-Content results/instrument.py
          python results/instrument.py
          if ($LASTEXITCODE -ne 0) { throw 'Instrumentation failed' }
          @'
          using System.Diagnostics;
          using System.Text.Json;
          namespace PaperTodo;
          internal static class EdgePreviewPhaseProbe
          {
              private static bool enabled;
              private static readonly Dictionary<string, (int Count, double Total, double Max)> values = new();
              internal static void Begin() { values.Clear(); enabled = true; }
              internal static IDisposable Measure(string name) => new Scope(name, enabled);
              internal static void Event(string name) { if (enabled) Add(name, 0); }
              private static void Add(string name, double ms)
              {
                  values.TryGetValue(name, out var v);
                  values[name] = (v.Count + 1, v.Total + ms, Math.Max(v.Max, ms));
              }
              internal static void Print()
              {
                  enabled = false;
                  Console.WriteLine("PHASE " + JsonSerializer.Serialize(values.ToDictionary(p => p.Key,
                      p => new { count = p.Value.Count, totalMs = p.Value.Total, maxMs = p.Value.Max })));
              }
              private sealed class Scope(string name, bool active) : IDisposable
              {
                  private readonly long started = active ? Stopwatch.GetTimestamp() : 0;
                  public void Dispose() { if (active && enabled) Add(name, Stopwatch.GetElapsedTime(started).TotalMilliseconds); }
              }
          }
          '@ | Set-Content src/EdgePreviewPhaseProbe.cs
          git diff --check
          if ($LASTEXITCODE -ne 0) { throw 'Invalid diagnostic diff' }
      - name: Profile unchanged rendering with phase counters
        run: |
          dotnet run --project tests/PaperTodo.EdgePreviewExperimentChecks -c Release -- --profile --avalon 2>&1 | Tee-Object results/phases.log
          if ($LASTEXITCODE -ne 0) { throw 'Phase profile failed' }
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: edge-preview-phase-probe
          path: results/
          retention-days: 7
