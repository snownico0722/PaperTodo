name: Temporary lifecycle final verification

on:
  push:
    branches: [perf/startup-exit-small-preload-20260913]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  verify:
    if: github.actor != 'github-actions[bot]'
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_NOLOGO: 'true'
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Apply measured startup-order correction
        run: |
          git config core.autocrlf false
          git config core.eol lf
          git checkout-index --all --force
          New-Item -ItemType Directory -Force review-output | Out-Null
          @'
          import base64, gzip, hashlib, subprocess
          from pathlib import Path
          value = Path('.github/lifecycle-order.patch.gz.b64').read_text().strip().replace('SePFghIrG/Ym', 'SePFghrg/Ym')
          patch = gzip.decompress(base64.b64decode(value))
          assert hashlib.sha256(patch).hexdigest() == '4163346054d3ca6112f95d8705d7015f530c5497872a6404dda6ff2ab3924e35'
          subprocess.run(['git', 'apply', '--check', '-'], input=patch, check=True)
          subprocess.run(['git', 'apply', '-'], input=patch, check=True)
          '@ | python -
          if ($LASTEXITCODE -ne 0) { throw 'Reviewed correction did not apply exactly' }
      - name: Build and run nine lifecycle cases
        run: |
          dotnet build tests/PaperTodo.LifecycleChecks -c Release *> review-output/build.log
          if ($LASTEXITCODE -ne 0) { Get-Content review-output/build.log; throw 'Build failed' }
          dotnet run --project tests/PaperTodo.LifecycleChecks -c Release --no-build *> review-output/lifecycle.log
          if ($LASTEXITCODE -ne 0) { Get-Content review-output/lifecycle.log; throw 'Lifecycle checks failed' }
      - name: Compare old main and final source on this runner
        run: |
          $baseline = Join-Path $env:RUNNER_TEMP 'lifecycle-baseline'
          git worktree add --detach $baseline 5bcf564f90d7512472261dee82f2412ba4c0d589
          git -C $baseline submodule update --init --recursive
          if ($LASTEXITCODE -ne 0) { throw 'Baseline setup failed' }
          $probe = Join-Path $baseline 'tests/PaperTodo.LifecycleChecks'
          New-Item -ItemType Directory -Force $probe | Out-Null
          Copy-Item tests/PaperTodo.LifecycleChecks/Program.cs $probe
          Copy-Item tests/PaperTodo.LifecycleChecks/PaperTodo.LifecycleChecks.csproj $probe
          Copy-Item src/AssemblyInfo.LifecycleChecks.cs (Join-Path $baseline 'src/AssemblyInfo.LifecycleChecks.cs')
          dotnet run --project $probe -c Release -- --baseline --profile *> review-output/baseline-profile.log
          if ($LASTEXITCODE -ne 0) { Get-Content review-output/baseline-profile.log; throw 'Baseline probe failed' }
          dotnet run --project tests/PaperTodo.LifecycleChecks -c Release --no-build -- --profile *> review-output/candidate-profile.log
          if ($LASTEXITCODE -ne 0) { Get-Content review-output/candidate-profile.log; throw 'Candidate probe failed' }
      - name: Run seven Release suites and Debug edge preview
        run: |
          foreach ($suite in @('MarkdownSemantic', 'MarkdownEditing', 'TodoNavigation', 'EdgeTitle', 'EdgePreview', 'Threading', 'Persistence')) {
            dotnet run --project "tests/PaperTodo.${suite}Checks" -c Release *> "review-output/$suite.log"
            if ($LASTEXITCODE -ne 0) { Get-Content "review-output/$suite.log"; throw "$suite failed" }
          }
          dotnet run --project tests/PaperTodo.EdgePreviewChecks -c Debug *> review-output/debug-edge.log
          if ($LASTEXITCODE -ne 0) { Get-Content review-output/debug-edge.log; throw 'Debug edge failed' }
      - name: Commit verified source without temporary machinery
        run: |
          git diff --check
          if ($LASTEXITCODE -ne 0) { throw 'Whitespace check failed' }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/AppController.cs src/AppController.StartupPrewarm.cs tests/PaperTodo.LifecycleChecks/Program.cs doc/ARCHITECTURE.md
          git rm .github/lifecycle-order.patch.gz.b64 .github/workflows/lifecycle-final-check.yml
          git commit -m 'perf(startup): warm artifacts after shell initialization; verify delayed recovery [ci]'
          if ($LASTEXITCODE -ne 0) { throw 'Source commit failed' }
          git rev-parse HEAD | Set-Content review-output/tested-head.txt
          git archive --format=zip -o review-output/tested-source.zip HEAD
          git diff --stat 5bcf564f90d7512472261dee82f2412ba4c0d589 HEAD | Set-Content review-output/changes.txt
          git push origin HEAD:perf/startup-exit-small-preload-20260913
          if ($LASTEXITCODE -ne 0) { throw 'Push rejected; tested source is preserved in the artifact, no force attempted' }
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: lifecycle-final-review
          path: review-output/
          retention-days: 2
