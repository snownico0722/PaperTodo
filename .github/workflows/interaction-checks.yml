name: Interaction Checks

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: interaction-checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  interaction:
    name: Interaction behavior checks
    runs-on: windows-latest
    timeout-minutes: 10
    defaults:
      run:
        shell: pwsh
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "true"
    steps:
      - name: Check out source
        uses: actions/checkout@v7
      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"
      - name: Run interaction behavior checks
        run: dotnet run --project .\tests\PaperTodo.InteractionChecks\PaperTodo.InteractionChecks.csproj -c Release
