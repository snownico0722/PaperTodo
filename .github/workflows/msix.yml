name: Build MSIX

on:
  workflow_dispatch:
  push:
    branches:
      - feature/msix-packaging-3x
    paths: &msix_paths
      - ".github/workflows/msix.yml"
      - "packaging/msix/**"
      - "src/**"
      - "App.xaml.cs"
      - "PaperTodo.csproj"
      - "native/**"
      - ".gitmodules"
  pull_request:
    branches:
      - 3.x
    paths: *msix_paths

permissions:
  contents: read

jobs:
  msix:
    name: Build and validate MSIX
    runs-on: windows-latest

    defaults:
      run:
        shell: pwsh

    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "true"
      MSIX_IDENTITY_NAME: ${{ vars.MSIX_IDENTITY_NAME }}
      MSIX_PUBLISHER: ${{ vars.MSIX_PUBLISHER }}
      MSIX_PUBLISHER_DISPLAY_NAME: ${{ vars.MSIX_PUBLISHER_DISPLAY_NAME }}

    steps:
      - name: Check out source
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.0.x"

      - name: Read package metadata
        id: meta
        run: |
          $project = [xml](Get-Content -LiteralPath .\PaperTodo.csproj -Raw)
          $versionNodes = $project.SelectNodes('/Project/PropertyGroup/Version')
          if ($versionNodes.Count -ne 1) {
            throw "PaperTodo.csproj must define exactly one <Version> element."
          }

          $appVersion = ([string]$versionNodes[0].InnerText).Trim()
          $versionCore = ($appVersion -split '[-+]')[0]
          $parts = @($versionCore.Split('.'))
          if ($parts.Count -lt 1 -or $parts.Count -gt 3) {
            throw "MSIX mapping expects a 1-3 part app version, got '$appVersion'."
          }

          $numbers = [System.Collections.Generic.List[int]]::new()
          foreach ($part in $parts) {
            $value = 0
            if (-not [int]::TryParse($part, [ref]$value) -or $value -lt 0 -or $value -gt 65535) {
              throw "Invalid MSIX version component '$part' in '$appVersion'."
            }
            $numbers.Add($value)
          }
          while ($numbers.Count -lt 3) {
            $numbers.Add(0)
          }
          if ($numbers[0] -eq 0) {
            throw "MSIX major version cannot be zero."
          }

          # Microsoft Store reserves the fourth field; Store-bound packages must end in .0.
          $msixVersion = "$($numbers[0]).$($numbers[1]).$($numbers[2]).0"
          $identityName = if ([string]::IsNullOrWhiteSpace($env:MSIX_IDENTITY_NAME)) { "PaperTodo.Test" } else { $env:MSIX_IDENTITY_NAME }
          $publisher = if ([string]::IsNullOrWhiteSpace($env:MSIX_PUBLISHER)) { "CN=PaperTodo Test" } else { $env:MSIX_PUBLISHER }
          $publisherDisplayName = if ([string]::IsNullOrWhiteSpace($env:MSIX_PUBLISHER_DISPLAY_NAME)) { "PaperTodo" } else { $env:MSIX_PUBLISHER_DISPLAY_NAME }

          "app_version=$appVersion" >> $env:GITHUB_OUTPUT
          "msix_version=$msixVersion" >> $env:GITHUB_OUTPUT
          "identity_name=$identityName" >> $env:GITHUB_OUTPUT
          "publisher=$publisher" >> $env:GITHUB_OUTPUT
          "publisher_display_name=$publisherDisplayName" >> $env:GITHUB_OUTPUT
          "artifact_name=PaperTodo-v$appVersion-win-x64-msix" >> $env:GITHUB_OUTPUT
          "msix_file=PaperTodo-v$appVersion-win-x64.msix" >> $env:GITHUB_OUTPUT

          Write-Host "App version:       $appVersion"
          Write-Host "MSIX version:      $msixVersion"
          Write-Host "Identity name:     $identityName"
          Write-Host "Publisher:         $publisher"
          Write-Host "Publisher display: $publisherDisplayName"

      - name: Prepare MSIX-only writable data paths
        run: |
          # The portable EXE remains portable. Only this CI workspace is rewritten before
          # compilation so an installed MSIX never tries to write into its read-only package.
          $sourceFiles = @((Get-Item -LiteralPath .\App.xaml.cs))
          $sourceFiles += @(Get-ChildItem -LiteralPath .\src -Filter *.cs -File |
            Where-Object { $_.Name -ne 'MsixDataDirectory.cs' })
          $sourcePaths = @($sourceFiles | ForEach-Object FullName)

          $matches = @(Select-String -Path $sourcePaths -SimpleMatch 'AppContext.BaseDirectory')
          if ($matches.Count -lt 3) {
            throw "Expected several app-relative paths, found only $($matches.Count). Refusing a partial MSIX rewrite."
          }

          Write-Host "Rewriting $($matches.Count) app-relative path occurrence(s) for MSIX:"
          $matches | ForEach-Object { Write-Host "  $($_.Path):$($_.LineNumber)" }

          $utf8 = [System.Text.UTF8Encoding]::new($false)
          foreach ($file in $sourceFiles) {
            $text = [System.IO.File]::ReadAllText($file.FullName)
            if ($text.Contains('AppContext.BaseDirectory')) {
              [System.IO.File]::WriteAllText(
                $file.FullName,
                $text.Replace('AppContext.BaseDirectory', 'MsixDataDirectory.Current'),
                $utf8)
            }
          }

          $remaining = @(Select-String -Path $sourcePaths -SimpleMatch 'AppContext.BaseDirectory')
          if ($remaining.Count -ne 0) {
            throw "MSIX data-path rewrite left $($remaining.Count) occurrence(s) behind."
          }

      - name: Build native LMDB library
        run: .\native\lmdb\build.ps1 -Configuration Release -ForceRebuild

      - name: Restore
        run: dotnet restore .\PaperTodo.csproj

      - name: Publish self-contained x64 payload
        run: |
          $publishDir = Join-Path $env:RUNNER_TEMP "papertodo-msix-publish"
          Remove-Item -LiteralPath $publishDir -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $publishDir | Out-Null

          dotnet publish .\PaperTodo.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -o $publishDir `
            /p:PublishSingleFile=false `
            /p:PublishReadyToRun=false `
            /p:PublishTrimmed=false `
            /p:EmbedAllSources=false `
            /p:EmbedUntrackedSources=false `
            /p:DebugType=none `
            /p:DebugSymbols=false
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          foreach ($required in @('PaperTodo.exe', 'papertodo_lmdb.dll')) {
            if (-not (Test-Path -LiteralPath (Join-Path $publishDir $required) -PathType Leaf)) {
              throw "Required MSIX payload file was not produced: $required"
            }
          }

          "PUBLISH_DIR=$publishDir" >> $env:GITHUB_ENV

      - name: Create manifest and package assets
        env:
          MSIX_VERSION: ${{ steps.meta.outputs.msix_version }}
          IDENTITY_NAME: ${{ steps.meta.outputs.identity_name }}
          PUBLISHER: ${{ steps.meta.outputs.publisher }}
          PUBLISHER_DISPLAY_NAME: ${{ steps.meta.outputs.publisher_display_name }}
        run: |
          $staging = Join-Path $env:RUNNER_TEMP "papertodo-msix-staging"
          Remove-Item -LiteralPath $staging -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $staging | Out-Null
          Copy-Item -Path (Join-Path $env:PUBLISH_DIR '*') -Destination $staging -Recurse -Force

          $assetsDir = Join-Path $staging "Assets"
          New-Item -ItemType Directory -Force -Path $assetsDir | Out-Null
          Add-Type -AssemblyName System.Drawing

          function Write-SquarePng([string]$sourcePath, [string]$destinationPath, [int]$size) {
            $resolvedSource = (Resolve-Path -LiteralPath $sourcePath).Path
            $source = [System.Drawing.Image]::FromFile($resolvedSource)
            try {
              $bitmap = [System.Drawing.Bitmap]::new(
                $size,
                $size,
                [System.Drawing.Imaging.PixelFormat]::Format32bppArgb)
              try {
                $graphics = [System.Drawing.Graphics]::FromImage($bitmap)
                try {
                  $graphics.Clear([System.Drawing.Color]::Transparent)
                  $graphics.InterpolationMode = [System.Drawing.Drawing2D.InterpolationMode]::HighQualityBicubic
                  $graphics.SmoothingMode = [System.Drawing.Drawing2D.SmoothingMode]::HighQuality
                  $graphics.PixelOffsetMode = [System.Drawing.Drawing2D.PixelOffsetMode]::HighQuality
                  $graphics.CompositingQuality = [System.Drawing.Drawing2D.CompositingQuality]::HighQuality

                  $scale = [Math]::Min($size / $source.Width, $size / $source.Height)
                  $width = [Math]::Max(1, [int][Math]::Round($source.Width * $scale))
                  $height = [Math]::Max(1, [int][Math]::Round($source.Height * $scale))
                  $x = [int](($size - $width) / 2)
                  $y = [int](($size - $height) / 2)
                  $graphics.DrawImage($source, $x, $y, $width, $height)
                }
                finally { $graphics.Dispose() }

                $bitmap.Save($destinationPath, [System.Drawing.Imaging.ImageFormat]::Png)
              }
              finally { $bitmap.Dispose() }
            }
            finally { $source.Dispose() }
          }

          $iconSource = Join-Path $env:GITHUB_WORKSPACE "assets\icons\papertodo-icon-1.png"
          Write-SquarePng $iconSource (Join-Path $assetsDir "Square44x44Logo.png") 44
          Write-SquarePng $iconSource (Join-Path $assetsDir "Square150x150Logo.png") 150
          Write-SquarePng $iconSource (Join-Path $assetsDir "StoreLogo.png") 50

          $manifestPath = Join-Path $staging "AppxManifest.xml"
          Copy-Item -LiteralPath .\packaging\msix\AppxManifest.xml -Destination $manifestPath -Force
          [xml]$manifest = Get-Content -LiteralPath $manifestPath -Raw
          $ns = [System.Xml.XmlNamespaceManager]::new($manifest.NameTable)
          $ns.AddNamespace('f', 'http://schemas.microsoft.com/appx/manifest/foundation/windows10')

          $identity = $manifest.SelectSingleNode('/f:Package/f:Identity', $ns)
          if ($null -eq $identity) { throw 'Identity element missing from AppxManifest.xml.' }
          $identity.SetAttribute('Name', $env:IDENTITY_NAME)
          $identity.SetAttribute('Publisher', $env:PUBLISHER)
          $identity.SetAttribute('Version', $env:MSIX_VERSION)
          $identity.SetAttribute('ProcessorArchitecture', 'x64')

          $publisherDisplay = $manifest.SelectSingleNode('/f:Package/f:Properties/f:PublisherDisplayName', $ns)
          if ($null -eq $publisherDisplay) { throw 'PublisherDisplayName missing from AppxManifest.xml.' }
          $publisherDisplay.InnerText = $env:PUBLISHER_DISPLAY_NAME

          $settings = [System.Xml.XmlWriterSettings]::new()
          $settings.Encoding = [System.Text.UTF8Encoding]::new($false)
          $settings.Indent = $true
          $writer = [System.Xml.XmlWriter]::Create($manifestPath, $settings)
          try { $manifest.Save($writer) } finally { $writer.Dispose() }

          "STAGING_DIR=$staging" >> $env:GITHUB_ENV

      - name: Build MSIX
        env:
          MSIX_FILE: ${{ steps.meta.outputs.msix_file }}
        run: |
          $outDir = Join-Path $env:GITHUB_WORKSPACE "msix-output"
          Remove-Item -LiteralPath $outDir -Recurse -Force -ErrorAction SilentlyContinue
          New-Item -ItemType Directory -Force -Path $outDir | Out-Null
          $msixPath = Join-Path $outDir $env:MSIX_FILE
          $sdkBin = "${env:ProgramFiles(x86)}\Windows Kits\10\bin"

          $makeAppx = Get-ChildItem -LiteralPath $sdkBin -Filter MakeAppx.exe -File -Recurse |
            Where-Object { $_.FullName -match '\\x64\\MakeAppx\.exe$' } |
            Sort-Object FullName -Descending |
            Select-Object -First 1
          if ($null -eq $makeAppx) { throw 'MakeAppx.exe was not found on the GitHub Windows runner.' }

          & $makeAppx.FullName pack /d $env:STAGING_DIR /p $msixPath /o
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          "MSIX_PATH=$msixPath" >> $env:GITHUB_ENV
          "MSIX_OUT_DIR=$outDir" >> $env:GITHUB_ENV
          "SDK_BIN=$sdkBin" >> $env:GITHUB_ENV

      - name: Self-sign and validate package
        env:
          IDENTITY_NAME: ${{ steps.meta.outputs.identity_name }}
          PUBLISHER: ${{ steps.meta.outputs.publisher }}
        run: |
          $cert = New-SelfSignedCertificate `
            -Type CodeSigningCert `
            -Subject $env:PUBLISHER `
            -CertStoreLocation "Cert:\CurrentUser\My" `
            -HashAlgorithm SHA256 `
            -KeyAlgorithm RSA `
            -KeyLength 2048 `
            -NotAfter (Get-Date).AddDays(7)

          $cerPath = Join-Path $env:MSIX_OUT_DIR "PaperTodo-MSIX-test.cer"
          Export-Certificate -Cert $cert -FilePath $cerPath | Out-Null
          Import-Certificate -FilePath $cerPath -CertStoreLocation "Cert:\CurrentUser\TrustedPeople" | Out-Null

          try {
            $signTool = Get-ChildItem -LiteralPath $env:SDK_BIN -Filter SignTool.exe -File -Recurse |
              Where-Object { $_.FullName -match '\\x64\\SignTool\.exe$' } |
              Sort-Object FullName -Descending |
              Select-Object -First 1
            if ($null -eq $signTool) { throw 'SignTool.exe was not found on the GitHub Windows runner.' }

            & $signTool.FullName sign /fd SHA256 /sha1 $cert.Thumbprint /s My $env:MSIX_PATH
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            & $signTool.FullName verify /pa /v $env:MSIX_PATH
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

            # Hosted Windows images do not always expose a fully usable AppX deployment service.
            # Registration is an extra smoke test; MakeAppx + SignTool remain the required checks.
            try {
              $existing = @(Get-AppxPackage -Name $env:IDENTITY_NAME -ErrorAction SilentlyContinue)
              foreach ($package in $existing) {
                Remove-AppxPackage -Package $package.PackageFullName -ErrorAction Stop
              }

              Add-AppxPackage -Path $env:MSIX_PATH -ErrorAction Stop
              $installed = @(Get-AppxPackage -Name $env:IDENTITY_NAME -ErrorAction SilentlyContinue)
              if ($installed.Count -ne 1) {
                throw "Expected one registered package named '$env:IDENTITY_NAME', found $($installed.Count)."
              }
              Write-Host "Registered package smoke test passed: $($installed[0].PackageFullName)"
              Remove-AppxPackage -Package $installed[0].PackageFullName -ErrorAction Stop
            }
            catch {
              Write-Warning "MSIX registration smoke test was unavailable on this hosted runner: $($_.Exception.Message)"
            }
          }
          finally {
            Remove-Item -LiteralPath "Cert:\CurrentUser\TrustedPeople\$($cert.Thumbprint)" -Force -ErrorAction SilentlyContinue
            Remove-Item -LiteralPath "Cert:\CurrentUser\My\$($cert.Thumbprint)" -Force -ErrorAction SilentlyContinue
          }

      - name: Write build metadata
        env:
          APP_VERSION: ${{ steps.meta.outputs.app_version }}
          MSIX_VERSION: ${{ steps.meta.outputs.msix_version }}
          IDENTITY_NAME: ${{ steps.meta.outputs.identity_name }}
          PUBLISHER: ${{ steps.meta.outputs.publisher }}
          PUBLISHER_DISPLAY_NAME: ${{ steps.meta.outputs.publisher_display_name }}
        run: |
          @"
          PaperTodo application version: $env:APP_VERSION
          MSIX package version: $env:MSIX_VERSION
          Identity Name: $env:IDENTITY_NAME
          Publisher: $env:PUBLISHER
          Publisher Display Name: $env:PUBLISHER_DISPLAY_NAME

          The .msix is self-signed only for CI validation. Microsoft Store replaces that
          signature when publishing. For direct sideload testing, trust PaperTodo-MSIX-test.cer.
          "@ | Set-Content -LiteralPath (Join-Path $env:MSIX_OUT_DIR "MSIX_BUILD.txt") -Encoding utf8

          Copy-Item -LiteralPath (Join-Path $env:STAGING_DIR "AppxManifest.xml") `
            -Destination (Join-Path $env:MSIX_OUT_DIR "AppxManifest.used.xml") -Force
          Get-ChildItem -LiteralPath $env:MSIX_OUT_DIR -File | Sort-Object Name | Format-Table Name, Length

      - name: Upload MSIX artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ steps.meta.outputs.artifact_name }}
          if-no-files-found: error
          path: msix-output/*
