name: Release v3.31 dispatcher

on:
  push:
    branches:
      - "3.x"
    paths:
      - ".github/workflows/release-v3.31-dispatch.yml"

permissions:
  contents: write
  actions: write

jobs:
  prepare-and-dispatch:
    runs-on: windows-latest

    defaults:
      run:
        shell: pwsh

    steps:
      - name: Check out 3.x
        uses: actions/checkout@v4
        with:
          ref: 3.x
          fetch-depth: 0

      - name: Prepare v3.31 metadata
        run: |
          $projectPath = Join-Path $env:GITHUB_WORKSPACE "PaperTodo.csproj"
          $projectText = Get-Content -LiteralPath $projectPath -Raw

          $replacements = [ordered]@{
            '<Version>3.3</Version>' = '<Version>3.31</Version>'
            '<AssemblyVersion>3.3.0.0</AssemblyVersion>' = '<AssemblyVersion>3.31.0.0</AssemblyVersion>'
            '<FileVersion>3.3.0.0</FileVersion>' = '<FileVersion>3.31.0.0</FileVersion>'
            '<InformationalVersion>3.3</InformationalVersion>' = '<InformationalVersion>3.31</InformationalVersion>'
            'Keep tray header "PaperTodo v3.3" free of +commit suffixes from SourceLink.' = 'Keep tray header "PaperTodo v3.31" free of +commit suffixes from SourceLink.'
          }

          foreach ($pair in $replacements.GetEnumerator()) {
            $count = ([regex]::Matches($projectText, [regex]::Escape($pair.Key))).Count
            if ($count -ne 1) {
              throw "Expected exactly one occurrence of '$($pair.Key)' in PaperTodo.csproj, found $count."
            }
            $projectText = $projectText.Replace($pair.Key, $pair.Value)
          }

          Set-Content -LiteralPath $projectPath -Value $projectText -Encoding utf8 -NoNewline

          $changelogPath = Join-Path $env:GITHUB_WORKSPACE "CHANGELOG.md"
          $changelogText = Get-Content -LiteralPath $changelogPath -Raw
          $unreleasedPattern = '(?m)^### Unreleased\s*$'
          $matches = [regex]::Matches($changelogText, $unreleasedPattern)
          if ($matches.Count -ne 1) {
            throw "Expected exactly one '### Unreleased' heading in CHANGELOG.md, found $($matches.Count)."
          }
          $changelogText = [regex]::Replace($changelogText, $unreleasedPattern, '### v3.31', 1)
          Set-Content -LiteralPath $changelogPath -Value $changelogText -Encoding utf8 -NoNewline

          git diff --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          git diff -- PaperTodo.csproj CHANGELOG.md

      - name: Commit release metadata to 3.x
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add PaperTodo.csproj CHANGELOG.md
          git commit -m "release: prepare v3.31"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git push origin HEAD:3.x
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Dispatch stable v3.31 release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run release.yml `
            --repo "${{ github.repository }}" `
            --ref 3.x `
            -f release_tag=v3.31 `
            -f prerelease=false `
            -f stable_release_confirmed=true
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
