name: Preview unification check
on:
  push:
    branches: [perf/whole-preview-artifact-preload-20260912]
permissions:
  contents: write
jobs:
  validate:
    if: contains(github.event.head_commit.message, '[unify-layout-check]')
    runs-on: windows-latest
    timeout-minutes: 20
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: recursive
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '10.0.x'
      - name: Keep cache-hit publication within the current layout pass
        run: |
          New-Item -ItemType Directory -Force evidence | Out-Null
          @'
          from pathlib import Path
          import subprocess
          p = Path('src/EdgeCapsulePreview.Markdown.cs')
          text = p.read_text(encoding='utf-8')
          old = '        IsHitTestVisible = _previewActive;\n        InvalidateMeasure();\n    }'
          new = '        IsHitTestVisible = _previewActive;\n    }'
          assert text.count(old) == 1
          text = text.replace(old, new)
          old = '                Publish(artifact, size);\n                published = true;'
          new = '                Publish(artifact, size);\n                // Async completion needs a new layout; a cache hit is already inside Arrange.\n                InvalidateMeasure();\n                published = true;'
          assert text.count(old) == 1
          p.write_bytes(text.replace(old, new).encode())
          subprocess.run(['git', 'add', '--', str(p)], check=True)
          tree = subprocess.check_output(['git', 'write-tree'], text=True).strip()
          subprocess.run(['git', 'archive', '--format=zip', '--output=evidence/tested-source.zip', tree], check=True)
          '@ | python -
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git diff --cached --check
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Release checks and Debug preview
        run: |
          foreach ($suite in @('EdgePreview', 'MarkdownSemantic', 'MarkdownEditing', 'TodoNavigation', 'EdgeTitle', 'Threading', 'Persistence')) {
            dotnet run --project "tests/PaperTodo.${suite}Checks" -c Release 2>&1 | Tee-Object "evidence/$suite.log"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          dotnet run --project tests/PaperTodo.EdgePreviewChecks -c Debug 2>&1 | Tee-Object evidence/debug-edge.log
          exit $LASTEXITCODE
      - name: Compare current and pre-unification production paths
        run: |
          $base = Join-Path $env:RUNNER_TEMP 'pr251-baseline'
          git worktree add --detach $base 868c81e6255645bb1c151a3731fd0b23329de812
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git -C $base submodule update --init --recursive
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          dotnet build "$base/tests/PaperTodo.EdgePreviewChecks" -c Release
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          foreach ($order in @('forward', 'reverse')) {
            $arguments = @('--preload-profile')
            if ($order -eq 'reverse') { $arguments += '--reverse' }
            dotnet run --project tests/PaperTodo.EdgePreviewChecks -c Release --no-build -- @arguments 2>&1 | Tee-Object "evidence/current-$order.log"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
            dotnet run --project "$base/tests/PaperTodo.EdgePreviewChecks" -c Release --no-build -- @arguments 2>&1 | Tee-Object "evidence/baseline-$order.log"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      - name: Reject a deferred-frame cache-hit regression
        run: |
          @'
          import collections, json, pathlib, statistics
          groups = collections.defaultdict(list)
          for p in pathlib.Path('evidence').glob('*-*.log'):
              revision = p.name.split('-')[0]
              if revision not in ('current', 'baseline'): continue
              for line in p.read_text(encoding='utf-8-sig').splitlines():
                  if not line.startswith('PRELOAD_SAMPLE '): continue
                  row = json.loads(line.split(' ', 1)[1])
                  if row['preparation'] != 'layout': continue
                  assert row['metrics'][10] == 1, row
                  if row['iteration'] >= 2:
                      groups[(revision, row['fixture'], row['mode'])].append(row['metrics'][4])
          report = []
          for (revision, fixture, mode), values in groups.items():
              if revision != 'current': continue
              baseline = groups[('baseline', fixture, mode)]
              assert len(values) == len(baseline) == 14
              report.append(dict(fixture=fixture, mode=mode, current=statistics.median(values), baseline=statistics.median(baseline)))
          assert len(report) == 6
          pathlib.Path('evidence/hot-layout-gate.json').write_text(json.dumps(report, indent=2))
          print(json.dumps(report, indent=2))
          assert all(r['current'] <= max(5.0, r['baseline'] * 1.5 + 1.0) for r in report), 'cache hits still wait for a later frame'
          '@ | python -
          exit $LASTEXITCODE
      - name: Push verified publication fix
        run: |
          $branch = 'perf/whole-preview-artifact-preload-20260912'
          $remote = (git ls-remote origin "refs/heads/$branch") -split '\s+'
          if ($LASTEXITCODE -ne 0 -or $remote[0] -ne '${{ github.sha }}') { throw 'Branch advanced; do not overwrite concurrent changes.' }
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix(preview): publish cached artifacts without invalidating the active layout pass'
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git push origin "HEAD:refs/heads/$branch"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          git rev-parse HEAD | Tee-Object evidence/pushed-head.txt
      - uses: actions/upload-artifact@v7
        if: always()
        with:
          name: preview-unification-verification
          path: evidence/
          retention-days: 2
