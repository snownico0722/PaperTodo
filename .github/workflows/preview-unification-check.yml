name: Preview unification check
on:
  push:
    branches: [perf/whole-preview-artifact-preload-20260912]
permissions:
  contents: read
jobs:
  baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Capture baseline source and history
        run: |
          mkdir evidence
          git archive -o evidence/source.zip HEAD
          git ls-tree -r HEAD > evidence/tree.txt
          git log -12 --format='%H %s' > evidence/commits.txt
      - uses: actions/upload-artifact@v7
        with:
          name: preview-unification-baseline
          path: evidence/
          retention-days: 1
